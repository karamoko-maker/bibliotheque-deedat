 comme destinée au monde entier, et non à quelques-uns sélectionnés, car Dieu aime le monde, et je signale au passage que le mot “engendré” signifie également “produit”, Monsieur. Dieu a produit son propre fils."}]}, {"title": "Q4. Le glorieux Coran déclare-t-il que le Saint Evangile est une guidance pour…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Le glorieux Coran déclare-t-il que le Saint Evangile est une guidance pour toute l’humanité?"}, {"t": "p", "x": "A. Deedat : Non, le Saint Coran ne dit pas que le Saint Evangile est une guidance pour toute l’humanité. La Bible ne le dit pas non plus. Vous voyez, lorsque Jésus-Christ envoya ses disciples avec la mission de prêcher et de guérir, il leur donna ses instructions. N’allez pas sur le chemin des Gentils et n’allez pas dans les villes des Samaritains, mais allez plutôt jusqu’à la seigneurerie de la maison d’Israël. Je voudrais savoir quelle est la place des Américains anglosaxons en tant que juifs de la maison d’Israël."}, {"t": "p", "x": "Donc, tandis qu’il parlait une femme juive vint à lui pour que sa fille soit guérie. Alors il détourna le visage d’elle. Elle alla de l’autre côté et ne voulut pas le laisser partir. Les disciples dirent: “Aidez-la, cette femme est entêtée. Vous savez comme un homme qui se noie s’accroche à un fétu de paille, une femme qui se noie fait de même. Guéris son enfant. Alors Jésus dit: “Je ne suis envoyé qu’à la seigneurerie de la maison d’Israël”. Jésus ajouta: “Ne jetez pas le pain des enfants aux chiens !“ Et qui étaient les chiens ?"}, {"t": "p", "x": "Les Gentils, c’est-à-dire vous et moi, tous les êtres humaines qui n’étaient pas juifs étaient considérés comme des chiens et des cochons, selon Jésus ou selon votre Ecriture. Et dès que Jésus a dit : “Ne jetez pas ce qui est sacré aux chiens, ne jetez pas les miettes aux porcs avant qu’elles ne rancissent” Et qui sont les chiens, et qui sont les porcs ? Les Gentils. Alors quand il a dit : “Ne jetez pas le pain des enfants aux chiens”, la femme désespérée gisant dans cet état dit : “Seigneur Maître, même les chiens ont des"}, {"t": "p", "x": "miettes tombées de la table du maître”. Et elle ajouta:“Donne-lui les miettes !“ Voilà c’est dans les Ecritures. Malheureusement, les Ecritures n’ont pas été citées, les Ecritures ont cité ce que Jésus a dit. Jésus a dit non à la supposition selon laquelle vous pourriez juste croire en lui et être sauvés. Il a dit: “En vérité, en vérité, je vous le dis, à moins que votre droiture ne surpasse celle des scribes, vous n’entrerez pas au royaume des cieux. il n’y a pas de paradis pour vous à moins d’être meilleur que les juifs et moi je vous demande comment vous pourriez être meilleurs que les juifs en ne vous tenant pas aux lois et aux commandements. Répondez à cela."}]}, {"title": "Q5. Monsieur Swaggart, Monsieur Deedat a donné ses preuves que la Bible que vous…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Monsieur Swaggart, Monsieur Deedat a donné ses preuves que la Bible que vous tenez dans votre main n’est pas la parole de Dieu. Quelle preuve avez-vous qu’il a tort ? Je veux dire une preuve, non pas seulement une conviction."}, {"t": "p", "x": "Jimmy Swaggart : Je crois avoir trouvé sans l’ombre d’un doute ce soir que la parole de Dieu est vraie. Et je ne vois pas de quelle autre preuve on aurait besoin. Vous pouvez lire la Bible et ne pas y croire. Mais le Seigneur nous dit d’y croire pour que nous en tirions les nombreux bénéfices. Si quelqu’un ne veut pas croire malgré la preuve qui lui est montrée il ne croira pas. Le Seigneur dit à un individu particulier:“Si quelqu’un revient de chez les morts, il racontait l’histoire du seizième chapitre de Luc et un homme riche dit: “Envoie quelqu’un revenant des morts pour avertir mes frères, si quelqu’un revenait des morts, il ne croirait pas."}, {"t": "p", "x": "Même s’il ne croit pas, les prophètes sont déjà là. Donc, on ne peut donner aucune preuve a un incroyant parce qu’il ne croira pas. C’est la réponse qu’il donna. Une fois encore, je cite un verset favorit:“Parce que Dieu a tant aimé le monde qu’il lui a donné son seul fils engendré de sorte que quiconque croira en lui ne périra pas mais aura la vie éternelle”. Et je terminerai par une déclaration supplémentaire, Monsieur. Je suis la preuve qu’il est réel parce qu’il a sauvé mon âme. AhmedDeedat. Pourriez-vous citer et donner la référence du glorieux Coran et sinon dites-nous quand il a été corrompu, par qui et où exactement il a subi des modifications?"}, {"t": "p", "x": "Ahmed Deedat : Monsieur le présentateur et mes chers frères. Vous savez que j’ai commencé à prendre la parole avec une incantation, une récitation. Je n’essayais pas de vous magnétiser, de vous hypnotiser. En réalité, je citais les mots du Coran qui nous instruisent et nous disent, nous informent que l’Ecriture dont les chrétiens nous parlent, la Bible, est leur propre création. Je répète ce que j’ai dit, je lis d’abord puis je lui donnerai la traduction."}, {"t": "v", "x": ["“Malheur à ceux", "qui écrivent le Livre", "de leurs mains,", "et qui disent,", "ensuite, pour en tirer", "un faible prix", "“Ceci vient de Dieu !”", "Malheur à eux", "à cause de que", "leurs mains ont écrit", "à cause de ce", "qu’ils ont fait.”"]}, {"t": "p", "x": "(Saint Coran 2:79) C’est comme ces 15 millions de dollars de bénéfice net faits sur la “Version Standard Révisée” [A. Deedat montre à l’auditoire la Bible dont il est question], 15 millions c’est très peu comparé à l’éternité, comparé à la bonté et au salut de Dieu. Ce n’est rien 15 millions."}, {"t": "v", "x": ["“Malheur à ceux", "qui écrivent le Livre", "de leurs mains,", "et qui disent,", "ensuite, pour en tirer", "un faible prix”"]}, {"t": "p", "x": "(Saint Coran 2:79)"}, {"t": "p", "x": "En d’autres mots, c’est ce que je vous ai prouvé tout au long. En réalité, je vous donnais un commentaire de ce verset coranique sans entrer dans les détails, car je sais que le temps primait. Au départ, nous étions d’accord pour une heure chacun. Pour quelque mystérieuse raison, on m’a volé 20 mn, ce qui fait que j’ai dû tout résumer. J’ai tellement plus à donner que je le réserve pour demain soir. Donc, maintenant ceci était en fait un commentaire sur le fait que ce livre a été rédigé de leurs propres mains. Vous ajoutez cela, vous ôtez cela, vous ajoutez et vous effacez."}, {"t": "p", "x": "Voyons, voici une preuve suffisante. Les livres que vous avez en mains sont une preuve suffisante que les livres ont été changés, que vous les avez changés. Sur 24000 manuscrits il n’y en a pas deux identiques. C’est un challenge, pas deux de ces manuscrits ne sont identiques. Monsieur Swaggart, y a-t-il un endroit dans l’Ancien Testament qui dise que le prophète Mohammed viendra après Jésus?"}, {"t": "p", "x": "J. Swaggart : Presque toutes les religions essaient de trouver dans la Bible leurs enseignements et leurs croyances. Le Coran fait de même. Il essaie de dire qu’il est mentionné dans la Bible, et que Mohammed est mentionné dans la Bible. Mais Mohammed n’est pas mentionné dans l’Ancien Testament. Je sais que vous faites référence au livre du Deutéronome, mais il n’est pas mentionné. [Non, Mohammed est mentionné par son nom dans l’original hébraïque: “Le fils de Salo-mon chapitre 5 verset 6”]. Ce passage se réfère totalement et complètement au Seigneur Jésus-Christ. Mohammed n’est mentionné nulle part, de la Genèse àla période de la Révélation. Ahmed Deedat, que peuvent dire les musulmans du fait que des gens sont guéris au nom de Jésus?"}, {"t": "p", "x": "A. Deedat : Je n’hésite pas à admettre ce phénomène. Cela peut arriver et ces choses arrivent. Dans l’hindouisme, des gens font des miracles. En islam, des gens font des miracles. Vous savez, même au nom d’un faux Dieu, vous pouvez faire des miracles. Un femme, celle qui avait des hémorragies depuis sept ans sans guérison, en appela à Jésus. Tandis qu’il passait près d’elle, ella toucha l’ourlet de son vêtement et fut instantanément guérie. Jésus avait senti que quelque chose était sorti de lui, la regarda et dit : “Femme, c’est ta foi qui t’a sauvée”."}, {"t": "p", "x": "Sa foi, le fait qu’elle avait la foi, qu’en touchant Jésus elle serait guérie, c’est cela. sa foi. Donc, en d’autres termes, la foi qu’on a en un faux Dieu peut également faire un miracle. C’est Jésus qui l’a dit: “Car il viendra beaucoup de faux prophètes et de faux christs, qui vous montreront de grands signes et de grandes merveilles au point de tromper les élus.” Même les disciples de Jésus pourront être abusés par de tels miracles. Alors les miracles ne constituent pas une preuve de l’authenticité de la personne. Monsieur Jimmy Swaggart, pourquoi l’Ancien Testament ne mentionne-t-il pas qu’il est le fils de Dieu ? Si oui, lisez-le moi s’il vous plait!"}, {"t": "p", "x": "J. Swaggart : Dans Isaïe chapitre 7 verset 14, on lit: “C’est pourquoi le Seigneur lui-même vous donnera un fils. Attention, une vierge concevra et portera un fils et il lui donnera pour nom Emmanuel, et"}]}, {"title": "Q6. Emmanuel signifie “Dieu avec nous”. [Emmanuel signifie “Dieu avec nous” et…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Emmanuel signifie “Dieu avec nous”. [Emmanuel signifie “Dieu avec nous” et non “le fils de Dieu”]. Monsieur Ahmed Deedat, qui peut nier le fait que Dieu qui a préservé dans le passé sa parole, la Thora ainsi que le Saint Evangile peut les préserver à jamais?"}, {"t": "p", "x": "A. Deedat : Ce que je vous ai dit pendant toute la soirée, c’est que ces livres n’ont pas été préservés. S’ils L’avaient été, ils mériteraient d’être reconnus. Qu’est-ce qui a été préservé alors ? Les choses qui sont dedans ont créé tous les dégâts. Le genre de livres qui est de la pornographie, je vous dis de le lire. Mon frère a eu plus de temps que nécessaire pour lire ce petit chapitre dEzekiel. J’ai dit que je défie quiconque de le lire à sa congrégation et je vous dis que je parie que vous ne le lirez pas. La raison : parce que ce n’est pas la parole de Dieu."}, {"t": "p", "x": "Si c’était la parole de Dieu, vous n’auriez pas honte. Si Dieu Tout-Puissant n’avait pas honte de révéler les détails de la prostitution de Dieu vous n’en auriez pas honte. Si Dieu Tout-Puissant n’avait pas honte de révéler les détails de la prostitution de ces deux soeurs, pourquoi donc, je vous le demande, auriez-vous honte ? Etes-vous plus saint que Dieu ? C’est ce qu’on pourrait en déduire. Vous êtes si saint que vous n’osez pas prononcer les mots que Dieu Tout-Puissant a prononcés. Etesvous plus saint que Dieu ?"}, {"t": "p", "x": "Je dis non. La question est que ce n’est pas de Dieu. Vous dites que la Bible a été écrite par quarante auteurs différents. Quarante personnes ont écrit ce livre. Nous, nous disons que nous croyons à la Thora, cela signifie la Révélation que Dieu a donnée à Moïse. il n’a pas envoyé un livre. Le frère Swaggart admet que les seules choses écrites par Dieu furent ses tablettes et que ces tablettes, Moïse les a détruites, jetées et mises en pièces. Si ces cinq livres avaient été écrits sur des ta-blettes de pierre, vous auriez besoin d’un musée aussi haut qu’un gratte-ciel pour conserver les pierrés de la Genèse, de l’Exode, du Lévitique, des Nombres et du Deutéronome."}, {"t": "p", "x": "Où les garderiez-vous, ces tablettes de pierre ? Non. Nous disons que ce ne sont pas les livres de Moïse. Moïse n’aurait aucune raison de rabaisser Loth, un prophète comme lui, en prétendant qu’il a commis l’inceste avec ses filles. Et Ruben, un des fils de Jacob, qui aurait commis l’inceste avec sa mère."}, {"t": "p", "x": "Pourquoi ? Et Juda, le père de la race juive, d’où vient le mot judaïsme qui aurait cohabité avec ses belles-filles sur le bord de la route lorsqu’il se rendait à Tîndat. Il voit une femme sur le bord de la route. il va vers elle et lui demande :“Permets-moi d’entrer avec toi”. Elle répond: “Que me donnes-tu ? “il dit : “Je te donnerai des jeunes du troupeau.” Elle demande ce quelle peut avoir comme garantie. il répondit: “Quelle garantie veux-tu ? “Elle répondit: “Ton sceau, ton bracelet et tes provisions.” Alors, il cohabita avec sa belle-fille et eut des jumeaux, Faris et Zara, que l’on met maintenant dans la généalogie de Jésus."}, {"t": "p", "x": "Ces enfants, issus de l’inceste, seraient les ancêtres de Jésus-Christ, selon Matthieu chapitre 1 verset 1. Et voici la généalogie de Jésus-Christ, fils d’Abraham, fils de David. Abraham eut Isaac, Isaac eut Jacob, Jacob eut Juda et son frère, et Judâ eut Fais et Zara de Tamara. Qui sont-ils ? Regardez la référence indiquée : Genèse 38. Vous trouverez le beau-père cohabitant avec sa bellefille, produisant ces enfants incestueux qui ont l’honneur de devenir les arrières grandsparents de Jésus-Christ. Je voudrais savoir comment cela fait partie du livre de Dieu. Comment cela fait-il partie de la généalogie d’un homme qui n’a pas de généalogie."}]}, {"title": "Q7. Monsieur Swaggart, voulez-vous répondre â la requête de Monsieur Deedat de…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Monsieur Swaggart, voulez-vous répondre â la requête de Monsieur Deedat de lire certains passages de la Bible, je veux dire les passages que le frère Ahmed nous a mis au défi de lire dans son exposé?"}, {"t": "p", "x": "J.Swaggart : Monsieur Deedat a le problème derépondre à des questions qui n’ont jamais été posées. Ezekiel 23: “La parole du Seigneur vint à moi disantFils de l’homme, il y avait deux femmes, les filles et une mère et elles se prostituaient en Egypte. Elles ont commis la prostitution dans leur jeunesse. Elles eurent leurs seins pressées, et elles meurtrissaient les mamelons de leur virginité et leurs noms étaient Aholah l’aîné et Aholibah sa soeur, et elles furent àmoi, et eurent des fils et des filles, donc leurs noms furent Samaria et Aholah, et Jérusalem Aholibah."}, {"t": "p", "x": "Et Aholah joua à la courtisane lorsqu’elle était mienne. Et elle aima à la folie ses amants, ses voisins assyriens dont les vêtements étaient bleus, capitaines et commandants, tous des jeunes gens désirables, des cavaliers montant leur cheval. Donc elle commit ses prostitutions avec eux, avec tous ceux qui étaient les hommes choisis d’Assyria, et avec tous ceux qu’elle aima à la folie. Avec toutes leurs idoles elle se débaucha. Elle n’abandonna jamais ses prostitutions amenées d’Egypte car, dans sa jeunesse, ils avaient couché avec elle. Ils avaient contusionné les seins de sa virginité et versé leurs prostitutions sur elle. C’est alors que je l’ai délivrée de ses amants, dans les mains des Assyriens qu’elle aimait à la folie."}, {"t": "p", "x": "Ils découvrirent sa nudité, ils prirent ses fils et ses filles, et la tuèrent de leur épée et elle devint célèbre parmi les femmes car ils avaient exécuté la sentence sur elle."}, {"t": "p", "x": "Et lorsque sa soeur Aholibah vit cela, elle devint encore plus corrompue dans ses amours irrégulières et dans ses prostitutions, plus que sa soeur dans ses prostitutions."}, {"t": "p", "x": "Elle aima à la folie ses voisins assyriens, capitaines et dirigeants dans leurs vêtements des plus magnifiques, cavaliers montés sur leurs chevaux, tous des jeunes hommes désirables."}, {"t": "p", "x": "Alors je vis qu’elle était débauchée, qu’elles avaient pris toutes les deux le même chemin, et qu’elle avait augmenté dans ses prostitutions, car lorsqu’elle voyait des portraits de jeunes hommes peints au mur, les portraits des Chaldéens peints en rouge ver millon, vêtus de ceinture sur leurs reins, extravagants dans leurs atours teints sur leur tête, tous ressemblant à des princes suivant les manières des Babyloniens de Chaldée, leur pays natal.” Jusqu’où voulez-vous que j’aille ? Attendez un instant chapitre 19."}, {"t": "p", "x": "“Pourtant elle multiplia ses prostitutions appelant dans ses souvenirs les jours de sa jeunesse où elle jouait les courtisanes au pays d’Egypte, car elle aima à la folie leurs amants dont la peau est semblable à la peau des ânes, et dont le jaillissement est semblable à celui. des chevaux.” “Voulez-vous que je continu à lire ?“ “Je crois que cela suffit.” “0K, attendez, je veux mes cent dollars maintenant!” Tous les musulmans sont des gens de confiance. Voilà les cent dollars, mais cet homme a la poche pleine d’argent."}, {"t": "p", "x": "Ça va encore aggraver la dette extérieure des USA. Je ne sais pas quel sorte de programme d’action vous avez ici en islam, mais je veux donne ces cent dollars pour ce que vous avez, pour aider à couvrir les frais de cette conférence de ce soir. Monsieur Deedat, vous avez déclaré que l’islam croit en la naissance virginale du Christ, or Dieu n’engendre pas et n’est pas engendré. Lue chapitre J versets 34-35 explique la naissance du Christ comme étant le Saint-Esprit qui a couvert Marie de son ombre et le pouvoir du Très-Haut qui est venu sur elle. Comment expliquez-vous cela?"}, {"t": "p", "x": "A. Deedat : Vous savez, le frère Swaggart a suggéré durant son exposé, que le Coran était une copie, un plagiat d’études issues de la Bible. Laissez-moi donc vous donner cet exemple, une comparaison entre ce que disent les Ecritures et ce qui est dit dans le Coran au sujet de la naissance de Jésus."}, {"t": "v", "x": ["“Au nom de Dieu, le très clément,", "le miséricordieux.", "Et lorsque les anges disent", "Ô Marie Dieu t’a choisie", "et t’a purifiée,t’a choisie", "sur toutes les femmes", "de toute la nation.”"]}, {"t": "p", "x": "(Saint Coran 3:42) Voilà l’honneur qui fut fait à Marie, la mère de Jésusdans le Saint Coran. Elle est une femme choisie parmi toutes les femmes de toute les nations."}, {"t": "v", "x": ["\"Ô Marie, adore", "ton Seigneur avec dévotion,", "prosterne-toi et incline-toi", "avec ceux qui s’inclinent", "en prière. Cela fait partie", "des nouvelles de l’inconnu", "que nous t’inspirons.", "Tu n ‘étais pas parmi eux", "alors qu’ils jetaient", "leur calame pour savoir", "qui d’entre eux prendraient", "Marie à sa charge,", "Et tu n ‘étais pas parmi eux", "alors qu’ils se disputaient.\""]}, {"t": "p", "x": "(Saint Coran 3:44) Je ne vais pas vous donner l’histoire complète, mais si je puis, je devrai le faire demain soir. Mais les versets continuent."}, {"t": "v", "x": ["\"Et lorsque les anges dirent:", "Ô Marie, Dieu t’annonce", "la bonne nouvelle", "de la prochaine venue", "d’une parole de lui", "Son nom est le messie,", "Jésus, fils de Marie,", "honoré dans ce monde", "et dans l’autre et", "parmi les rapprochés.\""]}, {"t": "p", "x": "(Saint Coran 3:45)"}, {"t": "p", "x": "Mais les chrétiens ajouteront qu’il est assis à la droite de Dieu. Nous ne disons pas physiquement, ni géographiquement, mais en stature, en spiritualité, dans la compagnie de ceux qui sont les plus proches de Dieu."}, {"t": "v", "x": ["\"Et il parlera", "aux gens,", "aux berceaux et adultes,", "et il fait partie", "des vertueux.\""]}, {"t": "p", "x": "(Saint Coran 3:46) Lorsque cette bonne nouvelle fut donnée à Marie de la naissance d’un fils béni, elle dit:"}, {"t": "v", "x": ["\"Seigneur. comment se Deut -il", "que j’aie un enfant", "alors qu’aucun être humain", "ne m ‘a jamais touchée.", "Il dit: C’est ainsi,", "Dieu crée ce qu’il veut,", "quand il décide d’une chose,", "il lui suffit de dire Soit ! pour qu’elle se", "réalise.\""]}, {"t": "p", "x": "(Saint Coran 3:47) Voilà comment les musulmans conçoivent la naissance de Jésus, que Dieu a créé un Jésus sans père humain, juste comme cela, ou de créer un million de Jésus sans père, sans mère, juste comme cela. La version biblique en comparaison, je la suggère au révérend Dunkan, le chef de la société biblique de Johannesburg. J’étais allé acheter une Bible indonésienne à Johannesburg, et il m’avait invité pour le thé, car il m’avait remarqué à cause de mes drôles de cheveux et de ma drôle de barbe, et avait vu que j’étais intéressé par les Bibles."}, {"t": "p", "x": "Donc, il m’appela dans son bureau et je lui expliquai ceci. C’était nouveau pour lui, ça l’étonnait que je parle ainsi de ce qu’il y a dans mon livre. il dit \"Vraiment, je trouve que ceci est la Bible c’est la même chose\". Je lui dis : \"Oui, en apparence, nous essayons tous les deux de dire la même chose: que Jésus a été créé par un miracle spécial. Mais quand vous comparez de près la différence entre la Bible et le Coran, ses craie et fromage. Je ne sais pas si les Américains comprennent cette expression. Les Canadiens ne la comprenaient"}, {"t": "p", "x": "pas, car ils ne connaissent pas la craie. Ils connaissent le crayon et le fromage. Craie et fromage signifient deux mondes à part. Le Coran dit que pour Dieu, créer quelque chose c’est simplement la vouloir, et la chose devient. La Bible pose la même question: Comment serait-ce possible alors \"qu’aucun homme ne m’a touchée ou que je ne connais aucun homme\", sous-entendu sexuellement. La Bible dit: \"Et le Saint-Esprit viendra sur toi, et le pouvoir du Très-Haut te vaincra.\""}, {"t": "p", "x": "Cela donne un tableau que les athées et les agnostiques refusent. Comment l’Esprit Saint viendrait-il sur Marie ? Comment le Tout-Puissant l’a-t-il recouverte de son ombre, comme sa femme, comment ? Non, nous savons qu’il ne veut pas dire cela, mais le langage des deux est différent: le langage coranique est que lorsque Dieu crée quelque chose, il la veut et la chose est. Le langage biblique est terre à terre. J’ai demandé au révérend Dunkan : \"Quelle version seriez-vous plus prêt àdonner à votre fille : la version coranique de la naissance de Jésus ou la version biblique ?\" Et croyez-moi, il baissa la tête de honte et dit: \"Je préfererais donner à ma fille la version coranique\". Frère Swaggart, que vouliez-vous dire par le terme \"unique\"?"}, {"t": "p", "x": "J. Swaggart :Après cette réponse, je propose que --ce n’est pas hors des règles -- ce soit la dernière question. Dans la traduction grecque, le mot \"unique\" signifie simplement \"différent de tout ce qui a jamais existé\". Il n’y en a jamais eu un comme le fils de Dieu. il est unique. Il n’y en a jamais eu comme Marie qui produisit le fils de Dieu, comme il l’a expliqué d’une façon si éloquente il y a un moment. Cela veut simplement dire qu’il n’y en a jamais eu auparavant comme lui, qu’il n’y en aura pas comme lui après cela."}, {"t": "p", "x": "Il est unique en tant que fils de Dieu, manifesté dans la chair. Et, à propos, nous chrétiens ne croyons pas en trois dieux. Nous ne croyons pas que Dieu est marié et vit dans un appartement au Paradis, et a beaucoup d’enfants. Nous ne croyons. pas qu’il faille enseigner une telle folie. Nous croyons que, par amour, Dieu Tout-Puissant a condescendu de descendre ici sur cette planète et de vivre parmi les êtres humains, et de marcher et de parler parmi les hommes et sous une forme humaine. C’est l’incarnation. Le fait d’être mort sur la croix comme offrande de soi parfaite pour une humanité, l’homme étant impuissant à se sauver lui-même."}, {"t": "p", "x": "Et c’est ce qu’il fit. il a dit aux gens: \" Vous avez tué son corps. Dans trois jours, je le ressusciterai.\" Une fois de plus, il fut unique en cela. il fut unique dans ses prophéties. Il fut unique dans sa naissance. Il fut unique dans sa vie, il fut unique dans ses miracles. il fut unique dans son ministère. Il fut unique dans sa mort. Il fut unique dans sa résurrection. il fut unique dans son ascension. Et lorsqu’il reviendra, il sera unique dans son retour."}]}, {"title": "Q8. Monsieur Deedat, nous vous avons invité dans notre nation chrétienne pour…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Monsieur Deedat, nous vous avons invité dans notre nation chrétienne pour débattre du sujet : \"La Bible est-elle la parole de Dieu ?\". Voudriez-vous maintenant avoir le courage d’inviter le Révérend Swaggart à débattre du même sujet dans la cité de la Mecque. Si non, pourquoi?"}, {"t": "p", "x": "A. Deedat : Vous savez, si la question était: \"Etesvous prêt à débattre avec le frère Swaggart dans différentes villes des Etats-Unis, je dirais que je suis même prêt à offrir i 000 dollars pour chaque meeting. Pour quatre meetings aux USA, ce serait 40000 dollars. Mais la question était de savoir si je suis prêt à l’inviter à la Mecque ? Tout d’abord, je ne possède pas la Mecque. Deuxièmement, si vous voulez aller à la Mecque, il vous faut un visa. Lorsque j’ai dû venir aux USA, votre gouvernement m’a forcé à faire ce"}, {"t": "p", "x": "visa. J’ai dû passer par tous les cheminements pour l’avoir et me voilà. Vous savez, je voulais aller dans l’ancienne Zambie lorsque la Zambie devint indépendante. A cette époque, c’était Yann Smith qui gouvernait la Rodhésie du Sud. Alors, ils m’ont donné les formulaires pour le visa et j’ai dû noter au dos que je reconnaissais pas le régime illégitime de Smith avant qu’ils ne me donnent le visa."}, {"t": "p", "x": "Je voulais y aller, alors j’ai dû signer le document que je ne reconnaissais pas le régime illigitime de Smith en Rodhésie du Sud. De la même façon, si je dois venir aux USA, je dois remplir vos conditions, quoique vous me demandiez si je suis prêt à passer par là, j’obtiens le visa. Sans cela pas de visa pour le Canada, par de visa pour ici, pas de visa pour les gens en Afrique du Sud. Vous devez remplir les conditions. Il y a une condition pour visiter la Mecque, et cette condition c’est que vous déclariez avec vos lèvres : \"La illa."}, {"t": "p", "x": "Mohammed rasul allah\". La signification en est: \"Je crois qu’il n’y a qu’un Dieu, ni père, ni Saint-Esprit, ni Jésus. Je crois dans le Dieu un et unique \"Allah\", ce qui est son nom, et que Mohammed est le dernier messager, le messager final de Dieu\". Si vous remplissez cette condition, vous êtes le bienvenu à la Mecque. Monsieur Swaggart, selon votre position, la version du roi Jacques de la Sainte Bible est nécessaire pour le salut. Pouvez-vous dès lors en déduire que celui qui utilise une autre Bible brûlera en enfer tout comme les musulmans, les bouddhistes, les catholiques, les juifs, etc...?"}, {"t": "p", "x": "J. Swaggart : Je n’ai jamais dit et jamais cru que vous deviez croire en la version du roi Jacques pour être sauvés. C’est de la folie. C’est idiot. Et avant de répondre à la question, si vous ne me laissez pas aller à la Mecque, laissez-moi y passer à la télévision. Monsieur Deedat a mentionné la double version de la Bible ou traductions disons-le ainsi. Nous n’acceptons pas les livres falsifiés qui ont été mentionnés mais nous croyons en une double traduction. Nous ressentons que c’est une bonne traduction. Personne ne doit croire en une traduction particulière de la Bible pour être sauvé, et encore une fois, la parole de Dieu dit : “Il n’y a pas d’autre nom sous le ciel”."}, {"t": "p", "x": "Elle nous dit aussi que nous sommes sauvés par notre foi, pas par les actions dont devrait se glorifier n’importe qui. Nous sommes sauvés par la foi dans le Seigneur Jésus-Christ. Et je ne me préoccupe pas de savoir où est la parole. Avez-vous un Coran ici Monsieur ? J’espérais qu’il en avait emporté.· Quelque soit le mot de Dieu qui est dans ce livre, si vous y croyez comme relevant du salut, vous serez sauvé. Vous suivez ce que je dis. Si la parole de Dieu appartenant au salut, appartenant à la rédemption, appartenant au fait d’être sauvé, qu’elle est écrite sur le côté d’un mur quelque part, pour être franc avec vous, elle est écrite sur mon coeur."}, {"t": "p", "x": "C’est ce que la Bible nous dit. Vous pouvez étudier ce livre par coeur et le vénérer, il ne vous sauvera pas. Il n’a pas le pouvoir de vous sauver. Mais bien la parole de Dieu, c’est-à-dire accepter Jésus-Christ comme votre propre sauveur personnel. Si c’est dans le Coran, vous pouvez être sauvé."}]}, {"title": "Q9. Monsieur Deedat, comment les musulmans expliquent-ils les différentes…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Monsieur Deedat, comment les musulmans expliquent-ils les différentes versions du Coran ? Toutes ces versions sont-elles des mensonges, ainsi que vous le dites de la Rible?"}, {"t": "p", "x": "A. Deedat : Je le répète, des versions différentes du Coran cela n’existe pas. J’ai dit qu’il y a des traductions, tandis que les vôtres ce sont des versions. Dans ses réponses aux questions précédentes frère Swaggart a dit qu’il y a sept livres falsifiés dans la version de"}, {"t": "p", "x": "Douay. Sept livres falsifiés qu’il rejette, c’est donc une version. Il y a sept livres dans celle-ci qu’il n’est pas d’accord d’admettre comme la parole de Dieu. Par contre, chaque Coran traduit dans le monde c’est la parole de Dieu traduite. Nous avons un choix de mots, mais ce ne sont pas des versions. Voici ces trois différentes versions, beaucoup de choses sont rejetées de ce qui est dans celle-ci. Ce sont trois versions différentes. J’espère que vous comprenez mon anglais Vous savez, je ne sais pas comment je pourrais le dire plus simplement, que les choses sont variées. [A. Deedat montre les différentes versions de la Bible]. Ce qui est ici dans le septième livre n’est pas là. Ce qui est ici dedans n’est pas dans ça. Ce qui est ici dedans a été enlevé de là de nouveau. Voyez-vous c’est une version."}]}, {"title": "Q10. Révérend Jimmy Swaggart, qu’est-ce que la Trinité?", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Révérend Jimmy Swaggart, qu’est-ce que la Trinité?"}, {"t": "p", "x": "J. Swaggart :Nous croyons que la parole de Dieu enseigne qu’il y a un dieu, non pas deux, cinq, dix ou quinze, manifeste en trois personnes, en trois différentes personnalités."}, {"t": "p", "x": "Nous croyons qu’il y a un père dans les cieux. Nous croyons qu’il y a Dieu le fils, et nous croyons que le Saint-Esprit qui, comme l’a mentionné Monsieur Deedat, est venu sur Marie est aussi Dieu. Ils sont indivisibles, ce qui veut dire qu’ils sont parfaitement d’accord. Ils sont un dans l’unité. ils n’ont jamais été en désaccord. Nous croyons que lorsque vous allez au Paradis, si vous y allez, Jésus-Christ sera assis, selon la parole, de Dieu à sa droite. Et nous maintiendrons ce trône pour toujours. Enfin c’est que ce nous voulons dire par trinité."}]}, {"title": "Q11. Monsieur Deedat, croyez-vous au Saint-Esprit? Pourquoi ou pourquoi pas?", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Monsieur Deedat, croyez-vous au Saint-Esprit? Pourquoi ou pourquoi pas?"}, {"t": "p", "x": "A. Deedat :Vous savez, l’idée du Saint-Esprit dans la chrétienté est qu’il est un dans la Trinité. Lorsque les chrétiens disent que le père est Dieu, que le fils est Dieu, et que le Saint-Esprit est Dieu, et qu’il ne sont pas trois Dieux mais un seul Dieu, dans son catéchisme il continue que le père est Tout-Puissant, que le Fils est tout-puissant et que le Saint-Esprit est tout-puissant, qu’ils ne sont pas trois toutes-puissances mais un seul tout-puissant. Il continue votre catéchisme. Il dit que le père est une personne, que le fils est une personne, et que le Saint-Esprit est une personne, mais ce que le frère Swaggart dit dans son livre, personne, personne, personne, mais pas trois personnes, mais personne, je me demande quelle langue vous parlez, c’est du baragouinage, ce n’est pas de l’anglais."}, {"t": "p", "x": "Vous savez, il a dit : personne, personne, personne, mais pas trois personnes, mais une personne. Je veux dire, frère Swaggart, que vous et vous autres deux, nous dirons qu’ils sont trois triplés identiques, et que nous ne pouvons pas faire de différence entre vous trois. Ils sont tous identiques. On ne peut pas faire la différence. Si l’un de vous commet un meurtre, pouvons-nous prendre les deux autres. Vous direz non. Je demanderai pourquoi. Vous direz: il est une personne différente. Je dirai d’accord. Mais qu’est-ce qui le rend différent."}, {"t": "p", "x": "Vous direz sa personnalité. Donc, voyez-vous, le père, l’imagination, l’esprit humain, vous n’y pouvez rien. Mais quand vous utilisez des mots, ils évoquent certaines images mentales. Lorsque vous utilisez des mots, ils évoquent des images. Lorsque vous dites \"Au Nom du père\", vous avez une certaine image mentale du vieux père Noël, de Saint Nicolas. Des millions et des millions d’hommes omnipotents, mais ressemblant à des hommes, assis sur une quelconque planète, balançant les pieds sur un repose-pieds, portant un casque, le bien-aimé père dans les cieux. Quand vous dites \"Dieu le fils\", je vous demande si vous pensez à un taureau de combat ou à quelqu’un de"}, {"t": "p", "x": "déloyal. Non, vous pensez à un beau jeune homme aux cheveux blonds, aux yeux bleus, à la physionomie agréable. Quelque chose comme le roi des rois, Jésus de Nazareth, le jour de son triomphe, joué par Geoffroy Hunter, beau jeune homme, blond, yeux bleus, physionomie agréable, jolie barbe, pas quelqu’un avec un nez tordu qui vous ferait venir d’autres images à l’esprit."}, {"t": "p", "x": "Vous savez, Shakespeare rendit Shylock célèbre. Non vous pensez à quelqu’un comme à un Anglais, un Nordique du type germanique, avec un nez droit, le fils. Et le Saint-Esprit, quelque chose qui est venu comme une colombe lorsque Jésus a été baptisé par JeanBaptiste dans le Jourdain ou quelque chose qui vient comme des flammes de feu à la pentecôte. L’image n’est pas très vivace, mais elle est là. Vous avez trois images mentales distinctes et quelque soient vos efforts vous ne pouvez jamais superposer ces trois images pour en créer une seule. Elles seront toujours trois dans votre esprit. Si je vous demande combien d’images vous voyez, vous répondez une. Frères et soeurs, vous me mentez. Vous me mentez."}]}, {"title": "Q12. Monsieur Swaggart, premièrement donnez-vous la permission pour tous ceux qui…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Monsieur Swaggart, premièrement donnez-vous la permission pour tous ceux qui seraient intéressés d’avoir une copie de cet évènement ? Deuxièmement, pourquoi n’avez-vous pas permis que cet événement soit télévisé. Nous vous avons offert la possibilité que cet événement soit télévisé à la Mecque, mais ça nous a été refusé."}, {"t": "p", "x": "J.Swaggart : N’avez-vous pas honte ! Vous m’avez mal cité. Je n’ai pas dit que Dieu est une personne, que le fils est une personne, que le Saint-Esprit est une personne. Je n’ai jamais dit cela. J’ai dit qu’il y a un Dieu, pas une personne [Cf au livre de Jimmy Swaggart \"The Error of the Jésus only Doctrine\", page 9, dans lequel nous pouvons lire \"We teach is one God manifest in three persons : God the Father, God the Son, God the Holy Ghost...\"] Il me semble qu’ils sont en train de retransmettre cela par télévision."}, {"t": "p", "x": "Je vois cinq caméras. Vous dites qu’ils ne sont pas en train de le téléviser. Or, ils sont en train de le téléviser. Non ? Je suis un peu confus. Je ne comprends pas. En réponse à la seconde question je réponds: Oui sans aucun doute, du moment que vous n’éditez pas des enregistrements. Vous savez, j’en connais un brin sur la télévision. Et on peut faire dire à n’importe qui tout ce que vous voulez lui faire dire, en faisant un montage. Nous sommes experts en la matière, Monsieur Deedat. Et je fais confiance à cet homme."}, {"t": "p", "x": "Vous me regardez, Monsieur. Je vous fais confiance. Mais je ne fais confiance au monde entier que je ne vois pas. Et nous demandons de signer une déclaration disant que si vous vouliez le retransmettre à la télévision et l’emporter avec vous, pour tout ce que vous voudriez en faire, ce serait à la condition de nous dire où vous allez l’éditer, et comment vous allez le découper. Je crois que ce n’est que justice. Nous ne voudrions pas prendre ce qu’il a dit, le découper et le faire paraître dire quelque chose qu’il n’a pas dite. Ce ne serait ni bien, ni juste. Et je crois que nous nous sommes comportés d’une façon aussi chrétienne que possible."}]}]}]}, {"id": "jonas", "title": "Quel était le signe de Jonas ?", "sub": "Les trois jours et trois nuits de Matthieu 12:40 examinés", "chapters": [{"n": 0, "title": "Le signe de Jonas", "sections": [{"title": "« Christ » n’est pas un nom", "blocks": [{"t": "p", "x": "Aujourd’hui, plus d’un milliard de chrétiens, acceptent aveuglément l’appellation de \"Christ\" pour désigner Jésus de Nazareth."}, {"t": "p", "x": "Ils se réfèrent à \"mille et une\" prophéties contenues dans la Bible (Ancien Testament) pour prouver ce qu’ils prétendent, à savoir que Jésus (Que la Paix soit sur lui) était le Messie attendu par les juifs. Laissons de côté pour un moment les \"mille prophéties\". Examinons plutôt la seule déclaration sans équivoque que fit Jésus (Que la Paix soit sur lui) dans l’Évangile et voyons s’il tint les promesses qu’il avait faites aux juifs. Nous devons admettre que le mot Christ n’est pas un nom mais bien un titre. C’est une traduction de l’hébreu Messiah qui signifie \"oint\" et qui se dit en grec \"Christos\" d’où le terme \"Christ\"."}, {"t": "p", "x": "Prêtres et rois étaient oints lorsqu’ils étaient consacrés. La Sainte Bible confère même ce titre à un roi païen Cyrus. Rappelons nous l’Évangile selon Luc: \"Quand le huitième jour fut accompli, il fut circoncis et fut appelé Jésus, du nom indiqué par l’ange avant sa conception.\" (Luc 2:21) Le nom qui fut transmis à Marie pour son fils avant même sa naissance était Jésus (Que la Paix soit sur lui) et non Christ. Ce fut seulement après le baptême, reçu des mains de Jean Baptiste, que Jésus (Que la Paix soit sur lui) déclara être le Christ. Les juifs ne furent pas de ceux qui acceptèrent cela comme une vérité. Ils exigèrent une preuve !"}]}, {"title": "Le miracle comme preuve", "blocks": [{"t": "p", "x": "Matthieu mentionne que de doctes juifs scribes et pharisiens vinrent à Jésus Que la Paix soit sur lui) et lui dirent \"Maître, nous voudrions voir un signe de ta part:’ (Matthieu 12:38) Ce qu’ils voulaient, en réalité, c’était de la prestidigitation, un tour de magie consistant à marcher sur l’eau, à voler dans les airs ou encore à mettre le pied sur des charbons ardents. C’était le genre de \"signe\" ou de \"miracle\" qu’ils attendaient. Insatisfaits, ils le prirent pour un sorcier, un magicien, un charlatan."}]}, {"title": "Pas d’autre signe que celui du prophète Jonas", "blocks": [{"t": "p", "x": "De juste droit indigné, Jésus (Que la Paix soit sur lui) leur répondit: \"Une génération mauvaise et adultère recherche un signe, il ne lui sera donné d’autre signe que celui du prophète Jonas. Car, de même que Jonas fut trois jours et trois nuits dans le ventre du grand poisson, de même le Fils de l’homme sera trois jours et trois nuits dans le sein de la terre.\" (Matthieu 12:39 40)"}, {"t": "p", "x": "\"Pas d’autre signe que celui du prophète Jonas (P)\", leur répondit Jésus (P). Il ne fit pas allusion à Bartimée, l’aveugle à qui il avait rendu la vue, ni à la femme atteinte d’une perte de sang depuis douze ans, ni même aux deux mille porcs qu’il avait anéantis pour délivrer un démoniaque, encore moins aux trois mille ou cinq mille personnes qu’il avait nourries à satiété avec quelques poissons et quelques pains. \"Pas d’autre signe que celui du prophète Jonas\", leur répondit Jésus (P). En s’engageant à produire ce signe là et pas un autre Jésus (P) risquait gros, car son titre de Messie (Christ) en dépendait. Jésus s’acquitta t il de sa promesse ? Oui, répond la chrétienté d’une voix unanime sans prendre garde au conseil biblique : \"Examinez toutes choses, retenez ce qui est bon !\" (1 Thessaloniciens 5:21)"}]}, {"title": "Jonas fuit l’appel de Dieu", "blocks": [{"t": "p", "x": "Quel était le signe (miracle) de Jonas (P) ? Pour le savoir revenons au \"Livre de Jonas\" dans l’Ancien Testament. Dieu ordonna à Jonas (P) d’aller à Ninive pour mettre en garde les Ninivites, afin que \"chacun revienne de sa mauvaise conduite et de la violence (attachée) aux paumes de ses mains\" (Jonas 3:8). Mais Jonas (P) répugnait à aller donner un avertissement aux Ninivites. Il partit donc à Jaffa, au lieu de Ninive, d’où il prit un bateau, pour fuir le commandement de Dieu. Alors qu’il était en mer, une terrible tempête se leva."}, {"t": "p", "x": "Selon les croyances superstitieuses des marins, se dérober aux commandements de son Maître pouvait déclencher pareille tempête. \"Venez et tirons au sort, (comme on fait à pile ou face) pour connaître celui qui nous attire ce malheur, dirent ils. \"Ils tirèrent au sort, et le sort tomba sur Jonas\" (Jonas 1:7). Quoiqu’ayant failli momentanément à sa mission, Jonas (P) se sacrifia spontanément et courageusement, il leur dit: \"Prenez moi, jetez moi dans la mer et la mer se calmera envers vous, car je sais que c’est moi qui attire sur vous cette grande tempête.\" (Jonas 1:12)"}]}, {"title": "Mort ou vif ?", "blocks": [{"t": "p", "x": "Puisque Jonas (P) s’offrit généreusement en sacrifice pour les autres, il n’y avait aucune raison que les marins l’étranglent, le frappent d’un harpon, ou lui brisent un membre avant de le jeter par dessus bord. \"Prenez moi, et jetez moi (dans la mer)\" furent ses propres termes. Maintenant, la question est de savoir s’il était mort ou vif, lorsque le capitaine et son équipage le lancèrent à la mer. N’importe quel petit chrétien étant allé au catéchisme, répondrait immédiatement : Vif ! La tempête s’apaisa. Fut ce une coïncidence ?"}, {"t": "p", "x": "Jonas (P) fut englouti par un poisson. Dans les entrailles du poisson, était il mort ou vif ? \"Vif !\" Était il mort ou vif, lorsque \"dans les entrailles du poisson, [il] pria l’éternel, son Dieu.\" (Jonas 2:1) ( Dans l’édition française ce passage correspond à Jonas 2:2.) Le troisième jour, il le vomit sur la’ terre ferme. Mort ou vif ? \"Vif’ bien entendu ! Que prophétisa Jésus (P) à propos de lui même ? \"De même que Jonas [...] de même le Fils de l’homme sera...\" \"Comme Jonas\" dit il. Pendant trois jours et trois nuits Jonas (P) était il mort ou vif? \"Vif !\" \"Vif !\" \"Vif !\" est la réponse unanime, tant des juifs et des chrétiens que des musulmans !"}]}, {"title": "Contrairement à Jonas", "blocks": [{"t": "p", "x": "Si Jonas (P) demeura vivant pendant trois jours et trois nuits, Jésus (P) dut donc également demeurer vivant, dans le tombeau, tout comme il l’avait prédit lui même !"}, {"t": "p", "x": "Mais pour leur propre salut, les chrétiens s’accrochent à l’idée de la mort de Jésus (P). De ce fait, à la question \"Jésus était il mort ou vif pendant trois jours et trois nuits ?\" ils ne peuvent que répondre : \"Mort\". Il y a donc ici une contradiction flagrante entre ce qu’il annonça et ce qu’il accomplit. Jonas (P) vivant et Jésus mort, contrairement à Jonas (P) ! Jésus (P) avait dit \"de même que Jonas\" non \"contrairement à Jonas\". Si sa mort s’avérait vraie, Jésus (P) ne serait pas, selon ses propres critères, le vrai Messie attendu par les juifs. Si ce que l’Évangile mentionnée est authentique, comment pouvons nous blâmer les juifs d’avoir proscrit le \"Christ\" ?"}]}, {"title": "Trois jours + trois nuits", "blocks": [{"t": "p", "x": "A cela, un docteur en théologie réplique que, dans le passage en question (Matthieu 12:40), c’est sur le facteur \"temps\" qu’est mis l’accent \"de même que Jonas (P) fut trois jours et trois nuits dans le ventre du grand poisson, de même le Fils de l’homme sera trois jours et trois nuits dans le sein de la terre\". \"Remarquez dit il que dans ce passage, le terme \"trois\" se répète \"quatre\" fois pour souligner que c’est en vertu de la période de temps où Jésus (P) restera dans le tombeau qu’il réalisera sa prophétie, et non en vertu d’une similitude avec l’état de Jonas (P) mort ou vif."}, {"t": "p", "x": "Si c’est le facteur temps que Jésus (P) privilégiait, réussit il à tenir la promesse qu’il avait faite aux Juifs ? Bien entendu ! répondent les dogmatiques chrétiens."}]}, {"title": "Vendredi saint", "blocks": [{"t": "p", "x": "Une question se pose alors: \"Quand le Christ fut il crucifié ?\" \"Vendredi !\" répond unanimement le monde chrétien. N’est ce pas la raison pour laquelle nous célébrons le \"Vendredi Saint\" dans tout le monde chrétien de l’Amérique à la Zambie en passant par l’Éthiopie et le Zaïre ? Pourquoi ce vendredi là est il un jour saint ? Parce que c’est ce jour là précisément que le Christ mourut sur la croix, pour nous purifier de nos péchés, disent les chrétiens. Ainsi il mourut sur la croix un vendredi, il y a 1950 ans. \"Oui !\" disent les chrétiens."}, {"t": "p", "x": "D’après les Evangiles, les juifs étaient pressés d’éliminer Jésus. Dès le lendemain de son procès, qui s’était déroulé en pleine nuit, ils le conduisirent devant Pilate, puis devant Hérode, pour le ramener ensuite devant Pilate. Les personnages influents craignaient le peuple car Jésus était son sauveur, son bienfaiteur. Ses ennemis devaient donc s’en débarrasser au plus vite et ils y parvinrent. Cependant, comme c’était vendredi, ils furent aussi pressés de le descendre de la croix qu’ils ne l’avaient été de l’y mettre, car son corps devait être enlevé avant le coucher du soleil, pour cause de Sabbat."}, {"t": "p", "x": "En effet, le Sabbat commençait le vendredi soir à dix heures, et le Deutéronome avait prescrit aux Juifs de ne pas laisser les corps en croix pendant le Sabbat car ils étaient \"objets\" de la malédiction auprès de Dieu\" et \"tu ne souilleras pas le territoire que l’Éternel, ton Dieu, te donne pour héritage\", poursuit le passage (21:23)."}, {"t": "p", "x": "Pour satisfaire aux prescriptions religieuses des scribes et des pharisiens, les disciples de Jésus (P) qui l’étaient \"en secret\" descendirent son corps de la croix. Ils lui firent la toilette mortuaire selon le rite juif, l’enduirent d’\"un mélange d’environ cent livres de myrrhe et d’aloès\" (Jean 19:39), et, avant la tombée de la nuit, déposèrent son corps recouvert d’un linceul dans un sépulcre."}]}, {"title": "Pourquoi « supposé » ?", "blocks": [{"t": "p", "x": "S’il y a des différences notoires entre les divers cultes et groupes chrétiens, ils sont cependant unanimes sur le fond. Jésus (P) est supposé reposer dans le tombeau la nuit du vendredi, il est également supposé y reposer le samedi et la nuit du samedi. Les chrétiens sont pleinement d’accord avec ceci. Si je répète le terme \"supposé\" trois fois, c’est parce que les Evangiles ne disent pas un mot sur le moment exact où Jésus (P) sortit du tombeau. Il se peut qu’il ait été emmené, par ses disciples, dans la nuit du vendredi, vers un endroit plus approprié et plus paisible. En tout état de cause, je ne peux assumer la responsabilité du silence des auteurs des Evangiles. C’est pourquoi, je répète le ternie \"supposé\" trois fois."}, {"t": "p", "x": "Pour clore cette analyse, voyons si Jésus (P) resta trois jours et trois nuits dans le tombeau. Dans la tombe Jours Nuits une nuit"}, {"t": "v", "x": ["Semaine de Pâques", "Vendredi", "Déposé dans la tombe avant", "le coucher du soleil", "Samedi", "Présent dans la tombe", "Dimanche", "Disparu avant", "le lever du soleil", "TOTAL"]}, {"t": "p", "x": "un jour"}, {"t": "p", "x": "une nuit"}, {"t": "p", "x": "-"}, {"t": "p", "x": "-"}, {"t": "p", "x": "un jour"}, {"t": "p", "x": "deux nuits"}, {"t": "p", "x": "Il n’est pas permis de douter que le total est d’un jour et deux nuits et non de trois jours et trois nuits. Au regard des Ecritures chrétiennes Jésus (P) aurait failli à sa promesse \"deux\" fois."}, {"t": "p", "x": "En premier lieu, contrairement à Jonas (P) qui était \"vivant\" dans les entrailles du poisson, Jésus (P) était mort pendant le même nombre de jours; les chrétiens prétendent donc que ce qui est arrivé à Jésus (P) est exactement le contraire de ce qui est arrivé à Jonas (P)."}, {"t": "p", "x": "En second lieu, nous découvrons que Jésus (P) n’a pas tenu sa promesse au regard du facteur temps. Le plus grand mathématicien qui puisse exister dans le monde chrétien ne pourra obtenir le résultat escompté, à savoir trois jours et trois nuits, car n’oublions pas que les Evangiles disent clairement que Marie Madeleine alla à la tombe de Jésus (P) et la trouva vide le Dimanche matin (premier jour de la semaine) \"avant le lever du soleil\"."}]}, {"title": "Mercredi saint", "blocks": [{"t": "p", "x": "Par sa connaissance de l’arithmétique, la famille Amstrong oppose un démenti au monde chrétien dans sa totalité. J’ai assisté récemment à une conférence à l’Holiday Inn de Durban (Afrique du Sud), donné par M. Robert Fahey du magazine \"Plain truth\", conférence lors de laquelle il tente d’apporter, à un auditoire chrétien, la preuve que Jésus (p) avait été crucifié un mercredi et non un vendredi comme le suppose la chrétienté depuis deux millénaires ! Selon lui, si à partir du dimanche matin, on compte à rebours trois jours et trois nuits, on tombe sur mercredi, qui est donc le jour saint."}, {"t": "p", "x": "Toutes mes félicitations à M. Fahey pour son ingéniosité. Je voudrais cependant lui demander: \"Comment se peut il que toute la chrétienté, sans exception, célèbre depuis 2000 ans le vendredi saint au lieu du mercredi saint ?\""}, {"t": "p", "x": "Ainsi, un milliard deux cent mille chrétiens de par le monde ignoraient le jour exact de la prétendue crucifixion ! Et selon M. Fahey, l’Église catholique de Rome elle même qui se réclame d’une lignée ininterrompue de Papes depuis Pierre jusqu’à nos jours se fourvoierait !"}]}, {"title": "Dieu ou diable", "blocks": [{"t": "p", "x": "Il s’agissait donc de savoir qui, depuis deux millénaires, induisit en erreur des millions de chrétiens. ETAIT CE Dieu ou le Diable ? \"Le diable\", répondit catégoriquement M. Fahey. \"S’il est si aisé au diable, lui dis je, de jeter le trouble chez les chrétiens pour des choses aussi élémentaires que la célébration d’un jour saint un mercredi ou un vendredi, ne lui est il pas encore plus aisé de les abuser sur des choses plus graves concernant Dieu lui même ?\" Sur ce, M. Fahey rougit et partit."}, {"t": "p", "x": "Si cette position reflète aujourd’hui la nouvelle tendance de la chrétienté, nous pouvons nous demander si elle ne constitue pas la plus grande mystification qu’ait jamais connu l’histoire !"}]}]}]}, {"id": "nom", "title": "Quel est Son nom ?", "sub": "Le nom de Dieu à travers les peuples, les langues et la Bible", "chapters": [{"n": 1, "title": "Croyance en un Dieu universel", "sections": [{"title": "Quel est Son nom ?", "blocks": [{"t": "p", "x": "A la fin de mon discours publique ayant pour thème \"Mohammed (ﷺ)* le successeur naturel du Christ\", un missionnaire chrétien demanda \"Quel est son nom ?\", faisant allusion à Dieu. Je me Ievai pour répondre mais avant que je n’ai eu le temps d’ouvrir la bouche devant le micro, il voulut répondre à sa propre interrogation prévenant ainsi toute autre intervention. Je lui dis : \"Vous avez posé une question à laquelle je suis obligé de répondre\". Il me répondit : \"Oui, mais je peux y répondre\" (rires dans la salle). Il cherchai une occasion d’être entendu."}, {"t": "p", "x": "Où aurait-il pu trouver pareille assistance pour faire son prêche qui, de surcroît, était financé par les musulmans. Je lui dis : \"Allez-y !\" (Donnons-lui plus de corde pour se pendre). (*) Abréviation de la formule de révérence : \"Que les prières [Ṣalât(s)] d’Allah soient sur Lui et Ses descendants\"."}, {"t": "p", "x": "Après quelques mots incohérents, il conclut par le fait que le nom de Dieu fut \"Jésus-Christ\" (P)*. Ce n’était ni le moment, ni 1’occasion et encore moins convenable d’aborder et de discuter totalement le sujet : \"Jésus estil Dieu ?\" (1). Il est plus que suffisant pour le moment de dire que dans le langage de Moïse (P), de Jésus (P), et Mohammed (ﷺ), le nom de Dieu Tout-Puissant est Allah ! Preuve en sera donnée au chapitre 4. Croire en Dieu est inhérent à la nature humaine. Depuis que l’homme est apparu à la surface de la terre, il a vécu en présence et en connaissance de Dieu Tout-Puissant."}, {"t": "p", "x": "Comme le disait le Professeur Max Fuller dans ses conférences de Hibbert: \"La religion n’est pas une nouvelle invention, elle est aussi vieille que le monde que nous connaissons si ce n’est plus. Il n’y a jamais eu un faux Dieu, pas plus qu’il n’y a eu de fausse religion. Toutes les religions, d’après mes informations et mes connaissances. ont le même objectif : toutes étaient reliées par une chaîne qui allait de la terre au paradis, qui tenaient et étaient tenues par la même main.\" (*) Abréviation de la formule de révérence : \"Que la Paix soit sur lui’. 1. Ce titre a été débattu avec les chrétiens instruits de la question. Les vidéo K7 sont disponibles. Le document \"Jésus est-il Dieu ?\" sera disponible trés prochainement."}, {"t": "p", "x": "Ceci est vraiment une attitude charitable, une attitude islamique Allah soubhanahou wa ta’a1a (Dieu ToutPuissant), nous dit le Saint Coran : \"... Il n’est pas une nation qui n’ait déjà eu un avertisseur\" Sourate Fâtir 35:24 \"... Et à chaque peuple.. um guide.\" Sourate Ra’d 13:7"}]}, {"title": "Dieu impartial", "blocks": [{"t": "p", "x": "Si Dieu est impartial vis-à-vis de ses créatures pour tous les bienfaits qu’il leur prodigue, comme l’air pur, la pluie, le soleil, etc... pourquoi ne le serait-il pas pour ses bienfaits spirituels (la voie divine) ? Il n’a jamais été partial ! II n’y a pas un seul peuple ou un seul groupe linguistique sur terre qui ne connaisse Dieu sous un nom ou sous un autre."}, {"t": "p", "x": "Ce savoir fut divulgué par le créateur lui-même à travers sa Parole prononcée par les lèvres de ses messagers"}, {"t": "p", "x": "dont nous con naissons quelques-uns d’entre eux : le reste a été oublié ou s’est dissipé dans les bromes de la superstition."}, {"t": "p", "x": "Alors que la théologie (connaissance de Dieu - Etude des religions) a vu le jour avec Dieu, l’homme a toujours jonglé avec les concepts purs et saints de la théologie. II le fit avec précipitation en perdant à chaque fois, n’hésitant pas à ajouter ornements et fioritures là ou la fantaisie était inutile et rendait le langage indigent. Dans son commentaire de la Bible, Mrs Ellen G. White une \"prophétesse\" du mouvement adventiste du 7° jour disait : \"Certains érudits ont dans certains cas des mots croyant les rendre plus évidents, alors qu’en réalité, ils mystifient ce qui est déjà évident (1)."}, {"t": "p", "x": "Dans les annales religieuses mondiales, les Ecritures juives et chrétiennes appelées la Sainte Bible abondent d’exemples graphiques portrayant Dieu d’après le modèle que s’en fait l’homme. 1. Pour tous les détails concemant Mrs White, consultez mon document \"I.a Bible est-elle la parole de Dieu ?\""}]}, {"title": "Les descriptions imparfaites de Dieu", "blocks": [{"t": "p", "x": "TEL UN HOMME (Genèse 11:5) \"L’Eternel descendit pour voir la ville et la tour que bâtissaient les fils des hommes\""}]}, {"title": "Moïse voit Dieu de dos (Exode 33:23)", "blocks": [{"t": "p", "x": "\"Puis, je retirerai ma main, et tu me verras par derrière, mais ma face ne pourra être vue.\" LUTTE AVEC JACOB (Genèse 32:28-29) \"L’homme lui dit : Quel est ton nom ? Il répon dit : Jacob. (L’homme) reprit : Jacob ne sera plus le nom qu’on te donnera, mais Israël car tu as lutté avec Dieu et avec des bommes, et tu as été vainqueur.\" COMME UN IVROGNE (Psaumes 78:65) \"Le Seigneur s’éveilla comme celui qui a dormi comme un héros rendu triomphant par le vin\""}]}, {"title": "Regrets pour la création de l’homme (Genèse 6:6)", "blocks": [{"t": "p", "x": "\"L’Eternel regrettera d’avoir fait l’homme sur la terre, et son coeur fut affligé.\" HUMANT LES PARFUMS AGRÉABLES (Genèse 8:21) \"L’Eternel sentit une agréable odeur et l’Eternel dit en son coeur...\" UN LION ACCROUPI (Nombres 24:9) \"II s’accroupit, il se couche comme un lion et comme une lionne : qui le fera lever ?\" UN FEU DEVORANT (Exode24:17) \"L’aspect de la gloire de l’Eternel était aux yeux des Israélites comme un feu dévorant au sommet de la montagne\". REPOSÉ ET RAFRAICHI (1) (Exode 31:17) \"... en six jours l’Eternel a fait les cieux et la terre et le septième jour il a cessé son euvre et il s’est reposé:’"}, {"t": "p", "x": "En dehors des 73 volumes de la version catholique (romane) et des 66 autres de la version protestante appelées toutes deux Bible (2), un nombre illimité de citations peut être éliminé. Il pourrait constituer une publication beaucoup plus importante que les deux versions de la Bible (citées ici) et soulignerait les descriptions imparfaites de Dieu par l’homme. Les exemples précédents devraient suffire j’espère. 1. Rafraîchi : pour commémorer le Sabbat du fait que Dieu Tout-Puissant aurait été fatigué et devait se reposer après six jours de travail harassant. C’est une insulte patente à l’égard de Dieu. Le Saint Coran dit :"}, {"t": "p", "x": "\"... II n’est sujet ni à la somnolence, ni au sommeil. II a tout ce qui est dans les cieux et tout ce qui est en terre... Son trône à la conte nance des cieux et de la terre et leur sauvegarde ne lui pèse en rien. II est le transcendant et le très grand.\" (Saint Coran 2:25) 2. Pourquoi 66 de l’une et 73 de l’autre ? Le livre \"La Bilble est-elle la parole de Dieu ?\" explique cette particularité."}, {"t": "p", "x": "Dans le domaine de la spiritualité, aucun peuple n’a eu autant d’occasions que les enfants d’Israël qui, malgré les avertissements répétés : \"Tu n’auras pas d’autres dieux devant ma face. Tu ne te feras pas de statue, ni de représentation quelconque de ce qui est en haut dans le ciel, de ce qui est en bas sur 1a terre et de ce qui est dans les eaux plus bas que la terre. Tu ne te prosterneras pas devant elles et tu ne leur rendras pas de culte. Car moi l’Eternel, ton Dieu, je suis un Dieu jaloux qui punit 1a faute des Pères sur les Fils jusqu’à la troisième génération et à la quatrième de ceux qui me haïssent.\" (Exode 20:3-5) Ils prirent le veau d’or comme divinité à adorer et retournèrent à maintes reprises à l’idolâtrie, tout comme les chrétiens qui ne sont encore et (toujours pas) libérés de cette corruption (maladie, infection)."}, {"t": "p", "x": "Visitez la cathédrale Saint Paul à Londres ou celle de Saint Pierre à Rome, et vous constaterez une petite différence avec le Temple de Sommath en Inde, différence comparable à celle de Tweedle Dum (1) et Tweedle Dee (1). Mais Vous n’avez pas à aller si loin (en Angleterre ou en Italie) pour vérifier mes affirma tions. Pourquoi n’iriez-vous pas rendre visite à une des églises protestante ou catholique de votre région ? 1. Personnages de contes de fées, identiques en apparence."}]}]}, {"n": 2, "title": "Les concepts", "sections": [{"title": "Les concepts", "blocks": [{"t": "p", "x": "Dans la terminologie religieuse à travers le monde, il est à constater que tous les \"Fils de l’Homme\" ont de tous temps, dans leur façon d’être et de s’exprimer, donné de merveilleux attributs au Seigneur des Paradis et de la Terre."}]}, {"title": "Le concept zoulou", "blocks": [{"t": "p", "x": "Dans notre pays, l’Afrique du Sud, les Zoulous, un peuple viril et militant, apparenté aux Qoraïch arabes de l’époque pré islamique, avait donné à Dieu Tout-Puissant le nom de \"uMvelinqangi\". Ce nom, lorsqu’il est correctement articulé dans sa phonétique originelle est identique au mot arabe \"Wallahou ghani\" qui veut dire \"et Dieu est riche (généreux)\". Il est très proche du terme \"Allegany\". Dan sa phonétique terme utilisé par les Indiens \"Peaux-Rouges\" d’Amérique du Nord (Souvenez-vous de leurs montagnes \"Allegany\")."}, {"t": "p", "x": "Le sens et l’origine réels du mot \"Allegany\" n’est pas connu par le commun des Américains, mais demandez à n’importe quel Zoulou, qui est ce \"uMvelinqangi\", il vous expliquera sûrement en langage zoulou : \"Hawu umnimzani ! Uyena, umoya oingcwele. Akazali yena, futhi akazalwanga; Futhi, akukho lutho olu fana naye.\""}, {"t": "p", "x": "Croyez-moi ceci est pratiquement, mot à mot, la traduction liuérale de la Sourate \"Al-Ikhlas\" chapitre 112 du Saint Coran : \"Dis : C’est Lui Dieu, seul et unique Dieu Le recours suprême et efficient Il n’a jamais enfanté, et Il n’a jamais été enfanté Nul ne Lui est égal ou semblable.\""}, {"t": "p", "x": "(Saint Coran 112:1-4)"}]}, {"title": "Pratiquement islamique", "blocks": [{"t": "p", "x": "Maintenant comparons les versets de la sourate \"Al-Ikhlas\" (La foi pure et exclusive) avec ma traduction libre de ce que le zoulou dit : \"Ô Seigneur ! ll est pur et Saint-Esprit, il n’a pas enfanté et n’a pas été enfanté et il n’est rien qui lui soit semblable.\""}, {"t": "p", "x": "Chaque tribu africaine, au Sud du fleuve Zambèse (en Afrique du Sud) a donné différents noms au ToutPuissant : \"Tixo\", \"Modimo\", \"Unkulunkulu\", etc... Et chaque groupe linguistique africain, tente avec difficultés d’exprimer le même concept pur et saint que les Zoulous. Il est tout à la gloire des peuples africains qui, malgré le fait qu’ils n’avaient pas de langue écrite et par conséquent pas de documents de référence, ne pouvaient compter le nom de tous leurs prophètes."}, {"t": "p", "x": "Pas une tribu cependant ne s’était avilie à vénérer des images ou des statues d’hommes ou d’animaux jusqu’à ce que l’homme blanc introduise sa religion et ne donne aux Africains son concept antropomorphique de Dieu le Père, Dieu le Fils, Dieu le Saint Esprit et ne conduise les Africains à se prosterner devant les statues de Jésus (P), Marie, Joseph, Christophe, etc... Parmi les douzaines de tribus africaines habitant cette partie du monde, pas une d’entre elles ne \"fabriqua d’images\" (\"Umfanegisos\") de son Dieu. Certes, ils étaient capables de sculpter des éléphants et des lions en bois et de faire des statues d’hommes et de femmes en argile, comme ils avaient une certaine maîtrise du travail des métaux."}, {"t": "p", "x": "Lorsque je demandai à un vieux Zoulou pourquoi les Africains ne réalisaient pas d’images de leurs dieux, il me repliqua : \"Comment pouvons-nous faire des images de Lui (Dieu Tout Puissant) quand nous savons qu’il ne ressemble pas à un homme, qu’i1 ne ressemble pas à un singe, ou un éléphant ou un serpent. ll ne ressemble à rien que nous pouvons imaginer ou qui peut nous venir à l’èsprit. Il est pur et Saint-Esprit.\""}]}, {"title": "Comme les Arabes", "blocks": [{"t": "p", "x": "Le mot \"uMvelingangi\", quoique très familier des Zoulous, était très peu utilisé par eux. Comme les païens Qoraïch de l’Arabie pré-islamique qui connaissaient le nom d’Allah et l’oublièrent, car ils étaient convaincus qu’il était trop haut, trop pur, trop saint pour être approché. Ils lui substituèrent leurs idoles et leurs dieux imaginaires, leurs ’ Alats, al-Ouzzas et a1 Manats\" et des centaines d’autres. Les Zoulous aussi ne pouvaient pas parler à leur \"uMvelingangi\" directement. Mais ils étaient mieux que les Arabes de Ayam al-Jahiliya (les jours de l’ignorance) car ils ne cherchaient pas de faux dieux, ils invoquaient l’esprit de leurs ancêtres afin qu’ils intercèdent auprès de \"uMvelinqangi\" exactement comme les catholiques lorsqu’ils invoquent la Vierge Marie et les saints."}, {"t": "p", "x": "Le nom le plus communément utilisé par les Zoulous pour désigner leur Dieu est \"Unkulunkulu\" qui signifie littéralement \"Le plus grand des plus grands\" ou \"Le plus puissant des puissants\". Plus familièrement lorsqu’ils prêtent serment, ils s’exclament \"Inkosi phe-Zoulou !\" Signifiant le Seigneur supérieur ou Dieu au Paradis ou le Paradis, sait que je dis la vérité. Le mot \"zoulou\" en langage zoulou veut littéralement dire \"Le para dis élevé\", les Zoulous se considérant comme supérieurs à toutes les autres tribus d’Afrique du Sud, ressemblant ainsi aux Qoraïch parmi les gens du désert avant l’Islam."}]}, {"title": "Le concept asiatique", "blocks": [{"t": "p", "x": "En hindi, Dieu se dit \"Pramatma\", en sanscrit, langue de l’Inde ancienne, \"Atma\" signifiait \"l’âme\" alors que \"Pram Atma\" signifiait la sainte grande âme ou le saint-esprit qui est réellement une belle description du \"Père\" au paradis. La Bible nous révèle : \"Dieu est esprit et il faut que ceux qui l’adorent, l’adorent en esprit et en vérité:’ (Jean 4:24) Non dans sa taille, dans sa forme, ni dans son apparence, mais dans son esprit. Malgré leur interprétation panthéiste de la divinité, les Hindous donnent à l’être suprême dans leur langue classique le nom de \"Om\" qui veut dire \"gardien\" ou \"protecteur\", un attribut approprié à propos duquel les musulmans ne peuvent avoir aucun doute."}]}, {"title": "Le concept occidental", "blocks": [{"t": "p", "x": "Dans leurs langages ou ceux qui leur sont apparentes, les Anglo-Saxons et les Teutons désignent l’objet de leur vénération par le terme \"God\" (1) ou d’autres ayant la même consonance ou la même signification : God en anglais"}, {"t": "p", "x": "God en afrikaan (langage des Boers, descendants des Hollandais d’Afrique du Sud) Gott en allemand Gudd en danois, suédois et norvégien. 1. Le terme \"Dieu\" avec toutes ses ramifications contraste avec \"Allah\" qui sera étudié au chapitre IV de ce livre."}, {"t": "p", "x": "Les anciens Phéniciens appelaient leur Dieu, Allon (nom très proche de Allah si on ne considère que sa forme articulée). Le peuple de Canaan - Ado - Les Israélites ont non seulement partagé leur mot \"EI\" avec le peuple originel de Palestine, mais ils ont emprunté le nom de leur plus grande divinité Ado, ce qu’ils transformèrent en \"Adonaï\". Par ailleurs, chaque fois que les quatre lettres YHWH sont apparues dans leurs Saintes Ecritures ils les lisaient \"Adonaï\" à la place de \"Yahuwa\"."}, {"t": "p", "x": "Vous ne manquerez pas de remarquer la ressemblance entre \"Adonaï\", d’origine juive, et \"Adonis\", dieu païen aimé de Vénus, déesse de l’amour dans la Grèce antique."}]}, {"title": "Le concept latin", "blocks": [{"t": "p", "x": "En latin, langue dominante qui prévalait en Europe de l’Ouest du fait de son usage généralisé pendant des siècles dans l’enseignement et la diplomatie, le terme principal pour désigner dieu était \"Deus\" : Deus en portugais Dieu en français Dio en italien Dios en espagnol Dia en écossais et en irlandais Duw en gallois Aussi surprenant que cela puisse paraître Deus et tous les autres mots de même consonnance voulaient dire \"Paradis\". Moulana Vidyarthi, dans son oeuvre maîtresse \"Mohammed dans les Ecritures Universelles\" (1), a consacré une centaine de pages à l’étude des noms donnés à Dieu dans les différentes langues."}, {"t": "p", "x": "Par ailleurs, à partir d’une liste de 155 attributs, 40 d’entre eux font usage du mot \"Paradis\" ou le \"Supérieur\". Cependant, les chants psalmodiés musulmans \"Asma Allah al-Husna\" (les plus beaux noms donnés à Allah) 99 noms sont extraits du Saint Coran avec le nom couronné d’Allah. Le terme \"Paradis\" n’en fait pas partie. Symboliquement, le mot \"Paradis\" décrirait la demeure de Dieu et dans les termes de Worsworth dans l’Abbaye de Tintem: \"Celui dont la demeure est la lumière des soleils couchants et des océans alentours, de l’air pur que l’on respire et le ciel bleu et l’esprit de l Homme, un signe et un esprit qui pousse toute chose pensante, tout objet et toutes les pensées et parcourt toute chose.’ 1."}, {"t": "p", "x": "Aucun étudiant ou chercheur en religions comparées ne peut évoluer sans cet ouvrage. Votre héritage le plus précieux CONCEPT D’AU-DELA DE L’EXTREME-ORIENT (Australie/Océanie) Parmi les 155 noms les plus beaux donnés à Dieu, dans les différentes langues, celui qui m’a le plus intrigué fut celui de \"A.T.N.A.T.U\", que j’avais donné en titre à mon ouvrage dé signé initialement \"Quel est son nom ?\""}, {"t": "p", "x": "Qu’y a-t-il de particulier ou de nouveau en ATNATU ?"}, {"t": "p", "x": "Les Aborigènes du Sud de l’Australie désigne Dieu par le nom \"ATNATU\" du fait qu’il a été \"conditionné par un philosophe un poète ou prophète pour admettre quel Dieu au Paradis est absolument libre de tout besoin. Il est indépendant et n’a besoin ni de manger ni de boire. Ces qualités, dans son langage primitif inhibé, lui font désigner Dieu sous le mot ATNATU qui veut littéralement dire \"Celui qui n’a pas d’anus\" ou \"Celui qui n’a aucun défaut\", et par exemple, celui de qui ne sort aucune impureté et aucune émanation. Quand j’ai voulu partager cette nouvelle vision avec les hindous, les musulmans ou les chrétiens de mes amis,"}, {"t": "p", "x": "leur réaction fut d’abord empreinte de gaité goguenarde qui se transforma en sourires idiots puis en rires. Ils ne réalisaient pas le ridicule de leur situation. Le problème était ailleurs. Quoique le mot \"anus\" est très court, seulement quatre lettres le composent. Beaucoup de gens ne le connaissent pas, ce qui les oblige à utiliser des termes vulgaires, que je ne peux reproduire ici ou utiliser en public dont je respecte l’hypersensibilité. Abdullah Yusuf Alî ne disait-il pas : \"... ils ont perverti leurs langages, beaux à l’origine, en jargons inélégants et de surcroît futiles et inexpressifs.\""}, {"t": "p", "x": "Pour simplifier la situation, utilisons une ellipse qui nous fera dire que là où il y a une \"entrée\" il y a nécessairement une \"sortie\". Quelqu’un qui se nourrit doit répondre à des besoins naturels - toilettes ou nature - dont nos primitifs avaient senti le besoin qu’ils ne pouvaient attribuer au Créateur. Ainsi, il appelait son Dieu - ATNATU ! : \"Celui qui n’a pas de système excrémental ou de terminaison caudale.\""}]}, {"title": "Dieu ne se nourrit pas", "blocks": [{"t": "p", "x": "Cette nouvelle conception de Dieu par les primitifs n’est pas à proprement parler nouvelle. Dieu Tout-Puissant a transmis la même vérité à toute l’humanité comme dans sa dernière et ultime révélation. Le Saint Coran, mais dans un langage tellement sub lime qti il ne pouvait être que divin. Cependant, du fait de sa subtilité et de son style raffiné, nous avons négligé le message. Nous sommes tenus de dire à tous ceux qui veulent nous détourner du culte du vrai Dieu Unique : \"Dis : Est-ce autre que Dieu que je prendrais comme ami protecteur."}, {"t": "p", "x": "Lui le créateur sans précédent des cieux et de Ia terre ?"}, {"t": "p", "x": "C’est lui qui nourrit et qui n’est point nourri.\" (Saint Coran 6:14) Nous ne prendrons pas un autre Seigneur ou protecteur autre qu’Allah, sublime créateur de l’Univers. Si quelqu’un avait des doutes avec ses soi-disants \"Hommes Dieux\" ou \"Dieu-fait homme\" ramenez-le sur terre. Dieu Tout-Puissant est celui qui pourvoit à tout et qui n’a pas à être pourvu (nourri), car il n’a besoin de rien. Est-ce que votre Dieu-fait-homme se nourrit ? S’il le fait, il est soumis aux lois de la nature - Notre Dieu ne se nourrit pas - Simple est la logique et prodigieux sont les arguments."}, {"t": "p", "x": "Hélas ! Nous avons à être ramené par un être primitif, à consi dérer l’inutilité de nos armes. Nous avons perdu l’art ou le don de communiquer, car pendant bon nombre de siècles, nous avons cessé de prêcher et de faire connaître l’islam autour de nous."}, {"t": "p", "x": "Les chrétiens frappent à nos portes et seuls les aveugles spirituels ou les \"autruches\" de notre bord ne voient rien. Le Koweit avait, pendant plus de cinquante ans, une seule famille chrétienne. Aujourd’hui, dans ce minuscule pays, il y a plus de trente-cinq églises."}, {"t": "p", "x": "Les Témoins de Jéovah, secte chrétienne qui a vu le jour aux USA il y a une centaine d’années, proclament partout que le groupe le plus important à l’étranger se trouve implanté au Nigéria, un pays musulman. En Indonésie, le plus grand pays musulman du monde, on peut compter plus de 600 missionnaires chrétiens permanents (moubalighs), non pas des prêtres, des titulaires ou des ecclésiastiques membres de leurs chapelles ou de leurs églises, mais les propagateurs (croisés) de leur foi aux non chrétiens, harcelant sans relâche \"Les païens\"."}, {"t": "p", "x": "Ces missionnaires chrétiens possèdent leurs propres aéroports qui sont plus nombreux que ceux dont dispose le gouvernement indonésien lui même. Ils possèdent des bateaux-missionaires qui sont ancrés dans les Iles, car l’Indonésie est un pays réparti sur plus de deux mille îles qui n’ont pas de port ou de structures portuaires."}, {"t": "p", "x": "Ils invitent les autochtones à se rafraîchir et à se distraire à bord des bateaux et leur enseignent leurs blasphèmes. Dans leur programme, dont le nom de code est \"Eradication\", ces missionnaires ont décidé de faire de l’Indonésie une nation chrétienne avant la fin du siècle actuel. Parmi les 60.000 missionnaires qui soulèvent la poussière à travers le monde, plus de la moitié sont à l’oeuvre en Afrique, le seul continent musulman aujourd’hui, continent assaini par les croisés modernes qui veulent en faire, là aussi, un continent chrétien avant la fin du siècle."}, {"t": "p", "x": "Notre armure, notre épée et notre bouclier, dans cette bataile de la foi, se trouvent dans le Coran. Nous l’avons psalmodié pendant des siècles pour en acquérir le sawab (les protections spirituelles). Maintenant, nous devons les mettre en avant et les amener sur le"}, {"t": "p", "x": "champ de bataille. \"Le Messie, fils de Marie n’est qu’un messager avant lequel sont déjà passés des messagers et sa mère est une personne absolument véridique. Tous les deux mangeaient de la nourriture. Vois comme nous leur exposons clairement les versets. Et puis vois comment ils s’en laissent conter.\" (Saint Coran 5:75) La maison de l’islam reconnaît que Jésus-Christ, fils de Marie, fut l’un des plus importants messagers de Dieu. Elle reconnait qu’il vint au monde miraculeusement, sans aucune intervention masculine, qu’il fut le messie, qu’il ressuscita le mort, avec 1a permission de Dieu, qu’il guérit les aveugles et les lépreux,avec Ia persmission de Dieu."}, {"t": "p", "x": "Mais ne se nourrissait-il pas avec des aliments ? \"Ils lui présentèrent un morceau de poisson grillé. II le prit et le mangea devant eux.\" (Luc 24:42-43) Plus encore, la mère de Jésus (P) était une femme de vérité, pieuse et sainte. Mais ne mangeait-elle pas de la nourriture ? Vous imaginez les conséquences ? Aurions-nous besoin d’un Aborigène australien pour nous rafraîchir la mémoire ? En fait, nous en aurions besoin ! Dans cette bataille des coeurs et des esprits de nations et de peuples, nous aurions besoin de son \"Atnatu\"."}, {"t": "p", "x": "Dans son langage simple et rustique, dans sa voie enfantine et puérile, il clame à la face du monde que son Dieu ne se nourrit pas, que celui qui se nourrit ne peut, en aucune façon, être son Dieu, puisqu il ne serait pas ATNATU."}, {"t": "p", "x": "Notre frère primitif n’avait pas d’inhibition, il appelait les choses par leur nom."}]}, {"title": "Les mahométans", "blocks": [{"t": "p", "x": "L’homme d’Occident est coutumier des sobriquets. Quand il eut inventé la lampe à incandescence, il désigna \"lampe Mazda\" son globe de verre (ampoule). Ainsi, Mazda devint le Dieu de la lumière pour les Zoroastriens. Aujourd’hui, en Afrique du Sud, l’Européen connaît un grand succès en vendant la margarine \"Rama\". Le nom de Rama n’est autre que celui d’un homme \"demi Dieu\" adoré par une grande partie de notre population ici. Le Blanc se fait appeler \"Christian\" car il est adorateur du Christ. Il désigne les adeptes de Bouddha, les Bouddhistes, et avec la même logique, il désigne les musulmans \"Mahométans\", présumant ainsi du fait que le musulman vénère Mohammed (ﷺ). L’évidence c’est que, parmi les millions de musulmans à travers le monde, pas un seul n’est dans cette situation."}, {"t": "p", "x": "Supposons qu’il y ait quelque musulman lunatique qui soit adorateur de Mohammed (ﷺ)qui dans son délire spirituel veuille se faire appeler \"Mahométan\". Si maintenant ce Mahométan, dans son zèle, venait à rencontrer nos primitifs du Sud australien et qu’il leur fasse avec fanfare son prêche \"mohammédiste\" pressant ce pauvre peuple arriéré d’accepter Mohammed (ﷺ)comme Dieu, vous pouvez imaginer ce fils de la nature demandant à notre déluré de frère : \"Est-ce que Mohammed (ﷺ)était AT’NATU ?\" La réponse aurait bien évidemment été : \"Non !\""}, {"t": "p", "x": "Même de la part d’un illuminé. Que dire alors de ces héros et héroïnes modernes que des millions de gens émancipés et civilisés idolâtrent et vénèrent tous les jours ? Présentez vos candidats un à un à l’autochtone. Pourquoi n’essayez-vous pas avec votre réel ou votre imaginaire Homme Dieu ou Femme-Déesse ? Notre Aborigène se fera un plaisir de vous envoyer hors limite à tous les coups avec son \"boomerang\" avec son ATNATU ! Il n’est, dans son concept de Dieu, pas plus grand que d’autres millions d’individus en Europe, en Amérique en Asie ou en Afrique."}]}, {"title": "Progrès en régression", "blocks": [{"t": "p", "x": "Une image des Américains qui ont posé leurs pieds sur le sol lunaire pour la première fois, et \"leurs clans\" qui regardent le spectacle lunaire retransmis à travers le monde entier grâce aux satellites, chaque spectateur ayant un doigt sur une touche, merveilleux n’est-ce pas ? Vous souvenez-vous de la tragédie de la baie du Bengale ? Les Américains avaient averti le Pakistan de l’éminence d’un raz-de-marée. Vous souvenez-vous de la Guerre de Ramadhan en 1973 ? Les Américains avaient informé les Israéliens du fait que les troupes arabes étaient en manoeuvre, mais qui jamais ne prirent l’information au sérieux."}, {"t": "p", "x": "Ces mêmes Américains, malgré leur dépravation à manier un pouvoir supérieur à celui de tous les \"hommes divinisés\" réunis ne sont aptes qu’à vénérer des hommes ou des singes. Non ! Décidément, ils ne sont capables que de se diaboliser eux-mêmes. \"Le culte de Satan\": comment cela est-ce possible ? \"Le diable leur a embelli leurs autels. Il est aujourd’hui leur patron-protecteur.\" Saint Coran 16:63 Le fait d’être héros ou de vénérer un héros fait partie de la nature humaine. Si elle ne vénère pas Dieu, elle adorera autre chose, car il doit adorer, sublimer dans le culte. En effet, qu y a-t-il de mieux qu’un bel homme ou une belle femme \"uniques\" en leur genre ?"}, {"t": "p", "x": "Antromorphisme : un système dans lequel l’homme conçoit Dieu d’après ses références traditionnelles. Cette notion a de tous temps existé, l’homme ne peut imaginer Dieu que comme un être qui lui est ressemblant. La Bible ne dit-elle pas dans le premier chapitre du premier livre ? \"Et Dieu dit : Faisons un homme à notre image.\" (Genèse 1:26) En parlant d’image, Dieu ne parle pas de ressemblance physique humaine, qui ne serait pas très éloignée des singeries, quoique Darwin disait que les singes étaient nos ancêtres ! Non ! Nous sommes faits à l’image spirituelle du Bienfaisant, nous sommes l’un de ses attributs. Mohammed (ﷺ)disait : \"Pénètre toi des attributs divins\"."}, {"t": "p", "x": "Comme Allah est saint, nous sommes saints. Comme il est juste, la justice étant un de ses attributs, nous devrions être justes. Comme il est miséricordieux, nous devrions être l’image de la miséricorde et il en serait ainsi pour les 99 attributs de Dieu qui nous sont donnés par le Livre Divin, le Saint Coran. Nul être ne peut être Un avec Dieu, car Dieu n’est pas un être physique."}]}, {"title": "Les trois hypostases de la Trinité", "blocks": [{"t": "p", "x": "Les Pauvres (1) chrétiens ont mal compris le sens du mot \"image’ autant que celui de \"nous\" dans la citation précédente. Au tout début de la Bible, les Chrétiens interprétèrent le mot \"nous\" pour impliquer la combinaison du \"Père, du Fils et du Saint Esprit\" de leur Sainte Trinité. Ils échouèrent en ne tenant pas compte du fait, qu’en hébreu aussi bien qu’en arabe, il y a deux types de pluriel : il y a un pluriel numéral comme il y a un pluriel de respect et honorifique. Ici, il y a un pluriel honorifique que vous n’avez peut-être pas remarqué."}, {"t": "p", "x": "Revoyez de nouveau, page 17, la citation du Saint Coran qui fait allusion à Jésus (P) et à sa mère se conformant au
