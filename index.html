/* ---------- reader ---------- */
let scrollT = 0;
function reader(c) {
  const o = BYID[c.id];
  S.read[o.id] = 1; S.last = { id: o.id, r: c.restore || 0 }; save();
  setBar(SHORT[o.b.id], o.c.n ? `Chapitre ${o.c.n}` : "Ahmed Deedat");
  const prev = SECS[o.idx - 1], next = SECS[o.idx + 1];
  const q = c.q || "";
  const blocks = o.s.blocks.map((bl, i) => {
    if (bl.t === "v") return `<p class="verse" data-i="${i}">${bl.x.map(l => hl(esc(l), q)).join("<br>")}</p>`;
    if (bl.t === "h") return `<h4 data-i="${i}">${hl(esc(bl.x), q)}</h4>`;
    return `<p data-i="${i}"${bl.t === "n" ? ' class="note"' : ""}>${hl(esc(bl.x), q)}</p>`;
  }).join("");
  const note = S.notes[o.id];
  $main.innerHTML = `<article class="reader">
    <div class="r-head"><div class="eyebrow">${esc(o.c.title)}</div><h2>${esc(o.s.title)}</h2><div class="orn">${I.khatam}</div></div>
    <div class="text" id="text">${blocks}</div>
    ${note ? `<div class="r-note"><b>Ma note</b>${esc(note.t)}</div>` : ""}
    <div class="r-next">
      ${prev ? `<button data-go="${prev.id}"><small>Précédent</small><span>${esc(prev.s.title)}</span></button>` : "<span></span>"}
      ${next ? `<button data-go="${next.id}"><small>Suivant</small><span>${esc(next.s.title)}</span></button>` : ""}
    </div>
  </article>
  <nav class="tools" aria-label="Outils de lecture">
    <button id="t-prev" ${prev ? "" : "disabled"} aria-label="Section précédente">${I.prev}Préc.</button>
    <button id="t-toc">${I.toc}Sommaire</button>
    <button id="t-fm" aria-label="Réduire le texte">${I.aminus}A−</button>
    <button id="t-fp" aria-label="Agrandir le texte">${I.aplus}A+</button>
    <button id="t-fav" aria-pressed="${!!S.favs[o.id]}">${I.star}Favori</button>
    <button id="t-note" aria-pressed="${!!note}">${I.note}Note</button>
    <button id="t-play">${isPlaying(o.id) ? I.pause : I.play}Écouter</button>
    <button id="t-next" ${next ? "" : "disabled"} aria-label="Section suivante">${I.next}Suiv.</button>
  </nav>`;
  const swap = id => replace("reader", { id });
  $main.querySelectorAll("[data-go]").forEach(el => el.onclick = () => swap(el.dataset.go));
  document.getElementById("t-prev").onclick = () => prev && swap(prev.id);
  document.getElementById("t-next").onclick = () => next && swap(next.id);
  document.getElementById("t-toc").onclick = () => go("toc", { b: o.b.id });
  document.getElementById("t-fm").onclick = () => { S.fs = Math.max(14, S.fs - 1); save(); applyPrefs(); };
  document.getElementById("t-fp").onclick = () => { S.fs = Math.min(28, S.fs + 1); save(); applyPrefs(); };
  document.getElementById("t-fav").onclick = e => {
    if (S.favs[o.id]) delete S.favs[o.id]; else S.favs[o.id] = Date.now();
    save(); e.currentTarget.setAttribute("aria-pressed", !!S.favs[o.id]);
  };
  document.getElementById("t-note").onclick = () => noteSheet(o.id);
  document.getElementById("t-play").onclick = () => { if (isPlaying(o.id)) togglePause(); else speakSection(o.id, 0); };
  markReading();
  requestAnimationFrame(() => {
    if (c.restore) window.scrollTo(0, c.restore * (document.documentElement.scrollHeight - innerHeight));
    else if (q) { const m = $main.querySelector("mark"); if (m) m.scrollIntoView({ block: "center" }); else scrollTo(0, 0); }
    else window.scrollTo(0, 0);
    c.restore = 0;
  });
}
window.addEventListener("scroll", () => {
  if (cur().v !== "reader") return;
  clearTimeout(scrollT);
  scrollT = setTimeout(() => {
    const h = document.documentElement.scrollHeight - innerHeight;
    if (S.last && h > 0) { S.last.r = Math.min(1, scrollY / h); save(); }
  }, 300);
}, { passive: true });

function noteSheet(id) {
  const o = BYID[id], n = S.notes[id];
  $ov.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Note">
    <h3>Ma note</h3><p>${esc(o.s.title)} · ${esc(SHORT[o.b.id])}</p>
    <textarea id="nt" placeholder="Écrivez votre réflexion, un verset à retenir, une question à poser…">${n ? esc(n.t) : ""}</textarea>
    <div class="btns">${n ? '<button class="btn danger" id="ndel">Supprimer</button>' : ""}<button class="btn" id="ncan">Annuler</button><button class="btn primary" id="nok">Enregistrer</button></div>
  </div></div>`;
  const close = () => { $ov.innerHTML = ""; };
  document.getElementById("scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  document.getElementById("ncan").onclick = close;
  document.getElementById("nok").onclick = () => {
    const t = document.getElementById("nt").value.trim();
    if (t) S.notes[id] = { t, d: Date.now() }; else delete S.notes[id];
    save(); close(); render();
  };
  const del = document.getElementById("ndel");
  if (del) del.onclick = () => { delete S.notes[id]; save(); close(); render(); };
  setTimeout(() => document.getElementById("nt").focus(), 50);
}

/* ---------- lists ---------- */
function favs() {
  setBar("Favoris");
  const list = Object.entries(S.favs).filter(([id]) => BYID[id]).sort((a, b) => b[1] - a[1]);
  if (!list.length) { $main.innerHTML = emptyState(tileSvg("favs"), "Aucun favori pour l’instant", "Pendant la lecture, touchez l’étoile de la barre du bas pour garder une section ici."); return; }
  $main.innerHTML = `<div class="panel"><h2>${list.length} section(s) enregistrée(s)</h2>${list.map(([id, d]) => rowSec(BYID[id], " · " + new Date(d).toLocaleDateString("fr-FR"))).join("")}</div>`;
  bindOpen();
}
function notes() {
  setBar("Notes");
  const list = Object.entries(S.notes).filter(([id]) => BYID[id]).sort((a, b) => b[1].d - a[1].d);
  if (!list.length) { $main.innerHTML = emptyState(tileSvg("notes"), "Aucune note", "Pendant la lecture, touchez « Note » pour écrire une réflexion attachée à la section."); return; }
  $main.innerHTML = `<div class="panel"><h2>Mes notes</h2>${list.map(([id, n]) => rowSec(BYID[id], " · " + new Date(n.d).toLocaleDateString("fr-FR"), esc(n.t.length > 180 ? n.t.slice(0, 180) + "…" : n.t))).join("")}</div>`;
  bindOpen();
}
function emptyState(svg, t, p) { return `<div class="empty">${svg}<b>${t}</b>${p}</div>`; }

function search(c) {
  setBar("Recherche", "Dans les trois livres");
  $main.innerHTML = `<div class="searchbox">${I.search}<input type="search" id="sq" placeholder="Un mot, un nom, une référence…" value="${esc(c.q || "")}" autocomplete="off"></div>
  <div class="chips">${["Lamartine", "Trinité", "Marie", "Coran 3:59", "Paul", "Yehoyaqim", "épée"].map(s => `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div id="sr"></div>`;
  const input = document.getElementById("sq");
  const run = () => {
    const q = input.value.trim(); c.q = q;
    const out = document.getElementById("sr");
    if (norm(q).length < 2) { out.innerHTML = `<p class="hint">Tapez au moins deux lettres. Les accents sont ignorés.</p>`; return; }
    const nq = norm(q); const re = rx(q); let total = 0; const res = [];
    for (const o of SECS) {
      if (!o.n.includes(nq) && !norm(o.s.title).includes(nq)) continue;
      const hits = (o.text.match(re) || []).length; total += hits;
      re.lastIndex = 0; const m = re.exec(o.text); re.lastIndex = 0;
      let snip = "";
      if (m) { const a = Math.max(0, m.index - 70), z = Math.min(o.text.length, m.index + m[0].length + 90); snip = (a ? "…" : "") + hl(esc(o.text.slice(a, z)), q) + (z < o.text.length ? "…" : ""); }
      res.push({ o, hits, snip });
    }
    res.sort((a, b) => b.hits - a.hits);
    out.innerHTML = res.length ? `<p class="hint">${total} occurrence(s) dans ${res.length} section(s)</p><div class="panel">${res.slice(0, 80).map(r => rowSec(r.o, ` · ${r.hits} fois`, r.snip).replace('data-open=', `data-q="${esc(q)}" data-open=`)).join("")}</div>`
      : `<div class="empty"><b>Aucun résultat pour « ${esc(q)} »</b>Essayez un autre mot ou une orthographe plus courte.</div>`;
    bindOpen(q);
  };
  let t; input.oninput = () => { clearTimeout(t); t = setTimeout(run, 180); };
  $main.querySelectorAll(".chip").forEach(el => el.onclick = () => { input.value = el.dataset.s; run(); });
  run();
  if (!c.q) setTimeout(() => input.focus(), 50);
}

function topicScore(kw) {
  return SECS.map(o => ({ o, n: kw.reduce((a, k) => a + (o.n.split(k).length - 1), 0) })).filter(x => x.n >= 2).sort((a, b) => b.n - a.n);
}
function topics() {
  setBar("Sujets", "Index thématique");
  $main.innerHTML = `<div class="panel"><h2>Thèmes abordés</h2>${TOPICS.map(([t, kw], i) => {
    const r = topicScore(kw);
    return `<button class="row" data-t="${i}"><span class="num">${i + 1}</span><span class="body"><span class="t">${esc(t)}</span><span class="m">${r.length} sections · ${[...new Set(r.map(x => SHORT[x.o.b.id]))].length} livre(s)</span></span><span class="end">${I.next}</span></button>`;
  }).join("")}</div>`;
  $main.querySelectorAll("[data-t]").forEach(el => el.onclick = () => { cur().y = scrollY; go("topic", { t: +el.dataset.t }); });
}
function topic(c) {
  const [t, kw] = TOPICS[c.t];
  setBar(t, "Sujet");
  const r = topicScore(kw);
  $main.innerHTML = `<p class="hint">Sections classées par nombre de mentions (${kw.join(", ")}).</p><div class="panel">${r.map(x => rowSec(x.o, ` · ${x.n} mentions`)).join("")}</div>`;
  bindOpen();
}

function refs(c) {
  const tab = c.tab || "c";
  setBar("Références", "Versets cités");
  const R = DATA.refs.filter(r => r.k === tab);
  let html = `<div class="chips"><button class="chip" data-tab="c" aria-pressed="${tab === "c"}">Coran (${DATA.refs.filter(r => r.k === "c").length})</button><button class="chip" data-tab="b" aria-pressed="${tab === "b"}">Bible (${DATA.refs.filter(r => r.k === "b").length})</button></div>`;

const TTS = "speechSynthesis" in window ? window.speechSynthesis : null;
let P = null; // {id, queue:[{i,t}], pos, paused}
function voices() { if (!TTS) return []; const v = TTS.getVoices(); return v.filter(x => /^fr/i.test(x.lang)).concat(v.filter(x => !/^fr/i.test(x.lang))); }
if (TTS) TTS.onvoiceschanged = () => { if (cur().v === "audio") render(); };
function chunks(text) {
  const out = []; let cur = "";
  text.split(/(?<=[\.\!\?;:])\s+/).forEach(s => {
    if ((cur + " " + s).length > 220 && cur) { out.push(cur); cur = s; } else cur = cur ? cur + " " + s : s;
  });
  if (cur) out.push(cur);
  return out.flatMap(c => c.length > 260 ? c.match(/.{1,240}(\s|$)/g) : [c]);
}
function speakSection(id, startBlock) {
  if (!TTS) { go("audio"); return; }
  qStop(true);
  TTS.cancel();
  const o = BYID[id]; const queue = [{ i: -1, t: o.s.title + "." }];
  o.s.blocks.forEach((bl, i) => { if (bl.t === "n") return; chunks(Array.isArray(bl.x) ? bl.x.join(", ") : bl.x).forEach(t => queue.push({ i, t })); });
  P = { id, queue, pos: 0, paused: false };
  speakNext(); renderPlayer(); refreshPlayBtn();
}
function speakNext() {
  if (!P) return;
  if (P.pos >= P.queue.length) {
    const nx = SECS[BYID[P.id].idx + 1];
    if (nx && nx.b === BYID[P.id].b) { if (cur().v === "reader" && cur().id === P.id) replace("reader", { id: nx.id }); speakSection(nx.id, 0); }
    else stopSpeak();
    return;
  }
  const item = P.queue[P.pos];
  const u = new SpeechSynthesisUtterance(item.t.replace(/\(Ç\)|\(ç\)/g, "").replace(/\(P\)/g, ""));
  u.lang = "fr-FR"; u.rate = S.rate;

  u.onend = () => { if (P && !P.paused) { P.pos++; speakNext(); } };

  document.querySelectorAll(".text .reading").forEach(el => el.classList.remove("reading"));

  const i = P.queue[P.pos] && P.queue[P.pos].i; if (i == null || i < 0) return;

function qNext(step = 1) {

function guessNum(name) {
  const base = name.replace(/\.[a-z0-9]+$/i, "");
  const groups = base.match(/\d{1,3}/g) || [];
  const three = groups.find(g => g.length === 3 && +g >= 1 && +g <= 114);
  if (three) return +three;
  const any = groups.find(g => +g >= 1 && +g <= 114);
  return any ? +any : 0;
}

  if (/hthfi|hudh|huth|houdh|arab/.test(s)) return "ar";
  return fallback;
}

  $main.querySelectorAll("[data-save]").forEach(el => el.onclick = async () => {
    const blob = await ldo("readonly", st => st.get(el.dataset.save)); if (!blob) return;
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (S.libMeta[el.dataset.save] || {}).name || "livre.pdf"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  });
  $main.querySelectorAll("[data-del]").forEach(el => el.onclick = async () => {
    if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Confirmer"; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = "Retirer"; } }, 4000); return; }
    const id = el.dataset.del; try { await ldo("readwrite", st => st.delete(id)); } catch (e) {}
    delete S.libPage[id]; delete S.libMeta[id]; save(); await loadLib();
  });
}

/* liseuse PDF (pdf.js) */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); }); }
function loadPdfJs() {
  if (!pdfReady) pdfReady = loadScript(PDFJS + "pdf.min.js").then(() => loadScript(PDFJS + "pdf.worker.min.js")).then(() => window.pdfjsLib).catch(e => { pdfReady = null; throw e; });
  return pdfReady;
}
let V = null; // {id, doc, page, scale, fit, task}
async function openPdf(id) {
  const title = (S.libMeta[id] || {}).title || "Livre";
  const wrap = document.createElement("div"); wrap.className = "pdfv"; wrap.id = "pdfv"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-label", title);
  wrap.innerHTML = `<div class="pbar"><button class="ib" id="vx" aria-label="Fermer">${CLOSE}</button><h1>${esc(title)}</h1><span></span></div>
    <div class="stage" id="vstage"><div class="pmsg">Ouverture du livre…</div></div>
    <div class="ptools"><button id="vp" aria-label="Page précédente">${I.prev}</button><button id="vzo" aria-label="Réduire">${ZOUT}</button>
      <span class="pg"><input id="vn" type="number" inputmode="numeric" min="1" value="1" aria-label="Page"><span id="vt">/ …</span></span>
      <button id="vzi" aria-label="Agrandir">${ZIN}</button><button id="vnx" aria-label="Page suivante">${I.next}</button></div>`;
  document.body.appendChild(wrap); document.body.style.overflow = "hidden";
  document.getElementById("vx").onclick = closePdf;
  try {
    const [lib, blob] = await Promise.all([loadPdfJs(), ldo("readonly", st => st.get(id))]);
    if (!blob) throw new Error("absent");
    const data = new Uint8Array(await blob.arrayBuffer());
    const doc = await lib.getDocument({ data, isEvalSupported: false }).promise;
    const saved = S.libPage[id];
    V = { id, doc, page: Math.min(saved ? saved.p : 1, doc.numPages), scale: saved && saved.s ? saved.s : 0, task: null };
    S.libMeta[id] = Object.assign(S.libMeta[id] || {}, { pages: doc.numPages }); save();
    document.getElementById("vt").textContent = "/ " + doc.numPages;
    document.getElementById("vn").max = doc.numPages;
    document.getElementById("vp").onclick = () => gotoPage(V.page - 1);
    document.getElementById("vnx").onclick = () => gotoPage(V.page + 1);
    document.getElementById("vzi").onclick = () => { V.scale = Math.min(4, (V.scale || V.fit) * 1.2); drawPage(); };
    document.getElementById("vzo").onclick = () => { V.scale = Math.max(.3, (V.scale || V.fit) / 1.2); drawPage(); };
    document.getElementById("vn").onchange = e => gotoPage(parseInt(e.target.value, 10) || 1);
    let sx = 0, sy = 0; const st = document.getElementById("vstage");
    st.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    st.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && st.scrollWidth <= st.clientWidth + 4) gotoPage(V.page + (dx < 0 ? 1 : -1));
    }, { passive: true });
    document.addEventListener("keydown", pdfKeys);
    drawPage();
  } catch (e) {
    const st = document.getElementById("vstage");
    if (st) st.innerHTML = `<div class="pmsg"><b>Impossible d’ouvrir ce livre.</b><br>${String(e.message).includes("cdnjs") ? "La liseuse a besoin d’Internet pour son premier chargement. Connectez-vous puis réessayez." : "Le fichier est peut-être abîmé ou protégé. Essayez de l’ajouter à nouveau."}</div>`;
  }
}
function pdfKeys(e) { if (!V) return; if (e.key === "ArrowRight") gotoPage(V.page + 1); if (e.key === "ArrowLeft") gotoPage(V.page - 1); if (e.key === "Escape") closePdf(); }
function gotoPage(n) { if (!V) return; n = Math.max(1, Math.min(V.doc.numPages, n)); if (n === V.page) return; V.page = n; drawPage(); const st = document.getElementById("vstage"); if (st) st.scrollTop = 0; }
async function drawPage() {
  if (!V) return;
  const st = document.getElementById("vstage"); if (!st) return;
  if (V.task) { try { V.task.cancel(); } catch (e) {} }
  const page = await V.doc.getPage(V.page);
  const base = page.getViewport({ scale: 1 });
  V.fit = Math.max(.3, (st.clientWidth - 24) / base.width);
  const scale = V.scale || V.fit;
  const vp = page.getViewport({ scale });
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const c = document.createElement("canvas");
  c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
  c.style.width = Math.floor(vp.width) + "px"; c.style.height = Math.floor(vp.height) + "px";
  V.task = page.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
  try { await V.task.promise; } catch (e) { return; }
  st.innerHTML = ""; st.appendChild(c);
  document.getElementById("vn").value = V.page;
  document.getElementById("vp").disabled = V.page <= 1;
  document.getElementById("vnx").disabled = V.page >= V.doc.numPages;
  S.libPage[V.id] = { p: V.page, s: V.scale || 0 }; save();
}
function closePdf() {
  document.removeEventListener("keydown", pdfKeys);
  if (V && V.doc) { try { V.doc.destroy(); } catch (e) {} }
  V = null; const w = document.getElementById("pdfv"); if (w) w.remove(); document.body.style.overflow = "";
  if (cur().v === "library") render();
}
window.addEventListener("resize", () => { if (V && !V.scale) drawPage(); });

try { history.replaceState({ d: 1 }, ""); } catch (e) {}
render(true);
</script>
