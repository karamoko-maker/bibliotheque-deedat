quie\", Tome I, Livre premier, XCV, Paris, 1854, pp. 277-280 1. La citation complète du livre de Lamartine se trouve en Annexe B de ce livre. La réponse à la question \"Existe-t-il quelqu’un de plus grand que lui ?\" est contenue dans la question elle-même. Il dit, implicitement: \"Il n’existe pas de plus grand homme que Mohammed (Ç). Mohammed (Ç) est le plus grand qui ait ja mais vécu!\" \"N’avons-nous pas exalté ta renommée ?\" Coran 94:4 Avant que d’absoudre Lamartine pour avoir montré quelque favoritisme, partialité ou avoir même été accusé de corruption, nous observerons ses trois critères et verrons s’ils sont motivés dans le cas de Mohammed."}]}, {"title": "1. La grandeur", "blocks": [{"t": "p", "x": "L’histoire dira que lorsque Mohammed (Ç) fut envoyé pour entreprendre sa mission, l’humanité vivait alors sa péri ode la plus sombre. Le fort besoin de l’émergence de prophètes dans chaque point du monde, ou l’envoi d’un messager, de la superstition, de l’égoïsme, du"}, {"t": "p", "x": "polythéisme, du mal et de l’oppression se faisaient sentir. C’était alors le sentiment de toute l’humanité. Et Dieu Tout-Puissant dans sa Sagesse choisit son Prophète dans les ruisseaux de l’Arabie pour en faire son Messager Universel. u le consigne de cette façon dans le Noble Livre \"Nous t’avons seulement envoyé comme une miséricorde pour les mondes\" Coran 21:107 \"Maintenant, il n’est plus question de race ou de nation, de \"peuple élu\" ou de \"semence d’Abraham\" ou de \"semence de David\"; ou d’Hindou Arya, de Juif ou de Gentil, d Arabe ou d\"Ajam (Perse), de Turc ou de Tadjik, d’Européen ou d’Asiatique, d’homme blanc ou de couleur, d Aryen, de sé mite, de Mongol, d Africain ou d Américain, d’Australien ou de Polynésien.. Les principes s’appliquent d tous les hommes et les êtres qui ont quelque responsabilité spiri tuelle\". ’Abdullah Yûsaf `Alî (1)"}]}, {"title": "Jésus fait de la discrimination", "blocks": [{"t": "p", "x": "Le prédécesseur direct de Mohammed (Ç) dit à ses disci ples : \"Ne donnez-pas ce qui est saint aux chiens\" (c’est-à dire aux non-Juifs). \"Ne jetez pas vos perles devant les pourceaux\" (Matthieu 7:6) (c’est-à-dire les non-Juifs). Les auteurs des évangiles sont d’accord sur le fait que le Christ vivait (tirait profit) des commandements qu’il prêchait. Au cours de sa vie, il n’a jamais prêché à un seul non juif. De 1. Demandez dès maintenant voue exemplaire de la traduction et du commentaire de Yûsuf `Alî, ainsi que des 6 000 annotations."}, {"t": "p", "x": "De mandez aussi un exemplaire pour vos amis nonmusulmans. fait, il repoussa une gentille femme qui recherchait sa béné diction (la femme était grecque). Alors que le maître s’était éuni avec ses disciples, à Jérusalem, à l’occasion de la Pâque, certains Grecs qui avaient eu vent de sa réputation, demandèrent à le rencontrer pour obtenir quelques éclair cissements spirituels. Jésus leur infligea un affront (1), comme l’écrivit St Jean \"Il y avait quelques Grecs parmi les gens qui étaient mon tés pour adorer pendant la fête. Ils s’approchèrent de Philippe... et lui demandèrent : nous voulons voir Jésus. Philippe alla le dire à André, puis André et Philippe allèrent le dire à Jésus\"."}]}, {"title": "Auto-glorification", "blocks": [{"t": "p", "x": "Les versets qui suivent ne font même pas état de \"oui, oui\" ou \"non, non\" de Matthieu 5:37. Ils continuent avec sa prière - \"Jésus leur répondit (Philippe et André) : l’heure est venue ou l’homme doit être glorifiée\"."}]}, {"title": "Les critère les plus hauts", "blocks": [{"t": "p", "x": "Mohammed (Ç) ne pouvait jamais jouir de telles libertés. Souvenez-vous de la façon avec laquelle le Tout-Puissant lui rappela que l’on attendait de lui ce qui était de plus noble. Rien que la pensée d’être troublé par l’intrusion d’un aveugle lui était désagréable (voir p. 28 \"il s’est renfrogné\"). Pour ce Messager Universel, Dieu composa les critères les plus confortables : 1. Signifie une attitude délibérément hostile. \"Tu es d’un caractère élevé\" Coran 68:4 Et son diocèse, son théâtre de mission ? L’humanité toute entière \"Nous t’avons seulement envoyé comme une miséricorde pour tous les mondes\""}, {"t": "p", "x": "Coran 21:107 Ce ne sont pas de simples banalités, de beaux sentiments sans actes. Mohammed (Ç) mettait en pratique ce qu’il prê chait Parmi ses premiers sahaba(s) (compagnons) et convertis, outre les Arabes, on peut compter Bilal l’Abbyssinien, Sal man le Perse et `Abdullah B in Sal.lâm le Juif. Ceux qui dou tent peuvent toujours dire que cela était forfait, mais que peu vent-ils dire quant au fait historique, qu’avant de mourir il avait déjà transmis cinq épîtres, une pour chacun des cinq pays voisins, les priant d’entrer dans la religion de l’Islam. 1."}, {"t": "p", "x": "L’empereur de Perse 2. Le mi d’Egypte 3. Le négus d’Abyssinie 4. L’empereur Héraclès à Constanrinople 5. Le roi du Yémen Ainsi, il donna l’exemple pour l’accomplissement de sa mission, la grandeur de son but, le retour de toute l’humanité dans le bercail du Maître. Existe-t-il un autre exemple d’une telle universalité dans une autre religion ? Mohammed (Ç) n’avait pas entrepris de tenir ou casser des records, il réalisait seulement l’espoir que le Seigneur de la Création avait placé en lui."}]}, {"title": "2. Petitesse des moyens", "blocks": [{"t": "p", "x": "Mohammed (Ç) n’est \"pas né coiffé\". Ses débuts ne re cueillèrent qu’un soutien infime. Son père était déjà mort à sa naissance. Sa mère mourut alors qu’il n’avait que six ans. Il était ainsi orphelin de père et mère dès son plus jeune âge. Son grand-père, `Abdul-Muttalib prit alors soin de lui, mais il mourut dans les trois années qui suivirent. Dès qu’il le put, il commença à garder les moutons et les chèvres de son oncle Abû Tâlib pour gagner sa vie. Comparez ce pauvre enfant arabe, orphelin de père et mère avec quelques grandes personnalités religieuses qui l’ont précédé et vous vous émerveillerez de ce que la Desti née lui a réservé !"}, {"t": "p", "x": "Abraham, le Père spirituel de Moïse, Jésus et Mohammed (Ç) (Que Dieu les bénisse tous) était le fils d’un homme d’affaires qui connaissait alors la réussite."}, {"t": "p", "x": "Moïse fut élevé dans la maison du Pharaon."}, {"t": "p", "x": "Jésus, bien que connu comme \"un charpentier et fils de charpentier\" était doué pour les études et tout ce qui était ma tériel. Pierre, Philippe, André, etc tous cessèrent le travail et le suivirent pour être à ses ordres, non parce qu’il avait une auréole (i) au-dessus de la tête, il n’y avait rien de tel, mais en raison de ses riches vêtements et de son allure royale. Il pouvait disposer de châteaux à Jérusalem, pour lui et ses dis ciples, même au summum de la saison des festivités, et se faire servir des soupers somptueux et vous pourriez l’entendre reprocher aux juifs matérialistes \"Ils le trouvèrent de l’autre côté de la mer et lui dirent \"Rabbî, quand es-tu venu ici ?\""}, {"t": "p", "x": "Jésus répondit : \"En vérité, je vous le dis, vous me cherchez, non parce que vous avez vu des miracles (1), mais parce que vous avez mangé des pains et que vous avez été rassasiés\".\" Jean 6:25-26 1. Halo ou auréole : cercle imaginaire lumineux qui surmonte la tête des saints et des saintes dans les peintures religieuses."}]}, {"title": "Rien à offrir", "blocks": [{"t": "p", "x": "Mohammed (Ç) n’avait ni pain, ni viande à offrir, aucune sucrerie dans le monde d’ici-bas ou dans l’autre ! II pouvait seulement donner à son pauvre peuple de bergers, le sens du combat et des épreuves, et aussi l’étreinte de leurs vies ici bas, ainsi que la jouissance de Dieu dans l’Au-delà."}, {"t": "p", "x": "La vie du Prophète (Ç) était un livre ouvert devant eux. II leur avait montré qui il était, la noblesse de son caractère, l’honnêteté de son dessein, son enthousiasme ardent et impétueux pour la Vérité, qu’il venait prêcher, tous ces traits ré vélaient le héros, et ils le suivirent. L’idée que se faisait Mr Stanley Poole de notre héros est si belle et pourtant si vrai que je ne peux résister à l’envie de vous en faire part : 1. La véracité du Message du Messie et de sa mission. \"C’était un enthousiaste dans le sens le plus noble du terme, quand l’enthousiasme devient le sel de la terre, la seule chose qui empêche l’homme de \"pourrir de son vivant\"."}, {"t": "p", "x": "L’enthousiasme est souvent utilisé à mauvais escient car il s’unit d une cause qui ne le mérite pas souvent, ou alors il est semé dans un terrain infertile et ne donne pas de fruits. Il n’en fut pas ainsi pour Mohammed (Ç). Il était enthousiaste alors que l’enthousiasme était la seule chose nécessaire quand le monde s’embrasa. Son enthousiasme était noble pour une cause noble."}, {"t": "p", "x": "Ilétait l’un de ces heureux hommes qui ont atteint l’allégresse suprême en faisant d’une vérité l’essence de leur vie."}, {"t": "p", "x": "Ilétait le Messager d’un seul Dieu et, jamais jusqu’à la fin de sa vie, il n’oublia jamais qui il était, ni le Message qui ét ait l’essence de son existence. Il porta la nouvelle d son peu ple avec une grande dignité née de la conscience de son de voir élevé, et avec une aimable humilité, dont les racines s’enfoncent dans sa propre faiblesse\"."}, {"t": "p", "x": "On peut facilement admettre que Mohammed (Ç) jouissait de la plus petite des ressources humaines. En fait, la chance n’était pas avec lui. Mais que dire de ses biens vers la fin de son séjour terrestre ? Il était le suzerain de toute l’Arabie Que dire aussi des moyens illimités dont il disposait alors ? Nous donnons la parole à un missionnaire chrétien pour répondre"}, {"t": "p", "x": "\"Il était César et le pape tout d la fois. Ilétait le pape sans ses exigences, et César sans ses légions : sans armée, sans garde-du-corps, sans palais, sans revenu; si aucun homme mail le droit de dire qu’il régnait de par le droit divin, c’était bien Mohammed (Ç), car il détenait tous les pouvoirs sans ses instruments, ni son soutien\"."}, {"t": "p", "x": "R. Bosworth Smith, \"Mohammad and Mohammadanism\", Londres,1874, p. 92."}]}, {"title": "Ses handicaps", "blocks": [{"t": "p", "x": "Sa \"faiblesse\" était sa force. Parce qu’il ne bénéficiait d’aucun moyen matériel qui puisse lui procurer un soutien, il se remit entièrement entre les mains de Dieu et Dieu le Miséricordieux ne l’abandonna pas. Son succès fut le plus éblouissant qui fut. Puissent les musulmans ne pas dire que ce fut seulement l’oeuvre de Dieu ? Et Mohammed (Ç) son instrument ?"}]}, {"title": "3. Des résultats éclatants", "blocks": [{"t": "p", "x": "Pour reprendre les paroles de Thomas Carlyle \"un homme contre tous les hommes\" (t) jusqu’à cent vingt-quatre mille au seul Pèlerinage d’Adieu ! Combien furent oubliés, hommes, femmes et enfants, tous croyants."}, {"t": "p", "x": "En l’an 12 de Rabi I, la l l ème année de l’Hégire (2), vers le 8 juin 632 de l’ère chrétienne, au cours d’un recueille ment, l’Esprit du Prophète prit son envol au-dessus de l’assemblée bénie par le Très-Haut. (Ibn Hisham) Alors que `Omar b. al-Hattâb (Qu’Allah soit avec lui) ap prenait la triste nouvelle de la mort du Prophète, il perdit ses esprits. Ce fut pour lui un tel choc qu’il laissa échapper: \"Si la moindre personne ose dire que Mohammed (Ç) est mort, je lui tranche la tête\". Hazrat Abû Bakr as-Siddîq vérifia, plus tard, que le Maître avait bien quitté ce bas-monde; et re venant de l’appartement du Prophète (Ç)> il annonça à l’assemblée que \"Mohammed (Ç) avait bien rendu l’âme."}, {"t": "p", "x": "Faîtes savoir d ceux qui ont adoré Mohammed (Ç)\" dit-il; \"qu’il est mort, mais à tous ceux qui ont adoré Allah, dîtes qu’A llah vit d jamais !\" 1. Voir la citation complète de Thomas Carlyle, p. 37. 2. Hégire : sens littéraire du mot \"migration\"."}, {"t": "p", "x": "Ceci ramena `Omar al-Fârûq (R.A.) à la raison. Est-ce que cet homme, qui devait devenir le second grand calife de l’Islam, pouvait, à ce moment-là, imaginer que 1 400 ans plus tard il y aurait mille millions de disciples ? Pouvait-il prévoir que la religion du Prophète (Ç) serait la religion qui s’étendrait le plus vite dans le monde (1) ?"}, {"t": "p", "x": "Le christianisme précédait l’Islam de 600 ans. Les chré tiens revendiquaient avoir le plus grand nombre de disciples par rapport à toutes les autres croyances. C’est vrai, mais regardons les faits en face. \"Il y a plus de soi-disant chrétiens dans le monde que de soi-disant musulmans, mais il y a plus de musulmans pratiquants dans le monde qu’il n y a de chrétiens pratiquants\"’. R.V.C. Brodley (l’Américain), \"The Messenger : the life\", U.S.A., 1969."}, {"t": "p", "x": "Je comprends, d’après ce qui précède, que M. Brodley tente de nous dire qu’il y a des personnes qui, lorsqu’elles remplissent des imprimés de recensement, indiqueront le terme \"chrétien\" sous la \"rubrique religion\". Cela ne signifie pas pour autant qu’elles croient dans le dogme chrétien. Elles pourraient tout aussi bien être athées ou \"bush-baptistes\" (2) par distinction d’avec les juifs, hindous, ou musulmans; ayant à l’origine un passé de chrétien c’est par un simple souci de commodité que ces personnes se qualifient de \"chrétiens\". 1."}, {"t": "p", "x": "Voir le tableau p. 40. 2. Bush-baptistes : il existe 40 différentes sortes d’églises baptistes aux Etats-Unis. Mais les bush-baptistes sont des personnes qui ont des sentiments religieux très forts. Ils ne se rendent pas dans n\"rtnporte quelle église et ne se rapprochent pas de n’importe quelle secte ou autre appellation."}, {"t": "p", "x": "De ce point de vue et du point de vue de la personne qui pratique ces croyances, il y aurait plus de musul mans que de chrétiens dans le monde."}, {"t": "p", "x": "Dans le temps, l’Islam a débuté avec 600 années de retard sur le christianisme, mais il occupe à présent la seconde place et remonte vite - \"la religion qui se propage le plus vite dans le monde aujourd’hui\" (voir le tableau p. 40); \"Un bil lion !\" Le chiffre est stupéfiant, la sincérité et la pratique des croyants est étonnante !"}, {"t": "p", "x": "Se basant sur ses trois critères objectifs : a) Grandeur du dessein, b) Petitesse des moyens, c) Résultats éclatants, La martine oserait-il avancer le nom d’un autre candidat plus grand que Mohammed (Ç) ? Il effraya ses lecteurs avec la liste des divers rôles dans iesquels Mohammed (Ç) excellait i.e. philosophe, orateur, apôtre, législateur, guerrier, con quérant des idées, restaurateur des croyances rationnelles et culte sans images, fondateur de vingt empires terrestres et d’un empire spirituel. Mohammed (Ç), c’est tout cela à la fois."}, {"t": "p", "x": "Par rapport à tous ces critères, je dis bien à TOUS CES CRITERES, qui font qu’un homme est le plus grand, nous pouvons poser la question : \"Y a-t-il un homme plus grand que lui ?\" Non, Mohammed (Ç) était bien le plus grand qui ait ja mais vécu ! Selon Lamartine, l’historien français. Et Dieu demande \"Tu es d’un caractère élevé\" (1) Coran 68:4"}]}, {"title": "La miséricorde", "blocks": [{"t": "p", "x": "Ceux qui propagent le christianisme attacheront de l’importance à ce qu’il n’y ait rien dans l’histoire de l’huma nité qui puisse être comparé à la miséricorde et au pardon de Jésus sur la croix... \"Jésus dit : Père, pardonne-leur car ils ne savant pas ce qu’ils font,\". Luc 23:34 Aussi surprenant que cela puisse paraître, parmi les quatre auteurs des évangiles, seul St Luc fut inspiré par le Saint Esprit (?), les trois autres - Matthieu, Marc et Jean - n’ont jamais entendu la Voie, ou bien l’ont trouvée trop insigni fiante ou pas assez importante pour être"}, {"t": "p", "x": "transcrite. St Luc n’était pas même l’un des douze apôtres choisis par Jésus. D’après les correcteurs de la Version Standard et Corrigée de la Bible, ces mots ne figurent pas dans les anciens manus crits, cela veut donc dire qu’il s’agit d’une interpolation. Dans la \"Nouvelle du roi James\" (Copyright Thomas Nelson Publishers en 1984), il est dit que ces paroles ne sont pas \"dans le texte original\" du manuscrit grec de St Luc. En d’autres termes, elles ont été façonnées par quelques per sonnes pieuses. Bien que la citation ne soit pas authentique, nous l’acceptons quand même car elle fait preuve d’une grande piété de l’amour de ses ennemis et d’un pardon sans pareil, comme le prêche le Maître lui-même."}, {"t": "p", "x": "Par indulgence parce qu’il n’a pas de valeur, celui qui pardonne doit être dans la situation de pardonner. Si la vic time d’une injustice était toujours dans les griffes de ses en nemis, dans une situation désespérée, et criait \"je vous par donne\", cela n’aurait pas de sens, mais si la chance tournait et la mettait dans une position qui lui permette de se venger ou d’infliger un quelconque châtiment, et qu’elle disait ce pendant \"je vous pardonne\", alors là seulement, ces mots au raient un sens !"}]}, {"title": "La clémence de Mohammed (Ç)", "blocks": [{"t": "p", "x": "Quel contraste entre le pardon donné sur la croix et la conquête historique et sanglante de la Mecque par Mohammed (Ç) à la tête de dix mille \"saints\" (1) (ses compag nons). \"La ville qui l’avait traité si cruellement, l’avait poussé avec ses fidèles compagnons d se protéger des étrangers, qui avait ruiné sa vie et l’existence de ses dévoués disciples, était d ses pieds. Ses anciens persécuteurs acharnés et impitoya bles, ayant déshonoré l’humanité de par leurs actes cruels in fligés d des hommes et des femmes innocents et même aux mourants, étaient d présent totalement d sa merci. Mais, même d l’infant de son triomphe, il oubliait toutes les souf frances, les injures. lancées et pardonnait d toute la population de la Mecque...\". Sayed `Amir `Alî dans \"L’esprit de l’Islam\""}, {"t": "p", "x": "Appelant à lui les habitants de la ville vaincue, il s’adressa à eux en ces termes : \"Qu’attendezvous de moi d présent ?\" Ses proches, qui le connaissaient trop bien, certains depuis son enfance, répondirent: \"Miséricorde, Ô généreux frère et neveu !\" Des lamies perlèrent des yeux du Prophète (Ç) et il dit alors : \"Je vous parlerai tout comme Joseph le fit d ses frères. Je ne vous ferai pas de reproches aujourd’hui. Allez, vous êtes libres !\" Et il s’accomplit alors, ce qui ne s’était jamais vu dans l’histoire, du monde."}, {"t": "p", "x": "Groupe après groupe, ils vinrent et se convertirent à l’Islam. Dieu Tout-Puissant témoigne de la dignité et de l’aisance de la conduite de son Messager. 1. L’accomplissement d’une autre prophétie dans Mohammed (Ç): \".. Il a resplendi de la montagne de Paran (en Arabie) et il est sorti du milieu des saintes Myriades...\" Deutéronome 33:2. \"Vous avez, dans le prophète de Dieu, un bel exemple\""}, {"t": "p", "x": "Coran 33:21"}, {"t": "p", "x": "Oh ! Comment Lamartine (1) inconsciemment, s’est-il fait l’écho de ses sentiments ? \"Compte tenu de tous les critères avec lesquels on peut évaluer la grandeur humaine, nous pouvons dire qu’il n’est pas de plus grand homme que lui ?."}, {"t": "p", "x": "En réponse, nous pouvons aussi ajouter : \"Non ! Il n’existe pas d’homme plus grand que Mohammed (Ç). Mo hamrned (Ç) était le plus grand homme qui ait jamais vécu !\" Donc, notre héros reçut les hommages spontanés mais faits à contre-caeur par des non-musulmans de différentes re ligions et de milieux intellectuels d’orientation différente. Mais tout ceci est incomplet sans le jugement du Maître : le prédécesseur de Mohammed (Ç) - Jésus-Christ. Nous n’appliquerons pas ce critère pour évaluer la grandeur."}]}, {"title": "L’origine de la question", "blocks": [{"t": "p", "x": "Jean le Baptiste (i) connu dans le monde musulman sous le nom de Hazrat Yahya AlaihisSalam (Que la paix soit sur lui) était un prophète de l’époque du Messie. Ils étaient 1. La citation complète se trouve en annexe B p. 68. 2. Jean : ne pas confondre avec Jean le disciple de Jésus. C’est un nom très répandu chez les juifs et les Arabes, même de nos jours, comme Tarik AZiz, l’actuel ministre irakien des Affaires Ecrangères. Le vrai nom Tarik Hanna Aziz, \"Hanna\" est le dininu4f de Yubanna qui signifie Jean. Personne n’ignore parmi les musulmans non arabes que notre ami est un chrétien marxiste. également cousins."}, {"t": "p", "x": "Voici ce que lui dit le Maître : \"En vérité, je vous le dis, parmi ceux qui sont nés de femmes, il ne s’en est pas levé de plus grand que Jean Baptiste. \" Matthieu 11:11 Chaque fils de l’homme est \"né d’une femme\". Par cette vérité, Jean-Baptiste est plus grand que Moïse, David, Salo mon, Abraham ou Esaïe, sans exclusion aucune des pro phètes israélites. Qu’est-ce qui donne à Jean cette ascendance sur chacun des autres prophètes ? Ce ne peut être un miracle, car la Bible les prend tous à son compte. Ce ne peut être ses en seignements, parce qu’il n’apporte ni de nouvelles lois, ni de nouvelles règlementations."}, {"t": "p", "x": "Alors, qu’est-ce qu’il a fait de si grand ? Il était tout simplement le héraut, le précurseur, l’annonciateur de la bonne nouvelle de la venue du Messie. C’est ce qui fit de Jean-Baptiste le plus grand mais Jésus se réclame plus grand que le plus grand (i.e. Jean). Pourquoi ? \"Moi, j’ai un témoignage plus grand que celui de Jean; car les ouvres que le père m’a donné d’accomplir, ces ouvres-mêmes que je fais témoignent de moi que le père m’a envoyé\". Jean 5:36 L’arbitre; c’est la commission en laquelle Dieu plaça sa confiance et qui qualifia Jésus de plus grand que Jean: L’application des mêmes critères que ceux dictés par le Maure, nous prouvent que 1. Jean le Baptiste était le plus grand de tous les prophètes israélites, car il annonçait le puissant Messie. De la même façon, Jésus serait plus grand que Jean car il annonçait"}, {"t": "p", "x": "\"l`Esprit de la vérité, le Consolateur qui devait guider l’humanité vers la Vérité\" (Évangile selon St Jean, chapitre 16) (1) 2. Le diocèse, la mission de Jésus, ou la tâche que Dieu lui a confiée se limitaient \"aux brebis perdues dans ta maison d’Israël\" (Matthieu 15:24) alors que la mission de Mo hammd était universelle. On lui avait dit: \"Nous t’avons seulement envoyé comme une miséricorde pour les hommes.\" Coran 21:107 S’acquittant de sa noble tâche, Mohammed remettait son Message à tous ceux, sans exception, qui écouteraient, sans distinction de race, classe ou foi, II les accueillit tous dans la religion de Dieu sans distinction."}, {"t": "p", "x": "II ne pensait pas diviser les créatures de Dieu en \"chiens et pourceaux\" (Matthieu 7:6) ou en \"brebis et boucs\" (Matthieu 25:32). u était le Messager de Dieu d’une seule Vérité qui \"fut envoyé comme une miséri corde pour les mondes \" (Coran 21:107), non, tout l’univers. Et jamais; il n’oublia sa mission, même vers la fin de sa vie. A la fin de son séjour terrestre, alors qu’il pouvait regar der en arrière vers ces années trépidantes et dangereuses, à présent couronnées de succès, il sentit qu’il pouvait s’asseoir et jouir des fruits de son travail; et river à une vie exempte de toute agitation et empreinte de satisfaction et de détente. 1."}, {"t": "p", "x": "Pour de plus amples explications sur cette prophétie, demandez dès aujourd’hui à 17PCI notre exemplaire gratuit du livre \"Mohammed, le successeur naturel du Christ\". Cela n’était pas pour lui ! u n’y a pas de repos ou de détente. Il y avait encore bien des tâches à accomplir. Dieu Tout-Puissant lui rappelle : \"Nous t’avons envoyé à la totalité des hommes uniquement comme annonciateur de la bonne nouvelle et comme avertisseur, mais la plupart des hommes ne savent pas.\" Coran 34:28 Comment devait-il répondre à cette nouvelle provocation alors qu’il avait atteint un âge avancé ?"}, {"t": "p", "x": "II n’avait pas à sa dis position de gadgets électroniques de méthodes de communi cation moderne, il n’y avait pas de télex, ni de fax qu’il au rait pu utiliser. Que pouvait-il faire ? Etre illettré, il fit venir les scribes et dicta cinq missives, une pour chacun des : em pereur de Constantinople, le roi d’Egypte, le négus d’Abyssinie, le roi du Yémen et l’empereur de Perse. Il fit appel à cinq sahab (ses compagnons fidèles), ainsi que cinq coursiers arabes et les envoya dans cinq directions diffé rentes afin d’inviter les nations du monde à rejoindre la reli gion universelle de Dieu."}, {"t": "p", "x": "J’ai eu le privilège de voir l’une de ces épîtres dans le Musée de Topkapi à Istambul"}, {"t": "p", "x": "(l’ancienne Constantinople). Cette lettre prend la poussière ! Matériellement, les Turcs ont préservé le parchemin. Mais le Message prend la poussière, comme je viens de le dire. La lettre commence par ses mots : \"De la pan de Mohammed (Ç), le Messager de Dieu, à Héraclès l’empereur de Constantinople : acceptez l’Islam et tirez-en profits\". Suit l’exhortation du Livre de Dieu. \"Dis. \"Ô Gens du Livre ! Venez à une parole commune entre nous et vous: Nous n’adorons que Dieu; Nous ne lui associons rien; Nul parmi nous ne se donne de Seigneur, En dehors de Dieu\", S’ils se détournent, dîtes-leur \"Attestez que nous sommes vraiment soumis\"."}, {"t": "p", "x": "Coran 3:64 Après avoir insérer dans la lettre cette citation coranique, le Prophète (Ç) conclut par les propres paroles de félicitation du Prophète, et scelle un sceau sur lequel est inscrit \"Il n’y a pas d’autre objet de culte que Allah, et Mohammed (Ç) est son Messager\". La lettre souleva la curiosité en Turquie, et quelque intérêt quant à sa conservation, mais la conservation-même est im possible face aux touristes. Le même Message coranique est dans presque toutes les maisons musulmanes, lu et relu des milliers de fois sans que le lecteur soit incité à délivrer le Message aux destinataires !"}, {"t": "p", "x": "Jetez encore une fois un regard au verset ci-dessus. Il est adressé à \"Ahle-kitab\" - Les Peuples du livre (i), les juifs et les chrétiens. Mais, durant plus de mille ans, nous avons tout à fait ignoré cette importante directive pour notre propre péril. Nous sommes assis sur ce Message comme un cobra sur un trésor, gardant les héritiers légitimes aux abois. Cette négligence absolue perpétuera des souffrances inouïes à l’Ummah pendant des générations et des générations."}, {"t": "p", "x": "Après plus de quatorze cent ans de lecture et de chant du Coran, avec différents rythmes, nous entendons toujours ce cri poignant \"Mais la plupart des hommes ne savent pas\". (2) Coran 34:28 Ceci est la phrase de conclusion du verset révélé il y a mille quatre cent ans. C’était la situation positive du monde religieux d’alors. La question que l’on doit poser au jourd’hui, estelle si différente ? Pas du tout ! D y a au jourd’hui plus de Mushrik(s) dans le monde qu’il n’y a de personnes qui croient dans Le Seul Vrai Dieu."}, {"t": "p", "x": "N’y a-t-il pas d’espoir que cela change ? Allah ordonnait à son Prophète (Ç). A présent, c’est à nous qu’il délivre ses ordres par le biais de ses sept versets de la sourate Muddath thir (chapitre 74)."}, {"t": "p", "x": "1.\"Ô Toi qui es revêtu d’un manteau\". l. Les peuples signifie les juifs et les chrétiens. Voui n’aurez du Livre\" tirer le kalam d’Allah. Ne laissez rien d’aussi bon pour étudier as passer cette chance. Rappelez-vous des versets tels qu’ils sont. pas passer 2. Pour lire le verset dans son entier, voir page 60."}, {"t": "p", "x": "Comme d’habitude, il y a ces versets magnifiques très mystiques (y compris celui qui suit), une triple ligne de pensées a."}, {"t": "p", "x": "Il est fait référence à une occasion ou une personne particulière. b. Une leçon spirituelle d’ordre général est donnée, et c. Une rêverie plus profonde est proposée."}, {"t": "p", "x": "En ce qui concerne a, le prophète. avait alors passé l’étape de la contemplation personnelle. Vêtu de son manteau, il al lait maintenant de l’avant, délivrant témérairement son Mes sage, et il proclamait publiquement que Allah était le Seul Vrai Dieu. Son c,œur était toujours purifié, mais tous ses gestes extérieurs devaient être offerts à Dieu, et le respect conventionnel pour les coutumes ancestrales et le culte de vaient être mis de côté. La tâche de ce Messager était des plus généreuses qui puissent être, mais aucune récompense ou remerciement n’était attendu du peuple. Bien au contraire, on exigeait de lui beaucoup de patience, et sa satisfaction venait du bon plaisir de Dieu."}, {"t": "p", "x": "En ce qui concerne b, des étapes identiques apparaissent à un degré moindre dans la vie de chaque homme bon, pour lesquels 1a vie du Prophète doit être l’exemple universel. En ce qui concerne c, les soufis entendent, par manteau et vêtements chauds, les circonstances d’une existence prodi gieuse, qui sont nécessaires à notre confort physique jusqu’à un certain point; mais, bientôt, nous grandissons plus vite qu’eux et notre nature profonde doit alors, courageusement, se révéler. Le fait d’espérer, seulement, serait incompatible avec notre nature élevée, qui sait porter tous les échecs et se réjoukt dans la grâce de Dieu. 2.\"Lève-toi et avertis ! 3.\"Glorifie ton Seigneur ! 4."}, {"t": "p", "x": "\"Purifie t’es vêtements ! 5.\"Fuis l’abomination (a) \"(a) \"Rujz\" ou \"Rijz\" signifie \"abominations\" (horreur) et est habituellement utilisé pour signifier idoldtrerie. Il est même possiblequ’une idole appelée Rujz ait existé. Mais de nos jours, ce mot a une signification plus vaste qui inclut un état mental opposé au culte de la vérité, un état de doute ou d’indécision\". 6.\"Ne donne pas en espérant recevoir davantage\" (b) \"(b) La formule légale et commerciale est que vous don nez pour recevoir un peu plus que vous n’avez donné, mais n’attendez rien du receveur. Vous servez Dieu et les créa tures de Dieu\"."}, {"t": "p", "x": "7.\"Sois patient envers ton Seigneur\" (c) (1) \"(b) Notre zèle pour la cause de Dieu elle-même exige que nous soyions patients, et que nous montrions de la constance dans nos efforts pour Sa cause. Car nous avons la Foi, et nous savons qu’Il est la Bonté, la Sagesse et la Puis sance’ `Abdullah Yusuf `Alî (2) 1. Rappelez-vous le kalam d’Allah et sa signification ! 2. La traduction anglaise et les commentaires sont de `Abdullah Yûsuf `Alï.Demandez votre livre à l’IPCI et bénéficiez d’un prix intéres sant. Commandez aussi un livre pour vos amis non-musulmans."}, {"t": "p", "x": "Pour les Arabes en général, et pour le Prophète (Ç) en particulier, \"un manteau\" signifiait la couverture protectrice utilisée pour s’abriter du soleil, du vent et du sable. Il en ét ait enveloppé et remontait ses manches pour accomplir sa tâche. Bien que la majorité des musulmans dans le monde ne se couvrent pas quotidiennement d’un manteau, ils transpor tent néanmoins une multitude de manteaux, témoins de leurs complexes d’infériorité. Que pouvons-nous faire pour faire briller plus encore la lumière de Dieu à travers l’obscurité qui nous entoure ?"}, {"t": "p", "x": "\"Nous devons d’abord la laisser briller en nous-mêmes. Avec cette lumière au sein de notre cour, nous pouvons marcher d’un pas ferme et sur, nous pouvons humblement rendre visite aux nécessiteux et guider leur pas, nous ne les guiderons pas, c’est la lumière qui les guidera ! Mais, oh, quelle joie que d’être utile pour porter la torche et de dire d nos frères : \"Moi aussi, j’étais dans l’obscurité, l’inconfort, et voyez, j’ai trouvé le confort et ta joie dans la grâce di vine!\" De cette façon, nous contribuons à la fraternité, en marchant humblement côte d côte dans la voie du Seigneur, avec une aide et un confort mutuels, et le cour plein de prières, fort du geste que le bon dessein de Dieu puisse ac complir en nous tous !\" `Abdullah Yûsuf `Ali \"Mais une grande partie de l’humanité ne sait pas encore\""}, {"t": "p", "x": "Ainsi parlait Notre Saint Prophète Mohammed (Ç), pour lequel nous invoquons la bénédiction de Dieu pour maintenant et après. AMEN"}]}, {"title": "Annexe A", "blocks": [{"t": "p", "x": "II atteignit le sommet de la distinction grâce à sa perfection II dissipa l’obscurité (du monde) par sa grâce Ses qualités étaient excellentes Priez pour que la bénédiction soit sur Lui et les siens Sheikh Sa’di Sherâzi (RA)"}]}, {"title": "Annexe B", "blocks": [{"t": "p", "x": "Mohammed (ç) le plus grand"}, {"t": "p", "x": "Si la grandeur du dessein la petitesse des moyens et les tonnants résultats sont les trois mesures du génie de l homme qui osera comparer humainement un grand homme de l’Hisioire moderne Mahomet ? les plus fameux n ont remu que des armes des lois des em pires ils n ont fond que des paissances mat rielles croul es sou vent avec eux. Celui-l a remu des arm es des l gislations des empires des peuples des dynasties des millions d hommes sur un tiers du globe habit mais il a remu de plus des autels des dieux des religions des es des croyances des âmes. II a fond sur un livre dont chaque lettre est devenue loi une nationalit spirituelle qui englobe des peuples de toute langue et de toute race..."}, {"t": "p", "x": "L’idée de l’unité de Dieu proclamée dans la lassitude des théogonies fabuleuses avait en ellemème une telle vertu, qu’en faisant explosion sur ses lèvres elle incendia tous les vieux temples des idoles et alluma de ses lueurs un tiers du monde... Sa prière sans fin sa conversation mystique avec Dieu sa mort et son triomphe aprés le tombeau attestent plus qu une im posture une conviction. Ce fut cette conviction qui lui donna la puissance de restaurer un dogme: Ce dogme était double l’unit de Dieu et l’immatérialité de Dieu l’un disant ce que Dieu est l autre disant ce qu’il n est pas..."}, {"t": "p", "x": "Philosophe orateur, apôtre, législateur, guerrier, conquérant d’idées restaurateur de dogmes rationnels, d’un culte sans images fondateur de vingt empires terrestres et d’un empire spirituel, voilà Mahomet !"}, {"t": "p", "x": "A toutes les échelles où l’on mesure la grandeur humaine, quel homme fut plus grand ? Lamartine, \"Histoire de la Turquie\", Tome I, Livre ler, XCV, Paris, 1854, pp. 277-280"}]}, {"title": "Annexe C", "blocks": [{"t": "p", "x": "Jules Masserman, psychanaliste américain Time, 15 juillet 1974 Les chefs doivent remplir trois fonctions : pourvoir au bien être du commandement, instaurer une organisation sociale au sein de laquelle les personnes se sentent relativement en sécurité, et leur inculquer des croyances. Des personnes comme Pasteur et Salk sont des chefs dans le premier sens du terme. Des personnes comme Gandhi et Confucius, d’un côté, et Alexandre, César et Hitler, d’un autre côté, sont des chefs dans le second sens, et peut-être dans le troisième sens. Jésus et Bouddha appartiennent à la seule troisième catégorie. Peut-être que le plus grand chef de tous les temps était Mohammed (ç), qui réunissait ces trois fonctions. A un degré moin dre, Moïse fit de même."}]}, {"title": "Annexe D", "blocks": [{"t": "p", "x": "La fidélité est une qualité humaine Qui différencie l’homme de la brute."}, {"t": "p", "x": "Mais cette fidélité suprême; innée dans chaque chien"}, {"t": "v", "x": ["Qui est la marque du meilleur ami de l’homme,", "Se trouve rarement chez l’homme!", "\"Un poète africain\""]}]}]}]}, {"id": "christ", "title": "Le Christ dans l’Islam", "sub": "Jésus et Marie selon le Coran, comparés au récit biblique", "chapters": [{"n": 0, "title": "Introduction", "sections": [{"title": "Avant-propos", "blocks": [{"t": "p", "x": "Encore une fois, le plan d’un dictateur a échoué et a disparu dans le désert, entraînant des centaines de milliers de morts. La Tempête du désert restera à jamais gravée dans la mémoire de tous ceux qui y ont participé. Et ce n’est pas la première Tempête du désert. Il en existe une autre qui dure depuis plus de deux mille ans concernant un homme appelé Jésus (que la paix soit sur lui) et sa mission. Les différends se rapportant à la nature du Christ ont déjà occasionné des millions de victimes, et ce depuis sa naissance (Matthieu 2:16). Quel est le point de vue musulman sur la personnalité du Prince de la Paix, Jésus?"}]}]}, {"n": 1, "title": "Les réponses des musulmans et des chrétiens", "sections": [{"title": "Débat télévisé", "blocks": [{"t": "p", "x": "A la fin du débat \"Chrétienté et Islam\" diffusé le 05 juin 1983 (1) sur la chaîne SABC-TV à partir des programmes \"Questions Chrétiennes\", le président Mr Bill Chalmers commentait : \"Je crois que nous pouvons dire àpartir de cette discussion qu’il y a dans l’islam, plus de tolérance pour le fondateur du christianisme, qu ’il n’y en a dans le christianisme pour le fondateur de l’islam. Quel sens faut-il donner à cela ? Nous vous laissons vous, téléspectateurs, réfléchir à cela, mais vous conviendrez avec moi que c’est une excellente chose que nous puissions discuter ensemble\"."}, {"t": "p", "x": "\"Bull\" comme il est familièrement et sans formalités appelé par les membres de son comité est un personnage extrêmement charmant et prodigieusement humble. Il est l’image même du bon chrétien tel qu’il est décrit dans le Saint Coran:"}, {"t": "p", "x": "(1) Si vous avez raté le programme OU Si vous désirez le revoir, nous serions heureux de vous prêter une vidéo K7 VHS. Téléphonez au \"centre’ pour toute information. Cette offre n’est valable que pour les Africains du sud; nous regrettons cette limitation. \".et tu trouveras que ceux, qui ont l’amitié la plus agissante la plus proche de ceux qui ont cru sont ceux qui ont dit: Nous sommes chrétiens (2) et ce parce qu’ils ont des prêtres et des moines et qu’ils n’affichent aucune superbe*.\""}]}, {"title": "Jésus son état", "blocks": [{"t": "p", "x": "Ne serait-ce pas des manoeuvres des musulmans, membres du comité, qui tenteraient de calmer les téléspectateurs en voilant le côté politique, la supercherie ou l’aspect diplomatique du propos ? Rien de tel! Les musulmans énoncent ce que Dieu Tout Puissant leur a intimé de dire dans le Saint Coran. En tant que musulmans, ils n’avaient pas d’autre alternative, ils ont toujours dit \"Nous musulmans, nous croyons au fait que Jésus (P)** est l’un des plus puis-"}, {"t": "p", "x": "(2) Chrétiens Le sens n’est pas dans le fait qu’ils se faisaient simplement appeler les chrétiens. Mais parce qu’ils étaient profondément sincères et qu’ils appréciaient les vertus des musulmans. Il auraient dû dire \"Cela est vrai, nous sommes chrétiens mais nous comprenons votre point de vue et nous savons que vous êtes des hommes bons.\" Ils sont musulmans dans leur cœur quelque soit leur apparence. (*) Superbe: arrogance (Note du traducteur). (**) Abréviation de la formule de révérence: \"Que la Paix soit sur lui’. sants messagers de Dieu, qu’il est le Christ, qu’il est né miraculeusement, sans aucune intervention masculine (ce que beaucoup de chrétiens contemporains refusent d’admettre jusqu’à maintenant), qu’il a ressuscité des morts, rendu la vue aux aveugles et guéri des lépreux et tout cela avec la permission de Dieu. En fait on ne peut être musulman si l’on ne croit en Jésus (P)!"}]}, {"title": "Heureuse surprise", "blocks": [{"t": "p", "x": "Plus de 90% des téléspectateurs qui ont suivi le débat ont été agréablement surpris malgré leur scepticisme. Ils n’ont pas dû en croire leurs oreilles et ont dû soupçonner les musulmans de vouloir amuser la galerie ou de vouloir gagner les faveurs de leurs amis paysans chrétiens; que s’ils disaient quelques mots aimables à propos de Jésus (P), les chrétiens réciproquement diraient quelques mots sur Mohammed (Ç)*. Ainsi, nous serions en train de nous caresser mutuellement, ce qui serait parfaitement honteux et hypocrite."}]}, {"title": "Une haine entretenue", "blocks": [{"t": "p", "x": "Nous ne pouvons en vouloir aux chrétiens pour leur scepticisme. Ils ont évolué pendant des siècles dans cet état d’esprit et ont été habitués à penser le pire de Mohammed (Ç) et de sa religion."}, {"t": "p", "x": "Comme le disait si justement Thomas Carlyle à propos des chrétiens il y a cent cinquante ans \"Les mensonges qui ont été amassés autour de cet homme (Mohammed) sont honteux pour nous seuls.\""}, {"t": "n", "x": "(*) Abréviation de la formule de révérence \"Que les prières (Çalât) d’Allah soient sur Lui et ses Descendants.\""}, {"t": "p", "x": "Nous, musulmans, sommes responsables en partie de cette ignorance massive qui touche 1.200.000 chrétiens àtravers le monde, et nous n’avons rien fait pour nettoyer et dépoussiérer les mentalités."}]}, {"title": "Un océan de chrétienté", "blocks": [{"t": "p", "x": "L’Afrique du Sud est un océan de chrétienté. Si la Libye revendique le plus haut pourcentage de musulmans pour le continent africain, l’Afrique du Sud voudrait en être le pays ayant le plus haut pourcentage de chrétiens."}, {"t": "p", "x": "Dans cet océan de chrétienté - la République d’Afrique du Sud - les musulmans ne représentent que 2% de la population. Nous sommes une minorité qui ne vote pas. Numériquement nous ne comptons pour rien, politiquement pas plus, et économiquement, un homme comme Oppenheimer peut nous acheter dans notre totalité. Si nous avons feint l’apaisement, nous avons à être excusés, mais non ! Nous devons proclamer les volontés de notre maître, nous devons faire retentir la vérité, que nous l’aimions ou pas. Jésus (P) ne disait-il pas \"Vous connaîtrez la vérité et la vérité vous rendra libres\" (Jean 8:32)"}]}]}, {"n": 2, "title": "Jésus dans le Coran", "sections": [{"title": "Jésus dans le Coran", "blocks": [{"t": "p", "x": "Le chrétien ne sait pas que l’esprit de charité que le musulman témoigne à Jésus (P) et à sa mère Marie jaillit de la fontaine de toutes les sciences, le Saint Coran. Il ignore que le musulman ne peut prononcer le nom sacré de Jésus (P) s’il ne le fait suivre de la formule Hazrat Issa (Béni soit Jésus), ou Issa alayhi As-Salam (que la paix soit sur lui). Chaque fois qu’un musulman mentionne le nom de Jésus (P) en omettant formules il est considéré comme irrespectueux, grossier ou barbare. Le chrétien ne sait pas que dans Le Saint Coran, Jésus (P) est cité cinq fois plus que n’est cité le Prophète de l’Islam dans le livre divin (Bible)."}, {"t": "p", "x": "Pour être exact, vingt-cinq fois contre cinq comme par exemple: \"...Nous avons donné à Jésus fils de Marie les preuves évidentes (miracles) et nous l’avons appuyé par le Saint Esprit..\" \"...Ô Marie! Dieu t’annonce la bonne nouvelle de la venue d’une parole de lui Son nom est le Messie, Jésus fils de Marie... \"Le Messie Jésus fils de Marie n’est que le messager de Dieu"}, {"t": "v", "x": ["\"Nous avons enchainé", "sur leurs traces", "par l’envoi de Jésus fils de Marie", "\"Et Zacharie,", "Jean, Jésus et Elie", "font partie des vertueux"]}]}, {"title": "Jésus - ses titres", "blocks": [{"t": "p", "x": "Même s’il est nommé vingt-cinq fois dans le Saint Coran, Jésus y est aussi désigné avec respect \"Ibnou Mariem\" fils de Marie, Massih en hébreu, Messiah traduit en Christ, Abdou Allah le serviteur de Dieu, Rassoulou Allah, le messager de Dieu. Il y est désigné encore comme \"parole de Dieu\" ou \"es prit de Dieu\" ou encore \"signe de Dieu\" sans parler des différents épithètes honorifiques qui lui sont attribués à travers quinze de ses différents chapitres. Le Saint Coran honore ce puissant messager tout comme les musulmans qui n’ont jamais failli à ce respect durant plus de quatorze siècles. Dans tout le Coran, il n’y a pas un seul dénigrement (une seule remarque désobligeante envers Jésus (P))* que le plus fielleux des chrétiens puisse trouver."}]}, {"title": "Issa latinisé en Jésus", "blocks": [{"t": "p", "x": "Le Saint Coran désigne Jésus (P) sous le nom de \"Issa\" qui y est utilise plus qu’aucun autre titre car c’était son nom \"chrétien\"(3)."}, {"t": "p", "x": "Le vrai nom de Jésus est donc Issa (en arabe) ou Yassou (en hébreu) qui devient en classique Yeheshua que les populations occidentales ont latinisé en Jésus (P). Le \"J\" initial ainsi que le 2ème \"S\" du nom (Jésus) n’existent pas dans les langues originelles. Elles n’existent pas dans les langues sémites. Le nom \"Esau\", très simple, est un nom juif communément répandu et utilisé plus de Soixante fois dans la première partie de la Bible, partie désignée \"les Génies\". il y avait finalement un \"Jésus\" assis sur un \"banc\" lors du jugement avant la Sanhédrin(*). Joseph, l’historien juif, fait mention de Jésus (P), plus de vingt-cinq fois dans le \"livre des anciens\"."}, {"t": "n", "x": "(3) Chrétien est devenu synonyme du fait d’être né en Afrique du Sud qu’il s’agisse d’un nouveau-né hindou, musulman, chrétien ou juif."}, {"t": "p", "x": "C\") Assemblée, tribunal religieux et civil pour toute la Palestine antique"}, {"t": "h", "x": "(NDLT)"}, {"t": "p", "x": "Le Nouveau Testament parle de \"Bar-Jésus\" un magicien, un sorcier et un faux prophète juif (Actes 13:6) et aussi de \"Jésus-Justus\" un missionnaire chrétien contemporain de Paul (Colossiens 4:11). Ils sont différents de Jésus, fils de Marie. Transformé en (J)ésu(s) le sens unique."}, {"t": "p", "x": "Ce nom unique est devenu courant chez les juifs et les chrétiens à partir du 2ème siècle après Jésus-Christ. Chez les juifs, il était synonyme d’une maladie très connue, le nom de celui qui avait blasphémé en religion hébraïque et chez les chrétiens parce qu’il devenait le nom de leur Dieu (?), leur Dieu incamé."}, {"t": "p", "x": "Les musulmans n’hésitent pas à appeler son fils (de Dieu*) \"Issa\" car c’est un nom honoré, le nom d’un vertueux serviteur de Dieu."}]}, {"title": "Plusieurs références", "blocks": [{"t": "p", "x": "A la fin de toutes les traductions du Saint Coran en langue anglaise de A. Yusuf Ah (4), il y a un appendice* littéraire très concis."}, {"t": "p", "x": "Si nous prenons la peine de le parcourir (5) nous allons découvrir page 1837 le sujet JESUS (Voir ci-contre)"}, {"t": "n", "x": "(4) Le \"Centre\" seul a distribué plus de 20.000 volumes de cette traduction pour les deux années écoulées. Nous recommandons tout particulièrement cet ouvrage. (5) Il n’ya pas de meilleure voie pour connaître le Coran que la familiarisation avec les index (Notes & appendices explicatifs). (*) Notes du traducteur The subject - JESUS: i.e. Jésus : un prophète vertueux (VI 85)"}, {"t": "h", "x": "Né (III 45-47 ; XIX 22-33)"}, {"t": "v", "x": ["Prophète d’Israèl (III 49-51)", "Disciples (III 52-53 - V 114-118)", "Pris (III 55-58 ; IV 157-159)", "Tel Adam (III 59)", "Non crucifié (IV 157)", "Pas plus qu’un apôtre (IV 171 ; V 78)"]}, {"t": "h", "x": "(XLIII 59, 63-64)"}, {"t": "p", "x": "Pas Dieu (V 19, 75) Envoyé avec l’Evangile (V 49) Pas le fils de Dieu (IX 30) Message et miracles (V 113 ; XIX 30-33) Prières pour le repas (V 117) Faux culte non enseigne (V 119-121) Les disciples se déclarent musulmans (V 114) Mission limitée (n. 1861 à XIII 38) Les fidèles avaient compassion et pitié (LVII 27) Les disciples sont les aides de Dieu (IXI 14) Comme un signe (XXIII 50 ; XLIII 61) Prophétise Ahmed (LXI 6)"}]}]}, {"n": 3, "title": "Mère et fils", "sections": [{"title": "Marie honorée", "blocks": [{"t": "p", "x": "Le deuxième titre du sujet abordé ici - sa naissance -est décrit à deux reprises dans les sourates 3 et 19 (6). A la partie de la traduction référencée et à la page 134 à laquelle commence la naissance de Jésus (P) nous croisons l’histoire de Marie et la position de respect qu’elle occupe dans l’islam bien avant que l’annonce de la naissance de Jésus (P) ne lui fut faite. \"Et lorsque les anges dirent: Ô Marie! Dieu t’a élue, t’a purifiée et élue au-dessus des femmes des humains\". (7)"}, {"t": "p", "x": "(6) Sourate: En arabe chapitre ( du Coran) (7) Je demande instamment à tous les musulmans qui peuvent lire ces versets en arabe de le faire en leur accordant leur véritable sens. Si la lecture arabe n’est pas possible, il faut en retenir le sens. Vous trouverez l’occasion de les partager avec vos amis chrétiens et vous en tirerez grand bénéfice. Vous êtes concernés. Le temps des évangélistes professionnels est révolu. Serez-vous incapable de faire ce petit effort pour l’Islam. \"....et t’a élue au-dessus des femmes des humains\". Un tel hommage n’est rendu nulle part ailleurs à Marie pas meme dans le Nouveau Testament. Le verset se prolonge: \"Ô Marie! sois pleine de dévotion à ton Seigneur, prosterne-toi et courbe-toi avec ceux qui se courbent\" Saint Coran 3:43"}]}, {"title": "La divine révélation", "blocks": [{"t": "p", "x": "Quelle est l’origine de cette merveilleuse et sublime récitation qui, dans sa version arabe originelle, émeut les lxxnmes à l’extase et les fait pleurer à chaudes lannes ? Le verset 44 nous révèle: \"Cela fait partie des nouvelles de l’inconnu que nous inspirons. Tu n ’étais"}, {"t": "v", "x": ["pas parmi eux alors qu’ils", "jetaient leurs calames.", "Pour savoir qui d’entre eux", "prendrait Marie à sa charge*"]}, {"t": "n", "x": "(*) Note traduite de la référence: \"Le père de Marie étant mort, les notables de la tribu tirèrent au sort l’honneur de la prendre en charge. Le prophète Zacharie (P) fut désigné par le sort. On dit qu’ils étaient vingt-sept concurrents et qu’ils jetèrent leurs \"Calames\" dans le courant du Jourdain. Seul celui de Zacharie (P) floua et resta...1..."}, {"t": "p", "x": "Et tu n ’étais pas parmi eux alors qu’ils se disputaient."}]}, {"title": "La naissance de Marie", "blocks": [{"t": "p", "x": "Le fait est que la grand-mère de Jésus Hannah était stérile. Elle offrait son coeur à Dieu et fit le serment que s’il lui donnait un garçon, elle le consacrerait au service du temple et à l’adoration de Dieu."}]}, {"title": "Anti-apogée (retour à l’ordinaire)", "blocks": [{"t": "p", "x": "Dieu exauça sa prière et Marie vint au monde. Elle (Hannah’) fut déçue. Elle attendait un garçon et au lieu de cela, elle donna naissance à une fille qui n’avait rien de commun avec le garçon et le rêve qu’elle avait en tête pour lui. Que pouvait-elle faire d’autre ? Elle avait fait un serment à Dieu, elle attendit que Marie fut suffisamment grande pour se prendre en charge. Quand le moment fut venu, Hannah emmena sa chère fille au temple pour le service. Chaque prêtre demande àDieu d’ être un bon père pour son enfant bien-aimé."}, {"t": "p", "x": "Ils (les notables*) tirèrent au sort pour savoir qui allait la prendre en charge (Marie’). Elle échut à Zacharie (P) non sans dispute. sur place. C’est ainsi que Marie lui échut. On rapporte qu’il l’enferma à clef et qu’à chaque fois qu’il entrait chez elle, il trouvait une nourriture céleste. Ce miracle la désignait déjà pour le grand rôle qui l’attendait."}, {"t": "p", "x": "Zacharie (P) était l’époux d’Elisabeth, tante maternelle de Marie qui donnera naissance au prophète Jean-Baptiste (P), cousin maternel et premier apôtre de Jésus (P). Il sera tué par les Juifs. (*) NDLT (notes du traducteur). Les mots ou expressions entre parenthèses accompagnés dune astérique sont du fait du traducteur."}]}, {"title": "L’origine de son message", "blocks": [{"t": "p", "x": "L’histoire est ainsi, mais d’où Mohammed (Ç) tenait-il son savoir? Il était oummi (illettré), il ne savait ni lire ni écrire. Il fut fait par Dieu Tout Puissant pour répondre aux nombreuses questions contenues dans les versets précédents et auxquelles il répondait que tout était \"inspiration divine\". \"Non!\" répondait ses détracteurs \"tout cela n’est que pure invention de Mohammed (Ç) il a copié ses révélations à partir des (en s’inspirant des textes’) juifs et des chrétiens. Il les a plagiés, comme il les a fabriqués (contrefaites’)\"."}, {"t": "p", "x": "Grâce à nos connaissances actuelles et notre croyance (foi’) nous savons que le Coran est la véritable parole de Dieu. Nous pouvons néammoins accepter de prendre en considération un instant, les arguments des ennemis de Mohammed (Ç) qui faisaient qu’il l’aurait (le Coran’) écrit. Nous pouvons attendre de leur part quelques concours."}, {"t": "p", "x": "Demandez-leur alors \"Aurez-vous quelque inquiétude à admettre que Mohammed (Ç) fut un arabe ?\" Seul un fou entêté pourrait hésiter et il n’y aurait aucun intérêt à poursuivre la discussion."}, {"t": "p", "x": "Poursuivons donc avec un individu capable de raisonner flonnalement: Cet Arabe s’est d’abord adressé aux Arabes, il ne parlait pas aux Indiens, ni aux Chinois, ou aux Nigériens musulmans, il s’adressait à son peuple, les Arabes. Qu’ils furent ou pas de son avis, il leur dit de façon sublime et avec des mots qui allaient être estampillés dans leurs Coeurs et leurs esprits. Marie, la mère de Jésus - une juive -fut choisie entre toutes. Ce n’était ni sa mère (à Mohammed (Ç)) ni son épouse, Di sa fille, ni aucune autre femme arabe, mais une juive."}, {"t": "p", "x": "Est-ce que quelqu’un peut expliquer cela? Pour tout un chacun, la mère, l’épouse ou la soeur devraient être les premières entre toutes les femmes."}, {"t": "p", "x": "Pourquoi le Prophète de l’Islam aurait-il rendu hommage à une femme de ses ennemis, et de surcroit une juive, appartenant à une race qui, depuis plus de trois mille ans, regardait de haut son peuple comme ils* continuent à regarder leurs frères arabes de nos jours."}]}, {"title": "Sarah et Hagar", "blocks": [{"t": "p", "x": "Il est dit dans la Sainte Bible que Abraham (p) le père des juifs, aurait eu deux épouses Sarah et Hagar (8). Enfourchant leur racisme absurde, ils* avancent le fait qu’ils sont les enfants d’Abraham (P) et de Sarah, son épouse légitime, alors que leurs frères arabes descendent de Hagar, une maîtresse de circonstance, ce qui en fait des descendants inférieurs. Plairait-il à quelqu’un de m’expliquer pourquoi Mohammed (Ç) aurait alors choisi une juive pour un tel honneur? La réponse est simple - il n’avait pas le choix - il n’avait aucun droit de parler de son propre chef. \"Ce n’est en fait qu’une révélation inspirée\""}, {"t": "n", "x": "(8) Hagar était une princesse d’Egypte et non une \"courtisane\" ou une esclave. Dans sa publication à venir, \"les partisans et les opposants d’Israël’, l’auteur fait la preuve, quelque soit la logique adoptée et en conformité avec les ’eugéniques\" (Euphémistes*), le judaisme ou le simple bon sens que la descendance de Hagar est supérieure à celle"}]}, {"title": "Un chapitre pour Marie", "blocks": [{"t": "p", "x": "Dans le Saint Coran, il y a un chapitre dédié à Marie, le chapitre XIX désigné ainsi en l’honneur de la mère de Jésus (P), honneur inexistant dans la Sainte Bible. Parmi les 66 livres (sacrés*) des protestants et les 70 des catholiques, aucun ne relève de Marie ou de son fils. Vous pouvez trouver l’évangile selon Saint Matthieu, Marc, Luc, Jean, Pierre ou Paul ou encore selon deux autres noms peu connus mais pas un seul selon Jésus ou Marie!"}, {"t": "p", "x": "Si Mohammed (Ç) avait été l’auteur du Saint Coran, il n’aurait pas hésité à ajouter à côté de Maryam la mère de Jésus (Marie en arabe*) sa propre mère Amina, sa chère épouse Khadija ou sa fille bien-aimée Fatima, mais non Non ! Ceci ne pourra jamais être. Le Coran n’est pas son oeuvre (9). (9) Dans notre livre \"le Coran, Miracle ultime\", nous prouvons mathématiquement qu’aucun être humain, pas plus qu’une société humaine avec l’intelligence de la terre entière, n’aurait pu concevoir une oeuvre comme le Saint Coran."}]}]}, {"n": 4, "title": "La bonne nouvelle", "sections": [{"title": "La bonne nouvelle", "blocks": [{"t": "p", "x": "\"Et lorsque les anges dirent Ô Marie! Dieu t’annonce la bonne nouvelle de la prochaine venue d’une parole de Lui. Son nom est le Messie, Jésus fils de Marie notable dans ce monde et dans l’autre et parmi les rapprochés\". \"Proche de Dieu\" non pas physiquement ou géographiquement, mais spirituellement. Comparez ceci avec \"et (Jésus) s’assit à la droite de Dieu \" (Marc 16:19) (10). Le comble des chrétiens fut de méconnaître ce verset (10) Marc 16:19 Maintenant supprimée de la version anglaise R.S.V où elle était intercalée. \"La Bible est-elle parole de Dieu\" l’explique."}, {"t": "p", "x": "comme beaucoup d’autres dans la Bible. lls imaginent le père (Dieu) assis sur un trône de gloire avec, à sa droite, son fils Jésus. Pouvez-vous évoquer cette image ? Si vous le pouvez, vous vous égarez complètement en ignorant tout de Dieu.11 n’est pas le père du christianisme, il est l’esprit au-delà de l’imagination des hommes. Il existe, Il est réel, mais il est différent de tout ce que nous pouvons imaginer Dans les langues orientales etre assis ou penser. \" \"à la droite de\" signifiait \"occuper une place d’honneur\" ce que justement le Saint Coran décrit \"en compagnie des proches de Dieu\"."}, {"t": "p", "x": "Les versets précédents (Coran 3:45) confirment le fait que Jésus (P) était le Christ et qu’il était la parole que Dieu que Dieu avait accordée à Marie. Là aussi, le chrétien donne à ces mots un sens qu’ils n’ont pas. Ils donnent au terne \"Christ\" le sens de Dieu incamé et au terme \"parole\" de Dieu le sens de Dieu (lui-méme*)."}]}, {"title": "Christ n’étant pas un nom", "blocks": [{"t": "p", "x": "Le mot \"Christ\" est dérivé du mot hébreu Messiah, en arabe Massih, la racine du mot masaha ou frotter, masser ouoindre. Les évêques et les rois étaient \"oints\" (bénis*) quand ils étaient intronisés."}, {"t": "p", "x": "Dans sa traduction, le terme Christ dans sa formulation grecque signifie \"unique\" : convenant seulement à Jésus (p) Les chrétiens étaient habiles pour transformer les métàux divers en or brillant. Ce qu’ils ont fait (dans la Sainte Bille’) était de traduire dans leur propre langage les mots tels que \"Céphas\" en Pierre (11) et \"Messie\" en Christ. (11) plus de détails à propos de ces acrobaties verbales dans mon ouvrage \"Mohammad\" (Ç) le successeur naturel du Christ (P)."}, {"t": "p", "x": "Comment ont-ils fait cela ? Facilement. Messiah en hébreu signifie le \"oint\" (le béni par l’onction*) qui en grec devient christos. En supprimant les lettres finales \"os\" vous avez \"christ\", maintenant le \"c\" minuscule de christ est remplacé par un \"C\" majuscule et prestement il vous crée le Christ, l’unique? Christos signifie \"oint\" (béni*) qui se traduit par \"désigné\" dans la religion de référence."}, {"t": "p", "x": "Lors de son baptême par Jean-le-Baptiste, Jésus (P) fut désigné (béni’) messager divin. Tous les prophètes (messagers divins) sont ainsi bénis ou désignés. La Sainte Bible en est pleine et la version hébraïque originale en avait fait \"Messiah\""}, {"t": "p", "x": "Examinons la traduction de \"oint\". Il n’y a pas que les prophètes, les ecclésiastiques ou les rois qui sont \"bénis\" (Christos-ED), il y a aussi les boeufs, les anges et les réverbères qui peuvent l’être aussi. \"Je suis le Dieu (de) Béthel où tu as oint une stèle, Genèse 31:13 \"Si c’est le sacrificateur ayant reçu l’onction...\""}, {"t": "p", "x": "Lévitique 4:3 \"Moïse prit l’huile d’onction, oignit le tabernacle et tous les objets qui s’y trouvaient et les consacra.\""}, {"t": "p", "x": "Lévitique 8:10 Dieu... tonnera... et relèvera la force de Son Messie.\" I Samuel 2:10"}, {"t": "p", "x": "\"Ainsi parle l’Eternel à Son Messie (12), à Cyrus...\""}, {"t": "p", "x": "Esaïe 45:1 (12) Pourquoi ne vérifiez-vous pas la Bible. le mot y serait. Il est facile et aisé pour un chrétien d’effacer le mot (... béni) des prochaines éditions comme ils ont éradiqué Allah de la version Schofield. Consultez \"La Bible est-elle parole de Dieu?\""}, {"t": "p", "x": "\"Tu étais un chérubin protecteur,...\" Ezekiel 28:14 Il y a des centaines d’autres références du même genre dans la Sainte Bible. Chaque fois que vous rencontrerez le mot \"oint\" (anointed) dans la Bible anglaise, terme qui dans la traduction grecque serait Christos, et que vous preniez les mêmes libertés que les chrétiens, vous pourriez obtenir \"ange béni\", \"cyrus béni\", \"évêque béni\", \"pilier béni\", etc..."}]}, {"title": "Quelques titres exclusifs", "blocks": [{"t": "p", "x": "Alors que chaque prophète est béni (oint) par Dieu, le Messie qui est la traduction du Christ, est exclusivement réservé à Jésus fils de Marie dans l’islam et le christianisme. Ceci n’est pas extraordinaire en religion. il y a certains titres honorifiques qui peuvent être attribués à plus d’un prophète et qui ne sont pas réservés à un seul usage. Ainsi, \"rassoulou Allah\" qui signifie \"messa- ger de Dieu\" et qui s’applique à Moïse (P) (19:51) et Jésu (P)(61:6) dans le Saint Coran. De même \"rassoulou Allah\" est devenu, pour de nombreux musulmans, synonymes de prophète de l’islam (Chaque prophète est en fait un ami de Dieu, mais son équivalent en arabe \"khalilou Allah\" est exclusivement réservé à père Abraham (P)."}, {"t": "p", "x": "Ceci ne signifie pas que les autres (prophète) ne soient pas les amis de Dieu.\"Kalimou AIlah\" (Celui qui parla à Dieu) n’est utilisé pour aucun autre (prophète) que Moïse (P) alors que nous, nous savons que Dieu à parlé à tous Ses messagers, ce qui inclut Jésus (P) et Mohammed (puissent la paix et les miséricordes divines être sur tous Ses serviteurs)."}, {"t": "p", "x": "Le fait d’associer certains titres avec quelques person (Plophètes*) seulement n’en fait pas des êtres exclu23"}]}, {"title": "L’étonnement des Juifs", "blocks": [{"t": "p", "x": "Là, il n’y a guère de Joseph le charpentier. Les circonstances devenant singulières, Marie, la mère de Jésus (P) se retira dans un endroit discret à l’est (Saint Coran 19:16). Après la naissance de l’enfant (Jésus*) elle revint (au milieu des siens*). \"L’étonnement de la population n’avait pas de limite, personne n’avait été préparé à imaginer le pire en ce qui la concernait lorsqu’elle quitta les siens quelque temps. Mais maintenant la voilà qui revient sans pudeur et sans honte paradant, un bébé dans les bras I Elle a jeté l’opprobe sur la maison de Aaron, la source de piété s’il enfut! La soeur de Aaron Marie se souvient de ses origines et de sa haute lignée tout autant qu’elle se souvient de l’exceptionnelle moralité de ses parents. Comme ils dirent, elle a failli et souillé le"}, {"t": "p", "x": "nom de ses géniteurs I Que pouvait faire Marie ? Comment pouvait-elle expliquer ? Allaientils accepter ses explications malgré leur prédispositon à la censure ? La seule chose qu’elle pouvait faire était de montrer l’enfant qu’elle savait différent. L’enfant vint à son secours. Miraculeusement il parla et prit la défense de sa mêre comme il prêcha à une assistance incrédule.\""}, {"t": "p", "x": "A.Yusuf Ah. Commentaires sur ses notes. 2480-2482, page 773 dans sa traduction (14) \"Elle le leur désigna (du doigt) ils dirent: Comment parlons-nous (14) Accordez-vous une faveur. Demandez dès maintenant votre exemplaire. Si vous ne pouvez l’obtenir dans votre région, contactez le \"centre\" en Afrique du Sud."}, {"t": "v", "x": ["à un enfant au berceau?", "Il dit: \"Je suis esclave", "et adorateur de Dieu.", "Il m’a apporté le livre", "et a fait de moi un prophète.\"", "Il a fait de moi une bénédiction", "là oùje me trouve.", "Et m’a recommandé la prière", "et l’aumône légale", "tant que je serai vivant.", "...Plein de piété filiale", "pour ma mère", "et il ne m’a nullement fait", "un violent misérable.", "Salut à moi", "Le jour de ma naissance,", "le jour de ma mort et", "le jour de ma résurrection!"]}]}, {"title": "Le premier de ses miracles", "blocks": [{"t": "p", "x": "Ainsi Jésus (P) prit la défense de sa mère contre la grave calomnie et les insinuations (malveillantes*) de ses ennemis. Ceci est le premier miracle attribué à Jésus (P) dans le Coran. Alors qu’il venait de naître et qu’il était dans les bras de sa mère, il s’adressa aux hommes. Faites la confronta26 tion de ceci avec son premier miracle rapporté dans le Nouveau Testament et qu’il vécut, alors qu’il avait plus de trente ans: \"Trois jours après, il y eut des noces à Cana en Galilée. La mère de Jésus était là. Jésus fut aussi invité aux noces ainsi que ses discipies. Comme le vin venait à manquer, la"}, {"t": "p", "x": "mère de Jésus lui dit ils n’ont pas de vin."}, {"t": "p", "x": "Jésus lui dit Femme qu’y a-t-il entre toi et moi ?"}, {"t": "p", "x": "Mon heure n’est pas encore venue."}, {"t": "p", "x": "Sa mère dit aux serviteurs Faites tout ce qu’il vous dira."}, {"t": "p", "x": "Il y avait là six jarres de pierre, destinées aux purifications des juifs et contenant chacune deux ou trois mesures."}, {"t": "p", "x": "Jésus leur dit Remplissez d’eau ces jarres. Et ils les remplirent jusqu’en haut. Puisez maintenant, leur dit-il, et portez-en à l’organisateur du repas. Et ils lui en portèrent. L’organisateur du repas goûta l’eau changée en vin. Il ne savait pas d’où venait ce vin, tandis que les serviteurs qui avait puisé l’eau le savaient. Il appela l’époux. Et lui dit tout homme sert d’abord le bon vin, puis le moins bon après qu’on se soit enivré. Toi, tu as gardé le bon vin jusqu’à présent.\" Jean 2:1-10 Depuis ce miracle, le vin coule à flots dans le christianisme. Plusieurs raisons aussi farfelues les unes que les autres font que ce qui était bon pour le maître était bon pour"}, {"t": "p", "x": "lui. Ils disaient que Jésus (P) n’était pas un rabat-joie. N’avait-il pas fait un délicieux vin, puissante que même les \"bons buveurs\", ou ceux dont les sens et le goût étaient émoussés pouvaient distinguer ? \"Le meilleur était laissé pour la fln\". Ce n’était pas du raisin pur, c’était le même vin qui, selon le nouveau testament, avait poussé les filles de Loth à séduire leur père (Genèse 19:32-33), c’était le même vin qu’il était recommandé aux chrétiens d’éviter (Ephésiens 5:18)."}, {"t": "p", "x": "Cela serait-il aussi innocent? Il y aurait 1% de la population qui entraînerait des millions d’hommes dans le mauvais chemin."}, {"t": "p", "x": "Les USA comptent 10 millions d’ivrognes et quelques 70 millions de désintoxiqués chrétiens! Les Américains baptisent leurs ivrognes \"buveurs à problèmes\" alors qu’en Afrique du Sud ils sont appelés \"alcooliques\". Ivrogne serau. un mot trop lourd à porter pour ceux qui ont une réputation de \"bons buveurs\"."}, {"t": "p", "x": "Le premier ministre de la Zambie, le Dr Kenneth Kaunda n’hésitait pas à appeler les choses par leur nom, il disait: \"Je ne suis pas prêt pour diriger une nation d’ivrognes\". Il parlait de son peuple qui était intoxiqué par l’alcool."}, {"t": "p", "x": "Que l’eau ait eu l’apparence (du vin*) ou n’en fut qu’une vision pour Jésus (P) nous ne pouvons lui tenir rigueur, pas plus qu’à ses disciples, de cette coutume (15) de boire qu’avaient leurs contemporains. Pour l’avis qu’il avait si justement donné \" \"J’ai beaucoup de choses à vous dire, mais vous ne les comprendrez pas maintenant.\" (Jean"}, {"t": "n", "x": "(15) Nous devons garder en mémoire le fait que les compagnons du saint prophète consommaient de l’alcool avant qu’il ne fut interdit (Saint Coran 5:93)"}, {"t": "p", "x": "16:12) (16). L’humanité n’est pas suffisamment mûre pour recevoir l’ensemble de la vérité de l’islam. N’avait-il pas dit aussi \"on ne met pas du vin nouveau dans de vieilles outres?...\" (Matthieu 9:17)."}]}, {"title": "« Mère » ou « femme » ?", "blocks": [{"t": "p", "x": "En référence (17) (ou en accord ou encore conformément*) à (l’évangile selon*) Saint Jean dans les quatre versets cités plus haut qui décrivaient la fête de mariage de Cana, il nous est dit que Jésus (P) s’était comporté de façon insolente envers sa mère, il l’appela \"femme\" et aurait été jusqu’à lui dire, pour retourner le couteau dans la plaie, \"qu’ai-je à faire de toi ? \" quelle relation y-a-t-il entre toi et moi ou que dois-je faire de toi ? Aurait-il pu oublier que cette vraie \"femme\" l’avait porté neuf mois et qu’elle l’aurait peut être allaité pendant deux ans, qu’elle l’avait mis au monde sous les insultes et les injures ? N’était-elle pas sa mère ? N’y a-t’il pas de mot pour dire \"mère\" dans cette langue?"}, {"t": "p", "x": "Etrangement, alors que les disciples vantaient l’humilité de leur maître, sa douceur et son long calvaire, ils l’appelaient le \"prince de la paix\" et le chantait. \"ll était né pour être égorgé comme un agneau et comme un mouton prêt àêtre tondu, il devait rester muet; il garda la bouche fermée\". (16) Ce verset, comme les autres prophéties de Jésus (P) telles que décrites dans l’évangile de Jean sont abondamment réalisées en la personne de Mohammed (Ç) le saint prophète. Cet aspect sera abondamment développé dans notre ouvrage \"Mohammed (Ç) le successeur naturel du Christ (P)\". (17) \"En référence à\" les quatre évangiles commencent tous par cette phrase: Pourquoi? Demandez votre exemplaire de l’ouvrage \"La Bible est-elle la parole de Dieu?\" qui explique cela en détail."}, {"t": "p", "x": "Ils ajoutèrent dans le même souffle qu’il était prêt depuis toujours à subir les invectives pour les aînés de sa race et se démenait pour étaler ses révélations, à condition que leurs écrits furent vrais \"Vous hypocrites !\" \"Vous génération malade et adultère !\" \"Vous pilleurs de tombe !\" \"Vous génération de vipères !\" Puis à sa mère: \"Femme....\""}]}, {"title": "La défense de Jésus", "blocks": [{"t": "p", "x": "Mohammed (Ç) le messager divin était destiné à l’absolution (avec l’aide et la permission de Dieu\"’ des fausses charges et des calomnies qui pesaient sur Jésus (P). dont les auteurs étaient ses ennemis..Plein de piété filiale pour ma mère et il ne m’a nullement fait un violent misérable.\""}, {"t": "p", "x": "A l’annonce de la bonne nouvelle relative à la naissance de son vertueux fils (Saint Coran 3:46) Marie répondit: \"Elle dit \"Seigneur! comment se peut-il que j’ai un enfant alors qu’aucun être humain ne m’a jamais touchée ? Il dit \"C’est ainsi. Dieu crée ce qu’il veut Quand Il décide d’une chose, Il lui suffit de lui dire \"sois\" pour qu’elle se réalise Il lui enseigna le Livre, la Torah et l’E vangile..\" (18) (18) Avez-vous appris ces versets par coeur? Si vous ne l’avez pas encore fait allez p. 14 et consultez les notes en bas de page. C’est un système qui me réussit. Alors s’il vous plait plus d’excuse."}]}]}, {"n": 5, "title": "Versions biblique et coranique", "sections": [{"title": "Rencontre avec le révérend", "blocks": [{"t": "p", "x": "J’espère que vous avez pris au sérieux ma remarque en bas de la page 14. J’essaie de faire ce que je prêche et, en conformité avec le conseil que je vous ai adressé, j’ai appris ces versets par coeur. Les occasions de les mettre en oeuvre se multiplient. Je visitais “la maison de la Bible” à Johanesburg et alors que j’explorai les nombreux ouvrages religieux et les différentes Bibles, je tombai sur une édition indonésienne et venais de prendre en main la version greco-anglaise du Nouveau Testament, un énorme ouvrage et ne m’aperçus pas du fait que j’étais observé par le conservateur de la maison de la Bible."}, {"t": "p", "x": "Accidentellement, il se dirigea vers moi. Peut être que mon collier de barbe ou mon couvrechef musulman avaient particulièrement attiré son regard? Il s’enquit de mon intérêt pour ce coûteux ouvrage. Je lui expliquai, qu’en tant qu’étudiant en “religions comparées”, j’avais besoin d’un tel ouvrage, il m’invita à prendre une tasse de café dans son bureau. J’acceptai son invitation que j’appréciais et le suivis. Après la tasse de thé, je lui expliquai la vénération des musulmans pour Jésus (P) et détaillai la position éminente qu’il occupait dans la maison de l’islam."}, {"t": "p", "x": "Mes propos le laissèrent sceptique et son ignorance feinte m’amusait car, en Afrique du Sud, seul un révérend expérimenté et de bonne souche peut devenir conservateur de la maison de la Bible. Je commençais à réciter la sourate 3 à partir du verset 42: “Et lorsque les anges dirent Ô Marie, Dieu t’a élue...” J’aurai voulu que le révérend (conservateur) entende non seulement le sens des mots, mais ausi leur mélodie et leur cadence dans la langue arabe."}, {"t": "p", "x": "Le révérend Dunkers (tel était son nom) s’assit et écouta avec une attention soutenue les paroles de Dieu. Lorsque je fus au terme du verset 49, le conservateur me dit alors que ce message du Coran était identique à celui de sa propre Bible. ll me dit ne voir aucune différence entre ce que je venais de lui réciter. Je lui dis : “C’est la vérité”. S’il avait lu ces versets en anglais, uniquement sans leur adaptation en langue arabe juxtaposée, il aurait été incapable de comprendre, fut-ce au bout de cent ans, qu’il venait de lire le Saint Coran."}, {"t": "p", "x": "S’il avait été protestant, il aurait pu penser qu’il lisait la version catholique romane s’il n’avait pas vu auparavant, ou la version des témoins de Jéovah ou celle des Grecs orthodoxes ou encore l’une des multiples versions parmi les centaines qu’il n’avait pu voir. Jamais il n’aurait pu imaginer que c’était la version du Coran."}, {"t": "p", "x": "Le chrétien devrait lire dans le Coran tout ce qu’il souhaite entendre sur Jésus (P) en termes nobles, déférents et sublimes, il n’aurait jamais pu supporté de les voir remplacés. Dans les huit vers 42 à 49, il nous est dit: a) Que Marie, la mère de Jésus, fut une femme vertueuse, honorée au-dessus de toutes les autres. b) Que tout ce qui fut dit fut révélation de Dieu à toute l’humanité. c) Que Jésus fut “parole de Dieu d) Qu’il était le Christ que les juifs attendaient. e) Que Dieu donnerait le pouvoir à Jésus pour accomplir les miracles y compris pendant son enfance. t) Que Jésus était venu au monde de façon miraculeuse sans l’intervention d’aucun homme. g) Que Dieu lui ferait ses révélations."}, {"t": "p", "x": "h) Qu’il ressusciterait les morts avec la permission de Dieu et qu’il soulagerait les (nés*) aveugles, les lépreux, etc... avec la permission divine."}, {"t": "p", "x": "LA CRAIE ET LE FROMAGE (19) (Le jour et la nuit*) Le chrétien le plus fervent ne peut trouver à redire à une simple citation ou un mot ici, mais la différence entre les narrateurs de la Bible et ceux du Coran est telle que celle qui existe entre “la craie et le fromage” ou “le jour et la nuit”... (19) Mes auditeurs nord-américains Ont éprouvé quelques difficultés àadmettre cette expression. Ils comprennent la différence entre “le Paradis et la terre”, “être aux antipodes”,“très différent” beaucoup mieux."}, {"t": "p", "x": "En français, l’expression utilisée sera “le jour et la nuit”."}, {"t": "p", "x": "Le révérend (conservateur de la maison de la Bible* ) me dit alors “pour moi, elles sont identiques, où est la différence ?“ Je sais que dans l’ensemble les deux versions concordent dans leurs détails, mais quand nous les examinons minutieusement, nous découvrons des différences vertigineuses. Maintenant, comparons la miraculeuse conception telle qu’annoncée dans le Saint Coran au verset 47 et ce qu’en dit la Sainte Bible. “Voici comment arriva la naissance de Jésus-Christ. Marie, sa mère était fiancée a Joseph. Avant leur union, elle se trouva enceinte (par l’action) du Saint Esprit.” Matthieu 1:18"}]}, {"title": "Éminent adaptateur", "blocks": [{"t": "p", "x": "L’éminent Billy Graham américain bon teint a adapté ces versets devant 40.000 personnes dans King Parc à Dur-ban."}, {"t": "p", "x": "Pointant son index menaçant et virevoltant de gauche et de droite au bout de son bras démesurément allongé, il dit: “Et le Saint Esprit vint et féconda Marie !“ Saint Luc nous avait dit la même chose mais de façon beaucoup moins cavalière. il disait que lorsque l’annonciation fut faite, Marie fut bouleversée, sa réaction naturelle fut: “...Comment cela se produira-t-il, puisque je ne connais pas ( sexuellement* ) d’homme ?“ Luc 1:34 La version du Coran est:"}, {"t": "p", "x": "“Elle dit: Seigneur, comment se peut-il que j’ai un enfant alors qu’aucun être humain ne m’a jamais touchée» Saint Coran 3:47 Dans le fond il n’y aurait pas de différence entre les deux citations : “Puisque je ne connais pas d’homme” et “Mors qu’aucun être humain ne m’a jamais touchée ?“Bien que composées de mots différents, elles ont le même sens. Le choix de mots différents devient important, les réponses respectives de Marie diffèrent au niveau des causes."}]}, {"title": "La version biblique", "blocks": [{"t": "p", "x": "“L’ange lui répondit le Saint Esprit viendra sur toi et la puissance du Très Haut te couvrira de Son ombre...” Luc 1:35 Vous ne voyez donc pas que vous (chrétiens*) donnez àl’athé, au sceptique et à l’agnostique le bâton pour vous battre ? ils pourraient vous demander: “Comment le Saint Esprit aurait pu venir sur Marie? Ou encore : “Comment le plus grand aurait pu la couvrir de Son ombre ?“ Nous savons que, littéralement, cela n’est pas le sens, c’était l’immaculée conception. Cependant les tennes utilisés ici sont détestables, vous l’admettrez?"}]}, {"title": "La version coranique", "blocks": [{"t": "p", "x": "“Il (l’Ange répond*) dit: C’est ainsi. Dieu crée ce qu’il veut. Quand il décide d’une chose Il lui suffit de lui dire “Sois” pour qu’elle se réalise. Saint Coran 3:47 Telle est la conception musulmane de la naissance de Jésus (P). Pour Dieu, créer Jésus (P) sans un père humain est affaire de simple décision. S’il voulait créer des millions de Jésus sans père ni mère il aurait simplement à le décider. Il n’a pas de craintes à transférer, comme le font les Hommes, les animaux (les êtres vivants en général* ) par contact ou insémination artificielle. il fait que les choses soient par son seul ordre”soit” et cela “est”."}, {"t": "p", "x": "il n’y a rien de nouveau dans ce que je vous dis. Je ne fait que le rappeler au révérend. ll est contenu dans le premier livre de votre sainte Bible (Génèse 1:3) “Et Dieu dit...” Qu’a-t-il dit? ll dit “soit !” et “Ce fut!”. Il n’avait pas à épeler les mots. C’est notre façon de comprendre le mot “sols”, quand il décidait que les choses “fussent”."}]}, {"title": "Le choix pour sa fille", "blocks": [{"t": "p", "x": "Entre ces deux versions relatives à la naissance de Jésus (P) — la version biblique et celle du Coran — laquelle auriezvous préféré offrir à votre fille? demandais-je au conservateur de “la maison de la Bible”. ll baissa la tête humblement et me confia: “La version du Coran.” Comment une “contrefaçon” ou une “imitation” (ailéga tion contre le Coran) peut-elle être meilleure que la version originale, authentique... (dont se réclame la bible)? Cela ne peut, en aucune façon être, sauf si cette révélation à Mohammed (Ç) est ce qu’elle même dit être, les paroles saintes et pures venant de Dieu."}, {"t": "p", "x": "Il y a des centaines de tests différents que les chercheurs Impartiaux et avides de vérité peuvent appliquer au Saint Coran et au terme desquels ils pourront dire haut et fort que c est bien un message qui vient de Dieu."}]}, {"title": "Comme Adam", "blocks": [{"t": "p", "x": "La naissance miraculeuse de Jésus (p) en ferait-elle un Dieu ou un fils procréé de Dieu ? Le Saint Coran dit non: “L’image de Jésus Pour Dieu est comme celle d’Adam Il le créa de terre puis lui dit “sols et il se réalise.” Saint Coran 3:59 “Après avoir décrit la position privilégiée qu ‘occupe Jésus (P) en tant que prophète, il nous échoit de réfuter le dogme qui en faisait Dieu ou fils de Dieu ou autrement qu’un homme. S’il est admis qu’il est sans (l’intervention d’un*) père Adam est aussi né de la même manière, enfait lui serait né sans père ni mère et, autant que nos corps physiques puissent être concernés ils sont faits simplement de terre."}, {"t": "p", "x": "Pour Dieu, Jésus (P)fut une poussière tout comme Adam ou l’humanité. La grandeur de Jésus lui est conférée par le commandement divin “Sois 1”: pour qu’il soit beaucoup plus que poussière, un grand esprit guide et un enseignant pour l’humanité”. Ali Yusuf, note 398 à propos du verset 3:59"}, {"t": "p", "x": "La logique de tout cela est simple. Le fait d’être né sans l’intervention d’un géniteur mâle en ferait l’égal de Dieu, Adam aurait le même honneur et cela aucun chrétien ne serait prêt à le concéder. Dès lors le musulman ne peut que bannir le blasphème chrétien. Mieux encore, si les chrétiens avancent le fait que Adam fut créé à partir de poussière, alors Jésus (P) fut “engendré” de façon immaculée dans la matrice de Marie. Il y aurait alors plus grand que Jésus (P) et ce dans sa propre Bible. Qui e
