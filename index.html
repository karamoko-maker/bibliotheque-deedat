x mots : \"Voyez comment NOUS avons fait clairs NOS messages pour eux !\" Aucun musulman n’a pu comprendre à travers ces pluriels une pluralité dans la pensée divine pas plus que n’a dû le faire un chrétien arabe ou juif. Demandez à un juif qui connait l’hébreu, combien il y a de Dieu dans son \"Nous\" hébreu, depuis le premier chapitre de sa Torah, et il vous confirmera sans hésitation ce que je vous dis."}]}, {"title": "Les dieux de l’apartheid", "blocks": [{"t": "p", "x": "Certaines âmes trompées ne se contentent pas de donner à Dieu une apparence physique humaine, mais lui donnent aussi les altérations et les caractéristiques raciales : \"Les dieux éthiopiens ont des lèvres éthiopiennes, des joues bronzées et des cheveux crépus. Les dieux grecs ressemblent aux Grecs avec des yeux perçants, intelligents et beaux.\" (Anonymes) Il y a deux mille ans, les Grecs et les Romains ont jeté leurs Minerve, Apollon et Hercule, et optèrent pour Jésus-Christ"}, {"t": "p", "x": "1. \"Pauvres\" : spirituellement, car numériquement les chrétiens seraient les plus nombreuz à la surface de la terre. 2 Apartheid : philosophie politique qui prûne la séparation des races en Afrique du Sud (avec prédoninance de la race blanche)."}, {"t": "p", "x": "Pour les nations de l’Europe de l’Ouest, qui commençaient à être lassées de leurs Thors et de leurs Wodens, les Romains devenaient les pionniers de leur mythologie fraîchement apprêtée. Ainsi, les Européens prenaient leur nouveau credo avec empressement."}, {"t": "p", "x": "A leur tour, les Européens infligeaient leur \"tri-théologïe\" à leurs colonies en donnant à l’homme - Dieu - plus de \"beauté\" que n’en avaient ceux des autochtones. Voyez comment ils l’ont matérialisé à travers moultes images, statues et films."}, {"t": "p", "x": "II a des cheveux blonds, des yeux bleus, un visage aux traits agréables et anguleux. Tout comme ceux de Jeffrey Hunter dans le film \"Le Roi des Rois\". Décidément, il n’a rien à voir avec le juif avec son proverbial appendice nasale, le nouveau Dieu est plus britannique, allemand ou scandinave dans sa structure osseuse. Un homme Dieu blanc contre un homme Dieu bleu (1), comparez les représentations picturales et vous serez pleins de compassion pour ces \"ces peuples qui ont glissé de la poêle à frire pour tomber dans le feu\". I. Rama et Krishna sont peints en bleu dans les représentations religieuses hïndoues. 2. \"Shirk\" : terme théologique arabe impliquant l’association d’individus avec Allah, le plus hideuz des péchés en Islam."}]}, {"title": "L’obligation du musulman", "blocks": [{"t": "p", "x": "Nous, musulmans, n’avons réellement rien fait pour des millions de naïfs à traves le monde. Nous sommes tenus de venir à leur secours pour les préserver contre leur \"shirk\" (2) sans quoi ils nous entraîneraient dans leur chute. Il y a des millions d’individus qui ont le culte des hommes-Dieu sur cette bonne terre d’Allah que ceux qui vénèrent la seule vraie divinité : Dieu. \"Allahou soubhanahou wa ta’la\""}, {"t": "p", "x": "Les souffrances existent dans le monde musulman à cause de la complète et totale négligence dans le partage de (la religion de Dieu), Dinou Allah avec les peuples de la planète Terre. La propagation de la Foi est le awwal (premier) fard (obligation) du musulman. Si vous devez ne pas tenir compte de ce pilier de l’Islam, vous le tenez à vos risques et périls. Vous savez que vous pouvez ignorer Allah. Cela est silencïeux (passera inaperçu). Comment pouvez-vous jouer votre rôle ? En vous rappelant un simple verset du Saint Coran, celui de la page 17, inscrivez-le sur un morceau de bristol avec son sens."}, {"t": "p", "x": "Apprenez les mots de Dieu par coeur, apprenez-en le sens par coeur, phrase par phrase. Et conservez précieusement cette carte tant que vous ne l’aurez pas complètement mémorisée dans l’ordinateur (cerveau) que Dieu vous a fourni. Avec seulement ce simple verset et le boomerang (ATNATU de l’Aborigène, vous voilà paré pour mettre en déroute n’importe quel antropomorphisme susceptible de perturber les créatures d’Allah. Ceci est votre privilège et c’est le destin de l’islam. Dieu dit : \"... Afin de la placer au-dessus de Ia religion toute entière N’en déplaise aux Associateurs.\" Saint Coran 61:9 Croyez-vous réellement à la promesse divine ? \"... Telle est en vérité la promesse de Dieu...\" Saint Coran 4:122"}]}]}, {"n": 3, "title": "Qui est Jéhovah ?", "sections": [{"title": "Qui est Jéhovah ?", "blocks": [{"t": "p", "x": "Aussi étonnant que cela puisse paraître, il est admis que jusqu’au tout début du XVIème siècle, le mot Jéhovah n’existait pas."}, {"t": "p", "x": "Chaque fois que l’origine de ce mot est apparue dans les Ecritures Juives dans sa forme hébraïque originelle (lire de droite à gauche comme en arabe) Yot, Huh, Wav, Huh, ou Y.H.W.H. ou ces quatre lettres étaient précédées par un mot de substitution \"ADONAÏ\" qui prévenait le lecteur du fait que le mot suivant n’avait pas à être articulé. Les juifs ont pris de méticuleuses précautions à répéter la formule dans leur Livre de Dieu six mille huit cent-trente fois en alternant les mots \"Adonaï\" et \"Elohim\". Ils croyaient sincèrement que le nom de Dieu n’avait pas à être prononcé."}, {"t": "p", "x": "Cette proscription n’était pas chose normale. Elle pouvait être sanctionnée par la surdité de celui qui prononçait le nom \"imprononçable\" de Dieu. Ce tabou eut un effet beaucoup plus important que tous les \"Faites\" et \"Ne faites pas\" des Dix Commandements réunis. Si Jéhovah est le nom de Dieu Tout Puissant et si les 27 livres du Nouveau Testament furent inspirés par Dieu, il se trouve qu’il existe une anomalie de première importance. Jéhovah aurait singulièrement oublié d’avoir son nom inscrit dans Sa Parole (le Nouveau Testament) le supplément chrétien de la Bible juive (Ancien Testament)."}, {"t": "p", "x": "Les chrétiens revendiquent la possession de plus de vingt quatre mille prétendus \"originaux\" de leurs Saintes Ecritures en version grecque, et pas un seul parchemin ne fait mention de Jéhovah. Curieusement, ce \"Nom de Dieu\" (?) aurait été remplacé de façon sacrilège par les mots grecs Ky’rios et The.os qui signifiaient \"Seigneur\" et \"Dieu\". Encore, un miracle parmi tant d’autres, Alleluia ! Aucun diable, aucun saint n’a été capable d’éliminer le nom d’Allah de ce qui est prétendument appelé le Nouveau Testament des chrétiens."}]}, {"title": "Les nouvelles doctrines venimeuses", "blocks": [{"t": "p", "x": "Il y a un siècle environ, et tout à fait soudainement, plus d’une centaine de nouveaux cultes et entités chrétiennes ont poussé comme des champignons aux Etats-Unis d’Amérique : les Adventistes du 7° Jour, les Scientistes chrétiens, les Ménonites, les Dauphins du Christ, les Témoins de Jéhovah et bien d’autres. Le fondateur du dernier culte nommé, le juge Rutherford, à propos duquel les chrétiens orthodoxes disaient qu’il n’était en aucune façon juge. Ce juge était un vorace, dévoreur de livres, et un rédacteur politique. Il eut à trébucher sur le mot \"Jéhovah\" qui l’avait profondément perturbé, et qui le conduisit à faire une religion sans en faire mention ou usage."}, {"t": "p", "x": "Le juge Rutherford suivi de Charles T. Russell ont été à l’origine d’une nouvelle \"Eglise\" qui, du fait de son organisation et de son administration, est la deuxième connue dans le monde, et nous, en tant que musulmans, nous avons beaucoup à apprendre de leur enthousiasme et de leur méthodologie. Lisez l’ouvrage de Schelin \"Trente ans un esclave de la tour d’observation\". Je ne suis en aucune façon passionné par leur théologie, mais c’est leur façon d’opérer qui m’attire. Lisez comment cette incorrigible secte fut sur le point de conquérir 1\"Allemagne avant Hitler."}, {"t": "p", "x": "Informez vous de leur deuxième retour dans ce pays, l’Allemagne de l’Ouest. Essayez de comprendre pourquoi ils développent autant d’énergie au Nigéria, pays dans lequel le système ou la religion qui prévaut, sera la norme ultïme pour le reste de l’Afrique ? Ce géant est le héros de la majorité des nations (le plus grand pays et la plus forte population) africains situées au Sud du Sahara. Les musulmans devraient y réfléchir."}]}, {"title": "Une nation virile", "blocks": [{"t": "p", "x": "Parmi toutes les sectes religieuses, les \"Témoins de Jéhovah\" sont ceux qui, au cours des cent dernïères années, ont connu le développement le plus important, si 1’on se réfère aux pourcentages statistiques. Les Bahîs seraient des limaces à côté d’eux. Leur recul actuel en pourcentage s’inscrit dans le même mouvement que celui des autres chrétiens affiliés ou assimilés."}, {"t": "p", "x": "Ces \"Témoins\" sont les plus performants dans leur bataille contre les autres chrétiens comme, et tout aussi bien, contre les musulmans, pour la simple et bonne raison qu’ils s’organisent pour que cinq fois par semaine, ils se retrouvent dans leur \"Kingdom Halls\", mettant en pratique leur savoir durant les fins de semaines (weekend). Nous, musulmans, serions supposés être organisés cinq fois par jour pour nos prières quotidiennes (ﷺ)alât)."}, {"t": "p", "x": "Mais, nous avons oublié l’objet et le but de ce pilier de l’islam. Notre \"Ṣalât\" est faite pour nous procurer le sawab."}, {"t": "p", "x": "Les Témoins de Jéhovah ont rendu le nom de leur père spirituel fameux. Ils frappent aux portes des gens pour leur demander : \"Quel est son nom ?\". Les chrétiens orthodoxes répondent : \"Dieu!\" Les Témoins de Jéhovah ajoutent : \"Dieu n’est pas un nom, c’est un objet d’adoration. Quel est son nom ?\" \"Le Père\" répondent les orthodoxes dans une deuxième tentative. \"Est-ce que votre Père est Dieu ?\" redemandent-ils. \"Bien sûr que non !\" Alors, quel est son nom ?\" Et les \"Témoins\" d’asséner aux musul mans et à ceux qui ne le sont pas : \"Jéhovah est son nom !\" II est professeur enseignant. Ce nom-là, nom qu’il a érigé en religion."}]}, {"title": "Le tétragramme", "blocks": [{"t": "p", "x": "Pour changer un peu, pourquoi ne pas lui poser une ou deux questions, Demandez-lui d’où provient le mot Jéhovah ? Il vous répondra sûrement : \"De la faible Bible\". Que dit-elle ? Y est-il écrit JEHOVAH ? Il vous répondra : \"Non ! Il y a un tétragrammaton dans la Bible, tétragrammaton duquel est dérivé Jéhovah\". Qu’est-ce qu’un tétragrammaton ? Personne ne semble avoir entendu ce terme mystique éminemment élevé. A l’université américaine de l’Illinois, j’ai demandé à un groupe d’étudiants et de chercheurs si quelqu’un avait déjà entendu parle de ce \"casse mâchoires\" ?"}, {"t": "p", "x": "Pas l’un d’entre eux n’en connaissait le sens ! Ce pendant, chaque Témoin de Jéhovah semblait le connaître, y compris les moins avertis. C’était vraiment des spécialistes. Nous vivons à l’ère de la spécialisation. Ils sont maîtres d’un mot, d’un seul mot, Jéhovah. Mais alors, qu’est qu’un \"tétragrammaton\" ? Les Témoins de Jéhovah vous répondent alors : \"YHWH !\" \"Non, ce que je veux savoir de vous c’est le sens de \"tétragrammaton\" !\" Vous verrez les Témoins de Jéhovah hésiter à vous répondre, soit qu’ils ignorent la définition du mot, soit qu’ils sont embarrassés par la réponse."}, {"t": "p", "x": "\"Tétra\" en grec signifie \"quatre\" et \"Grammaton\" signifie \"lettres\". \"Tétragrammaton\" veut dire \"mot de quatre lettres\". Pouvez-vous trouver le mot Jéhovah dans les quatre lettres YHWH ? Je ne le puis. Mais bien sûr, répondent les Témoins de Jéhovah, nous devons ajouter des voyelles à ces quatre consonnes pour produire un son. Originellement, les Hébreux et les Arabes écrivaient sans \"voyelliser\" les écrits. Les natifs de chacune des deux langues pouvait lire sans voyelles ce qui n’était pas le cas des autres langues qui avaient créé les voyelles."}]}, {"title": "L’incurie du « J »", "blocks": [{"t": "p", "x": "Ajoutons les voyelles comme nous l’a suggéré le \"Témoin\". YHWH devient alors YEHOWAH. Faites comme vous voudrez, jamais vous n’obtiendrez Jéhovah. Demandez-lui alors d’où a-t-il extrait son \"J\", il vous répondra que c’est la prononciation populaire de ce mot depuis le XVIème siècle. Le son exact des quatre lettres YHWH est inconnu des juifs autant que des \"Gentils\" (Occidentalisés), quoiqu il se trouve au fond de chaque gorge."}, {"t": "p", "x": "Les chrétiens d’Europe ont inventé un fondement (une maladie) pour la lettre \"J\". Ils ajoutent des \"J\" là où il n’y en a pas. Voyez ! YAEL converti en JOEL YEHUDA converti en JUDAS YEHESHUA converti en JOSUE YUSUF converti en JOSEPH YUNUS converti en JONAS YESUS converti en JESUS YEHOWA converti en JEHOVAH Il n’y a aucune limite à l’engouement des occidentaux pour la lettre \"J\". Actuellement, dans les rues animées d’Afrique du Sud ils n’hésitent pas à aborder les passants distraits pour faire quelques pas ensemble."}, {"t": "p", "x": "Alors que personne ne les prend en charge pour convertir les noms juifs (Yehudi) en nom \"Gentils\". Les lettres YHWH apparaissent 6823 fois dans les Ecritures sacrées des Juifs, ce dont se flattent les Témoins de Jéhovah. Elles viennent se combiner avec le mot Elohim 156 fois dans la seule Genèse. La combinaison YHWH/ELOHIM a été traduite sans ambiguité et à l’infini \"Seigneur Dieu\", \"Seigneur Dieu\",..."}]}, {"title": "Origine commune", "blocks": [{"t": "p", "x": "Qui est YHWH et qui est ELOHIM ?"}, {"t": "p", "x": "Du fait que les juifs n’avaient pas articulé le mot YHWH pendant des siècles, et que le grand rabbin ne pouvait admettre que l’ineffable soit entendu, ils avaient condamné le fait de pouvoir prononcer dogmatiquement la manière dont le mot devait ou pouvait être entendu."}, {"t": "p", "x": "Nous devons faire appel aux Arabes pour faire revivre la langue hébraïque, une langue qui était devenue moribonde."}, {"t": "p", "x": "Dans toutes les situations difficiles au plan linguistique, il est fait appel à l’arabe, une langue soeur qui se trouve être restée une langue vivante et viable. Aux plans racial et linguistique, les Arabes et les Juifs ont une origine commune qui remonte à Abraham (P) (1). Remarquez l’effrayante ressemblance entre les deux langues. Très souvent les mêmes consonances ont un même sens."}, {"t": "v", "x": ["HEBREU ARABE FRANCAIS", "ELAH ILAH DIEU", "IKHUD AHUD UN", "YAUM YAUM JOUR", "SHALOAM SALÂM PAIX", "YAHUWA YAHUWA OH LUI"]}, {"t": "p", "x": "YHWH ou YEHOVA ou encore YAHUWA, tous veulent dire la même chose, \"YA\" est une particule phonétique et exclamative dans les deux langues, hëbraïque et arabe, signifiant OH ! et \"HUWA\" ou \"HU\" qui se traduit par LUI dans les deux langues, hébraïque et arabe. Ensemble, ils signifient OH LUI ! au lieu de YHWH ELOHIM, maintenant nous avons OH LUI ! ELOHIM. 1. Pour mieux apprecier les affinités entre Juïfs et Arabes, lisez la Genèse 16:12 et 25:18. Pour plus de détails, consultez le livre \"Ce que dit la Bible de Mohammed ?\""}]}]}, {"n": 4, "title": "Allah dans la Bible", "sections": [{"title": "Allah dans la Bible", "blocks": [{"t": "p", "x": "Le suffixe \"IM\" dans le mot \"Elohim\" est le pluriel de déférence en hébreu. Souvenez-vous qu’en langue arabe et hébraïque il y a deux types de pluriel : l’un numéral et l’autre honorifique, comme dans les décisions et les proclamations royales. Depuis que le pluriel de déférence est devenu peu usité dans les langues européennes, son usage dans un contexte numéral, dénature la notion de pluralité lorsqu’il s’agit de divinité. Ainsi, en est-il de la doctrine de la Sainte Trinité : le Père, le Fils et le Saint-Esprit."}, {"t": "p", "x": "Ainsi, ELOHIM = ELOH + IM. Maintenant, je voudrais que vous réalisiez un exercice. Vous voyez le mot YAHUWA ELOH IM ? Placez votre index gauche sur les deux premières lettres YA qui signifient \"OH\" et votre autre index sur le IM, suffixe de déférence, vous obtenez HUWA ELOH ou HUWA ELAH. \"EL\" signifie \"Dieu\" en hébreu. \"ELOH\" ou \"ELAH\" prenant le même sens, dès lors \"HUWA EL ELAH\" ou \"HUWA’L LAH\" qui est alors identique à l’expression du Coran. HOUWA ALLA-HOU (IL, est Allah) de la sourat \"Al-Ikhlâs\" :"}, {"t": "v", "x": ["\"Dis :", "C’est lui", "Dieu seul et unique.\"", "Saint Coran 112:1"]}, {"t": "p", "x": "L’exercice qui précédait prouve que EL, ELAH et ELOHIM ne sont pas trois mots différents. Ils représentent l’unique mot arabe \"Allah\", qui n’est pas le fruit de mon désir personnel. Consultez la page suivante. C’est une reproduction d’une page de la Bible britannique, éditée par le Révérend C. I. Scofield (D.D.) avec ses commentaires de la Bible. Ce docteur ès divinités est très respecté par les chercheurs du monde entier. II est renforcé dans sa \"Nouvelle édition améliorée\" par une constellation de huit autres docteurs ès divinités qui ont"}, {"t": "p", "x": "contiribué à la traduction de l’oeuvre : Rév. Henry G. WESTON D.D., L.D. Président du Séminâire théologique Crozer Rév. W.G. MOOREHEAD D.D. Président de Xenia (U.I.) Séminair théologique Rév. James M. GRAY D.D. Président du l’Institut Biblique Moody Rév. Elmore HARRIS D.D. Président du Séminaire Biblique de Toronto Rév. William J. ERDMAN D.D. Auteur de \"l’Evangile de Jean\", etc... ’ Rév. Arthur T. PIERSON D.D. Auteur, éditeur, professeur, etc... Rév. William L. PETTINGIL D.D. Auteur, éditeur, professeur, etc... Amo C. GAEBEI,EIN Auteur \"Harmonie des mots prophétiques\", etc..."}, {"t": "p", "x": "Je n’ai pas aligné ces noms lumineux pour vous intimider, mais parce qü ils ont sans réserve supporté le Révérend Scofield dans son commentaire \"Nouvelle et améliorée\". Notez que dans les commentaires N°1 (page suivante), il y a coïncidence entre ELOHIM (tantôt EL ou ELAH signifiant \"Dieu\") et ALAH (troisième ligne, troisième mot). Les huit docteurs ès divinités ne pouvaient pas être aveuglés au point de écrire \"ALAH\" à la place de Dieu. De combien étaient-ils éloignés du mot arabe écrit ALLAH en caractères latins."}, {"t": "p", "x": "Je vous le demande cher lecteur ? Ceci est de la main de Dieu, mais le diable (Je dois l’écrire avec un \"D\" majuscule qui le desservira) a tôt fait de revenir à la charge par le biais de ses agents. Il eut tôt fait de réussir à mettre par terre tous les docteurs ès divinités responsables de cette débâcle et de les remplacer par neuf autres avec des niveaux beaucoup plus importants que ceux du lot précédent. Vous les trouverez dans la récente reproduction de \"La nouvelle référence biblique de Scofield\". Vous serez incapables de poser les mains sur une Bible avec \"ALAH\" inscrit à l’intérieur, le diable a déjà fait son oeuvre."}]}, {"title": "Ma seule défense", "blocks": [{"t": "p", "x": "J’ai fait quelques apparitions publiques depuis que j’ai découvert le mot \"ALAH\" qui s’écrivait usuellement \"ELAH\" en vocable chrétien. Mon seul appel aux chrétiens est le suivant. Vous pouvez écrire le mot comme vous voudrez avec un \"A\", avec un \"E\", avec un seul \"L\" ou deux \"LL\", mais par respect pour Dieu, prononcezle correctement comme nous le faisons, nous musulmans, car même avec sa propre orthographe anglicisée, Allah \"Il demeure loin de sa forme arabe originelle, lorsqu’il est prononcé avec des consonnes très atténuées et de très faibles voyelles, il est méconnaissable même pour les Arabes musulmans\"."}, {"t": "p", "x": "Ainsi, parlait le Révérend Kenneth CRAGG, évêque anglican de Jérusalem dans son livre \"L’appel du minaret\", page 36. De même que les Anglicisants ont le droit de nous dicter leur façon de sonoriser et de prononcer leur langue, nous avons, nous musulmans, sûrement le droit de demander, par courtoisie réciproque, le même égard par rapport au nom de Dieu. Nous ne souhaitons pas que le mot Allah ne se perde dans les limbes comme le fut le YAHUWA des juifs."}, {"t": "p", "x": "Plus de 6.000 fois l’expression YAHUWA ELAH ou YA HUWA ALAH ou encore HUWALLAH (il est Dieu). apparaît dans les Ecritures de l’Ancien Testament, la Bible des juifs, Ancien Testament étant le nom qui lui est donné par les chrétiens. Si ce fait est connu par les savants de la chrétienté et diffusé comme l’a fait le Révérend Scoffield, alors le jour où musulmans et chrétiens vénèreront Dieu ensemble ne sera plus éloigné. Mais le diable veille. Des intérêts énormes sont en jeu. Au lieu d’avoir à prononcer correctement le nom de Dieu Allah correctement, ils préfèrent omettre tout simplement le mot."}]}, {"title": "Une abrogation rapide", "blocks": [{"t": "p", "x": "cliquez pour la version agrandie (354 Ko) \"Maintenant vous le voyez,Maintenant vous ne le voyez pas\""}, {"t": "p", "x": "C’est une vieille blague de l’Ouest Comparez avec les pages 34 et 35, et voyez comment de façon parfaitement intelligente et adroitement le nouveau groupe de missionnaires a \"expulsé\" le mot Alah de la \"Version Autorisée de Saint Jacques\" de la Bible traduite par Scoffield: (1 ) 1. Pour avoir quelques exemples des acrobaties chrétiennes dans la Bible, consultez le chapitre 4 de mon livre \"La Bible est-elle la parole de Dieu ?\""}, {"t": "p", "x": "En tant que guides d’une des plus grandes mosquées de l’hémisphère sud \"Masjid Juma\" à Durban, mon compagnon et moi-même sommes souvent sollicités par les touristes et une de leur question \"Pourquoi Allah serait-il un autre Dieu ?\" La réponse est bien évidemment : \"Non !\" II n’y a pas d’autre Dieu. Le musulman diffuse, la kalima (parole)"}, {"t": "p", "x": "\"Il n’y a pas d’autre divinité qu’Allah\""}, {"t": "p", "x": "Il faut expliciter cela. Tout musulman doit imposer cet état univoque ainsi que la seconde moitié de la kalima :"}, {"t": "p", "x": "\"Mohammed est le messager d’Allah\""}, {"t": "p", "x": "Ce qui exclut Mohammed (ﷺ)d’être associé à Allah dans sa divinité. Nous sommes destinés à dire \"Pas même Mohammed ( \")اn’est Dieu ou ne peut être objet d’adoration. Allah et Allah seul est le Dieu Unique et Vrai."}, {"t": "v", "x": ["FRANÇAIS ARABE TRANSCRIPTION", "\"ll est Dieu", "II n’y a pas d’autre divinité", "que (Dieu) Lui.\"", "Huwwa"]}, {"t": "p", "x": "allahoula illaha Ila houa"}, {"t": "p", "x": "Saint Coran 59:22"}]}, {"title": "Un nom unique pour un Dieu unique", "blocks": [{"t": "p", "x": "Mais préférons le mot arabe \"Allah\" au mots anglais \"God\", ou français \"Dieu\", car ils sont mal utilisés ou mal appliqués. J’ai expliqué à mon visiteur non musulman de la mosquée, visiteur du groupe \"Oriental-Tour\" organisé par l’Office Publicitaire de Durban."}, {"t": "p", "x": "J’enchainai : \"A votre dernière escale, votre visite s’est achevée à la Maison hindoue de la prière appelée Temple, et vous avez dû pointer votre doigt vers les images et les idoles qui s’y trouvaient pour montrer à vos enfants \"Les Dieux hindous\"."}, {"t": "p", "x": "Si un Hindou vous avait entendu, il n’aurait pas été surpris car ce que vous disiez à vos enfants n’avait rien d’offensant pour lui, puisque c’était ce qu’il croyait vraiment. Nous avons abordé ensuite les divinités grecques, dieux et déesses anciennes, qui mangèrent et burent, qui se querellèrent et ourdirent des complots, qui enlevèrent les épouses des autres dieux. Mieux encore, en anglais, si un homme de bonne souche prend soin d’un enfant, nous dirions qu’il est un \"père divin\" pour l’enfant et que la dame serait une \"mère divine\"’ pour lui."}, {"t": "p", "x": "Quelqu’un qui serait un tantinet moqueur ou \"éclairé\" pourrait vous dire alors : \"Que pensez-vous de vous-même ? Etes-vous un \"Tin God\" ?\" Nous écrivons \"God\" tantôt avec un \"G\" majuscule ou un \"G\" minuscule, ce qui crée chez vous toute une hiérarchie de divinités. Ce mot arabe Allah n’est jamais utilisé avec un autre sens. Il n’y a rien de \"Allah-Père\" ou \"Allah-mère\" ou \"Tin Allah\". Allah est un mot unique pour un Dieu unique. La langue arabe comme toutes les autres langues a ses règles et sa grammaire mais en arabe, vous ne pouvez pas faire le pluriel de Allah pas plus que vous n’obtiendrez de forme mise au féminin."}, {"t": "p", "x": "Tout ceci est différent avec le mot anglais God. Si vous voulez faire un pluriel vous ajoutez un \"S\" (Gods). Vous pouvez aussi faire un féminin en ajoutant \"Dess\" (GODDESS) comme vous pouvez faire un diminutif en ajoutant le suffixe LING pour obtenir GODLING. Voyez les plaisanteries douteuses que font les occidentaux à propos du mot Dieu et comment leur fertile imagination suscite l’émeute et provoque des ravages en dénigrant la gloire et la majesté de l’Incomparable Créateur supportant et chérissant tous les univers, ainsi qü il est dit dans le dictionnaire d’Oxford. Vous avez tous les choix dans la liste suivante. Faites votre choix comme cette vieille dame qui brûlait un cierge à Saint Michel et dédiait un autre au diable de façon à avoir ses entrées en enfer comme au paradis."}, {"t": "v", "x": ["JUPITER DIEU DU PARADIS", "PLUTON DIEU DE L’ENFER", "MARS DIEU DE LA GUERRE", "NEPTUNE DIEU DE LA MER", "ZEUS DIEU DES DIEUX"]}, {"t": "p", "x": "Sans compter leurs épouses, leurs nombreux enfants, et autres Hercules, Apollon, Horus, Isis et Osiris... tout cela n’étant que mythologie et blasphème de première importance. Cependant, la mythologie ne l’était pas pour des peuples qni y croyaient. C’était une croyance empirique qui, au regard de la terminologie occidentale, les préparait à la théologie païenne avec leurs \"Dieux\" et leurs \"Déesses\". Mais, Dieu, Allah est hors de portée de toute corruption. Vous ne pouvez en aucune façon manipuler ce mot dans la langue arabe ! \"C’est Lui Dieu nul Dieu autre que Lui connaisseur des mondes voilés et perceptibles. C’est Lui le miséricordieux par essence et par excellence."}, {"t": "p", "x": "C’est Lui, nul Dieu autre que Lui Le Souverain Le Saint La source du salut, de la paix et de la sécurité Le prédominant Le puissant Le contraignant Celui qui écrase tout de sa grandeur L’exalté dans la Foi L’irrésistible Le suprême Gloire et pureté à Dieu Dieu au-dessus de ce qu’ils associent ! C’est Lui Dieu Le créateur L’extenciateur Le dessinateur Il a les attributs les plus beaux Tout ceux Qui est dans 1es cieux et en terre Proclame sa gloire C’est Lui Le Puissant Le sage Saint Coran 59:22-24 Y a-t-il, dans toute la littérature religieuse du monde, quelque chose de comparable ?"}]}, {"title": "Allah dans la Bible et dans toutes les langues", "blocks": [{"t": "p", "x": "Nous n’avons aucune réserve à admettre que chaque peuple a donné un nom spécifique à Dieu, nom qui est ou correspond à un de ses attributs. Alors que le nom, au sens propre du terme, de Dieu Tout-Puissant en langue sémite, dans la langue maternelle de Moïse (P), de Jésus (P) ou de Mohammed (ﷺ)est Allah ! Ce nom est dans le Nouveau Testament et dans chaque langue. Les chrétiens se targuent d’avoir traduit leur Bible en plus de quinze cents langues, et plus particulièrement le Nouveau Testament. Dans tous les Evangiles que j’ai examinés, dans de très nombreux langages, j’ai trouvé le mot \"Allah\" - que ce soit en anglais, zoulou, swahili, etc..."}, {"t": "p", "x": "Pourquoi ne vérifiez-vous pas dans votr propre dialecte juste pour me prouver le contraire. Si ce que je clame est vérité évangélique, pourquoi l’ensemble des chrétiens, à travers le monde, soit plus de 1.200.000 d’individus, n’ en ont ils pas été informés ? C’est l’oeuvre efficace du conditionnement ou du lavage de cerveau. Elles ont été entraînées à ne pas voir l’évidence. Jésus (P) ne s’était-il pas lamenté ? \"... Parce qu’en voyant, ils ne voient pas et qu’en entendant ils n’entendent, ni ne comprennent\" Saint Matthieu 13:13"}]}, {"title": "Des lèvres de Jésus", "blocks": [{"t": "p", "x": "Je demandai à mon visiteur chrétien : \"Vous souvenez-vous du récit de votre Evangile lorsque le Christ fut sur la croix. Il implora d’une voix puissante : \"Eloi, Eloi, lama sabachtani ?\" \"Mon Dieu, Mon Dieu, Pourquoi m’as-tu abandonné ?\" (Marc 15:34) Le verset précédent est de la traduction des manuscrits grecs \"selon Saint Marc\". De toute évidence, son juif avait un accent grec car les originaux dont il fait état furent écrit en grec. Mais écoutons Matthieu qui est supposé avoir écrit son Evangile originellement en hébreu et qui était dévolu aux juifs. Saint Jérôme, un curé chrétien, de la première heure et qui vécut aux IVème et Vème siècles après JésusChrist, atteste : \"Matthieu qui est aussi lévi et qui, de simple individu, est de venu apôtre, tous les"}, {"t": "p", "x": "évangélistes ont composé 1’Evangile du Christ en Judée et en langue et caractères hébraïques pour le plus grand profit de ceux qui avaient assisté à la circoncision et qui avaient cru.\" (1) Naturellement, l’accent de Matthieu aurait pu être plus sémitique que celui de Marc. Matthieu a rapporté la même scène que Marc au chapitre 15 verset 34. Mais, sans la nuance du dialecte : \"Jésus s’écria d’une voix forte : Eli, Eli, lama sabachtani ?"}, {"t": "p", "x": "C’est-à-dire : \"Mon Dieu, mon Dieu, pourquoi m’as-tu abandonné ?\" (Matthieu 27:46) De gâce, souvenez-vous des mots \"Eli, Eli, lama sabachrani\" (Eli prononcé comme un \"L\" et un \"I\" anglais). Prononcez les mots Eli, Eli, lama sabachtani; Eli, Eli, la ma sabachtani à vos amis chrétiens et à vos voisins en leur demandant si ces mots sonnent comme \"Jehovah, Jehovah ! \". S’ils ne sont pas sourds leur réponse devrait être négative. Demandez-leur au passage si \"Eli, Eli\" aurait une sonorité qui pourrait être proche ou ressemblante à \"Abba, Abba\" (signifiant Père, Père en hébreu)."}, {"t": "p", "x": "La réponse ne pourra être que négative s’ils ne sont pas sourds. Ne peuvent-ils comprendre que l’appel déchirant est pour Allah ? \"Eli, Eli - Elah, Elah - Allah, Allah !\" Laissez-les entendre ces mots de vos lèvres et observez leurs réactions. Aucun individu honnête ne pourra plus être de votre avis. 1. Ceux qui furent circoncis en référence aux juifs convertis du christianisme."}]}, {"title": "Alléluia !", "blocks": [{"t": "p", "x": "Maintenant, demandez à votre ami chrétien s’il a entendu le mot Alleluia. Aucun chrétien digne de ce nom ne pourra ne pas le reconnaître. Lorsque le chrétien est en extase, il s’exclame : \"Alleluia ! Alleluia !\" tout comme nous, musulmans, nous annonçons le takbir \"Allahou Akbar ! Allahou Akbar !\" (Allah est le plus Grand !) Demandez-lui qu’est-ce que Alleluia ? Ramenez-le à l’examen du livre de la révélation, le demier livre du Nouveau Testament, chapitre 19. Nous y apprenons que Jean, disciple de Jésus (P), a eu une vision dans laquelle il entendait les anges chantant au paradis : Alleluia !"}, {"t": "p", "x": "Alleluia ! Redemandez-lui alors ce que signifie \"Alleluia\" \" \"Hip, Hip, Hip, Hourrah ! Hip, Hip, Hip Hourrah ! Seraient-ce les anges qui chanteraient Hip, Hip, Hip Hourrah à Dieu ? Est-ce que chaque fois que Dieu crée une nouvelle galaxie, les anges chantent ses louanges, ou bien le font-ils lorsqu ’il fait exploser une super nova. C’est absurde ! Mais alors, que signifie Alleluia ?"}, {"t": "p", "x": "La dernière syllabe YA est vocative, c’est la forme exclamative en arabe et en hébreu, signifiant une note exclamative, une particule d’exclamation ou encore une marque d’exclamation. Le Sémite, arabe et juif, commence avec une particule exclamative ou une marque d’exclamation comme par exemple : Halte ! En avant ! Feu ! Bang !"}, {"t": "p", "x": "Répétons le tasbih (mots de prières) comme un Arabe ou on juif : ALLE-LU-IA qui deviendrait YA-ALLE-LU qui ne serait autre que YA ALLA HU signifiant \"OH ALLAH !\" (Vous êtes le seul digne d’éloges). Un chrétien honnête n’aurait aucun doute à reconnaître \"Allah\" au lieu de son \"EL, ELI, ELAH, ALAH, ALLAH\". Désignez-le par n’importe quel nom. Pour lui ce sont les plus beaux noms pourvu qu’ils ne soient pas contaminés ou altérés, ou qu’ils ne suscitent pas d’images d’hommes, de singes, etc... quelque soit la vénération dont ils ont été l’objet."}]}, {"title": "Le concept de « Dieu le Père »", "blocks": [{"t": "p", "x": "De nombreux attributs de Dieu sont communs au Coran et à la Bible, une très longue thèse peut être rédigée sur ce thème Cependant, l’un des aspects les plus intéressants que j’ai découvert dans le Coran est l’inexistence du mot \"Père\" parmi les 99 attri buts de Dieu."}, {"t": "p", "x": "Si Mohammed (ﷺ)avait été l’auteur du Coran comme l’avaient prétendu ses ennemis, comment aurait-il pu éviter le mot \"Père\" pour le remplacer par Dieu, durant plus de 23 ans de sa vie de prophète ? ABB voulant dire \"père\" en arabe, est beaucoup plus facile que le mot RABB qui signifie Seigneur et bien aimant encore que l’attribut RABB abonde dans la demière et ultime Révélation de Dieu. L’oubli du mot ABB pour décrire Dieu est évident. \"L’humanité a dénigré 1e concept merveilleux du père aimant\" au paradis pour en faire le père n’aimant que \"le fils engendré\" et en cela, ressembler à un être humain car la reproduction est acte animal, l’acte le plus vil au plan des fonctions sexuelles."}]}, {"title": "Unique dans le Coran et conclusion", "blocks": [{"t": "p", "x": "\"Dis: ‹Devais-je prendre pour allié autre qu’Allah, le Créateur des cieux et de la terre? C’est Lui qui nourrit et personne ne Le nourrit.\" Saint Coran 6:14 Toute créature qui a besoin de nourriture terrestre ne peut être \"ATNATU\" si vous pouviez faire admettre aux adorations des \"Hommes-Dieux\" cette pierre de touche. Vous pourriez les préférer de l’éminence des flammes de l’Enfer."}, {"t": "p", "x": "Prenez exemple sur l’aborigène australien (Jetez-lui un demier coup d’oeil) qui, malgré sa \"primitivité\" est campé devant les occidentaux et les orientaux hommes et femmes qui \"contrôlent\" le monde."}, {"t": "p", "x": "\"Gloire à Allah !\" Et paix et salutations soient sur son messager Mohammed (ﷺ)qui a transmis son message à l’humanité."}, {"t": "p", "x": "Puisse Dieu nous faire dignes d’être Ses disciples"}, {"t": "p", "x": "Amine !"}]}]}]}, {"id": "resur", "title": "Résurrection ou ressuscitation ?", "sub": "Ce que disent vraiment les récits des Évangiles", "chapters": [{"n": 0, "title": "Résurrection ou ressuscitation ?", "sections": [{"title": "Avant-propos", "blocks": [{"t": "p", "x": "Les traductions des citations coraniques ont été tirées de l’Essai d’interprétation du Coran inimitable. Traduction par Denise Masson, revue par Dr Sobhi al-Saleh, Gallimard, Bibliothèque de la Pléïade, 1967."}, {"t": "p", "x": "Les traductions des citations bibliques ont été tirées de \"La Sainte Bible\", traduite d’après les textes originaux hébreu et grec. Nouvelle version Segond Révisée. Société biblique Française, Paris, 1978."}, {"t": "p", "x": "La résurrection, était-ce une plaisanterie ? Par le biais du titre \"Résurrection vraiment ?\" Garner Ted Armstrong le Vice-Président et co-éditeur de \"The Plain Truth\" de Juillet 1977, pose la question."}, {"t": "p", "x": "La résurrection de Jésus-Christ de Nazareth est soit l’acte suprême de toute l’histoire, soit une invention flagrante et délibérée imposée aux adeptes du christianisme. Le personnage principal de la croyance chrétienne est-il réellement revenu des morts ?"}]}, {"title": "Résurrection, vraiment ?", "blocks": [{"t": "p", "x": "Au cours de la leçon n° 2 : \"Qui bougea la pierre ?\" J’avais promis d’aborder le problème qui se pose aux croyants qui lisent l’anglais et qui sont, malgré tout, tellement conditionnés qu’ils comprennent exactement le contraire de ce qu’ils lisent L’histoire qui suit, tirée de la réalité, n’illustre pas seulement ce problème mais élucidera la question suivante : \"Résurrection, vraiment ?\" Avant de partir pour le Transvaal, pour un voyage de conférences, je téléphonai à mon ami Hafiz Yusuf Dadoo de Standerton. Je lui faisais part de ma prochaine visite et lui demandai s’il souhaitait quelque chose de Durban. Il me fit savoir qü ayant repris des études d’hébreu, il souhaitait que je lui trouve une Bible bilingue hébreu/anglais."}, {"t": "p", "x": "Je me rendis à la \"Bible House\" à Durban où je trouvai aisément la Bible qui convenait à mon ami : 1\"`Authorised Version\" (la Version Autorisée), également connue sous le nom de \"King James Version\". Alors que je cherchais la meilleure édition et la moins chère, je remarquai que la jeune femme, derrière le comptoir, venait de décrocher le téléphone et s’apprêtait à engager la conversation avec quelqu’un."}, {"t": "p", "x": "D’où j’étais je ne pouvais entendre la conversation qui, d’ailleurs ne m’intéressait pas. Après quelques mots échangés avec son interlocuteur, la jeune femme s’adressa à moi : \"Excusez-moi, Monsieur, êtes-vous M. Deedat ?\" Je répondis aff’irmativement."}, {"t": "p", "x": "Elle ajouta alors : \"Le responsable de la \"Bible Society\" (Association biblique) souhaiterait s’entretenir avec vous.\" Ce à quoi je répondis : \"Avec plaisir\". Elle dit encore quelques mots puis raccrocha le téléphone. Souriant, je lui dis : \"Je pensais que vous appeliez la police.\" (sans doute à cause de toutes les Bibles que je manipulais). Elle éclata de rire et me fit savoir que \"le Révérend Roberts, le responsable, souhaitait me parler\"."}]}, {"title": "Gagner une conversion", "blocks": [{"t": "p", "x": "Ce fut le Révérend Roberts qui me contacta et aprés s’être présenté, il me fit signe de lui donner la Bible que je tenais. J’obtempérai. Il l’ouvrit et commença à lire : \"Or, la vie éternelle, c’est qu’ils te connaissent, toi, le seul vrai Dieu, et celui que tu as envoyé, Jésus-Christ\" (Jean 17:3). (Par la suite, je vérifiai les références de ses citations évangéliques)."}, {"t": "p", "x": "Je l’écoutai lire ces Ecritures saintes, puis lui répondis : \"J’accepte !\" (J’acceptais en effet le message qu’il tentait de me communiquer). Mais je ne lui fis pas savoir que ce message qü il essayait de me transmettre était identique à celui du Saint Coran délivrant à l’humanité depuis quatorze cents années, c’est-à-dire que chacun doit croire en \"Un Dieu unique et tout puissant et Jésus-Christ n’est que le messager de Dieu\". Les paroles du Saint Coran sont les suivantes : \"Oui, le Messie, Jésus, fits de Marie, est le Prophèt~ de Dieu, Sa Parole qu’i1 a jetée en Marie un esprit émanant de lui Croyez donc en Dieu et en ses prophètes...\" (Saint Coran 4:171)"}]}, {"title": "Aimez-vous les uns les autres", "blocks": [{"t": "p", "x": "Le Révérend Roberts a dû se sentir exalté lorsqu il m’entendit accepter sa première citation. Il ouvrit rapidement la Bible à une autre page et lut ces paroles attribuées à Jésus (P) * : \"Je vous donne un commandement nouveau : Aimez-vous les uns les autres; comme je vous ai aimés, vous aussi, aimez-vous les uns les autres. A ceci tous connaîtront que vous êtes mes disciples, si vous avez de l’amour les uns pour les autres.\" (Jean 13:34-35) Lorsqu’il eut fini de lire ses versets, je dis : \"Très bien !\" Il prit ma remarque pour un encouragement."}, {"t": "p", "x": "J’étais sincère, je ne simulais pas. Le Révérend trouva encore une autre citation qui devait confirmer la conversion. Il commença : \"Ne jugez pas, afin de ne pas être jugés. C’est du jugement dont vous jugez qu’on vous jugera, de la mesure dont vous mesurez qu’on vous mesurera.\" (Matthieu 7:1-2) (*) Abréviation de la formule de révérence : \"Que la Paix soit sur luî’. A cette citation, je répondais encore : \"Je suis d’accord !\" Ne croyez pas que je sois d’accord avec tout ce que lit le Révérend, dans le seul dessein d’obtenir quelque remise sur mes achats auprès de la Bible Society."}, {"t": "p", "x": "Ces citations, jusqu’à présent, étaient porteuses du même message et des mêmes idées qu’Allah, subha na lahu wa ta’aala, ordonnait aux musulmans de prêcher et de pratiquer. Ce ne serait pas honnête que de trouver des exceptions à tout ce qui était commun aux deux : musulmans et chrétiens. En effet, ce serait être hypocrite que d’admettre qu’un message tiré de mon livre (le Saint Coran) était très bon et que le même message extrait de son livre (la Sainte Bible) serait très mauvais. Ce serait un message impardonnable."}]}, {"title": "L’objectif", "blocks": [{"t": "p", "x": "Quel était donc le but poursuivi par le Révérend alors qu’il me lisait les Ecritures ? En réalité, je bénéficiais bien d’une remise spéciale sur tous mes achats effectués auprès de la Bible Society. D’ailleurs, j’étais sans doute le seul non chrétien à profiter de cet avantage, mais ce n’était que le résultat d’une transaction d’affaires. En tant que chef de la Bible Society, le Révérend devait être informé de ce privilège. J’étais musulman et mon physique ne pouvait prêter à confusion; je portais, en effet, barbe et chapeau, signes extérieurs de ma Foi, et reconnaissables aisément en tant que tel en cette partie du monde, et ceci malgré tous les achats de la Bible en anglais, zoulou, afrikaan, urdou, arabe, etc..."}, {"t": "p", "x": "Je n’étais toujours pas \"converti\". Peut-être suffisait-il d’un petit coup de pouce, et le responsable devait le savoir, ce qui explique sa lecture des citations précédentes. Comment se faisait-il que je n’avais pas encore embrassé la religion chrétienne ? Sans doute, pensait-il que je n’avais pas encore lu ces beaux passages de la Bible."}]}, {"title": "Un problème", "blocks": [{"t": "p", "x": "Le Révérend jouait le role du professeur qui désirait enseigner, communiquer un"}, {"t": "p", "x": "nouveau savoir à son élève."}, {"t": "p", "x": "Depuis que mon prophète m’avait ordonné, \"du berceau jusqu’à la tombe, à rechercher 1a connaissance\" et \"à rechercher la connaissance même s’i1 fallait aller jusqu’en Chine \", j’avais acquis le désir d’apprendre: Je dis alors : \"Je suis d’accord avec tout ce que vous m’avez lu, mais j’ai un problème avec votre Bible\". \"Quel problème ?\" demanda-t-il. Ce à quoi je rétorquai : \"S’il vous plaît, ouvrez l’Evangile de Saint Luc, au chapitre 3, verset 23\". Il fit ce que je demandai. Je lui demandai alors de lire. Il lut : \"Jésus avait environ trente ans lorsqu’il commença (son ministère)."}, {"t": "p", "x": "Il était (comme on le pensait) fils de Joseph, fils d’Eli.\" (Luc 3:23) J’attirai l’attention du Révérend sur les mots \"comme on Ie pensait\". Je lui demandai alors : \"Voyez-vous ces mots \"comme on le pensait\" qui sont entre parenthèses ?\" Il répondit affirmativement. Je lui demandai pourquoi des parenthèses à cet endroit ? Il me répondit : \"Je l’ignore, mais je peux en avoir l’explication par les théologiens.\" J’admirai son humilité. Bien qne tous les responsables des Bible Houses en Afrique du Sud soient des révérends à la retraite, il était possible que cet aspect précis des connaissances de la Bible ne soit pas de leur domaine."}, {"t": "p", "x": "Alors je lui répondis : \"Si vous ne savez pas, alors permettez moi de vous dire ce que font ces parenthèses dans ce verset. Il est inutile de faire appel à un théologue.\""}, {"t": "p", "x": "Ainsi, j’expliquai que dans les \"plus anciens manuscrits de Luc, les mots \"comme on le pensait\" ne figuraient pas. Vos traducteurs sentirent alors que sans cette adjonction, les \"petits agneaux\" encore mal façonnés à la foi, pourraient faire un faux pas et tomber dans l’erreur, celle de croire que Joseph le Charpentier était le vrai père biologique de Jésus. Ainsi, ils ajoutèrent, par prudence, leurs commentaires qu’ils placèrent entre parenthèses, afin d’éviter tout malentendu. J’ajoutai alors : \"Je n’essaie pas de trouver l’erreur dans votre système d’adjonction de mots entre parenthèses, pour venir en aide au lecteur. Mais ce qui m’étonne c’est que dans toutes les traductions de la Bible, en langues africaines ou occidentales, les mots \"comme on le pensait\" sont maintenus mais sans parenthèses."}, {"t": "p", "x": "Se peut-il que, mis à part les Anglais, les autres nations de la terre ne puissent saisir le sens et le but de ces parenthèses ?"}, {"t": "p", "x": "Que se passe-t-il avec les Afrikaners ? Pourquoi avez-vous fait disparaître les parenthèses de la Bible Afrikaan ? Le responsable rétorqua vivement : \"Je ne l’ai pas fait\". Je lui répondis : \"Je le sais bien que vous ne l’avez pas personnellement fait. Mais pourquoi la Bible Society, que vous représentez, et vos théologiens jouent-ils avec la \"Parole de Dieu\" ? Si Dieu Tout Puissant n’a pas jugé utile de protéger Luc de l’erreur, quel droit avez-vous d’ajouter ou de faire disparaître des mots dans le \"Livre de Dieu\" ? Quel droit avez-vous de créer des Paroles de Dieu ?"}]}, {"title": "Des adjonctions", "blocks": [{"t": "p", "x": "Le fait que le traducteur place des mots entre parenthèses peut assez facilement être imputé à Saint Luc. En effet, si l’on ôte les parenthèses, et que l’on admet que Luc était inspiré par Dieu pour écrire ce qu’il écrivit, alors les adjonctions deviennent de ce fait Parole de Dieu. Ce qui n’est pas tout à fait le cas. (Cette question sera développée dans le futur livre : \"La Bible est-elle la Parole de Dieu ?\") Je concluai par ces mots : Vos théologiens d’aujourd’hui ont réussi où les alchimistes d’autrefois ont échoué, à savoir transformer un quelconque métal en or scintillant."}]}, {"title": "La langue anglaise", "blocks": [{"t": "p", "x": "Le Révérend tint alors des propos qui n’avaient aucun rapport avec la discussion et le sujet de notre échange verbal prit une autre direction. Il fit quelques remarques qui me firent rétorquer : \"Voyez-vous Monsieur, vous aulres Anglais,"}, {"t": "p", "x": "vous ne connaissez pas votre propre langue.\" (Je m’ excuse auprès de mes lecteurs de langue maternelle anglaise). Il rétorqua vivement : \"Vous insinuez que vous connaissez mieux ma langue que moi ?\" Je lui répondis alors : \"Voyezvous, Monsieur, vous lisez vos Saintes Ecritures dans votre langue maternelle, comme tout chrétien de l’un des mille groupes linguistiques. Et pourtant, chacun de ces groupes linguistiques chrétiens interprètent ce qu’il lit de façon diverse.\" \"Vous parlez de quoi ?’ me dit-il."}]}, {"title": "Un fantôme", "blocks": [{"t": "p", "x": "Je poursuivis : \"Vous souvenez-vous lorsque Jésus (P) revint à la salle du repas après avoir été crucifié, \"et leur dit (aux disciples) : Que la Paix soit avec vous\" (Luc 24:36) et que ses disciples prirent peur en le reconnaissant ?\" Il me dit se souvenir de cet incident. Alors je lui demandai : \"Pourquoi, devaient-ils avoir peur ? Quiconque reconnaît un ami perdu ou un être cher devrait se réjouir et l’étreindre, et embrasser ses mains et ses pieds. \"Pourquoi étaient-ils si terrifiés ?\" Le Révérend répondit : \"Ils (les disciples) pensaient voir un fantôme\"."}, {"t": "p", "x": "Je lui demandai si Jésus (P) ressemblait à un fantôme ? Il répondit par la négative. \"Alors pourquoi pensaient-ils qu’ils voyaient un fantôme, alors qu’il ne ressemblait pas à un fantôme ?\" Le Révérend fut embarrassé par ma question. Je lui proposai : \"S’il vous plaît, permettez-moi de vous expliquer.\""}]}, {"title": "Les disciples ne sont pas des témoins oculaires", "blocks": [{"t": "p", "x": "\"Voyez-vous, Monsieur, les disciples de Jésus (P) n’étaient pas des témoins visuels ou même oculaires des évènements qui se déroulèrent au cours des trois jours précédents. Souvenez-vous de ce que Saint Marc dit, alors que Jésus (P) connait le moment le plus critique de sa vie : \"Tous l’abandonnèrent et prirent la fuite:’ (Marc 14:50) Tout ce que les disciples savaient sur leur maître ne leur étaït parvenu que par ouïe-dire. Ils avaient entendu dire que leur maître avait été accroché à la croix, qu’il avait rendu l’âme, qu’il était mort et enterré depuis trois jours."}, {"t": "p", "x": "Quiconque serait mis en présence d’une personne qui serait passée par toutes ces étapes, conclurait avoir en face d’elle un fantôme. Aussi, il n’est guère étonnant que ces dix hommes, braves, aient été terrifiés.\" \"Af’m de leur faire reprendre leurs esprits, Jésus (P) leur parla. Il leur dit : \"Voyez mes mains et mes pieds, c’est bien moi.\" Plus familièrement, il aurait dit : Qu’estce qui ne va pas, ne voyez vous pas que c’est moi, que je suis le même (celui qui a marché et parlé avec vous, qui a rompu le pain avec vous) fait de chair et de sang."}, {"t": "p", "x": "Pourquoi donc doutez-vous ? \"Touchez-moi et voyez; un esprit n’a ni chair ni os, comme vous voyez j’en ai.\" (Luc 24:39). En d’autres termes, il leur dit : \"Si je suis fait de chair et d’os, alors c’est ce que je ne suis pas un fantôme, pas un revenant, pas un esprit !\" Je m’adressai alors au Révérend : \"Est-ce exact ?\" Il répondit : \"Oui !\" Je poursuivis donc. Ainsi, Jésus (P) leur dit, comme le précise le verset, que ce que les disciples devraient \"toucher et voir\" n’était pas un corps traduit, ni métamorphosé, ni d’ailleurs ressuscité, car un corps ressuscité est un corps spiritualisé. Il leur expliqua donc le plus clairement possible qu’il n’est pas ce qu’ils pensent. Ils le croyaient \"esprit\", \"ressuscité\", revenu du royaume des mots. Il n’en était rien !"}]}, {"title": "Spiritualisation", "blocks": [{"t": "p", "x": "\"Mais comment pouvez-vous être aussi sûr que le corps ressuscité ne puisse se matérialiser comme Jésus (P) put le faire ?\" murmura le Révérend. Je lui répondis : \"Parce que Jésus (P), lui même, a dit que les corps ressuscités se spiritualisaient.\" \"Quand a-t-il dit cela ?\" s’enquit le Révérend, ce à quoi je rétorquai : \"Souvenez-vous de l’incident rapporté dans l’Evangile de Saint Luc au chapitre 20, lorsque les savants juifs - \"les principaux sacrificateurs et les scribes"}, {"t": "p", "x": "avec les anciens\" - vinrent à lui afin de le questionner. Parmi leurs questions, il y en avait une concernant une femme juive qui eut successivement sept maris, conformément à la coutume juive. Tous décédèrent ainsi que la femme.\" Le Révérend confirma se souvenir de cet incident. Je poursuivis : \"Le piège, que l’on voulait tendre à Jésus (P) alors, concernait la désignation du mari, parmi les sept, qui aurait la femme dans l’autre monde, après la résurrection. Car, en fait, les sept frères l’avaient possédée\". Le problème ne se posait pas tant lorsqu’il s’agissait d’assurer la descendance; ils l’avaient eu alors chacun à leur tour, se succédant auprès d’elle au fur et à mesure des décès des frères."}, {"t": "p", "x": "Mais, dès lors qu’à la résurrection, tous reviendraient à la vie, alors il y aurait une lutte au Paradis afin de l’obtenir, surtout si elle avait su leur procurer du plaisir. \"Jésus (P) balaya toutes leurs fausses notions de la résurrec tion en précisant qu’à la résurrection \"ils ne pourront pas non plus mourir\" (Luc 20:36). Ce qui signifie que les personnes ressuscitées seront immortalisées. Elles ne pourront plus mourir, ni connaître la faim ou la soif, ni la fatigue. En résumé, tout ce qui peut conduire à la mort deviendra inefficace contre les corps ressuscités."}, {"t": "p", "x": "Jésus (P) poursuit son explication : \"parce qu’ils (les corps ressuscités) seront semblables aux anges\" ce qui revient à dire qu’ils seront des anges, qu’ils seront spiritualisés et deviendront des esprits, \"et ils seront fils de Dieu, étant fils de la résurrection\" (Luc 20:36)"}]}, {"title": "Jésus n’est pas spiritualisé", "blocks": [{"t": "p", "x": "Le Révérend m’a mis au défi de répondre à sa question : \"Mais comment pouvezvous être sûr... ? et cela a interrompu mon exposé. Aussi, reprenons où nous nous étions alors arrêtés. Il n’est pas ce qu’ils pensaient qu’il était : il n’était ni esprit, ni fantôme ni revenant. Afin de les rassurer plus encore, après qu’ils aient vu et touché ses mains et ses pieds, et s’être assurés qu’il était bien matériel, qu’il avait un corps bien physique, et que leur peur était injustifiée, il dit à ses disciples : \"Avez-vous quelque chose à manger ? Ils lui présentèrent un morceau de poisson grillé. Il le prit et le mangea devant eux.\" (Luc 24:41~3)"}]}, {"title": "Une comédie", "blocks": [{"t": "p", "x": "Qu’est-ce que Jésus (P) voulait prouver en faisant toucher ses mains et ses pieds, en mangeant et mâchant le poisson grillé ?"}, {"t": "p", "x": "Etait-ce une simulation, une tromperie, une comédie ? \"Non\" dit Schleliermacher en 1819, une centaine d’années avant que je ne vois le jour. Albert Schweizer rappelle ses propos : \"Si Jésus s’est nourri uniquement afin de prouver qu’i1 pouvait se nourrir alors qu’il n’avait aucun besoin de se nourrir, c est là un simulacre.\" (A la recherche du Jésus historique\", p. 64) Alors que je m’entretenais avec le responsable de la Bible Society, je ne connaissais pas encore Schleliermacher, ni les autres théologiens chrétiens qui, il y a plus de cent ans, étaient sceptiques quant à la mort de Jésus (P), sur la croix telle qu’elle est rapportée par Albert Schweizer."}]}, {"title": "Pas de résurrection", "blocks": [{"t": "p", "x": "\"Qu est-ce qui ne va pas ?\" Jésus (P) vous dit, usant d’un langage sans ambiguité, qu’il n’est pas un Esprit, qu’il n’est pas spiritualisé, et pourtant tout le monde Chrétien croit qu’il est ressuscité, c’est-à-dire spiritualisé. Qui ment, vous ou lui ? Comment se fait-il que vous (chaque chrétien et tous les chrétiens) lisiez votre Sainte Bible dans votre langue maternelle et que, malgré tout, tous autant que vous êtes vous compreniez l’opposé de ce que vous lisiez ? Supposons que vous lisiez la Bible, en hébreu par exemple, et que vous reconnaissiez ne pas comprendre ce que vous lisez, alors cela serait compréhensible."}, {"t": "p", "x": "De même, si vous la lisiez en grec. Mais ce qui est incompréhensible, c’est que vous la lisez chacun dans votre langue maternelle et que pourtant vous comprenez le contraire de ce qui est écrit. Avez-vous subi un lavage de cerveau ? Ou, avez-vous été"}, {"t": "p", "x": "\"programmé\", comme le diraient les Américains ? \"S’il vous plaît, dites-moi qui ment ? Serait-ce Jésus (P) ou un millier de millions de chrétiens de part le monde ? Jésus (P) dit: \"Non !\" au fait qu’il soit ressuscité, et vous tous dites \"Oui !\" Nous, musulmans, qui devons-nous croire : Jésus (P) ou ses soi-disant disciples ? Nous, musulmans, croirions plutôt le Maître. N’a-t-il pas dit : \"Le disciple n’est pas plus que le maître:’ (Matthieu 10:24) C’était plus que le Révérend ne pouvait supporter d’entendre. Aussi, il s’excusa poliment : il devait aller fermer son bureau mais il espérait me revoir. Une formule de politesse comme une autre !"}, {"t": "p", "x": "Si je sortis vainqueur de cette discussion, je perdis, par contre, ma remise auprès de la Bible Society. Mais que cette perte soit ma récompense. Si vous, cher lecteur, pouviez seulement vous rafraîchir les idées quant au sujet de la crucifixion, alors je considèrerais avoir déjà gagné."}, {"t": "p", "x": "Ceux d’entre vous qui ont déjà appris les leçons 1 et 2 : \"Quel était le signe de Jonas ?\" et \"Qui bougea la pierre ?\" devraient garder en mémoire les versets de la leçon 3. Si vous ne possédez pas encore les brochures précitées, n’hésitez pas à écrire pour les demander. Nous vous ferons aussi parvenir un ouvrage plus détaillé intitulé \"Le Christ fut-il crucifié ?\" \"... Lui-même se présenta au milieu d’eux et dit : Que la Paix soit avec vous. Saisis de frayeur et de crainte, ils pensaient voir un esprit. \"... il leur dit :..."}, {"t": "p", "x": "\"Voyez mes mains et mes pieds, c’est bien moi. Touchez-moi et voyez, nn esprit n’a ni chair, ni os, comme vous voyez que j’en ai. \"Et... il leur montra Ses mains et Ses pieds. \"Comme dans leur joie, ils ne croyaient pas encore et qu’ils étaient dans l’étonnement, il leur dit : \"Avez-vous quelque chose à manger ? \"Ils lui présentèrent un morceau de poisson grillé\" * \"Il le prit et le mangea devant eux.\""}, {"t": "n", "x": "(*) La \"Revised Standard Version\" ne fait pas mention du \"miel\". Pourquoi ? Notre ouvrage \"La Bible est-ce la parole de Dieu ?\" en donne l’explication"}]}]}]}, {"id": "choix", "title": "Le Choix, vol. 2 (résumés)", "sub": "Résumés en français de « The Choice: Islam and Christianity », volume 2", "chapters": [{"n": 1, "title": "Partie 1 · Les Gens du Livre", "sections": [{"title": "À propos de ces résumés", "blocks": [{"t": "p", "x": "Ces pages résument en français la première partie de « The Choice: Islam and Christianity », volume 2, d’Ahmed Deedat (IPCI, Durban, 1993). Ce ne sont pas des traductions : chaque chapitre est présenté avec ses idées principales, ses anecdotes et les versets qu’il cite, pour retrouver facilement les arguments de l’auteur."}, {"t": "p", "x": "La première partie, « People of the Book » (les Gens du Livre), occupe les pages 1 à 33 du livre. Elle contient cinq chapitres : Nos premiers clients, Retourner la situation, La Bible : une anthologie de l’inceste, Le test de l’inspiration et Pornographie."}, {"t": "n", "x": "Les arguments présentés sont ceux d’Ahmed Deedat. Les références bibliques renvoient à la version King James utilisée dans le livre ; la numérotation peut varier légèrement selon les Bibles françaises."}]}, {"title": "Nos premiers clients", "blocks": [{"t": "h", "x": "Chapitre 1 · pages 1 à 6"}, {"t": "p", "x": "Le chapitre part du verset Coran 3:110 : « Vous êtes la meilleure communauté suscitée pour les hommes : vous ordonnez le bien, interdisez le mal et croyez en Allah. » Deedat remarque que les prédicateurs citent presque toujours cette première moitié et s’arrêtent au mot « Allah »."}, {"t": "p", "x": "Lors d’une conférence à Newcastle (Natal, Afrique du Sud), un auditeur lui demande pourquoi il ne laisse pas les juifs et les chrétiens tranquilles. Sur environ trois cents personnes, onze connaissent le début du verset. Trois sont hafiz ; Deedat demande aux huit autres de réciter la suite : aucun n’y parvient. Il avoue avoir longtemps été dans le même cas."}, {"t": "h", "x": "La seconde moitié du verset"}, {"t": "p", "x": "La réponse à « pourquoi s’en prendre aux juifs et aux chrétiens ? » se trouve dans la suite du verset : si les Gens du Livre croyaient, ce serait meilleur pour eux ; parmi eux il y a des croyants, mais la plupart sont des pervers. Deedat dit n’avoir jamais entendu d’exposé sur cette seconde moitié."}, {"t": "p", "x": "Le titre de « meilleure communauté » est, selon lui, une responsabilité : partager le message avec le reste de l’humanité. Les juifs et les chrétiens doivent être les premiers visés, car ils ont déjà reçu la Tawrât, le Zabour et l’Injîl. Ils sont les mieux préparés à reconnaître l’islam comme le renouvellement de la révélation qu’ils possèdent, et pourtant ils ont été les premiers à le rejeter."}, {"t": "h", "x": "Au bon chrétien"}, {"t": "p", "x": "Il faut adapter la méthode : douceur pour les sincères, fermeté pour les arrogants. Au chrétien de bonne foi, Deedat conseille de lire, phrase par phrase et si possible avec l’arabe, les versets Coran 3:42-49 : Marie choisie et purifiée au-dessus des femmes des mondes, l’annonce de la naissance de Jésus, le Messie, honoré ici-bas et dans l’au-delà, et ses miracles accomplis avec la permission d’Allah."}, {"t": "p", "x": "Il dit avoir vu bien des fois les larmes monter aux yeux des auditeurs, comme le décrit le Coran : quand ils entendent ce qui a été révélé au Messager, leurs yeux débordent de larmes parce qu’ils reconnaissent la vérité (Coran 5:83)."}, {"t": "p", "x": "Sa règle : considérer chaque chrétien comme sincère jusqu’à preuve du contraire, et le traiter avec bonté. Mais si l’interlocuteur se montre hostile envers le Prophète, le Coran et l’islam, on peut changer d’attitude, comme l’annonce la fin du verset."}, {"t": "n", "x": "Deedat recommande aux lecteurs musulmans d’apprendre Coran 3:110 en entier, avec son sens. Il cite le verset des larmes sous le numéro 5:86, selon la numérotation de la traduction qu’il utilise."}]}, {"title": "Retourner la situation", "blocks": [{"t": "h", "x": "Chapitre 2 · pages 7 à 11"}, {"t": "h", "x": "La nouvelle stratégie des missionnaires"}, {"t": "p", "x": "En 1992, après quinze ans de demandes, Deedat obtient enfin un visa pour le Soudan et y fait une tournée de conférences pour préparer les musulmans face aux missionnaires. À Khartoum, un étudiant lui décrit leur méthode : accueillis avec l’hospitalité arabe, ils posent trois questions. Croyez-vous au Jour du Jugement ? Au paradis et à l’enfer ? Et ce paradis, sera-t-il sur terre ou dans les cieux, que dit votre Coran ?"}, {"t": "p", "x": "Le piège est dans « que dit votre Coran ? ». Quelle que soit la réponse, le missionnaire demande : « Montrez-moi. » Deedat estime que 90 % des musulmans ont un avis mais ne peuvent citer aucun verset. Une fois cet aveu obtenu, la politesse oblige à écouter ce que dit la Bible ; le missionnaire repart en laissant une belle brochure intitulée « Comment trouver le chemin du paradis »."}, {"t": "p", "x": "Deedat reconnaît devant son public qu’il aurait lui aussi répondu « je ne sais pas » ; il précise qu’il n’a trouvé la réponse coranique que très récemment."}, {"t": "h", "x": "Retourner la table"}, {"t": "p", "x": "Sa méthode : admettre qu’on ne connaît pas son Coran aussi bien qu’on le devrait, puis demander au missionnaire s’il connaît, lui, sa Bible, et s’il peut la prêter un instant. On l’ouvre à Genèse 19:30 et on lui demande de lire à voix haute. Selon Deedat, le missionnaire, formé à ne lire que les passages choisis, cherche alors à changer de sujet. On lui demande : « N’est-ce pas le livre de Dieu ? Alors lisez. »"}, {"t": "p", "x": "Il présente aussi Genèse 35:22 et Genèse 38:15-18, puis pose la question : « Quelle est la morale de ces récits ? » Les fables que l’on raconte aux enfants, comme le renard et les raisins ou le chien qui lâche son os pour son reflet, ont toujours une leçon. Pour Deedat, des récits d’inceste sans leçon morale dans un « livre de Dieu » sont immoraux."}, {"t": "h", "x": "Le « Combat Kit »"}, {"t": "p", "x": "De retour en Afrique du Sud, Deedat rédige un manuel pour répondre aux missionnaires qui viennent chez les musulmans. L’IPCI l’imprime à cent mille exemplaires pour une distribution gratuite. Le lecteur doit se procurer une Bible, de préférence la King James, et coller le « Combat Kit » à l’intérieur de la couverture : l’index est en page 1 et le mode d’emploi en page 2. La partie 2 du livre lui est consacrée."}]}, {"title": "La Bible : une anthologie de l’inceste", "blocks": [{"t": "h", "x": "Chapitre 3 · pages 12 à 21"}, {"t": "p", "x": "Le chapitre reprend la rubrique « Inceste » du Combat Kit, définie d’après les dictionnaires Collins et Oxford comme une relation sexuelle (ou un mariage) entre proches parents."}, {"t": "h", "x": "La visite des deux colporteurs"}, {"t": "p", "x": "Un dimanche matin, deux colporteurs de la Bible viennent chez Deedat. Il leur dit qu’il prépare un essai sur l’inceste et leur demande ce qu’ils feraient s’il le donnait à lire à leur sœur ou à leur fille adolescente. Ils répondent qu’ils l’étrangleraient. Il leur demande alors ce qu’ils diraient si ce texte venait de la Bible ; ils protestent que c’est impossible. Il ouvre leur propre Bible à Genèse 19:30."}, {"t": "h", "x": "Un père et ses deux filles"}, {"t": "p", "x": "Genèse 19:30-36 raconte comment les deux filles de Lot enivrent leur père deux nuits de suite pour avoir des enfants de lui. Deedat compare deux éditions de la King James (« préserver la semence » ou « la lignée » de notre père) et note que les traductions modernes, comme la Good News Bible ou l’International Children’s Bible, emploient des mots beaucoup plus explicites."}, {"t": "p", "x": "De ces unions naissent Moab et Ben-Ammi, ancêtres des Moabites et des Ammonites. Deedat relève que Dieu ordonne ensuite à Moïse de ne pas inquiéter ces peuples ni de prendre leur terre, donnée aux descendants de Lot (Deutéronome 2:19), alors que la même Torah exclut les enfants illégitimes de l’assemblée du Seigneur (Deutéronome 23:2). Il demande quelle leçon tirer d’un récit où les fautifs ne sont ni blâmés ni punis."}, {"t": "h", "x": "Ce que l’on lit nous façonne"}, {"t": "p", "x": "Il cite les expériences du psychologue américain Vernon Jones : des histoires racontées à des écoliers produisent des changements de caractère légers mais durables. Il rapproche ce constat du livre de Jimmy Swaggart sur l’inceste, qui déplore l’ampleur du phénomène aux États-Unis. Sa formule : physiquement on est ce qu’on mange, moralement on est ce qu’on lit."}, {"t": "h", "x": "L’exercice à faire dans sa Bible"}, {"t": "p", "x": "Deedat demande au lecteur d’encadrer Genèse 19:30-36 dans sa propre Bible, d’écrire en gros titre « Inceste entre un père et ses filles », puis d’indiquer en bas de page le renvoi suivant, avec le numéro de page de sa Bible. On fait de même pour Genèse 35:22 (« Inceste entre un fils et sa mère ») et Genèse 38:15-18 (« Inceste entre un beau-père et sa belle-fille »). Ainsi préparé, on peut répondre à tout missionnaire qui frappe à la porte."}, {"t": "h", "x": "Un fils et la femme de son père"}, {"t": "p", "x": "Genèse 35:22 rapporte que Ruben, fils aîné de Jacob, coucha avec Bilha, concubine de son père, et que Jacob l’apprit. Deedat compare les formulations de la King James, de la Douay catholique (« dormit avec ») et de l’International Children’s Bible, qui parle sans détour de relations sexuelles. Pour lui, la femme de son père est une mère, quel que soit le mot employé."}, {"t": "p", "x": "Il ajoute que « femme » et « concubine » semblent interchangeables dans la Bible : Genèse 25:1 appelle Ketura « femme » d’Abraham, alors que 1 Chroniques 1:32 l’appelle « concubine ». Soit les deux mots veulent dire la même chose, soit c’est une contradiction de plus, à ajouter à la liste du Combat Kit."}]}, {"title": "Le test de l’inspiration", "blocks": [{"t": "h", "x": "Chapitre 4 · pages 22 à 30"}, {"t": "p", "x": "Les missionnaires aiment citer 2 Timothée 3:16-17 : toute Écriture est inspirée de Dieu et utile pour enseigner, convaincre, corriger et instruire dans la justice. Deedat rappelle que Paul est l’auteur le plus prolifique du Nouveau Testament (14 livres sur 27, selon lui), que Timothée, fils d’un père grec et d’une mère juive, fut circoncis par Paul (Actes 16:3), et que Paul lui conseillait de boire un peu de vin pour son estomac (1 Timothée 5:23)."}, {"t": "p", "x": "Les « Écritures » dont parle Paul ne sont pas les Évangiles, qui n’existaient pas encore, mais les livres juifs que Timothée connaissait depuis l’enfance, c’est-à-dire l’Ancien Testament (2 Timothée 3:15). Puisque les missionnaires utilisent ce verset pour valider toute la Bible, Deedat l’applique comme critère."}, {"t": "h", "x": "Les quatre rubriques"}, {"t": "p", "x": "Une écriture venue de Dieu doit servir à l’une de ces quatre choses : 1. la doctrine (l’enseignement) ; 2. la réprimande (montrer ce qui est mal) ; 3. la correction des fautes ; 4. l’instruction dans la justice (apprendre à bien vivre). Deedat dit n’avoir jamais trouvé de chrétien capable de proposer une cinquième rubrique."}, {"t": "h", "x": "Genèse 38 passé au crible"}, {"t": "p", "x": "Il conseille de lire tout le chapitre pour qu’on ne puisse pas l’accuser de sortir les versets de leur contexte. Juda, ancêtre dont viennent les mots « Judée », « judaïsme » et « juif », marie son fils aîné Er à Tamar ; Er est méchant et Dieu le fait mourir (Genèse 38:7). Rubrique : réprimande."}, {"t": "p", "x": "Juda demande à son deuxième fils, Onan, de donner une descendance à son frère défunt. Onan refuse que l’enfant porte le nom de son frère et Dieu le fait mourir aussi (Genèse 38:8-10). Rubrique : réprimande, encore."}, {"t": "p", "x": "Juda renvoie Tamar chez son père en promettant de la donner à son troisième fils, Chéla, une fois adulte, mais il ne tient pas parole. Tamar se poste alors sur la route de Timna, où Juda la prend pour une prostituée. Elle exige en gage son sceau, ses bracelets et son bâton. Enceinte, elle est accusée de prostitution et Juda ordonne qu’on la brûle ; elle lui fait remettre les gages, et Juda reconnaît : « Elle est plus juste que moi » (Genèse 38:11-26). Elle met au monde des jumeaux, Pérets et Zérah (Genèse 38:27-30)."}, {"t": "p", "x": "Ces jumeaux figurent dans la généalogie de Jésus (Matthieu 1:3), et le nom d’Onan est passé dans les dictionnaires avec le mot « onanisme ». Comme ce récit ne relève, selon Deedat, d’aucune des quatre rubriques, il en propose une cinquième : la pornographie."}, {"t": "n", "x": "Deedat signale aussi que des mots ajoutés par les traducteurs entre crochets, comme « car il ne savait pas que c’était sa belle-fille », ont perdu leurs crochets dans des éditions plus récentes, transformant une note de traducteur en texte présenté comme parole de Dieu."}, {"t": "h", "x": "Fils de Dieu ou fils du Saint-Esprit ?"}, {"t": "p", "x": "Matthieu et Luc donnent deux généalogies de Jésus qui, selon Deedat, totalisent soixante-six ancêtres sans autre nom commun que Joseph, lequel ne peut pas être le père de Jésus. Matthieu affirme deux fois en trois versets que Marie est enceinte « par le Saint-Esprit » (Matthieu 1:18-20). Deedat en conclut que, selon la logique de ce texte, c’est le Saint-Esprit et non Dieu le Père qui devrait être appelé le père de Jésus."}]}, {"title": "Pornographie", "blocks": [{"t": "h", "x": "Chapitre 5 · pages 31 à 33"}, {"t": "p", "x": "Ce court chapitre est une liste de références bibliques que Deedat présente comme des récits ou passages à caractère sexuel, avec un bref résumé de chacun :"}, {"t": "p", "x": "1. Les filles de Lot enivrent leur père pour concevoir de lui (Genèse 19:30-36). 2. Ruben couche avec la femme de son père ; ni Jacob ni Dieu ne le blâment (Genèse 35:22). 3. Juda et sa belle-fille Tamar, dont les jumeaux deviennent ancêtres de Jésus (Genèse 38:15-30). 4. Amnon, fils de David, viole sa sœur Tamar par ruse (2 Samuel 13:5-14). 5. Absalom, autre fils de David, prend dix des femmes de son père sous une tente dressée sur le toit, « aux yeux de tout Israël » (2 Samuel 16:21-23). 6. Jérusalem décrite comme une prostituée insatiable (Ézéchiel 16:23-34). 7. Les deux sœurs, Ohola et Oholiba, rivalisant de débauche (Ézéchiel 23:1-35)."}, {"t": "h", "x": "Autres passages signalés"}, {"t": "p", "x": "Deedat invite le lecteur à surligner en rouge, dans sa propre Bible, Proverbes 7:7-22 (la femme qui séduit un jeune homme en l’absence de son mari), plusieurs passages du Cantique des cantiques (Cantique 1:12-13, Cantique 3:1-4 et Cantique 4:1-7) et Juges 16:1 (Samson chez une prostituée de Gaza)."}, {"t": "p", "x": "Il cite un mot attribué à George Bernard Shaw, pour qui la Bible serait le livre le plus dangereux au monde, à garder sous clé loin des enfants, et une phrase de la revue chrétienne « The Plain Truth » selon laquelle bien des censeurs classeraient la Bible « X »."}, {"t": "p", "x": "Le chapitre se termine en recommandant au lecteur qui veut étudier la Bible à fond de maîtriser la partie 2 du volume, le « Combat Kit », présenté comme l’arme décisive face aux prédicateurs qui viennent frapper à la porte."}]}]}]}], "refs": [{"k": "c", "s": 68, "v": "4", "id": "mohammed:0:0", "q": "Coran 68:4"}, {"k": "b", "b": "Jean", "c": 14, "v": "15", "id": "mohammed:0:8", "q": "Jean 14:15"}, {"k": "b", "b": "Matthieu", "c": 5, "v": "19", "id": "mohammed:0:8", "q": "Matthieu 5:19"}, {"k": "c", "s": 94, "v": "4", "id": "mohammed:0:13", "q": "Coran 94:4"}, {"k": "b", "b": "Matthieu", "c": 4, "v": "1-11", "id": "mohammed:0:13", "q": "Matthieu 4:1-11"}, {"k": "b", "b": "Matthieu", "c": 3, "v": "16", "id": "mohammed:1:1", "q": "Matthieu 3:16"}, {"k": "b", "b": "Jean", "c": 20, "v": "25", "id": "mohammed:1:2", "q": "Jean 20:25"}, {"k": "c", "s": 68, "v": "4", "id": "mohammed:1:5", "q": "Coran 68:4"}, {"k": "c", "s": 80, "v": "1-4", "id": "mohammed:1:6", "q": "Coran 80:1-4"}, {"k": "c", "s": 2, "v": "256", "id": "mohammed:1:11", "q": "Coran 2:256"}, {"k": "c", "s": 48, "v": "28", "id": "mohammed:2:2", "q": "Coran 48:28"}, {"k": "c", "s": 94, "v": "4", "id": "mohammed:2:5", "q": "Coran 94:4"}, {"k": "c", "s": 21, "v": "107", "id": "mohammed:2:6", "q": "Coran 21:107"}, {"k": "b", "b": "Matthieu", "c": 7, "v": "6", "id": "mohammed:2:7", "q": "Matthieu 7:6"}, {"k": "b", "b": "Matthieu", "c": 5, " BOOKS.forEach(b => b.chapters.forEach((c, ci) => c.sections.forEach((s, si) => {
  const id = `${b.id}:${ci}:${si}`;
  const text = s.blocks.map(x => Array.isArray(x.x) ? x.x.join(" ") : x.x).join(" ");
  const o = { id, b, c, ci, si, s, idx: SECS.length, text, n: norm(text) };
  SECS.push(o); BYID[id] = o;
})));
function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[’'`]/g, " "); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const ACC = { a: "[aàâä]", e: "[eéèêë]", i: "[iîï]", o: "[oôö]", u: "[uùûü]", c: "[cç]" };
function rx(q) {
  const p = norm(q).trim().split("").map(ch => ACC[ch] || (ch === " " ? "[\\s’']+" : ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))).join("");
  return new RegExp(p, "gi");
}
function hl(html, q) { if (!q) return html; return html.replace(rx(q), m => `<mark>${m}</mark>`); }

/* ---------- navigation ---------- */
let stack = [{ v: "home" }];
function cur() { return stack[stack.length - 1]; }
function go(v, p = {}) { stack.push(Object.assign({ v }, p)); try { history.pushState({ d: stack.length }, ""); } catch (e) {} render(true); }
function replace(v, p = {}) { stack[stack.length - 1] = Object.assign({ v }, p); render(true); }
function back() { if (stack.length > 1) { try { history.back(); } catch (e) { stack.pop(); render(true); } } }
window.addEventListener("popstate", () => { if (stack.length > 1) { stack.pop(); render(true); } });

/* ---------- render ---------- */
const $bar = document.getElementById("bar"), $main = document.getElementById("main"), $ov = document.getElementById("overlay");
function setBar(title, sub) {
  const home = cur().v === "home";
  $bar.innerHTML = `
    ${home ? `<span class="ib" aria-hidden="true">${MEDAL}</span>` : `<button class="ib" id="bk" aria-label="Retour">${I.back}</button>`}
    <h1>${sub ? `<small>${esc(sub)}</small>` : ""}${esc(title)}</h1>
    <button class="ib" id="menu" aria-label="Réglages">${I.kebab}</button>`;
  const bk = document.getElementById("bk"); if (bk) bk.onclick = back;
  document.getElementById("menu").onclick = () => cur().v === "settings" ? null : go("settings");
}
function render(scrollTop) {
  const c = cur();
  const views = { library, sourates, qfiles, home, books, toc, chapters, reader, favs, search, topics, topic, notes, audio, refs, settings };
  document.body.classList.toggle("reading", c.v === "reader");
  (views[c.v] || home)(c);
  renderPlayer();
  if (scrollTop && c.v !== "reader") window.scrollTo(0, c.y || 0);
}

function secLabel(o) { return o.c.n ? `${SHORT[o.b.id]} · ch. ${o.c.n}` : SHORT[o.b.id]; }
function rowSec(o, extra = "", snip = "") {
  const fav = S.favs[o.id], rd = S.read[o.id];
  return `<button class="row" data-open="${o.id}">
    <span class="body"><span class="t">${esc(o.s.title)}</span><span class="m">${esc(secLabel(o))}${extra}</span>${snip ? `<span class="snip">${snip}</span>` : ""}</span>
    <span class="end">${fav ? `<span class="star-on">${I.star}</span>` : ""}${rd ? `<span class="dot" title="Lu"></span>` : ""}</span>
  </button>`;
}
function bindOpen(q) {
  $main.querySelectorAll("[data-open]").forEach(el => el.onclick = () => openSec(el.dataset.open, { q: el.dataset.q || q || "" }));
}
function openSec(id, p = {}) { cur().y = window.scrollY; go("reader", Object.assign({ id }, p)); }

function quoteOfDay() {
  const vs = [];
  SECS.forEach(o => o.s.blocks.forEach(bl => { if (bl.t === "v" && !/\([IVXL]+[ )]|\(\d|^[\s"]*$/.test(bl.x.join(" ")) && bl.x.join(" ").length > 40 && (bl.x.join(" ").match(/[a-zàâéèêîôûç]/g) || []).length > bl.x.join(" ").length * .5) vs.push({ o, x: bl.x.join(" ").replace(/^"\s*|\s*"$/g, "") }); }));
  if (!vs.length) return { o: SECS[0], x: SECS[0].s.title };
  const d = new Date(); const k = (d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate()) % vs.length;
  return vs[k];
}

function home() {
  setBar("Bibliothèque Deedat");
  const last = S.last && BYID[S.last.id];
  const qd = quoteOfDay();
  $main.innerHTML = `<div class="grid">${TILES.map(t => {
    let em = "";
    if (t.v === "favs") em = Object.keys(S.favs).length ? `${Object.keys(S.favs).length} enregistré(s)` : "";
    if (t.v === "notes") em = Object.keys(S.notes).length ? `${Object.keys(S.notes).length} note(s)` : "";
    if (t.v === "books") em = `${BOOKS.length} ouvrages`;
    if (t.v === "sourates") em = "Arabe · français";
    if (t.v === "library") { const n = CATALOG.filter(b => LIBHAS.has(b.id)).length + LIBEXTRA.length; em = n ? `${n} livre(s) sur l’appareil` : `${CATALOG.length} titres`; }
    return `<button class="tile" data-v="${t.v}">${t.svg}<span>${t.label}</span>${em ? `<em>${em}</em>` : ""}</button>`;
  }).join("")}</div>
  <button class="foot" id="foot">
    <span class="sq"></span>
    <span class="txt">${last ? `<b>Reprendre la lecture</b><span>${esc(last.s.title)} — ${esc(SHORT[last.b.id])}</span>` : `<b>Citation du jour</b><span>${esc(qd.x)}</span>`}</span>
    ${I.clock}
  </button>`;
  $main.querySelectorAll(".tile").forEach(el => el.onclick = () => {
    if (el.dataset.v === "continue") return continueReading();
    go(el.dataset.v);
  });
  document.getElementById("foot").onclick = () => last ? continueReading() : openSec(qd.o.id);
}
function continueReading() {
  if (S.last && BYID[S.last.id]) openSec(S.last.id, { restore: S.last.r });
  else openSec(SECS[0].id);
}

function books() {
  setBar("Livres", "Ahmed Deedat");
  $main.innerHTML = `<div class="books">${BOOKS.map(b => {
    const all = SECS.filter(o => o.b === b), rd = all.filter(o => S.read[o.id]).length;
    const [col, letter] = COVERS[b.id];
    return `<button class="book" data-b="${b.id}">
      <span class="cover" style="background:${col}">${letter}</span>

      <small>${b.chapters.length} chapitre${b.chapters.length > 1 ? "s" : ""} · ${all.length} sections · ${rd} lue(s)</small>
      <span class="prog"><i style="width:${Math.round(rd / all.length * 100)}%"></i></span></span>
    </button>`;
  }).join("")}</div>`;
  $main.querySelectorAll(".book").forEach(el => el.onclick = () => { cur().y = scrollY; go("toc", { b: el.dataset.b }); });
}

function toc(c) {
  const b = BOOKS.find(x => x.id === c.b);

      <span class="end">${S.favs[o.id] ? `<span class="star-on">${I.star}</span>` : ""}${S.read[o.id] ? '<span class="dot" title="Lu"></span>' : ""}</span></button>`;
