dessus »(Jean 12:14 ) Dieu Tout-Puissant pourrait-il être l’auteur de cette situation déplacée ?"}, {"t": "p", "x": "Dieu s’écarte ainsi de Son Chemin afin de bien s’assurer que les auteurs des Evangiles n’oublient pas de signaler, en bas de page, la promenade à dos d’âne de Son \"fils\" alors qu’il entre dans la Ville Sainte. Dieu, aussi, leur \"souffle\" de censurer toute information se rapportant à l’ascension de Son \"fils\" vers le ciel sur les ailes des anges ?"}]}, {"title": "Ça suffit", "blocks": [{"t": "p", "x": "Les évangélistes acharnés et les défenseurs de la Bible furent trop lents à saisir la plaisanterie. Avant qu’ils n’aient compris que"}, {"t": "p", "x": "In the above drawing is shown the gradual development of the English Bible as well as the foundations upon winch each successive version rests. We are living in an age of"}, {"t": "p", "x": "printing. It is hard for us to realize that when the books of the Bible were originally written, there was no printing press to multiply the copies.Each copy must be made slowly and laboriously by hand. Under these conditions it was inevitable that many ancient books should be lost. This largely accounts for the fact that all the original manuscripts of the bible have perished."}, {"t": "p", "x": "The question arises, what have we then as the li foundation of our Bible ? (1).We have the most ancient copies made from the original manuscripts. We mention only three principal ones. (a) The Codez Sinaiticus, originally a codex of the Greek Bible belonging ’ to the fourth century. Purchased from the Soviet Republic of Russia in 1933 by Great Britain and is now in the British Museum. (b) The Codex Alexandrinus, probably written in the fifth century, now in the British Museum. It contains the whole Greek Bible with the exception of forty lost leaves. (c) The Codex Vaticanus, in the Vatican library at Rome, originally contained the whole Bible but parts are lost."}, {"t": "p", "x": "Written probably about the fourth century. la clé de voûte de leur prêche - l’Ascension de Jésus (P) - avait été sabotée par l’érudition biblique chrétienne, les éditeurs de la RSV avaient déjà empoché un profit net de 15 000 000 dollars ! (15 millions). Les propagandistes se rebellèrent et, appuyés par deux comités confessionnels parmi les cinquante, obligèrent les éditeurs à réintégrer les citations. Dans chaque nouvelle publication de la RSV, postérieure à 1952, les passages manquants furent ainsi \"restitués dans le texte\"."}, {"t": "p", "x": "Les juifs et les chrétiens ont rédigé leur \"Livre de Dieu\" dès qu’il leur fut inspiré. La différence entre eux et les anciens rédacteurs réside dans le fait que ces derniers n’avaient aucune connaissance de l’art d’écrire des \"préfaces\" et des \"notes de bas de page\", sinon ils nous auraient aussi parlé de leur fabrication et de leurs excuses séduisantes pour avoir ainsi changé une fausse monnaie en or scintillant. \"De nombreuses propositions de modification ont été faites au comité par des individus et par deux comités confessionnels."}, {"t": "p", "x": "Le comité examina avec attention toutes les propositions.\" \"Deux passages, le plus long se terminant par Marc (16:9-20)... Et Luc 24:51 sont restitués dans 1e texte.\" (Préface Collin’s pages vi et vii). \"Pourquoi \"restitués\" ? Parce qu’ils en avaient été antérieurement expurgés ! Pourquoi les références à l’Ascension ont-elles été expurgées ? Les plus anciens manuscrits ne font pas du tout référence à l’Ascension. La même chose se produisit pour la Trinité - 1 Jean 5:7 (voir précédemment \"Mathématiques chrétiennes\", exemple 3)."}, {"t": "p", "x": "Pourquoi supprimer un texte et restituer l’autre. N’en soyez pas étonné! Avant que vous n’ayez trouvé une RSV, le \"Comité\" aura sans doute décidé d’éliminer l’intégralité de l’inestimable préface. Les témoins de Jéhovah ont déjà annulé 27 pages révélatrices de leur avant-propos dans leur \"New World Translation of the Christian grec scriptures (la Traduction du Nouveau Monde des Écritures grecques chrétiennes). (C’est leur façon de nommer le Nouveau Testament )"}, {"t": "p", "x": "Le Révérend C.I Scofield, Docteur en Divinité, ainsi qu’un groupe de huit éditeursexperts, tous Docteurs en Divinité, pensèrent qu’il convenait d’orthographier le mot hébreu \"Ela1\" (signifiant Dieu) aussi \"Alah\". Les chrétiens ne réagirent pas. Ils semblaient avoir accepté que le nom de Dieu soit \"Allah\", mais s’obstinaient toujours à l’orthographier avec un \"L\" (voir page suivante). Au cours de conférences publiques, l’auteur de ce livre rapporta des citations à ce sujet. La \"Scofield Reference Bible\" a retenu mot à mot tout le commentaire de la Genèse 1:1, mais a effacé> grâce à un adroit tour de passe-passe, le mot \"Alah\". On ne perçoit même pas l’absence du mot \"Alah\" dans la Bible des orthodoxes ! Il est difficile de s’y retrouver parfois."}]}]}, {"n": 5, "title": "Confessions accablantes", "sections": [{"title": "Confessions accablantes", "blocks": [{"t": "p", "x": "Mme Elen G. White, \"prophétesse\" de l’Eglise des Adventistes du Septième Jour, dans son Commentaire de la Bible, volume 1, page 14, dit au sujet de la faillibilité de la \"Sainte Bible\". \"’La Bible que nous lisons aujourd’hui est l oeuvre de plusieurs scribes qui ont accompli, le plus souvent, leur travail avec une précision merveilleuse. Mais les scribes ne sont pas infaillibles, et apparemment Dieu n’a pas jugé opportun de les mettre à l’abri de l’érreur alors qu’ils écrivaient:\" Dans les pages suivantes de son commentaire, Mme White affirme : \"Je vis que Dieu protégeait particulièrement la Bible\" (de quoi ?) \"Lorsqu’il y en eut plusieurs exemplaires, des érudits ont, par endroits, changé les mots, pensant ainsi rendre le texte clair,, alors qu’au contraire ils mystifiaient ce qui était clair, en le basant sur des poings de vue soumis aux traditions.\""}]}, {"title": "Maladie en voie de développement", "blocks": [{"t": "p", "x": "La maladie mentale est une maladie de \"la civilisation\". Cet auteur et ses successeurs peuvent toujours crier haut et fort que \"La Bible est véritablement la parole infaillible de Dieu. Elle est bel et bien falsifiée, mais pure. Elle est humaine, bien que divine.\" Les mots ont-ils vraiment un sens alors ? Oui, dans leurs tribunaux mais pas dans leur théologie, car ils sont empreints de \"licence poétique\" dans leurs prêches"}, {"t": "v", "x": ["\"Leur coeur est malade", "Dieu aggrave cette maladie", "Un châtiment douloureux sera le prix", "de leur mensonge.\"", "(Saint Coran 2:10)"]}]}, {"title": "Les témoins", "blocks": [{"t": "p", "x": "Les plus virulents de tous les défenseurs de la Bible, les témoins de Jéhovah, dans l’avant-propos, cité précédemment en page 5, ils avouent : \"En copiant à la main les originaux inspirés, la fragilité humaine s’extériorise, et alors aucun des milliers d’exemplaires existant, de ce jour dans la langue originale, n’est une copie parfaite. Le résultat est qu’il n’existe pas deux exemplaires identiques.\" A présent, vous comprenez pourquoi l’intégralité de l’avantpropos (27 pages) a été éliminée de leur Bible. Allah dit de telle sorte qu’ils se noyèrent dans leur propre érudition."}]}, {"title": "À la fortune du pot", "blocks": [{"t": "p", "x": "Parmi plus de 4.000 manuscrits différents, fierté des chrétiens, les pères de l’Église en ont retenu quatre seulement, correspondant à leurs idées. Ils les appelèrent Évangiles de Matthieu, Marc, Luc et Jean. Nous verrons chacun d’eux en temps opportun. Abordons, à présent, la conclusion de la recherche des témoins de Jéhovah telle qu’elle apparaît dans l’avant-propos \"allégé\" \"Dès lors, il est évident que le texte original des Écritures (1) grecques chrétiennes a été falsifié, comme celui des LXX.\" (2)"}, {"t": "p", "x": "1. Nouveau Testament. 2. \"LXX\" qui signifie soixante-dix dans le titre de substitution du Vieux Testament. Ne vous y laissez pas prendre. Ils ont l’habitude d’appeler un simple mot de quatre lettres : un \"tétragrammaton\"."}, {"t": "p", "x": "Et ce culte incorrigible pousse l’effronterie jusqu’à publier 9 000 000 (neuf millions) d’exemplaires de la première édition d’un livre de 192 pages intitulé \"La Bible est-elle réellement la Parole de Dieu ?\" Quelle mentalité que celle des témoins de Jéhovah, qui lancent qu’aucune falsification \"n’affectera de façon appréciable l’authenticité de la Bible\" (?). C’est d’une logique chrétienne!"}]}, {"title": "Une audience patiente", "blocks": [{"t": "p", "x": "Dr Graham Scroggie, dans son livre précité, plaide en faveur de la Bible, page 29 \"Et soyons parfaitement honnêtes lorsque nous continuons à étudier la question. (La Bible est-elle la Parole de Dieu ?). Souvenons-nous que nous devons aussi écouter ce que la Bible dit d’ellemême. Dans un tribunal, nous supposons qu’un témoin dit la vérité et nous devons alors accepter ce qu’il dit d moins que nous n ayons matière d le suspecter ou puissions prouver qu’il ment. Il faudrait sûrement donner d la Bible l’occasion d’être entendue, et alors elle pourrait être perçue d’une oreille plus patiente.\" Le procès est honnête et raisonnable. Nous ferons donc comme il demande et laisserons la Bible parler d’elle-même."}, {"t": "p", "x": "Dans \"les cinq premiers livres de la Bible - Genèse, Exode, Lévitique, Nombres et Deutéronome - il y a plus de 700 affirmations qui prouvent non seulement que Dieu n’est pas l’auteur de ces livres, mais que Moïse n’aurait pas non plus participé à leur rédaction. Ouvrez ces livres au hasard et vous verrez - \"Et le Seigneur lui dit: Pars...\" - \"Et Moïse dit au Seigneur: le peuple ne peut venir...\" - \"Et le Seigneur dit d Moise : Va au devant du peuple...\" - \"Et le Seigneur dit d Moïse: Parle...\" - \"Et le Seigneur dit d Moise : Descends,...\""}, {"t": "p", "x": "II est évident que ce ne sont ni les Paroles de Dieu, ni celles de Moïse, mais plutôt des \"ouï-dire\" écrits par une troisième personne."}]}, {"title": "Moïse rédige sa propre nécrologie", "blocks": [{"t": "p", "x": "Se peut-il que Moïse ait participé à la rédaction de sa propre nécrologie avant sa mort ? Est-ce que les juifs rédigeaient leurs propres nécrologies ? \"Moïse mourut... âgé... de 120 ans... !l ne s’est plus levé, en Israël, de prophète comme Moïse...\" (Deutéronome 34:5-10) Analysons à présent l’Ancien Testament, sous différents angles."}]}]}, {"n": 6, "title": "Le livre baptisé « le Nouveau Testament »", "sections": [{"title": "Le livre baptisé « le Nouveau Testament »", "blocks": [{"t": "p", "x": "Le livre baptisé \"le Nouveau Testament\""}]}, {"title": "Pourquoi « selon » ?", "blocks": [{"t": "p", "x": "Que dire du soi-disant Nouveau Testament ?* Pourquoi chaque évangile débute-t-il par: Selon... (voir page suivante). Pourquoi \"selon\" ? Car pas une seule des 4.0(0 copies existantes ne pope la signature de son auteur ! D’où la supposition \"selon\" ! Même les preuves intrinsèques démontrent que Matthieu n’était pas l’auteur du premier évangile qui porte son nom. \"En passant plus loin (Jésus (P)) vit un homme appelé Matthieu assis au bureau des péages. Il lui dit : suis-moi (Matthieu), se leva et le suivit.\" (Matthieu 9:9) Sans faire aucun effort d’imagination, il apparais que les \"il\" et \"le\" de la citation cidessus ne se réfèrent pas à Jésus ou Matthieu en tant qu’auteur, mais à une troisième personne qui rédige ce qu’elle a vu et entendu."}, {"t": "p", "x": "Si nous ne sommes pas à même d’attributs ce \"Livre des Rêves\" (le premier Evangile est aussi ainsi appelé) au disciple de Matthieu, alors comment pouvonsnous l’accepter en tant que Parole de Dieu ? Nous ne sommes pas"}, {"t": "p", "x": "(*) Ix \"Soi-disant\" car nulle pan le \"Nouveau Testament\" ne se nomme luimême le Nouveau Testament, et nulle part l’Ancien Testament ne se nomme lui-même l’Ancien ’l’estiment, tout comme le mot \"Bible\" est inconnu dans les pages de la Bible. Dieu a oublié de donner un titre à \"ses\" livres ! Évangile selon Saint Matthieu 9. En passant plus loin, Jésus vit un homme appelé Matthieu assis au bureau des péages. Il lui dit : Suis-moi. Matthieu se leva et le suivit. \"il et \"1e\" ce n’est pas Matthieu!"}, {"t": "v", "x": ["Les", "Evangiles", "traduit", "en anglais moderne", "par"]}, {"t": "h", "x": "J.B. PHILLIPS"}, {"t": "p", "x": "L’Evangile de Matthieu La tradition ancienne attribue cet Evangile l’apôtre Matthieu, mais les savants aujourd’hui rejettent cette idée."}, {"t": "p", "x": "L’auteur, 1a as similé \" \" qui pourrait n’être~en fait~ que la suc cession clairement leoessron des traditions orales. Occasions des évènements et à lusreurs,MaLG tout en modifiant l’ordre, p ihistoire. Le style est lumi-neux, écrue en fait, la même h a modifié le texte, pour \" ’ \" écrit avec un certain discernement,osé et soi né. Matthieuveux, p g ’ \" ’ \" et qu’il était convaincu noncomme s’il avait qa vérité mars du motif divin i se cache derrière les faitsseulement de s 4uhistoriques.Sr Matthieu a écot quelque chose, comme on le suppose à présent,’ en tant que document chrétien,!a valeur de cet Evan rle, qencre 85 et 90, 9norme."}, {"t": "p", "x": "C’est, en sorte, est énorme. C’est, quelque ’ e lHomme. I! fut écrit en aidant une cer-taine distance dans le temps, par rapport g la réflexion. II se veut être 1 conserver une certaine sobriété dans e p2rtm l’unique révélation de Dieu Luimême, par rapport à tous !es autres portraits réalisés par ceux qui approchaient de trop près la lumière aveuglante. london geoffrey bles seuls à découvrir que Matthieu n’écrivit pas l’Évangile selon Saint Matthieu, et que celuici fut écrit par une main anonyme. J.B. Phillips rejoint notre point de vue."}, {"t": "p", "x": "Il est le \"serviteur appointé\" de l’Église anglicane, un chanoine de la Cathédrale de Chichester, en Angleterre. Il n’a donc aucune raison de mentir ou de trahir l’opinion officielle de son Église ! Référez-vous à son introduction de l’Évangile de Saint Matthieu (dans les pages suivantes). Phillips dit ceci au sujet de l’auteur de cet Évangile \"La tradition ancienne attribue cet évangile à l’apôtre Matthieu, mais les savants aujourd’hui rejettent presque tous cette idée\". En d’autres termes, St Matthieu n’a pas écrit l’Évangile qui porte son nom."}, {"t": "p", "x": "Ceci est la conclusion émise par des savants chrétiens, parmi les plus éminents - non pas hindoûs, arabes ou juifs - qui pourraient être accusés de déviation. Permettons à notre ami anglican de poursuivre: \"L’auteur, que nous appellerons toujours, par commodité Matthieu.\" \"Par commodité\", car à chaque référence faite à Matthieu, nous devrions dire : \"Le premier livre du Nouveau Testament\", chapitre tant et tant, verset tant et tant, etc."}, {"t": "p", "x": "Selon J.B. Phillips il est préférable que nous donnions un nom au livre. Alors pourquoi pas \"Matthieu\" ? Je pense que ce nom en vaut un autre ! Phillips poursuit : \"\"L auteur a assimilé clairement le mystérieux \"Q\" qui pourrait n’être, en fait, que la succession des traditions orales.\" Quel est ce \"mystérieux Q\" ? \"Q\" est l’abréviation du mot allemand"}, {"t": "p", "x": "\"Quella\" Qui signifie \"source\" (fontaine). Un autre document - une source commune doit avoir existé et à laquelle Matthieu, Marc, Luc et Jean ont pu avoir accès. Ces trois auteurs, ont eu une vision commune du document qu’ils détenaient alors. Ils écrivirent avec \"la même vision\" et ainsi les trois premiers \"Évangiles\" furent appelés \"Les Évangiles Synoptiques\"."}]}, {"title": "Usage massif et déloyal de traduction", "blocks": [{"t": "p", "x": "Et que dire de cette \"inspiration\" commerciale ? Le chanoine anglican a mis le doigt dessus, et il est mieux placé que quipages 38 conque pour le faire. N’est-il pas serviteur de l’Église, un orthodoxe chrétien évangélique, bibliophile renommé, ayant un accès direct à tous les manuscrits grecs originaux. Alors laissons-lui le plaisir de lire : Il (Matthieu) a fait usage gratuitement de 1 E’vangile de Marc\", c’est-à-dire qu’il \"a tout copié sur Marc ! \". Et cependant les chrétiens appellent ce plagiat énorme la Parole de Dieu ?"}, {"t": "p", "x": "Cela ne nous conduit-il pas à vous poser la question suivante: \"Que dire d’un témoin oculaire et d’un témoin auditif du ministère de Jésus (P) - dont Matthieu était supposé être - qui, au lieu de rédiger ses premières impressions sur le ministère de \"Son Seigneur\", voleraient les écrits d’un adolescent (Marc) qui n’avait que dix ans lorsque Jésus (P) réprimanda son peuple ?\" Pourquoi un témoin oculaire ou auditif copierait-il un individu qui écrit à partir de ouï-dire? Le disciple Matthieu ne se prêterait pas à un jeu si stupide. Pourtant, un document anonyme fait peser le doute sur l’intégrité de Matthieu."}]}, {"title": "Plagiat ou kidnapping littéraire", "blocks": [{"t": "p", "x": "\"Plagiat\" signifie \"vol littéraire\". Quelqu’un qui copie ad verbatim (mot à mot) l’écrit d’un autre et le fait passer pour sien, est appelé \"plagiat\". C’est un trait de caractère commun aux quarante, et plus, auteurs anonymes des livres de la Bible. Les chrétiens s’enorgueillissent d’un soi-disant lien commun entre les écrivains des 66 fascicules protestants, et ceux des 73 fascicules catholiques appelés la \"Sainte Bible\". Il existe bien un lien commun, pour Matthieu et Luc : ils ont plagié à 85%, et mot pour mot, les écrits de Marc ! Dieu Tout-Puissant ne dictait pas les mêmes termes aux synoptiques (ceux qui voyaient avec les mêmes yeux). Les Chrétiens eux-mêmes le reconnaissent, parce qu’ils ne croient pas en l’inspiration verbale, contrairement aux musulmans pour le Saint Coran. (1)"}, {"t": "p", "x": "Demandez votre exemplaire du livre \"Le Coran - Le Miracle Utlime\" qui prouve mathématiquement, mot à mot, lettre à lettre, que le Coran est la révélation de Dieu Tout-Puissant. 85% du plagiat de Matthieu et Luc, ce n’est rien en comparaison des kidnappings littéraires des auteurs de l’Ancien Testament, où le taux atteint est de 100% dans le soidisant Livre de Dieu. Les intellectuels chrétiens, tel que l’évêque Kenneth Cragg, usent d’un euphémisme pour nommer cet état de fait. Ils parlent de \"reproduction\" (1) et en sont très fiers."}]}, {"title": "Des modèles pervertis", "blocks": [{"t": "p", "x": "Le Dr Scroggie (dont on a déjà parlé) cite dans son livre (2) de façon très enthousiaste, le Dr Parker et son unique éloge de la Bible \"La Bible, un livre si varié dans ses matières ! De pleines pages sont remplies de noms obscurs, et il en est plus dit sur la généalogie que sur le jour du jugement dernier. La nuit tombe déjà et l’on ignore encore qui a vaincu car les histoires n’ont pu être racontées en entier. Où existe-t-il quelque chose (dans la littérature religieuse mondiale) qui correspond à ceci ?\""}, {"t": "p", "x": "Beaucoup de bruit pour rien, en fait, et un blasphème répugnant envers Dieu ToutPuissant qui autorise un tel méli-mélo. Et cependant, les chrétiens sont fiers, malgré les imperfections belles qui existent dans leur livre."}]}, {"title": "Rien moins que 100 %", "blocks": [{"t": "p", "x": "Afin de procéder à la démonstration du degré de plagiat pratiqué par les écrivains \"inspirés\" de la Bible, à l’auditoire de mon symposium à l’Université de Cape Town (dirigé par le Professeur Cumpsty, chef du Département de Théologie, et moi-même) sur le sujet \"La Bible, est-elle la Parole de Dieu ?\", je proposerai donc d’ouvrir la Bible. Certains chrétiens aiment à avoir, sous le bras, leur Bible"}, {"t": "p", "x": "1. Voir page 5 la citation complète. 2. \"La Bible est-elle la Parole de Dieu ?\" Par MoodY Press. lorsqu’ils se rendent à des débats ou des discussions religieuses. Ils semblent terriblement démunis sans ce livre. Je leur demandai donc d’ouvrir la Bible au chapitre 37, au \"Livre d’Esaïe\". Lorsque les personnes furent prêtes, je leur demandai de comparer mon \"Esaïe 37\" pendant que je lisais afin de vérifier s’ils étaient identiques. Je commençai à lire très lentement : versets 1, 2, 4, 10, 15, etc... jusqu’à la fin du chapitre."}, {"t": "p", "x": "Après chaque verset, je demandai si ce que je lisais était identique aux versets de leur Bible, ce à quoi ils répondaient en choeur : \"Oui !\", \"Oui !\" A la fin du chapitre, la Bible toujours ouverte entre mes mains, et à la place même d’où je venais de lire, je demandai au Président de révéler à l’auditoire que ce que je venais de lire n’était pas du tout Isaïe 37 mais 2 Roi 19 ! Il y eut alors une terrible consternation parmi l’auditoire. Je venais de prouver qu’il y avait plagiat à 100% dans la \"Sainte Bible\" (voir page suivante)."}, {"t": "p", "x": "En d’autres termes, Isaïe 37 et 2 Rois 19 sont identiques mot pour mot Et malgré tout, ils ont été attribués à des siècles de distance à deux auteurs différents que les chrétiens disent inspirés par Dieu."}, {"t": "p", "x": "Qui copie qui ? Qui vole qui ? Les 32 bibliophiles de renom de la RSV disent que l’auteur du Livre des Rois est \"inconnu\". Vers la fin de ce livre il y a une reproduction de la RSV par Collins. Le Révérend David J. Fant, directeur en littérature, secrétaire général de la New-York Bible Society (Association de la Bible New-York) a préparé et édité ces notes sur la Bible. Bien évidemment, si les révérends hommes de la chrétienté croyaient un tant soit peu que la Bible est la Parole de Dieu, ils l’auraient dit, mais ils confessent honnêtement (honteusement): \"Auteur : inconnu!\" Et, cependant, ils rendent hommage à des Ecrits qui auraient pu être tout aussi bien le fait de Pierre, Paul ou Jacques, et ils espèrent que chacun de nous verra en ces écrits la Parole de Dieu."}]}, {"title": "Pas d’inspiration verbale", "blocks": [{"t": "p", "x": "(Pour avoir une liste complète de tous les livres de la Bible et"}]}, {"title": "Plagiat à 100 %", "blocks": [{"t": "v", "x": ["2 Rois 19:1", "Lorsque le roi Ézéchias eut entendu", "cela, il déchira ses vêtements, se", "couvrit d’un sac, et alla dans la", "maison de l’Éternel."]}, {"t": "v", "x": ["Esaïe 37:1", "Lorsque le roi Ézéchias eut entendu", "cela, il déchira ses vêtements, se", "couvrit d’un sac, et alla dans la", "maison de l’Éternel."]}, {"t": "p", "x": "2. Il envoya Éliakim, chef de la 2. Il envoya Éliakim, chef de la maison du roi, Schebna, le secrétaire, maison du roi, Schebna, le secrétaire, et les plus anciens des sacrificateurs, et les plus anciens des sacrificateurs, couverts de sacs, vers Ésaïe, le couverts de sacs, vers Ésaïe, le prophète, fils d’Amots. prophète, fils d’Amots. 3. Et ils lui dirent: Ainsi parle Ézéchias: Ce jour est un jour d’angoisse, de châtiment et d’opprobre; car les enfants sont près de sortir du sein maternel, et il n’y a point de force pour l’enfantement."}, {"t": "v", "x": ["3. Et ils lui dirent: Ainsi parle", "Ézéchias: Ce jour est un jour", "d’angoisse, de châtiment et", "d’opprobre; car les enfants sont près", "de sortir du sein maternel, et il n’y a", "point de force pour l’enfantement."]}, {"t": "p", "x": "5. Les serviteurs du roi Ézéchias allèrent donc auprès d’Ésaïe."}, {"t": "p", "x": "5.Les serviteurs du roi Ézéchias allèrent donc auprès d’Ésaïe."}, {"t": "p", "x": "10. Vous parlerez ainsi à Ézéchias, roi 10.Vous parlerez ainsi à Ézéchias, roi de Juda: Que ton Dieu, auquel tu te de Juda: Que ton Dieu, auquel tu te confies, ne t’abuse point en disant: confies, ne t’abuse point en disant:"}, {"t": "p", "x": "Jérusalem ne sera pas livrée entre les Jérusalem ne sera pas livrée entre les mains du roi d’Assyrie. mains du roi d’Assyrie. 11. Voici, tu as appris ce qu’ont fait les rois d’Assyrie à tous les pays, et comment ils les ont détruits; et toi, tu serais délivré!"}, {"t": "v", "x": ["11.Voici, tu as appris ce qu’ont fait", "les rois d’Assyrie à tous les pays, et", "comment ils les ont détruits; et toi, tu", "serais délivré!"]}, {"t": "p", "x": "12.Les dieux des nations que mes 12. Les dieux des nations que mes pères ont détruites les ont-ils pères ont détruites les ont-ils délivrées, Gozan, Charan, Retseph, et délivrées, Gozan, Charan, Retseph, et les fils d’Éden qui sont à Telassar? les fils d’Éden qui sont à Telassar? 14. Ézéchias prit la lettre de la main 14.Ézéchias prit la lettre de la main des messagers, et la lut. Puis il monta des messagers, et la lut. Puis il monta à la maison de l’Éternel, et la déploya à la maison de l’Éternel, et la déploya devant l’Éternel, devant l’Éternel,"}, {"t": "p", "x": "15. à qui il adressa cette prière: 15. à qui il adressa cette prière: Éternel, Dieu d’Israël, assis sur les chérubins! C’est toi qui es le seul 16. Éternel des armées, Dieu d’Israël, Dieu de tous les royaumes de la terre, assis sur les chérubins! C’est toi qui c’est toi qui as fait les cieux et la terre. es le seul Dieu de tous les royaumes de la terre, c’est toi qui as fait les cieux et la terre. 37. Alors Sanchérib, roi d’Assyrie, 2 Rois 19:36 Alors Sanchérib, roi d’Assyrie, leva leva son camp, partit et s’en retourna; son camp, partit et s’en retourna; et il et il resta à Ninive. resta à Ninive. 38."}, {"t": "p", "x": "Or, comme il était prosterné dans 37. Or, comme il était prosterné dans la maison de Nisroc, son dieu, Adrammélec et Scharetser, ses fils, le la maison de Nisroc, son dieu, Adrammélec et Scharetser, ses fils, le frappèrent par l’épée, et s’enfuirent au frappèrent avec l’épée, et s’enfuirent pays d’Ararat. Et Ésar-Haddon, son au pays d’Ararat. Et Ésar-Haddon, son fils, régna à sa place. fils, régna à sa place. 2 rois 19 louis second Esaïe 37 louis second"}, {"t": "p", "x": "Ces versets sont ares de la Version Autorisée mais vous pouvez trouver les mêmes textes dans toutes les versions. de leurs auteurs, il nous faut utiliser le \"Collins\" RS V et ses annotations). Qu’est-ce que les intellectuels chrétiens ont à dire sur le \"livre d’Esaïe\" ? Ils disent : \"En grande partie attribué à Esaïe. Quelques passages peuvent avoir été écrits par d’autres\". Au vu de ces confessions, nous ne prendrons pas à partie Esaïe. Pouvonsnous alors attribuer ce plagiat à Dieu ? Quel blasphème ? Le Professeur Cumptsy confirmait alors que la question était posée, à la fin du symposium sus-indiqué, que les \"chrétiens ne croient pas en une inspiration verbale de la Bible\"."}, {"t": "p", "x": "Donc, Dieu Tout-Puissant n’a pas perdu la mémoire et dicté deux fois la même histoire ! Des mains humaines ont fait des ravages dans cette soi-disant Parole de Dieu, la Bible. Malgré tout, les défenseurs de la Bible insistent: \"Chaque mot, chaque virgule, chaque point de la Bible est la Parole de Dieu!\""}]}]}, {"n": 7, "title": "Le moment de vérité", "sections": [{"title": "Le moment de vérité", "blocks": [{"t": "p", "x": "Comment savoir qu’un livre qui se réclame être l’oeuvre de Dieu est véritablement le Livre de Dieu ? Un examen parmi tant d’autres tend à prouver qu’un message émis par un Etre Omnis-cient doit être cohérent. Il se doit être exempt de toutes imperfections et contradictions. C’est exactement ce que le Dernier Testament, le Livre’de Dieu, dit"}, {"t": "v", "x": ["\"Ne méditent-ils pas sur le Coran ?", "Si celui-ci venait d’un autre Dieu,", "ils y trouveraient de nombreuses", "contradictions.\""]}, {"t": "p", "x": "(Saint Coran 4:82)"}]}, {"title": "Dieu ou diable ?", "blocks": [{"t": "p", "x": "Si Dieu Tout-Puissant veut que nous vérifions l’authenticité de Son Livre (le Saint Coran) grâce à cet examen corrosif, alors pourquoi ne pas faire subir cet examen à tout livre qui lui est attribué ? Nous ne voulons pas mystifier qui que ce soit, comme les chrétiens. Il est volontiers admis, à partir des références des savants chrétiens, que j’ai indiquées, que la Bible n’est pas la Parole de Dieu, bien que l’on essaie de nous faire croire le contraire.. Un autre exemple de ce malaise fut encore mis en évidence hier seulement."}, {"t": "p", "x": "Le synode anglican était réuni à Grahamstown. Le très révérend Bill Bumett, l’archevêque, prêchait à son troupeau et créa une certaine confusion. En effet, un Anglais inscrit s’adressa à un groupe de prêtres et évêques anglais cultivés, dans leur propre langue maternelle, l’anglais, et ces propos furent mal interprétés par ses collègues. A tel point que Mc Millan, peut-être anglican lui aussi, l’éditeur d’un quotidien anglais \"Le Nasal Mercury\", daté du 11 Décembre 1978, dit au sujet de la confusion qui s’ensuivit à l’encontre du propre clergé de l’Archevêque \"Les remarques de l’archevêque au synode ne furent pas un modèle de clarté et furent largement et énergiquement mal interprètées par un grand nombre des personnes présentes.\""}, {"t": "p", "x": "Il n’y a pas de problème avec l’anglais, en tant que langage, mais plutôt avec le style de pe s confuses que le chrétien développe pour toutes les matières religieuses. Le \"pain\" de la Sainte Communion n’est pas du \"pain\" mais de la \"chair\" ? Le \"vin\" est le \"sang\" ? \"la Trinité est une ?\" et \"l’humain est divin ?\" Mais ne faites pas d’erreur, il n’est pas aussi simple lorsqu’il traite avec la prolifique royauté, alors il est des plus précis. Il faut redoubler de prudence si vous traitez avec lui ! Il peut vous réduire à néant avant que vous ne l’ayez réalisé."}, {"t": "p", "x": "Les exemples que j’avancerai afin de justifier mes dires sont si simples que même un enfant pourrait les suivre et les comprendre (voir page suivante). Vous remarquerez que les auteurs des livres des \"Chroniques\" et de \"Samuel\" nous racontent la même histoire au sujet de David recensant les juifs. D’où vient donc l’inspiration de David pour cette nouvelle tâche ? L’auteur de 2 Samuel 24:1 dit que \"le Seigneur\" Dieu qui excita (RSV \"incita\") David à accomplir une"}, {"t": "p", "x": "chose si infâme ! Comment Dieut Tout-Puissant pourrait-il être la source de ces \"inspirations\" contradictoires ? Est-ce Dieu ou Satan ? Dans quelle religion le diable est-il le synonyme de Dieu? Je ne parle pas du \"satanisme\", une récente excroissance du christianisme, dans laquelle des ex-chrétiens adorent le diable. Le christianisme fut très prodigue d’ismes (courants) : athéisme, communisme, fascisme, totalitarisme, nazisme, mormonisme, maonisme, scientifisme_ chrétien, et à présent le satanisme. A quoi d’autre le christianisme donnera-t-il naissance ?"}, {"t": "p", "x": "La Sainte Bible se prête aussi à toutes ces interprétations contradictoires. C’est l’orgueil chrétien ! \"Certains soutiennent si fermement, que des passages bibliques ont été sans cesse malmenés et détournés afin de justifier chaque plaie connue de l’homme\". (tirée de \"La Pleine Vérité\", un journal chrétien américain, sous le titre : \"La Bible, le livre le plus controversé du monde\", Juillet 1975)."}]}, {"title": "Qui sont les vrais auteurs ?", "blocks": [{"t": "p", "x": "D’autres preuves tirées de \"Samuel\" et \"Chroniques\" seront apportées, mais j’estime judicieux en premier lieu de déterminer leurs auteurs et non d’accepter que Dieu soit à l’origine des absurdités de ces livres. Les Réviseurs de la RSV disent a. Samuel : auteur \"Inconnu\" (juste un seul mot). b. Chroniques : auteur \"Inconnu\", vraisemblablement rassemblées et éditées par Ezra. Nous devons admirer l’humilité de ces bibliophiles, mais leurs \"peut-être\", \"probablement\" et \"vraisemblablement\" sont plutôt interprêtés comme des \"réellement\" par leurs brebis égarées. Pourquoi considérer alors le pauvre Ezra ou Esaïe comme les boucsémissaires de ces écrivains anonymes ?"}]}, {"title": "Trois ou sept ?", "blocks": [{"t": "p", "x": "Regardez la reproduction de la page suivante. Comparez les deux citations. 2 Samuel 24:13 qui dit: \"’Gad arriva chez David et lui rapporta ceci, et lui dit...\" Ces paroles sont reprises mot à mot dans 1 Chroniques 21:11, exception faite de la redondance ’Et lui rapporta ceci!\" Mais, pendant qu’il éliminait l’expression inutile, l’auteur élagait aussi le facteur temps de \"sept\" années à \"trois\" années. Que dit Dieu à Gad: trois ou sept années de fléaux \"sur ces deux maisons\" ?"}, {"t": "h", "x": "II SAMUEL 24"}, {"t": "v", "x": ["Recensement", "La colère de l’Eternel s’enflamma de nouveau", "contre Israël. Elle excita David contre,", "eux en disant : \"Va, fais le recensement", "d’Israël et de Juda.\""]}, {"t": "p", "x": "Alors que l’auteur de Samuel 24, ci-dessus, fait de Dieu le maître de la situation, l’auteur des Chroniques, ci-dessous"}, {"t": "h", "x": "I CHRONICLES 21"}, {"t": "v", "x": ["Recensement", "Satan se dressa contre Israël et il excita", "David à faire le recensement d’Israël."]}, {"t": "p", "x": "Outre le fait de montrer la soumission à Dieu, comme cela est indiqué partout, rendre aussi justice au diable. Cette dichotomie qui est le fait de l’auteur des Chroniques me rappelle l’histoire de cette femme âgée qui allumait un cierge à Saint Michel et un autre au diable. Saint Michel était foulé aux pieds, mais qu’elle aille au ciel ou en enfer, elle aurait toujours un allié. Ce chroniqueur fit de sorte qu’il eut bien un ami dans le tribunal Céleste, ainsi qu’un autre dans le tribunal Inférieur. Il voulait être et avoir été."}]}, {"title": "Huit ou dix-huit", "blocks": [{"t": "p", "x": "Voir pages suivantes : quel âge avait Yehoyaqim ? Comparez les deux citations 2 Chroniques 36:9 qui nous indique que Yehoyaqim avait \"huit\" ans lorsqu’il commença à régner, mais 2 Rois 24:8 dit qu’il avait \"dix-huit\" ans alors. L’auteur \"inconnu\" des Rois a dû réfléchir à la raison qui pousserait à abdiquer en faveur d’un enfant de huit ans, et à préférer ajouter généreusement dix années à Yehoyaqim afin qu’il soit alors assez mûr pour faire face à la colère de Dieu. Il dut, malgré tout, payer pour ses falsifications (?). Alors, il réduisit son règne à dix jours ! Ajouter dix années â l’âge, otez dix jours au règne ! Dieu pourrait-il présenter les mêmes choses aussi différemment ?"}]}, {"title": "Cavalerie ou infanterie ?", "blocks": [{"t": "p", "x": "Comparez les deux citations page suivante (\"700 ou 7 000\"). Combien de conducteurs de chars David tue-t-il ? Sept cent ou sept mille ? Et aussi, tue-t-il 40 000 cavaliers ou 40 000 fantassins ? Le conflit ouvert entre les écrits de 2 Samuel 10:18 et 1 Chroniques 19:18 laisse supposer que Dieu ne peut pas faire la différence entre centaines et milliers, mais aussi qu’Il ne pourrait pas distinguer la \"cavalerie\" del’ ’infanterie\". Il est clair que dans le dictionnaire chrétien, le blasphème se cache sous le couvert de \"l’inspiration\" !"}]}, {"title": "Travaux pratiques", "blocks": [{"t": "p", "x": "Salomon, au temps de sa gloire commença à se faire construire un palais royal. La construction aura treize années. Le ler Livre des Rois, Chapitre 7, nous l’apprend. Vous souvenez-vous de la fierté du Dr Parker : \"De pleines pages sont remplies de noms obscurs\" (Chapitre 6 de ce livre: \"Des modèles pervertis\"). Même par pur enfantillage, vous ne pouvez pas faire mieux dans"}, {"t": "p", "x": "(s.à. pg. 52)"}, {"t": "h", "x": "QU’EST-CE QUE LE SEIGNEUR A DÉCRÉTÉ"}, {"t": "h", "x": "3 ANS ou 7 ANS DE FAMINE ?"}, {"t": "p", "x": "La Peste"}, {"t": "h", "x": "II SAMUEL 24:13"}, {"t": "p", "x": "13. Gad arriva chez David, lui rapporta ceci et lui dit : \"Est-ce qu’il t’arrivera sept années de,famine dans ton pays, ou bien trois mois de fuite devant les adversaires qui te poursuivront,..."}, {"t": "h", "x": "I CHRONIQUES 21:11"}, {"t": "p", "x": "’11. Gad, arriva chez David et lui dit : \"Ainsi parle l’Eternel 12. Accepte : ou bien trois années de famine, ou trois mois de défaite devant tes adversaires, pendant lesquels l’épée de tes ennemis (pourrat’) atteindre...\" Si Dieu est bien !’Auteur de chaque mot, virgule et point dans la Bible, comme le prétendent les chrétiens, alors il est également l’auteur des erreurs arithmétiques cidessus ?"}]}, {"title": "Quel âge avait Yehoyaqim ?", "blocks": [{"t": "h", "x": "8 OU 18 ANS ?"}, {"t": "p", "x": "Entre huit et dix-huit ans il y a une différence de dix belles années. Pouvons-nous dire (plaise à Dieu !) que le Tout-Puissant et Omniscient ne savait pas compter, et, par conséquent, ne faisant pas la différence entre-huit et dix-huit ? Si nous considérons la Bible comme étant la Parole de Dieu, alors la Dignité et le Statut du Seigneur ToutPuissant en prennent un sérieux coup !"}, {"t": "h", "x": "II CHRONIQUES 36"}, {"t": "p", "x": "9. \"Yehoya avait huit ans lorsqu’il devint roi et il règna trois mois- et dix jours à Jérusalem. Il fit ce qui est mal auX~yeux de l’Eternel.\""}, {"t": "h", "x": "II ROIS 24"}, {"t": "p", "x": "8. \"Yehoya avait dix-huit ans lorsqu’il devint"}, {"t": "p", "x": "roi et il règna trois mois à Jérusalem. Le nom de sa mère était Nehushta, fille d’Elnathan, de Jérusalem.\""}, {"t": "h", "x": "700 OU 7 000 ?"}, {"t": "p", "x": "Cela ne nuit certainement en rien au confort des amis de la Bible qu’un zéro (0)’ soit ajouté à 700 ou ôté de 7 000 ce qui, en fait, déconcerte encore plus les Mathématiques bibliques déjà peu claires. 1-"}, {"t": "h", "x": "Il SAMUEL 10"}, {"t": "p", "x": "18. Les Syriens s’enfuirent devant Israël, et David leur tua (les troupes de) 700 chars et 40000 cavaliers. Il frappa aussi le chef de leur armée."}, {"t": "h", "x": "I CHRONIQUES 19"}, {"t": "p", "x": "i -1-8. Les Syriens s’enfuirent devant Israël et David leur tua (les troupes dé) 7 000 chars et 40 000 hommes à pieds, et il fit mourir Chophale, chef de leur armée."}, {"t": "h", "x": "DIEU CONFOND \"CAVALERIE\" et \"INFANTERIE\""}, {"t": "p", "x": "Que les \"écrivains de la Bible ne fassent pas la différence entre \"hommes à pieds\" et \"cavaliers\" est du plus grave effet, car ils rejettent ainsi sur Dieu l’ignorance, en tant que source de cette \"inspi-ration\". Est-il possible que les Syriens, qui s’enfuirent devant Israël, aient été des Centaures (une sorte de créature au corps et aux pattes de cheval avec un torse et des bras humains) ? Est-il possible que ces \"créateurs\" se voient échappés de leur mythologie classique pour venir stupéfier le lot d’auteurs trop impressionnables ?"}, {"t": "p", "x": "1. Voir, en fin de chapitre, la remarque sur le zéro. le genre, que ce chapitre 7 du ler Livre des Rois et Ezékiel 45. Vous vous devez, à vousmême, de le lire ne serait-ce qu’une seule fois dans votre vie. Après cela, vous apprécierez vraiment le Saint Coran ! Si vous ne possédez pas de Bible> ét si vous êtes musulmans, essayez de vous en procurer une et vous pourrez alors colorier les différentes références de ce fascicule dans votre Bible : \"jaune\" pour les contradictions, \"rongé\" pour les passages pornographiques, \"vert\" pour les citations sensées, acceptables comme celles que j’ai citées au début de cet essai."}, {"t": "p", "x": "Ce sont les Paroles que vous pouvez aisément reconnaître, comme celles de Dieu et de Ses Saints Messagers. Grâce à ce travail, vous pourrez confondre et convaincre tout missionnaire ou bibliophile que vous rencontrerez ! \"Si nous suons plus en temps de paix, nous saignerons moins en temps de guerre.\" (Chang Kai-Shek)"}]}, {"title": "Quelle hygiène ?", "blocks": [{"t": "p", "x": "Voyez la page suivante, et notez que l’auteur de 1 Rois 7:26 a dénombré pas moins de 2 000 bains dans le palais de Salomon, alors que l’auteur de 2 Chroniques 4:5 augmente le chiffre royalement de 50 %, pour atteindre 3 0()() ! Quelle extravagance et erreur dans le \"Livre de Dieu\" ? Même si Dieu Tout-Puissant n’avait rien d’autre à faire, alors passerais-il son temps à inspirer des stupidités aussi contradictoires et triviales aux juifs ? La Bible est-elle le Livre de Dieu ? Est-elle réellement la Parole de Dieu ?"}]}, {"title": "Accumulation de contradictions", "blocks": [{"t": "p", "x": "Avant d’en terminer avec cette suite de contradictions, permettez-moi de vous en citer encore une. II y en a des centaines d’aunes dans la Bible. Voyer les pages suivantes. Encore Salomon ! Il fait vraiment les choses en grand. L’ex-Shah d’Iran n’étais qu’un bambin en comparaison ! L’auteur de 2 Chroniques 9:25 donne à Salomon mille écuries de plus que le nombre de \"bains qu’il lui a donnés\". Salomon avais \"4 000 écuries mur les chevaux...\" Mais l’auteur de 1 Rois 5:26 avais vraiment des pendes"}, {"t": "h", "x": "(SUITE PAGE 55)"}, {"t": "h", "x": "LA DIFFERENCE ENTRE 2 000 et 3 OQO"}, {"t": "h", "x": "C’EST SEULEMENT UNE EXAGERATION DE 50%!"}, {"t": "h", "x": "I ROIS 7"}, {"t": "p", "x": "26. \"Son épaisseur était d’une palme; et son bord était façonne comme le bord d’une coupe, en fleur de lys. Elle contenait 2 000 bains.\""}, {"t": "h", "x": "II CHRONIQUES 4"}, {"t": "p", "x": "5 \"Son épaisseur était d’une palme; et son i bord était façonné comme le bord. d’une coupe, en fleur de lys. Elle pouvait contenir 3 000 bains.\""}, {"t": "p", "x": "Que ce soit fait sciemment ou non, l’incapacité singulière de l’écrivain \"inspiré\" à saisir la différence qui existe entre 2 000 et 3 000 est impardonnable. C’est une contradiction évidente. \"Et aucun miracle ne démontrait que 2 et 2 font 5 ou que le cube puisse avoir 4 angles. Et pas un seul miracle quel qu’il soit ne pouvait modifier une contradiction qui repose sur les enseignements et les dires du christianisme.\""}, {"t": "p", "x": "Albert Schweizer, A la recherche du \"Jésus\" historique\", p. 22"}, {"t": "h", "x": "LA DIFFERENCE ENTRE 4 000 et 40 000"}, {"t": "h", "x": "II Chroniques chapitre 9"}, {"t": "p", "x": "25. \"Salomon avait 4 000 écuries pour les chevaux et les chars, et 12 000 cavaliers qu’il installa dans les villes de garnison et à Jérusalem près du roi.\""}, {"t": "h", "x": "N’EST QUE DE 36 000 ’."}, {"t": "h", "x": "I Rois chapitre 5"}, {"t": "p", "x": "26. \"Salomon avait des écuries de 40 000 chevauac pour ses chars et 12 000 cavaliers.\""}, {"t": "h", "x": "LES JUIFS N’UTILISAIENT PAS LE \"0\" (ZÉRO) DANS L’ANCIEN TESTAMENT"}, {"t": "p", "x": "très attentionnées pour son royal patron. II a multiplié le nombre d’écuries de Salomon par 1000, passant de 4 00 à 40 000 écuries! Avant que quelque orateur évangéliste ne vous donne le change en disant que la différence n’est que d’un zéro (un \"0\"), que quelque scribe ou copiste avait par inadvertance gonflé 4 000 pour en faire 40 000, laissez-moi vous dire qu’à l’époque de Salomon, les juifs ignoraient tout du zéro \"0\" ! Ce sont les Arabes qui ont introduit le zéro au Moyen-Orient et en Europe dans les siècles suivants."}, {"t": "p", "x": "Les juifs écrivaient leurs chiffres grâce à des mots dans leurs travaux littéraires, et non avec des chiffres. Notre question est \"Quel est te vrai auteur de l’erreur aberrante concernant la différence de 36 000 ? Dieu ou l’homme ? Ces références et d’autres évidences du même ordre sont regroupées dans un livre important \"La Bible - La Parole de Dieu ou la Parole de l’Homme\" par A.S.K. Joommal."}]}]}, {"n": 8, "title": "Le témoignage plus objectif", "sections": [{"title": "Le témoignage plus objectif", "blocks": [{"t": "p", "x": "Le propagandiste chrétien se plaît à citer le verset suivant comme preuve que la Bible est bien la Parole de Dieu. \"Toute écriture EST inspirée de Dieu et est utile pour renseigner, pour con vainrre, pour redresser, pour éduquer dans la justice.\" (2 Thimothée 3:16) Remarquer le \"est\" en capitales. Le Révérend Scofield sousentcnd ainsi qu’il n’apparaît pas dans le document grec original. \"La Nouvelle Bible Anglaise\" traduite par un comité représentant l’Eglise d’Angleterre, l’Eglise d’Ecosse, l’Eglise Méthodiste, l’Eglise Congrégalionnelle, l’Union Baptiste, l’Eglise Presbytérienne d’Angleterre, etc... et"}, {"t": "p", "x": "l’Association britannique et étrangère de la Bible ont donné la traduction qui est la plus proche par rapport au texte grec original, et qui mérite d’être citée ici \"Toute écriture inspirée est utile pour enseigner la vérité et repousser l’erreur, ou pour corriger les habitudes et la discipline dans la justice.\" (2 Timothée 3:16) Les Catholiques dans leur \"Douais\" sont encore plus fidèles au texte que les Protestants ne le sont dans leur Version Autorisée (AV). Ils disent: \"Toute écriture, inspirée de Dieu, est utile pour enseigner, pour réprouver, pour corriger...\"."}, {"t": "p", "x": "Mais, ne jouons pas sur les mots. Les musulmans et les chrépages 56 tiens sont d’accord sur le fait que ce qui émane de Dieu - par inspiration ou révélation doit servir l’un des quatre buts suivants 1. Enseigner une doctrine 2. Punir pour nos erreurs 3. Donner un châtiment 4. Guider vers la justice Durant les 40 années passées, j’ai demandé aux hommes cultivés du christianisme s’ils pouvaient donner un cinquième \"prétexte\" à la Parole de Dieu. Ils n’ont pu s’y résoudre, ni moi d’ailleurs."}, {"t": "p", "x": "Voyons ensemble la \"Sainte Bible\" avec ses desseins objectifs."}]}, {"title": "À portée de mains", "blocks": [{"t": "p", "x": "Le tout premier livre de la Bible - la Genèse - nous fournit de nombreux exemples de ces évidences. Ouvrez-la au chapitre 38 et lisez. Vous avez là l’histoire de Juda-, le père des juifs, d’où découlent les noms \"Judée\" et \"judaïsme\". Ce patriarche des juifs se maria et eut trois fils : Er, Onan et Chéla. Lorsque le premier fut assez âgé, Juda le maria à une femme du nom de Tamar. \"Er, premier-né de Juda était mauvais aux yeux de 1 E’ternel, et ! E’ternel le fit mourir.\" (Genèse 38:7). Sous lequel des quatre principes de Timothée placeriez-vous cette triste histoire ?"}, {"t": "p", "x": "Le second but : Punir. Er était mauvais, alors Dieu 1e tua. Une leçon pour tous. Dieu nous tuera tous pour notre méchanceté. Punition."}, {"t": "p", "x": "Poursuivons donc cette histoire juive : selon leurs coutumes, si un frère décède et qu’il n’a pas de successeur, il est du devoir de l’autre frère d’assurer la descendance afin que le nom du défunt soit perpétué. Juda, respectueux des usages, ordonna à son second fils,"}, {"t": "p", "x": "1. Vous vous souvenez du Dr Kenneth Cragg dans son \"Appel au Minaret\" et son \"Histoire\". Voyez la citation complète page S. C’est de cette histoire qu’il s’agit."}, {"t": "p", "x": "Onan, d’accomplir son devoir. Mais la jalousie envahit son coeur. Ce serait sa semence, mais ce serait le nom de son frère ! Alors, au moment critique: \"’Onan, sachant que cette descendance ne serait pas de lui, (se) souillait à terre... Ce qu’il fit était »fauvais aux"}, {"t": "p", "x": "yeux de 1 E’ternel qui le fit aussi mourir.\" (Genèse 38:9-10). Dans le tableau des textes de Timothée, où se situerait ce meurtre ? \"Punition !\" encore. Des réponses faciles à des questions pourtant fondamentales. Faites le mal et subissez-en les conséquences ! Onan n’est pas dans le \"Livre de Dieu\" mais les sexologues chrétiens l’ont pourtant immortalisé en baptisant te \"coïtus interrupws\" d’onanisme, dans leur \"Livre du Sexe\". Alors Juda conseilla à sa belle-fille, Tamar, de retourner vivre chez son père jusqu’à ce que son troisième fils soit assez âgé et qu’il puisse alors accomplir son devoir."}]}, {"title": "La vengeance d’une femme", "blocks": [{"t": "p", "x": "Chéla grandit et épousa peut-être une autre femme. Mais Juda ne respecta pas ses obligations vis-à-vis de Tamar. Au plus pro- I fond de lui-même, il est terrifié. Il a déjà perdu deux de ses fils à cause de cette \"sorcière\" : \"Car il (se) disait : celui-là aussi va mourir comme ses frères...\" (Genèse 38:11). Alors Juda décida de ne pas tenir sa promesse. La jeune femme, ainsi blessée, décida de se venger de son beau-père pour l’avoir privée de son droit de \"semence\"."}, {"t": "p", "x": "Tamar apprit que Juda devait se rendre à Timnath pour y faire tondre ses moutons. Elle s’arrangea afin d’être seule avec lui sur le chemin, le devança et s’assit bien en vue, sur la route. Lorsque Juda la vit, il ne la reconnut pas et la prit pour une prostituée, car elle avait recouvert son visage. Il alla vers elle et proposa \"Autorise-moi à venir avec toi; et elle dit : Que me donneras-tu pour venir avec toi ?\" Il promit de lui envoyer un chevreau de son troupeau. Quelle garantie pouvait-elle avoir qu’il l’enverrait bien ? Quelle garantie voulait-elfe, s’enquit Juda. \"Son cachet, son cordon et son bâton\". II les lui donna, \"puis il vint vers elle et elle devint enceinte de lui.\"’ (Genèse 38:16-18)"}]}, {"title": "La morale", "blocks": [{"t": "p", "x": "Avant de chercher l’intitulé de Timothée 3:16 dans lequel nous pouvons classer cette histoire malsaine et sordide, tirée du \"Livre de Dieu\", je me pose la question, comme vous vous la posez sans doute : Quelle morale (?) nos enfants tireront-ils de cette histoire? Car, bien sûr, nous racontons à nos enfants des fables, pas uniquement pour leur plaisir, mais afin qu’ils en retirent quelque leçon. \"Le renard et les raisins\", \"Le loup et l’agneau\", \"Le chien et son ombre\", etc... Que l’histoire soit simple ou stupide, il lui faut une morale."}]}, {"title": "L’embarras des parents chrétiens", "blocks": [{"t": "p", "x": "Le Dr Vernon Jones, un psychologue américain de grand renom, fit quelques expériences sur des groupes d’enfants à qui l’on racontait des histoires. Les héros des histoires étaient les mêmes pour tous les différents groupes d’enfants, mais ils réagissaient différemment selon les groupes. Ainsi, dans un groupe St Georges tuant le dragon faisait fière figure, alors que dans un autre groupe, il fuyait terrorisé et cherchait refuge dans les jupes de sa mère. \"Ces histoires ont conduit à certains changements, légers mais"}, {"t": "p", "x": "permanents, dans le caractère et même dans cette petite cellule scolaire\" conclut le Dr Jones."}, {"t": "p", "x": "Quels dégâts ces viols et ces meurtres, ces incestes et ces violences ont-ils causé aux enfants chrétiens ? Les articles que nos journaux quotidiens -leur consacrent nous donnent une idée de leur impact. Si telle est la source de la moralité occidentale, il n’est guère étonnant alors que les méthodistes et les catholiques aient déjà célébré des mariages entre homosexuels dans leurs \"Maisons de Dieu\", et que 8 000 gays (un euphémisme pour sodomites) se donnent en spectacle à Londres, à Hyde Park, en juillet 1978, pour accueillir les médias de l’information et la TV."}, {"t": "p", "x": "Prenez la Bible et lisez tout le chapitre 38 de la Genèse. Puis, soulignez en rouge tout ce qui justifie cette fin. Nous aboutissons alors au verset 18 : la morale \"et elle devint enceinte de lui\"."}]}, {"title": "Se cacher éternellement ?", "blocks": [{"t": "p", "x": "Trois mois plus tard, Juda apprit que sa belle-fille, Tamar, s’était prostituée et que \"la voilà même enceinte à la suite de sa prostitution. Alors, Judo dit : faites-la sortir et qu’elle sQit brûlée\" (Genèse 38:24). Juda la renia et demanda qu’elle soit brûlée. Mais la situation se retourna vite contre le vieil homme. La jeune femme fit parvenir à son beaupère ses gages : le cachet, le cordon et le bâton tout en le suppliant de trouver le responsable de sa grossesse. Juda se trouva dès lors dans une situation embarrassante mais dut admettre que sa belle-fille était plus respectueuse de ses devoirs qu’il ne l’avait été : \"Et il ne la connut plus \"(Verset 26)."}, {"t": "p", "x": "II est intéressant de comparer te vocabulaire utilisé dans les différentes versions pour relater cette même histoire. Les témoins de Jéhovah, dans leur \"Traduction du Nouveau Monde\" traduisent la dernière citation ainsi : \"Il n’eut plus de relation avec elle, après\" (1). Tant de choses furent écrites dans le \"Livre de Dieu\" sur Tamar que les auteurs des Evangiles l’ont immortalisée dans leur \"généalogie de leur Seigneur\"."}]}, {"title": "Inceste accompli", "blocks": [{"t": "p", "x": "Je ne veux pas vous ennuyer avec des détails, les derniers versets de la Genèse 38 racontant le droit à la succession, lutte qui a pour cadre les \"entrailles\" de Tamar et pour acteurs \"ses jumeaux\". Les juifs ont toujours été très méticuleux pour reconnaître le premier-né qui est le principal héritier testamentaire. Qui sont les grands vainqueurs de cette course à l’héritage ? Perets et Zerah, fils de Tamar et Juda ? Comment ? La suite nous l’expliquera. Voyons plutôt la morale dé cette histoire. Quelle estelle ? Vous souvenez-vous de Er et Onan, anéantis par Dieu, en raison de leurs péchés ? La leçon que nous en tirons à chaque fois se résume en \"punition\". Mais à quel objectif, de la liste de Ti-"}, {"t": "p", "x": "1. La version des témoins, de Jéhovah est plus explicite dans le choix de ses termes. Comparez Ezechiel 23 avec toute autre version et vous verrez la différence."}, {"t": "p", "x": "mothée, rapprochez-vous l’inceste de Juda et sa progéniture illégitime ? Le \"Livre de Dieu\" leur accorde une place très honorable et fait de ses bâtards les arrières grandspères et grands-mères de l’ \"unique fils que Dieu engendra\". Lisez Matthieu 13. Dans chaque version de la Bible, les chrétiens ont orthographié différemment les noms des personnages par rapport aux noms qui figurent dans l’Ancien Testament (Genèse Chap. 38 à ceux du Nouveau Testament (Matthieu - Chap. 1). Ceci a pour effet d’être perturbant pour le lecteur."}, {"t": "p", "x": "Ainsi, l’on passe de Pere à Peretz et de Zerah à Zera et de Tamar à Thamar. Et la morale ? Que Dieu bénisse le crime incestueux de Juda ! Donc, si vous agissez \"mal\" (Er), Dieu vous fait mourir. Si vous gaspillez la \"semence\" (Onan), Dieu vous tue. Mais Dieu remercie la belle-fille qui se prostitue (avec Juda) pour assurer la descendance ! Comment qualifier cela dans le \"Livre de Dieu\" ? Et à quelle catégorie d’acte le rattacher ? 3e vous laisse réfléchir. 1. Doctrine ? 2. Punition ? 3. Correction ? ou 4. Action pour le bon droit ?"}, {"t": "p", "x": "Demandez-leur, aux prêcheurs, aux évangélistes acharnés, aux défenseurs de la Bible, de répondre à cette question et de justifier leur réponse. Car personne ne peut justifier cet acte sordide, cet écrit pornographique. Car il s’agit bien là de \"Pornographie\"."}]}, {"title": "Censurez le livre !", "blocks": [{"t": "p", "x": "Georges Bernard Shaw disait: \"C’est le livre le plus dangereux qui soit sur terre. Tenez-le sous clé.\" Ne le laissez pas à portée de mains innocentes. Qui suivit son conseil ? Il n’avait pas l’impact des B.A. (1), des chrétiens \"ressuscités\". Au nom de la morale, les chrétiens d’Afrique du Sud ont cen-"}, {"t": "p", "x": "1. B.A. : Abréviation du mot anglais \"Bom-Again\" (qui naît à nouveau), qui est le nom d’un nouveau malaise, qui s’oppose au \"Culte du suicide\" du révérend Jim Jones; à Johannesbourg -Guyane. suré le livre \"Lady Chatterley\" à cause d’un tetragrammaton (un mot de 4 lettre), ce qu’ils auraient probablement fait aussi à la Sainte Bible si celle-ci avait été un livre religieux hindou ou musulman. Mai ils restent impuissant face à leur \"saint Livre\", leur \"salut\" en dépend !"}, {"t": "p", "x": "Lire la Bible aux enfants conduit à discuter de la moralité du sexe. La Bible peut ainsi refléter l’état d’esprit des censeurs."}, {"t": "p", "x": "The Plain Truth (Octobre 1977)"}]}, {"title": "Les filles séduisent leur père", "blocks": [{"t": "p", "x": "Lisez Genèse 19 du Verset 30 à la fin, et notez en rouge les mots et expressions s’y rapportant. N’hésitez pas et ne le remettez pas à plus tard. Votre Bible \"en couleurs\" sera"}, {"t": "p", "x": "l’héritage inestimable transmis à vos enfants. B. Shaw a raison. Il faut mettre la Bible sous clé, mais elle nous est toutefois utile pour répondre au défi chrétien. Le Prophète de l’Islam disait que \"la guerre est une question de stratégie\" et la stratégie veut que nous utilisions les armes de nos ennemis pour nous défendre contre \"Le Livre\" (La Bible). Les professeurs que nous rencontrons sans cesse se référent à la Bible, qui \"dit ceci\" ou \"dit cela\", espérant que nous troquions notre \"Saint Coran\" contre la \"Sainte Bible\". Ouvronsleur les yeux sur les imperfections de leur \"Saint Livre\", car ils n’en connaissent que les versets \"publicitaires\"."}, {"t": "p", "x": "Poursuivons \"l’histoire\" : nuit après nuit, les filles de Loth ennivrèrent leur père et le séduisirent afin de lui assurer une descendance. Un point sur lequel la Bible revient souvent dans la Genèse notamment. De cette filiation incestueuse sortirent les Ammonites et les Moabites pour lesquels le Dieu d’Israël éprouvait une certaine pitié. Plus loin, la Bible nous révèle que ce même Dieu de Pitié a ordonné aux juifs de tuer sans exception les Phillistins - hommes, femmes et enfants. Personne ne fut épargné. Mais ni les Ammonites, ni les Moabites ne furent menacés Reprenez et relisez Ezechiel 23, en faisant cet exercice de colonage, dont vous connaissez déjà les règles."}, {"t": "p", "x": "Les deux sueurs prostituées, Aholah et Agikuvag. Les détails sexuels font que ce livre rejoint le lot des livres censurés. Dans quelle catégorie vos visiteurs chrétiens \"ressuscités\" classeraient-ils toute cette débauche ? Certainement pas dans le \"Livre de Dieu\"."}, {"t": "p", "x": "Al-Haj A.D. Ajijola, dans son livre \"Le Mythe de la Croix\", donne un exposé court mais crucial sur le sophisme de la Bible, ainsi que la crucifixion, en résumé de l’intégralité du christianisme. Aucun étudiant en religion comparative ne peut se passer de cet ouvrage, ni d’ailleurs de \"La Bible : Parole de Dieu ou Parole d’Homme ?\" dont nous avons déjà parlé. ou touchés, car ils descendaient de Loth. (Deutéronome 2:19) Personne ne peut lire véritablement les passages relatant la séduction que la mère de Loth, sa sueur ou ses filles exercent sur lui, sans être choqué par la perversion et le sordide de l’histoire, sauf peut-être quelques pervers qui se complaisent dans la corruption morale. suré le livre \"Lady Chatterley\" à cause d’un tetragrammaton (un mot de 4 lettres), ce qu’ils auraient probablement fait aussi à la Sainte Bible si celle-ci avait été un livre religieux hindou ou musulman. Mais ils restent impuissants face à leur \"Saint Livre\", leur \"Salut\" en dépend!"}]}]}, {"n": 9, "title": "La généalogie de Jésus", "sections": [{"title": "La généalogie de Jésus", "blocks": [{"t": "p", "x": "Voyons à présent par quel subterfuge les pères chrétiens ont rejeté la responsabilité des progénitures incestueuses de l’Ancien Testament sur leur Seigneur et Sauveur, JésusChrist, dans le Nouveau Testament. Lui qui n’avait pas de généalogie, ils lui en ont fabriqué une. Et laquelle ! Six adultères et rejetons incestueux pour ce Saint Homme de Dieu, ainsi que des femmes et des hommes dignes d’être lapidés, selon la loi divine, et même bannis de la Maison de Dieu pour des générations et des générations ! (1 )"}]}, {"title": "Des aïeux indignes", "blocks": [{"t": "p", "x": "Pourquoi a-t-il fallu que Dieu donne un \"père\" (Joseph) à Son \"Fils\" (Jésus) ? Et pourquoi des ancêtres aussi peu dignes ? \"En voici toute la beauté\", disent les pervers. Dieu aime les pécheurs, aussi n’hésite-t-il pas à lier à leurs noms celui de Son \"Fils\"."}]}, {"title": "Seulement deux porte-paroles patentés", "blocks": [{"t": "p", "x": "Parmi les quatre auteurs des Evangiles, Dieu en choisit seulement deux pour rendre compte de la généalogie de Son \"Fils\"."}, {"t": "p", "x": "1. Un bâtard n’entrera pas dans l’assemblée de l’fitemel : même de dixième génération (Deutéronome 23:2.) Les témoins de Jéhovah sont très sensibles à cette Parole et l’appliquent à la lettre."}, {"t": "p", "x": "Afin de faciliter la comparaison entre ces deux listes \"inspirées\" par Dieu, je n’ai retenu que les noms donnés dans les Evangiles et écarté tout le texte (voir page suivante). Dieu ne \"souffle\" à Matthieu que 26 noms entre David et son \"Fils\" Jésus, alors que Luc en donne 41 ! Mais le seul nom que ces deux listes aient en commun est celui de Joseph, et encore Luc en parle-t-il en termes douteux \"comme on le pensait, fils de Joseph\" (Luc 3:23). Joseph, le charpentier, celui dont le nom resplendit et seul ascendant de Jésus, commun aux deux listes, d’ailleurs parfois contradictoires. Se pourrait-il que ces deux listes émanent de la même source, de Dieu ?"}]}, {"title": "Respecter la prophétie ?", "blocks": [{"t": "p", "x": "Matthieu et Luc font preuve de zèle en portant en tête de liste le nom du roi David, premier ancêtre de Jésus, ce qui vint renforcer la fausse prophétie qui dit que Jésus doit s’asseoir sur le Trône de son père David (Actes 2:30). Les Evangiles démentent cette prophétie, d’ailleurs ce n’est pas Jésus qui s’assit sur le trône de son père (David) mais Ponce Dilate, un gouverneur romain et de surcroît païen, qui condamna à mort l’héritier (Jésus). Sans importance, disent les évangélistes, \"si ce n’est dans ce monde, ce sera dans l’autre, alors il accomplira cette prophétie et 300 autres encore\"."}, {"t": "p", "x": "De par leurs liens ancestraux physiques entre Jésus et David, les auteurs \"inspirés\" commettent une erreur. Erreur reprise par la Bible. \"Un de ses (Da vii3) descendants\". (Actes 2:30) Matthieu 1:6 précise que Jésus était le fils de David par Salomon, alors que Luc 3:31 dit qu’il (Jésus) -est le fils’de David par Nathan. Inutile d’être généalogiste -pour admettre qu’il est mpossible que David suive deux chemins si distincts (Salomon et Nathan) et aboutisse au nom de Jésus ! Ces deux auteurs mentent et nous le savons car Jésus est né d’un miracle, d’où l’homme est exclu. Done,,reconnaître à jésus un ancêtre humainphysique n’est que pure élucubration."}]}, {"title": "Faire cesser cette ineptie", "blocks": [{"t": "p", "x": "Bien que cette démonstration soit logique, elle n’atteint pas le chrétien. Prenons un autre exemple, où -il lui sera plus facile d’être objectif."}, {"t": "p", "x": "L’histoire dit que Mohammed, le Prophète de l’Islam, était le fils d’Abraham par Ismaël. Si un écrivain \"inspiré\" tentait de faire croire à une filiation par l’entremise dIsaac, alors nous n’hésiterions pas à le confondre, car la descendance ne peut suivre deux voies pour aboutir au même nom ! Cette différence est celle qui existe entre Juifs et Arabes. Dans ce dernier exemple, nous savons que quiconque proclamerait qu’Isaac est le père de Mohammed (Ç) mentirait. Dans l’exemple de Jésus (Pj : Matthieu et Luc sont tous deux suspects."}, {"t": "p", "x": "En attendant que les chrétiens choisissent entre ces deux généalogies pour leur \"Dieu\", les deux évangiles sont à réfuter. La chrétienté n’a pas encore résolu ce mystère vieux de 2 000 ans. Quelle persévérance pourtant ! \"Le temps apportera la clé du mystère\". \"Pour les athées, il reste des points auxquels les théologiens n’ont pas encore répondu de façon assez satisfaisante. Il subsiste des difficultés dans le texte auxquels les savants sont toujours confrontés. Seule une Bible illettrée nierait ce fait.\" (The Plain Truth - Juillet 1975)"}]}, {"title": "La source de l’inspiration de Luc", "blocks": [{"t": "p", "x": "Nous avons déjà reconnu 85 % de Matthieu et Luc comme émanant de Marc ou \"Mystérieux Q\" (1). Voyons qui inspira Luc à raconter l’excellent Théophile (Luc 1:13), l’histoire de Jésus (P) (voir page 68 : La préface de Luc à son \"Evangile\"). Il dit suivre l’exemple d’autres auteurs moins qualifiés que lui pour accomplir cette tâche et qui se contentent d’écrire ce qui se dit de son héros (Jésus). D était sans nul doute mieux préparé pour rédiger ce chef &oeuvre littéraire. ’7l m’a semblé bon à moi aussi... d’y mettre de"}, {"t": "n", "x": "1. Voir note à ce suJjet chapitre VI."}, {"t": "h", "x": "GENEALOGIE DE DAVID À JESUS"}, {"t": "p", "x": "EN IMAGE (bientôt inch’ Allah)"}, {"t": "h", "x": "POURQUOI LUC A-T-IL ECRIT"}, {"t": "h", "x": "\"SON\" EVANGILE ?"}, {"t": "p", "x": "L’Evagile selon"}, {"t": "h", "x": "SAINT LUC"}, {"t": "p", "x": "Puisque plusieurs ont entrepris de composer un récit des événements qui se sont accomplis parmi nous."}, {"t": "p", "x": "2. Tels que nous les ont transmis ceux qui, dès le commencement en ont été les témoins oculaires et qui sont devenus serviteurs de la parole. 3. Il n’a semblé bon à moi aussi, après avoir tout recherché exactement depuis les origines, de te l’exposer par écrit d’une manière suivie, excellent Théophile; 4..Afin que tu reconnaisses la certitude de renseignements que tu as reçus."}, {"t": "p", "x": "Extrait de la Versin Autorisée - Saint Luc l:l-4 l’ôrdre par écrit...\". Telle est sa justification par rapport à ses prédécesseurs. Dans l’introduction de \"L’Evangile de Saint Luc\", J.B. Phillips dit : \"Luc reconnait avoir comparé et écrit un sujet déjà existant, mais il semble qu’il ait pu disposer d’informations supplémentaires, dont nous pouvons deviner les sources\". Et vous appelez cela la Parole de Dieu ? Achetez \"The Gospels in Modem English\" (les Évangiles en anglais moderne) par les Éditions Fontana. Faites vites car les chrétiens risquent d’en faire censurer les mots inestimables de Phillips ! Et les auteurs de la RSV risquent aussi d’extirper la \"Préface\" (1) de leur traduction. C’est décidément une habitude dont j’ai été la victime aussi !"}]}, {"title": "Le dernier Évangile", "blocks": [{"t": "p", "x": "Qui est l’auteur de l’Évangile de St Jean ? Ni Dieu, ni St Jean. Voyons ce qu’il (?) dit parlant de lui (?). Voir page suivante: Jean 19:35 et 21:24-25. Qui est \"Celui\" et \"Son\" ? Et \"Nous savons\" et \"Je ne pense\". Est-ce celui qui l’abandonne dans le jardin alors qu’il avait tant besoin d’aide. Or, est-ce le 14ème homme autour de la table du \"Dernier Repas\", celui que Jésus (P) chérissait ? Tous deux se prénommaient Jean. Un prénom alors populaire parmi les juifs et les chrétiens, comme aujourd’hui. Ni l’un, ni l’autre de ces deux Jean n’est l’auteur de cet Évangile. Il est évi dent que nous avons encore affaire à une main anonyme!"}]}, {"title": "Les auteurs", "blocks": [{"t": "p", "x": "Terminons cette recherche de paternité littéraire par l’avis des 32 intellectuels soutenus par leurs 50 confessions. Dieu en est exclu. Dans la RSV de \"Collins\" des notes inestimables sont publiées quant aux \"Livres de la Bible\". Page suivante vous trouverez une partie de ces informations. Nous commençons avec la \"Genèse\" : Le premier Livre de la Bible. Les savants disent à propos de son \"Auteur\", \"Un des cinq livres de Moïse\". J’insiste (Suite page 72)"}, {"t": "p", "x": "I. Voir chapitre 3 : La \"Préfacé\" de la RSV de 1971."}, {"t": "h", "x": "REMARQUEZ LES PRONOMS !"}, {"t": "v", "x": ["35. \"Celui qui l’a vu en a rendu", "témoignage, et Son témognage", "est vrai; et Il sait qu’Il dit vrai, afin", "que vous croyiez vous aussi.\""]}, {"t": "p", "x": "Qui est-ce \"Celui\", \"Il\" et \"Son\" ?"}, {"t": "p", "x": "L’Evangile selon Saint Jean saint jean 21 24. \" c’est ce disciple qui rend témoignage de ces choses et qui les à écrits. Et Nous savons que son témoignage est vrai\". Qui est-ce 25. \" Jesus a fait encore beaucoup d’autres chose \"Nous\" et ; si on les écrivait en détail, et ne pense pas que ce \"Je\" ? le monde même pourait contenir les livres qu’on écrirait.\""}, {"t": "h", "x": "QUELLE EXAGERATION !"}, {"t": "h", "x": "THE BOOKS OF THE BIBLE"}, {"t": "p", "x": "GENESIS FIRST CHRONICLES AUTHOR. One of the \"five A U T H O R. Unknown, probably books of Moses.\" collected and edited by Ezra. EXODUS SECOND CHRONICLES AUTHOR Generally credited AUTHOR. Likely collected and edited by to Moses. Ezra LEVITICUS"}, {"t": "h", "x": "EZRA"}, {"t": "p", "x": "AUTHOR. Generally AUTHOR. Probably written or edited by credited to Moses Ezra. NUMBERS ESTHER AUTHOR. Generally AUTHOR. Unknown. credited’ to Moses. DEUTERONOMY JOB AUTHOR. Generally AUTHOR. Unknown. credited to Moses. JOSHUA PSALMS AUTHOR.Major part AUTHOR.Principally David, though credited to Joshua. there are other writers. JUDGES ECCLESIASTES AUTHOR. Possibly Samuel. AUTHOR.Doubtful,but commonly assigned to Solomon."}, {"t": "h", "x": "RUTH"}, {"t": "v", "x": ["AUTHOR, Not definitely", "known, perhaps Samuel.", "FIRST SAMUEL", "AUTHOR. Unknown.", "SECOND SAMUEL", "AUTHOR. Unknown."]}, {"t": "v", "x": ["ISAIAH", "AUTHOR. Mainly credited to Isaiah.", "Parts may have been written by others.", "JONAH", "AUTHOR. Unknown.", "HABAKKUK", "AUTHOR. Nothing known of the place or", "time of his birth."]}, {"t": "v", "x": ["FIRST KINGS", "AUTHOR. Unknown.", "SECOND KINGS", "AUTHOR. Unknown."]}, {"t": "p", "x": "The above facts are from Collins’ R.S.V. 1971, Pages 12-17, sur \"cinq livres de Moïse\". Une façon détournée d’admettre que c’est l’oeuvre de Moïse mais que nous (les 32 savants) nous refusons cette idée."}, {"t": "p", "x": "Les 4 livres suivants : \"Exode\", \"Zévitiques\", \"Nombres\" et \"Deutéronome\". Auteur ? Généralement attribués à Moïse (P), comme pour la Genèse."}, {"t": "p", "x": "Qui est l’auteur du livre ’ Josué\"? Principalement Josué."}, {"t": "p", "x": "Qui est l’auteur du livre des \"Juges\" ? Vraisemblablement Samuel. Qui est l’auteur de \"Ruth\" ? Pas réellement connu."}, {"t": "p", "x": "Et l’auteur de · (1) Samuel ? Auteur: inconnu · (2) Samuel ? Auteur: inconnu · (1) Roi ? Auteur: inconnu · (2) Roi ? Auteur: inconnu · (1) Chroniques ? Auteur: inconnu vraisemblablement... · (2) Chroniques ? Auteur : vraisemblablement un collectif..."}, {"t": "p", "x": "C’est ainsi. Les auteurs de ces livres anonymes sont soit \"inconnus\" ou \"probablement\" ou \"vraisemblablement\" ou d’origine \"douteuse\". Pourquoi blâmer Dieu de cet échec ? Il n’a pas attendu 2 000 ans pour que des bibliophiles érudits nous apprennent toute 1a vérité sur l’auteur de ces futilités, de ces vanités et autres idées préconçues juives et de leurs conflits, jalousies et incongruités. Il dit ouvertement \"Malheur à ceux"}, {"t": "v", "x": ["qui écrivent le Livre", "de leurs mains,", "et qui disent,", "ensuite, pour en tirer", "un faible prix", "\"Ceci vient de Dieu !’"]}, {"t": "p", "x": "Malheur à eux ! A cause de ce que leurs mains ont écrit à cause de ce qu’ils ont fait.\" (1) (Saint Coran 2:79) Nous aurions pu débuter ce livre par le verset coranique cidessus et le terminer par lui, satisfait ainsi de ce que Dieu ait pu donner son avis sur la question : \"La Bible est-elle la Parole de Dieu ?\" Mais nous laissons encore à nos frères chrétiens l’occasion d’étudier cette question aussi objectivement qu’ils le souhaitent (2) afin qu’ils révisent tous leur jugement. Et le Saint Coran ? Est-il la Parole de Dieu ? L’auteur de ce livre répond à cette question de manière scientifique dans son livre \"Le Coran, miracle ultime\"."}, {"t": "p", "x": "1. \"La Bible\" : le \"Best Seller Mondial\" ! Les éditeurs de la RSV ont réalisé un bénéfice net de 15.040.000 $ sur la seul lère édition ! \"Quelle valeur ridicule comparée à l’Eternité ! 2. Voir Dr Scroggie, chapitre 5."}]}]}, {"n": 10, "title": "Conclusion", "sections": [{"title": "Conclusion", "blocks": [{"t": "p", "x": "Le lecteur se rend compte à présent, s’il est assez ouvert d’esprit, que la Bible en fait n’est pas réellement ce que les protagonistes du christianisme prétendent qu’elle est. Depuis près de 40 ans, on me demande d’où me vient cette connaissance profonde de la Bible et du christianisme."}, {"t": "p", "x": "A vrai dire, si je suis considéré comme un musulman expert de toutes les questions sur le judaïsme et le christianisme, c’est que j’y ai été conduit par la force des choses."}]}, {"title": "Provocation précoce", "blocks": [{"t": "p", "x": "C’était en 1939. J’étais alors vendeur à la mission Adam, situé près d’un séminaire chrétien du même nom. J’étais ainsi que mes collègues musulmans la cible préférée de ces aspirants à l’habit religieux. Pas un jour ne se passait sans que nous essuyions des insultes portant sur l’Islam, le Saint Prophète (Ç) et le Coran. Seulement âgé de 20 ans, je passais des nuits blanches à me morfondre de ne pouvoir cire en mesure de répondre à ces insultes, de défendre Mohammed (Ç), la miséricorde de l’Humanité. Je déciciai donc d’étudier (e Coran, la Bible, etc... Le livre \"Izharul haq\" fut décisif pour moi. Quelques temps après, j’étais en mesure d’inviter les missionnaires du Collège de la Mission Adam et de leur en imposer. Ils découvraient !’Islam et son Saint Prophète"}]}, {"title": "Attaques constantes contre les musulmans", "blocks": [{"t": "p", "x": "Je suis perplexe en voyant comment tant de musulmans imprudents se laissent attaqués par des évangélistes chrétiens qui, menant des campagnes de porte-à-porte, profitent de l’hospitalité proverbiale du musulman pour proférer des remarques insidieuses conte leur croyance."}, {"t": "p", "x": "Je suis donc déterminé à inciter les musulmans à se défendre eux-mêmes, en les armant avec un minimum de connaissances, afin de contrecarrer l’évangélisateur virulent, le colporteur du christianisme, l’insulteur impudent de l’Islam et de ses Saints Apôtres. J’ai donc entrepris, en toute humilité, d’organiser des conférences pour montrer aux masses musulmanes qu’elles n’avaient rien à craindre des attaques des chrétiens. Mes conférences s’adressaient également à ceux-ci, car témoignant de la véracité de l’Islam et des contrefaçons qui s’étaient immiscées dans les vrais enseignements de Jésus (P)."}]}, {"title": "Attaques non récentes", "blocks": [{"t": "p", "x": "Au cours des siècles passés, les missionnaires chrétiens ont attaqué les musulmans sur plusieurs points auxquels, à ma connaissance, ils ont répondu au moins partiellement. Peut-être est-ce aussi la volonté d’Allah que je réponde à ces détracteurs de l’Islam, ne serait-ce qu’en partie. Il est important de ne pas se soustraire à cette responsabilité. C’est donc ce genre de défi qui vient effleurer l’esprit de Viz Gao G. Harris, auteur de \"Comment conduire les musulmans vers le Christ\". Ce missionnaire qui tenta de convertir les musulmans chinois dit (à la page 15 de son ouvrage), de cette façon arrogante et condescendante propre aux occidentaux, dans le chapitre \"La théorie ou l’accusation de corruption\" \"A présent, voici la plus lourde accusation du monde musul-, man vis-à-vis des Écritures chrétiennes. Cette accusation comporte trois aspects"}, {"t": "p", "x": "1. Les écritures chrétiennes ont subi tant de modifications qu’elles ne ressemblent glus, ou si peu, à 17njil dû Coran. On peut alors se demander : Qu’estce qm a donc modifié, changé ? Pouvez-vous comparer un exemplaire de 17njîl, le vrai, avec le mien ? A quelle date l’Inp’\"1, le vrai, était-il lisible ? 2. Nos Evangiles ont été corrompus. Mous estimes avoir le droit de poser les 5 questions qui suivent a) Cette corruption, ou cette modification était-elle intentionnelle ? b) Pourriez-vous, dans ma Bible, me citer un de ces passages ? c) Quel en était le texte original ? d) Quand, qui, comment et pourquoi cette corruption et cette modification 7 e) Cette corruption touche-t-elle le fonds ou la forme ? 3."}, {"t": "p", "x": "Nos Évangiles ne sait que de faut substituts de 17njî1 original. Ou nos Évangiles sont l’oeuvre de l’homme, et non l’1njîl noble transmis par Jésus. Mais, après avoir posé quelques questions, la situation est plus claire : le musulman qui pore ces accusations ignore tout de la Bible et du Nouveau Testament, tels qu’ils se présentaient alors. Avant de poursuivre, il convient de se souvenir que lorsqu’un objecteur envisage de soulever la futilité de cette accusation il faudrait lui enseigner nos Écritures, afin que nos e, fJ`’orts soient positifs et non négatifs.\""}]}, {"title": "Les musulmans détiennent-ils la réponse ?", "blocks": [{"t": "p", "x": "Nous, musulmans, n’avons-nous pas de réponse à ces ques tions ? Si vous avez lu ce livre alors convenez que ce que dit Géo. G. Harris n’a aucun sens. Je peux le prouver par quelques pages tirées de la Bible."}]}, {"title": "Les musulmans polémiquent", "blocks": [{"t": "p", "x": "Dans son livre, page 16, Géo. G. Harris enseigne à ses camarades une règle fondamentale afin de répondre de façon définitive aux musulmans \"Dans ce chapitre, nous supposons que les musulmans ont eux-mêmes évoqué la question de l’authenticité et de la sincérité de nos Écritures. Si cela est le cas, alors avant de défendre notre position, souvenons-nous de cette règle aussi fondamentale. La charge de la preuve revient aux musulmans.\" (1)"}, {"t": "p", "x": "1. AL Hamdu lillah ! (Si Dieu le veut !), le lecteur sera d’accord pour reconnaître que ce livre et les autres, cités au dos de la couverture, ont toujours répondu au défi des chrétiens."}, {"t": "p", "x": "Dieu m’est témoin qu’au cours de ces 40 années durant lesquelles j’ai réfuté l’authenticité de la Bible, que les chrétiens réclament, j’ai été l’heureux vainqueur. Sachez que nous, musulmans, ne frapperons pas aux portes pour vendre notre religion, alors que les chrétiens de toutes confessions font irruption dans notre vie privée, rompant le calme, profitant de notre hospitalité pour harceler le musulman sans défense."}, {"t": "p", "x": "Ceux qui craignent de dire la vérité lorsque ces chrétiens les défient, qui osent même insulter notre bien-aimé Nabi Mohammed (Ç), devraient revoir leur Eimann. Mes conférences interrogent ces missionnaires furtifs qui \"forcent les portes\" des maisons et le coeur des musulmans imprudents et qui interfèrent dans les affaires d’autrui. Les conférences doivent aussi permettre de restaurer la dignité spoliée du musulman, contrariée par les attaques sans pitié des chrétiens. Demandez aux musulmans de Chatsworth, Hanover Park ou Riverlea (1) s’ils ne subissent pas la tyrannie de certains missionnaires."}, {"t": "p", "x": "Si mon livre \"La Bible, est-elle la Parole de Dieu ?\" trouve une place dans les foyers musulmans et se pose en rempart contre la menace des missionnaires, alors mes efforts ne seront pas vains."}, {"t": "p", "x": "La plus grande récompense serait qu’un des disciples de Jésus (P) suive la voie de la vérité et s’éloigne de toutes les contrefaçons et du mensonge. La plus grande des récompenses serait qu’Allah Tout-Puissant (qu’Il me guide et m’accorde Sa miséricorde, Sa grâce et Son pardon) accepte que je Lui dédie mes efforts en toute humilité."}, {"t": "p", "x": "1. Ce sont des communes où vivent les musulmans les plus pauvres, selon la loi sud-africaine \"GrauP Areas Act\" Acte de sectorisation raciale)."}, {"t": "p", "x": "Les traductions des citations coraniques ont été tirées de l’Essai d’interprétation du Coran inimitable. Traduction par Denise P Masson, revue par D- Sobhi al-Saleh, Gallimard, Bibliothèque de la Pléïade 1967. Les traductions des citations bibliques ont été tirées de \"La Sainte Bible\", traduite d’après les textes originaux hébreu et grec. Nouvelle version Segond Révisée. Société biblique Française, Paris 1978."}]}]}]}, {"id": "debat", "title": "Le grand débat : Deedat – Swaggart", "sub": "« La Bible est-elle la parole de Dieu ? » Exposés et questions du public, Louisiane", "chapters": [{"n": 1, "title": "Les exposés", "sections": [{"title": "Introduction au débat", "blocks": [{"t": "p", "x": "L’association des Etudiants Islamiques de Louisiane nous a envoyé un SOS pressant pour que soit organisé un débat avec le Révérend Jimmy Swaggart Monsieur Ahmed Deedat a immédiatement accepté."}, {"t": "p", "x": "Il a été proposé que chaque orateur parle pendant soixante minutes. Le ministère de Jimmy Swaggart a répondu qu’il désirait que chaque orateur ne dispose que de vingt minutes. Cette réponse nous a déçus, car un sujet tel que \"La Bible est-elle la parole de Dieu ?\" ne peut être traité convenablement en un laps de temps si Court (ainsi que notre public pourra en juger par ce qui va suivre). Cependant, après des négociations acharnées, il a été convenu que chacun disposerait de quarante minutes. Les spectateurs verront qu’étonnamment, au bout de trente-neuf minutes, Jimmy Swaggart reconnait qu’il n’a défendu qu’un tiers de son sujet. Nous ne savons ce qu’il faut en conclure de la part de quelqu’un qui dit prêcher devant un vaste public depuis de si nombreuses années."}, {"t": "p", "x": "Monsieur Ahmed Deedat, quant à lui, aurait pu continuer à prouver pendant encore de longues minutes s
