a conception selon laquelle la Bible n’est pas la parole de Dieu. Si Jimmy Swaggart croyait qu’en limitant le temps de parole il marquerait des points, eh bien, vous, spectateurs, soyez-en juges. La Paix soit avec vous!"}, {"t": "p", "x": "Au nom d’Allah, frères, soeurs et amis, voici le plan du débat d’aujourd’hui. Le Révérend Jimmy Swaggart va commencer. Il nous parlera pendant trente minutes, après quoi Frère Ahmed Deedat aura la parole pendant 40 minutes. Enfin, le Révérend Jimmy Swaggart reviendra pour nous parler pendant dix minutes encore. Cela nous a semblé juste et équitable, et ils l’ont accepté tous les deux. Ensuite, vous l’assistance, vous aurez la possibilité de poser des questions aux orateurs. Nous disposerons d’une heure pour les questions et les réponses. Je vous rappelle le titre du débat: \"La Bible estelle la parole de Dieu ?\" Que notre conduite à tous, musulmans et chrétiens, soit la meilleure possible. Qu’Allah le Tout-Puissant nous bénisse! Je vous présente le Révérend Jimmy Swaggart."}]}, {"title": "Exposé de Jimmy Swaggart", "blocks": [{"t": "p", "x": "Merci beaucoup. Je suis extrêmement heureux d’être ici ce soir et bien que nos amis musulmans soient à l’origine de ce débat, ou plutôt de ces allocutions, il n’empêche que cet éminent savant du monde de l’Islam, Monsieur Ahmed Deedat, est venu pour être avec nous dans notre ville. Je viens de rencontrer Monsieur Deedat cet après-midi, ou plutôt ce soir, à vrai dire pendant quelques minutes seulement, et c’est le genre d’homme pour qui on éprouve de la sympathie dès le départ, et je voudrais que nous tous chrétiens, ici présents, et bien sûr je sais que les musulmans se joindront à nous, et ceci n’empiètrera pas sur mes trente minutes, j’aimerais que nous souhaitions chaleureusement la bienvenue à Monsieur Deedat dans notre ville de Bâton Rouge. C’est"}, {"t": "p", "x": "un savant, alors que moi-même, je ne suis pas un théologien de la Bible, bien que je l’étudie passionnément. Monsieur Deedat a taquiné ma femme et moi-même juste avant notre arrivée en disant que l’Islam permet d’avoir quatre épouses. Il vient de me corriger: \"jusqu’à quatre. J’ai répondu : \"Monsieur Deedat, le christianisme ne nous en autorise qu’une, c’est pourquoi j’ai dû trouver la meilleure du premier coup. Je suis très honoré d’être ici ce soir, très heureux d’avoir ainsi l’occasion de m’exprimer brièvement sur ce que nous croyons être la parole de Dieu Tout- Puissant."}, {"t": "p", "x": "Je voudrais dire quelque chose juste avant que nous commencions. Je ne sais pas grand chose sur l’Islam. Je ne suis pas fier du tout de le dire, mais je dois être honnête. Ces quelques derniers mois j’ai étudié un peu l’Islam, et j’avoue que je n’ai fait qu’effleurer le sujet. Il y a quelque temps, il y a peut-être deux ans, j’ai fait à la télévision une remarque désobligeante sur le Coran. Si vous n’écoutiez pas cette semaine-là, je ne vais pas vous la répéter, mais je tiens à présenter mes excuses. Je n’ai jamais recommencé ét ne le recommencerai jamais, parce que j’estime que ce n’était pas ce qu’il fallait faire."}, {"t": "p", "x": "Puis j’ai étudié un peu le sujet, comme je viens de le dire, et j’ai appris que les musulmans sont parmi les gens les plus hospitaliers du globe. J’ai aussi appris que vous vous vouez entièrement et totalement à votre foi, en d’autres termes, que ce n’est pas un simple simulacre pour vous, et que vous y apportez le plus grand sérieux. Et comme l’a dit, il y a un instant notre distingué Président, les deux influences religieuses les plus puissantes dans le monde d’aujourd’hui sont le christianisme et l’islam, et j’aimerais dire d’emblée que le peuple chrétien aime le peuple musulman."}, {"t": "p", "x": "J’ai appris à respecter le Coran et j’ai appris à respecter les musulmans, et je ne crois pas que le Coran soit la parole de Dieu. Je ne crois pas que Mohammed ait été le prophète de Dieu, mais je respecte vos croyances, je respecte votre foi et je respecte votre sincérité. En d’innombrables occasions, devant de vastes publics de téléspectateurs, j’ai brandi cette Bible ou une autre qui lui ressemble, et je suis sûr que la plupart d’entre vous m’ont vu le faire. A la télévision, je l’ai fait à l’attention de 140 pays de par le monde et j’ai affinné: \"Ceci est la parole de Dieu Tout-Puissant."}, {"t": "p", "x": "J’ai affirmé qu’il n’y a pas d’autre parole de Dieu et que c’est par ce livre que nous vivons ou mourons, coulons ou surnageons. Je le crois et je le crois de tout mon coeur. Mais bien sûr c’est facile à dire, ce sont des paroles qui ne coûtent pas grand chose. Et j’aimerais commencer ce soir en citant un passage des Ecritures sur lequel Monsieur Deedat et moimême ne sommes pas tout à fait d’accord. Mais qui, dans la parole de Dieu, est cher sinon le plus cher au coeur des chrétiens. Il se trouve, dans l’Evangile selon Saint Jean, chapitre 3, verset 16: \"Car Dieu a tant aimé le monde qu’il a donné son fils unique afin que quiconque croit en lui ne périsse point mais qu’il ait la vie éternelle."}, {"t": "p", "x": "Et je voudrais baser la simple déclaration que je vais tenter de faire ce soir sur ce texte. Je voudrais que nous baissions tous la tête, et que nous demandions à Dieu de bénir cet effort. \"Père céleste, en venant vers toi, nous demandons que tu nous aides, nous tous ici, à nous comporter comme je sais que nous allons le faire, par ton aide et ta grâce, de la façon dont tu désires que nous le fassions. Mais que chaque mot soit à ta gloire, que nous ne disions que ce que tu désires, de la manière dont tu le désires, au nom saint et adoré de Jésus."}, {"t": "p", "x": "Aucun chrétien ne dira que Dieu a écrit la Bible. Dieu n’a pas écrit la Bible. Pour vous dire la vérité, la seule chose que je connaisse que Dieu ait écrite, c’est les dix commandements sur la pierre pour Moïse. Ce fut le décalogue conservé dans l’arche de"}, {"t": "p", "x": "l’alliance pendant des siècles et des siècles. Mais Dieu n’a jamais écrit la parole de Dieu. La Bible, c’est l’homme qui l’a écrite. La Bible, dans le sens d’une compilation de livres, l’homme l’a écrite selon Simon Pierre selon l’esprit saint. Pierre a dit que des hommes parmi les plus saints l’ont écrite, poussés et inspirés par Dieu, pour écrire ce qui venait de Dieu. Dieu a utilisé leur personnalité, il a utilisé leur caractère, il a utilisé leur dévotion pour lui. il a même parfois utilisé leur particularité."}, {"t": "p", "x": "Mais il a utilisé les hommes afin que son grand projet pour cette planète, pour l’humanité toute entière, puisse être exprimé en des mots simples, pour que l’homme puisse l’appréhender, que l’homme puisse le comprendre. Aucun livre au monde n’a fait l’objet d’autant d’études critiques. Je me sens quelque peu insignifiant en essayant de disserter sur la Bible, alors que je sais que quelques-uns des savants les plus éminents au monde ont passé au crible le moindre texte encore et encore, n’épargnant ni dépense, ni temps, ni effort pour en sonder l’authenticité."}, {"t": "p", "x": "J’ai lu la Bible de bout en bout maintes et maintes fois, et d’autres que moi l’ont lue plus souvent, d’autres beaucoup plus instruits que je ne pourrai jamais l’être, qui comprenaient à la fois l’hébreu et le grec."}, {"t": "p", "x": "Les premiers passages de la Bible ont été écrits il y a environ trente-cinq siècles. A ma connaissance, c’est le livre le plus ancien au monde sur la Révélation. Nous croyons que Moïse a écrit ce qu’on appelle le Pentateuque, les cinq premiers livres, à l’exception peutêtre des derniers versets. Le Deutéronome, il pourrait même l’avoir écrit, parce que nous croyons que Dieu, et je sais que l’islam le croit, est si puissant qu’il pourrait avoir révéler à Moïse exactement comment il allait mourrir, et comment ses funérailles se dérouleraient."}, {"t": "p", "x": "Ça n’aurait pas été un problème pour Dieu, car que ce soit Moïse ou Josué qui l’ait écrit, il a été écrit il y a environ trente-cinq siècles, et la totalité de la parole de Dieu, comme vous êtes si nombreux à le savoir, a été écrite par environ quarante hommes sur une période de seize à dix-huit siècles environ, le dernier livre ayant été écrit approximativement un siècle après la mort, la résurrection et l’ascencion de notre Seigneur JésusChrist, par l’apôtre Jean. Il a donc fait l’objet d’études critiques plus que tout autre livre au monde, comme je l’ai mentionné."}, {"t": "p", "x": "Il est très intéressant de savoir que, dans sa traduction anglaise du Coran largement utilisée, Yusuf Ah cite à deux reprises Sir Frédéric Kinian comme faisant autorité. Kinian, ancien conservateur en chef du British Museum, a été parmi ceux qui ont fait autorité dans le monde dans l’étude critique des textes anciens. Pour ce qui est de la fiabilité du texte de la Bible, il a conclu que le chrétien peut prendre la Bible toute entière dans sa main et dire, sans crainte ni hésitation, qu’il tient dans la main la vraie parole de Dieu."}, {"t": "p", "x": "Concernant le Seigneur Jésus-Christ, le professeur de Harvard, Simon Greenhif, à qui on a attribué le mérite avec Joseph Storey, juge de la Cour Suprême, de la renommée atteinte par la Harvard School. Monsieur Greenhif, donc, a abandonné son agnosticisme après seulement un mois d’études attentives et de recherches approfondies. Il est reconnu comme l’autorité aux Etats-Unis en matière de preuves juridiques, et Monsieur Greenhif s’est trouvé logiquement obligé de conclure, après une longue analyse critique, que ces évènements réels et historiques que sont la mort, l’ensevelissement, la résurrection du Christ, fils de Dieu, pour le rachat de nos péchés, étaient démontrés par des preuves indéniables, irréfutables, et c’est l’un des juristes les plus brillants du monde. En complet accord, le professeur Thomas Arnold qui occupe ou occupait la chaire d’Histoire Moderne à Oxford a écrit: \"J’ai pris l’habitude depuis de nombreuses années"}, {"t": "p", "x": "d’étudier l’histoire d’autres époques et de m’interroger sur le crédit et les témoignages de ceux qui avaient écrit sur ces époques, et je ne connais pas un seul évènement dans l’histoire de l’humanité qui, pour un enquêteur de bonne foi, ait été corroboré par de meilleures preuves plus complètes, de toutes sortes, que le signe extraordinaire que Dieu nous a donné, Jésus-Christ mort et ressuscité d’entre les morts, ce que proclame la parole de Dieu. Aucun homme n’a jamais dit qu’il mourrait et reviendrait d’entre les morts comme l’a fait Jésus-Christ."}, {"t": "p", "x": "Maintenant, certains se réfèrent aux nombreuses versions de la Bible, ce qui est vraiment une assertion incorrecte. Il n’y a qu’une version de la Bible. Il y en a de nombreuses traductions. Nos savants débattent sans cesse sur ces diverses traductions. La version du roi James - puisque nous utilisons ce terme, mais incorrectement comme je l’ai dit - est, en réalité, une traduction. D’autres traducteurs ont mis en question la version du roi James, au point de travailler constamment à partir de l’hébreu, langue originale de l’Ancien Testament, à l’exception de quelques versets en araméen et à partir du grec pour le Nouveau Testament."}, {"t": "p", "x": "A notre avis, certaines traductions sont incorrectes. Personnellement, j’aime celles du roi James.Toutefois, le Coran a été traduit, lui aussi, dans de nombreuses langues, et il en existe différentes traductions en anglais, en Afrique du Sud, et Monsieur Deedat peut me corriger si je me trompe, je crois que c’était en 1978, on a publié une certaine traduction du Coran qui a été très discutée, et je crois qu’on a exigé son retrait du marché. Donc, les savants du Coran ont le même problème que nous, chrétiens, pour passer d’une langue à une autre, ce qui n’est pas facile."}, {"t": "p", "x": "Dans certaines langues les mots n’existent même pas pour exprimer ce que l’on veut dire. Il est donc très, très difficile parfois de trouver le mot exact qui recouvre exactement ce qui a été écrit en hébreu ancien ou en grec ancien. Il existe quelque vingt-quatre mille manuscrits de la parole de Dieu, je devrais dire rien que pour le Nouveau Testament. Certains remontent à 350 avant notre ère. L’expression originale, la signature, l’autographe de la parole de Dieu n’existent pas. Comme je l’ai dit, les premiers manuscrits ont été écrits sur du parchemin ou sur des tablettes d’argile, il y a quelque trente-cinq siècles."}, {"t": "p", "x": "Ils ont fini par disparaître à force d’être trop utilisés, et d’avoir été mis sur des supports peu résistants ou du moins pas résistants à ce point. Mais, de toute manière, quelque vingt-quatre mille exemplaires ont été produits et les savants nous disent que lorsqu’il s agit de livres de l’Antiquité, si au moins dix exemplaires existent, on n’a pas besoin de l’original pour garantir l’authenticité du texte. Et quand on considère qu’il y a vingt-quatre mille exemplaires, on peut admettre qu’il y ait quelques variantes mais, fondamentalement, le texte n’est pas modifié."}, {"t": "p", "x": "Il existe plusieurs livres, certains appelés les apocryphes qui n’ont pas été inclus dans les Bibles protestantes, mais que les catholiques ont inclus dans les leurs pour des raisons qui leur sont propres, et la raison pour laquelle nous-mêmes n’avons pas inclus ces soidisants livres dans la Bible, est simplement que nous croyons qu’ils ne sont pas d’inspiration divine. Et quand on commence à les étudier, il y a quantités de raisons qui démontrent qu’ils ne sont pas d’inspiration divine."}, {"t": "p", "x": "Maintenant, l’islam nous dit que les musulmans croient en la Thora et l’Injîl. Ils vont conclure qu’ils croient en la Thora et l’Injîl mais que ceci n’est pas la Thora ni l’Injîl, mais un texte dénaturé. Et si c’est un texte dénaturé notre foi est vaine. Si c’est un texte dénaturé que je tiens dans la main, si ce n’est pas la parole de Dieu, alors une multitude, des millions et des millions de chrétiens ont cru en vain, ont vécu en vain et sont morts en vain. Ils nous disent que les livres originaux donnés par Dieu la Thora, l’Ancien"}, {"t": "p", "x": "Testament, l’Injîl, le Nouveau Testament ont été perdus. Et je ne crois pas que quiconque puisse nous dire où ils ont été perdus, quand ils ont été perdus, et comment ils ont été perdus. Je poserai cette question \"Si Dieu a donné ces deux livres originaux, la Thora et l’Injîl, ils sont la parole de Dieu comme le dit le Coran et je crois que tout musulman cultivé garantirait que, comme l’affirme le Coran, Dieu Tout-Puissant a donné des livres autres que le Coran la Thora et l’Injîl. Si Dieu a donné ces livres, Dieu ne pouvait-il pas les préserver?"}, {"t": "p", "x": "Nous autres, chrétiens, nous croyons que Dieu est omnipotent. L’Islam croit que Dieu est omnipotent. Et si Dieu est omnipotent, il aurait pu aisément préserver ses livres sans qu’ils soient perdus. Mohammed se réfère à ces livres un bon nombre de fois dans le Coran et dans les autres livres saints qui ont été écrits, et je vous affirme ce soir que l’Ancien Testament que je tiens dans la main est le même ancien testament qu’avaient les juifs au temps de Mohammed. Il n’a pas changé. L’Injîl ou le Nouveau Testament que je tiens dans la main est le même livre que l’Eglise avait du temps de Mohammed. Dieu l’a préservé. Notre foi n’est pas vaine. Je crois que je peux prouver ce soir qu’elle n’est pas vaine."}, {"t": "p", "x": "Je suis convaincu que tous les musulmans, ici présents, le savent. Après la mort de Mohammed, il est bien connu que de nombreuses versions du Coran circulaient et les docteurs de la religion musulmane donnèrent des instructions pour que le calife ottoman uniformise le texte - je me demande combien de musulmans le savent, peu de temps après la mort de Mohammed - parce qu’il existait de nombreux textes du coran, mais nous ne sommes pas en train d’étudier le coran ce soir. Je veux seulement le dire en passant, il s’agit là d’une foule d’interprétations différentes. Pendant le règne ottoman, on lui rapporta que dans différentes régions de Syrie, d’Arménie et d’Irak, les musulmans ne récitaient pas le Coran de la même façon qu’en Arabie."}, {"t": "p", "x": "Othmân réclama immédiatement le manuscrit du Coran qui était dans la possession de Abssa, une des femmes de Mohammed et fille d’Omar, et ordonna à Zayn bent Thabet et à trois autres personnes de faire des copies du texte et de le corriger partout où cela était nécessaire. Quand cela fut fait, on dit qu’Othmân prit des mesures draconiennes concernant les autres manuscrits du Coran qui circulaient alors. Il envoya dans chaque province musulmane un exemplaire du texte qui venait d’être copié et ordonna que tous les autres manuscrits du Coran, qu’il s’agisse d’extraits ou du texte complet, soient brûlés."}, {"t": "p", "x": "S’il n’était pas contradictoire, je me demande pourquoi il a ordonné qu’ils soient brûlés. Les seuls qui aient jamais ordonné que la Bible soit brûlée étaient ceux qui la haïssaient. Je me demande si cela a jamais été étudié. Combien de passages du Coran - et c’est un livre magnifique, sans égal du point de vue littéraire - combien d’histoires ont été plagiées, des fables et du folldore juif, je me le demande. Je désire m’arrêter un moment sur les prétendues contradictions aux variantes trouvées dans la parole de Dieu, et à partir de là, je veux vous prouver que c’est bien la parole."}, {"t": "p", "x": "Dans Samuel il chapitre 24 verset 4 et les Chroniques I chapitre 21 verset 1, il est mentionné que Dieu excita David: Samuel livre 11, et que Satan excita David: Chroniques livre I. Il semble y avoir là une contradiction bien sûr, quiconque étudie la parole de Dieu sait cela. Il est dit que Dieu fait des choses que souvent il ne fait qu’autoriser. Pour être franc"}, {"t": "p", "x": "avec vous, il est évident que, dans le Coran, Dieu agit de même. Je le répète, il n’y a là aucune contradiction."}, {"t": "p", "x": "Dieu, surtout dans l’Ancien Testament, est tenu responsable de quelque chose alors qu’il a seulement permis que cette chose soit faite. Et, en réalité, si on y réfléchit, il est effectivement responsable. Dans les Rois1 chapitre 4 verset 26, il est question de 40 000 crèches pour les chevaux, et dans la Gloire de Salomon, Chroniques 2 chapitre 9 verset 25, de 4 000 crèches pour les chevaux. Il s’agit du même fait. Que devons-nous penser? N’est-ce pas une contradiction ? C’en est une, pleine et entière, il s’agit de la même histoire."}, {"t": "p", "x": "Il ya plusieurs passages dans la parole de Dieu qui racontent exactement la même chose de manière différente. Un compte-rendu aura été fait et le nombre aura été légèrement modifié, un autre compte-rendu aura été fait, il aura mentionné 2 000 alors que dans les Chroniques, livre 1 ou livre 2, il aura été question de 3 000 ou de tout ce que vous voudrez. Saint Jean, chapitre 8 versets 1 à 11, raconte l’histoire d’une femme surprise en adultère, et certains disent que ce passage ne se trouvait pas dans le texte original, que c’est une imposture, que c’est une dénaturation."}, {"t": "p", "x": "Cependant, la vulgate de Byzance, la Syriaque de Jérusalem, la Méphénite, l’Ethiopienne et les Pères de l’église primitive, disent que ces passages se trouvaient dans les premiers manuscrits. Dans les Rois 2:19 et Isaïe 37, il y a des chapitres qui sont identiques mot pour mot. Pourquoi? Si Dieu les a donnés se seraient-ils répétés ? Pourquoi pas ? Jésus lui-même s’est répété parfois. Dans le Coran, dans la sourate 32 verset 5 il est question de 1000 ans, dans la sourate 70 verset 4, il est question de 50000 ans. Un jour est comme 1 000 ans, un jour est comme 50000 ans, est-ce là une contradiction ? (certainement pas, le Coran s’exprime en un langage divin, allégorique, cosmique."}, {"t": "p", "x": "A la différence, la Bible cite de manière concrète des nombres de crèches pour chevaux). Voici ce que j’ai à vous dire: s’il s’agissait d’un texte dénaturé, s’il s’agissait d’une imposture, d’une supercherie, ne pensez-vous pas que les imposteurs auraient retiré de la parole de Dieu ces prétendues contradictions. Vous êtes-vous jamais arrêté sur cette idée ? Certains se sont échinés sur le texte pour s’assurer qu’ils comprenaient exactement ce que disait le manuscrit. ils ont traduit de l’hébreu et du grec. Que s’est-il donc passé ?"}, {"t": "p", "x": "Si c’est la parole de Dieu, pourquoi ces contradictions s’y trouveraient-elles ? En fait, c’est tout simple. Il n’y avait pas de photocopieuse Xerox en ce temps-là, il n’y avait pas d’ordinateur, on devait copier à la main, et un copiste commet parfois des erreurs. Je pense que nos frères musulmans seront d’accord làdessus. Concernant la généalogie dans Matthieu et Luc, dans Matthieu c’est celle de Joseph, et dans Luc c’est celle de Marie."}, {"t": "p", "x": "Dans le temple de Jérusalem, s’il y avait eu quoi que ce soit de faux dans la généalogie du Christ, on l’aurait fait remarquer immédiatement, mais on ne l’a pas fait. Ce livre est un livre d’histoire. Il raconte des milliers de détails concernant les villes, les gens, et pas une seule pelletée de poussière archéologique n’a jamais pu en réfuter un seul mot. Deuxièmement, des milliers et des milliers de prophéties et qui se révèlent justes. Je voudrais terminer rien qu’en disant ceci. Je n’ai jamais rencontré cet homme avant ce soir."}, {"t": "p", "x": "J’ai lu le petit livre qu’il a écrit et je dois l’avouer Monsieur Deedat, j’ai été un peu interloqué. Je m’attendais à un peu plus de courtoisie et je ne veux pas vous parler de notre réunion d’aujourd’hui. Je veux parler de votre petit livre qui m’a peiné, m’a attristé. Samedi soir, je suis allé prier dans notre église. J’ai commencé à prier en pensant à cette réunion et je crois que le Seigneur a parlé à mon coeur. Vous êtes plus âgé que moi et je vous témoignerai le respect que votre âge et votre savoir méritent, sans le moindre"}, {"t": "p", "x": "doute. Le Seigneur, je le crois, a mon coeur et m’a dit : voici ce que tu diras à cet homme éminent: \"Il y avait un autre homme, il y a 2000 ans, SaU1 de Tarse qui n’aimait pas les chrétiens. Et je pense que vous connaissez l’histoire. Saùl rencontra Jésus avant que son temps ne soit venu, sur la route de Damas, et Jésus lui demanda : \"Pourquoi regimbes-tu contre les aiguillons ?\""}, {"t": "p", "x": "Et je crois que notre père céleste m’a chargé de vous demander, et je le dis avec considération et respect : Pourquoi vous regimber devant le plus grand des prophètes, le fils de Dieu, le Seigneur Jésus-Christ ? Il m’a dit (si c’était bien Dieu qui me parlait) : \"Dis à Monsieur Deedat que je l’aime car je suis un Dieu d’amour, et dis-lui que s’il veut me donner son coeur, j’en comblerai la solitude et la souffrance et que je donnerai au peuple musulman un amour tel qu’il n’en a jamais connu auparavant, dans toute sa vie. Et je terminerai ce petit exposé (à peine le tiers de ce que j’avais à dire) en déclarant que nous vous aimons et que Dieu vous aime. Dieu vous bénisse."}]}, {"title": "Exposé d’Ahmed Deedat", "blocks": [{"t": "p", "x": "Bissmillah rahman al-rahim"}, {"t": "p", "x": "\"Malheur à ceux qui écrivent le Livre de leurs mains, et qui disent, ensuite, pour en tirer un faible prix \"Ceci vient de Dieu !\" Malheur à eux à cause de que leurs mains ont écrit à cause de ce qu’ils ont fait\" (Saint Coran 2:79) Monsieur le Président, chers Frères, J’aurais voulu aborder d’emblée le sujet, mais le plaidoyer qu’a fait Frère Swaggart m’oblige à faire une confession de foi, à savoir qu’il se trouve que nous autres musulmans nous avons la seule foi non chrétienne dont les croyants ont pour article de foi de croire en Jésus."}, {"t": "p", "x": "Aucun musulman n’est un vrai musulman s’il ne croit pas en Jésus. Nous croyons que Jésus-Christ a été un des plus puissants messagers de Dieu. Nous croyons qu’il a été le Messie. Nous croyons en sa naissance miraculeuse que beaucoup de chrétiens des temps modernes rejettent aujourd’hui. Nous croyons qu’il a rappelé les morts à la vie par la permission de Dieu et qu’il a guéri les aveugles de naissance et des lépreux par la permission de Dieu. Nous et vous allons dans le même sens. La seule divergence de vue, la seule différence réelle entre les musulmans et les chrétiens est que nous disons qu’il n’est pas Dieu tout-puissant fait homme, qu’il n’est pas l’incarnation de Dieu et qu’il n’est pas le fils engendré par Dieu. Métaphoriquement parlant, nous sommes tous enfants de Dieu, les bons comme les méchants, mais Jésus était plus le fils de Dieu qu’aucun d’entre nous, car il fut plus fidèle à Dieu qu’aucun"}, {"t": "p", "x": "d’entre nous pourrait jamais l’être. De ce point de vue, noùs admettons qu’il est au plus haut point le fils de Dieu. Mais pas dans le sens où l’entendent les chrétiens, c’est-à-dire qu’il est le seul fils qui engendre Dieu, engendré non pas créé, pas dans ce sens-là. Venons-en à notre sujet. Notre sujet est le suivant La Bible est-elle la parole de Dieu ? Et Frère Swaggart nous a donné à entendre que les traductions et les versions sont une seule et même chose. Nous autres musulmans, nous avons un certain nombre de traductions du Coran, y compris en anglais, faites par des personnes différentes, Youssef Ah, Marmaduke Picktall, Yabadi, etc."}, {"t": "p", "x": "Nous avons des traductions en anglais faites par différents traducteurs. Or, différentes traductions, cela suppose des différences dans le choix des mots. Par exemple pour traduire tel ou tel phrase d’arabe en anglais, dans le choix des mots, les versions sont quelque chose de tout à fait différentes. J’ai ici, dans la main, cette Bible (Holy Bible, Douay Version) que Frère Swaggart ainsi que de nombreux protestants n’acceptent pas comme étant la parole de Dieu. C’est la version catholique romaine de la Bible. Cette Bible se compose de 53 livres, sept de plus que celle sur laquelle Frère Swaggart prête serment, la version du roi James."}, {"t": "p", "x": "Dans son \"Evangelist magazine, en décembre 1985, quelqu’un demandait si la Bible était la parole de Dieu. Et il a répondu: \"C’est la parole de Dieu, et entre parenthèses, je me réfère à la version du roi James. Dans votre \"Evangelist de d~cembre 1985, la version du roi James a supprimé ses sept livres supplémentaires. Autrement dit, ces sept livres supplémen taires, les protestants ne les acceptent pas comme étant ha parole de Dieu. Vous utilisez certains termes techniques comme \"apocryphe\" que la grande majorité des chrétiens ne connaissent pas."}, {"t": "p", "x": "Que veut dire \"apocryphe\" ? Il veut dire : douteux, faible, qui ne mérite pas d’être dans le livre de Dieu. C’est pourquoi les protestants ont supprimé les apocryphes comme étant une invention. Donc, cette version-ci de la Bible, les chrétiens protestants ne l’acceptent pas comme étant la parole de Dieu. N’ai-je pas raison Frère ? Ce n’est pas la parole de Dieu. Par conséquent, nous la rejetons. J’accepte ce que vous me dites. Vous dites, ceci n’est pas la parole de Dieu et je dis : je suis d’accord avec vous et je la rejette."}, {"t": "p", "x": "A présent, vous me dites que ceci st la parole de Dieu, à savoir la version du roi James avec ses 66 livres. Elle a été publiée pour la première fois en 1611 sur l’ordre de sa majesté le roi James dont le nom s’est maintenu jusqu’à aujourd’hui (The Holy Bible, The authorized King James Version), la Version Autorisée, mais autorisée par qui ? Pas par le Dieu tout- puissant ? Mais par le roi James. C’est lui qui l’a autorisé, pas le Dieu tout-puissant! Or, elle remonte aux anciens manuscrits, c’est-à-dire quatre à six cent ans avant Jésus-Christ."}, {"t": "p", "x": "Or nous avons eu accès aux manuscrits les plus anciens. Cette traduction ou version, la Version Standard Révisée, remonte aux manuscrits les plus anciens. il date de deux ou trois cent ans après Jésus-Christ. Ils sont donc plus près de la source. Or, plus un document est prêt de la source, plus il est authentique. Cela va de soi. Si ceci avait été écrit du temps de Jésus, et qu’il l’avait signé et dédicacé, il n’y aurait aucune contestation possible. Celle-ci date de deux à trois cent ans après, celle-la de quatre à six cent ans après, donc cette traduction a été publiée ici dans votre propre pays, ainsi qu’en Grande-Bretagne, au Canada."}, {"t": "p", "x": "Tous ces pays ont fait paraître cette Bible en même temps. Et nous apprenons que cette traduction a reçu les plus vives louanges. Par exemple, \"Church of England Newspaper dit que \" C’est la meilleure version qui est parue au cours de ce siècle. Cette version serait la meilleure. D’après le supplément littéraire du Time (Time literary supplement), c’est une traduction entièrement nouvelle faite par les savants les plus éminents qui ont pleinement utilisé les ressources du savoir moderne. \"Life and Work\", une autre publication, parle des"}, {"t": "p", "x": "caractéristiques très appréciées de la Version Autorisée jointes à une exactitude nouvelle dans la traduction. Quant au Times anglais, il parle de l’interprétation la plus exacte et la plus proche de l’original. Les éditeurs de cette Bible, ceux qui l’ont fait connaître pour la première fois en 1952 environ, décerne les plus vives louanges à la Version du roi James et j’aurais manqué à mon devoir si je ne vous avais pas lu ces louanges. Le Frère Swaggart apprécie hautement et moi aussi."}, {"t": "p", "x": "Chaque citation que je ferai sera tirée de la version du roi James. J’en aime beaucoup le langage, le problème est que maintenant certains termes et expressions sont supprimés. Ils ne conviennent pas aux chrétiens d’aujourd’hui comme par exemple la citation par laquelle Frère Swaggart a terminé son discours à propos de Paul sur la route de Damas. Le persécuteur des premiers chrétiens a eu une vision. Jésus-Christ lui apparait et lui dit en hébreu: \"SaùI, Saùl, pourquoi me persécutes-tu. Il te serait dur de regimber contre les aiguillons (pricks en anglais) ?\" (Actes 9:5) C’est là la citation exacte de la version du roi James, tandis que Frère Swaggart, je ne sais pas pourquoi, a utilisé le mot \"goads."}, {"t": "p", "x": "J’ai demandé à des chrétiens ce que signifiait le mot \"goads et personne ne sait ce que veut dire \"goads. J’ai demandé : Pourquoi changez- vous les mots ? Il est question du mot \"pricks. Il faut garder le mot \"pricks si c’est là la langue originale du roi James, mais voilà qu’il parle des \"goads. C’est la première fois de ma vie que j’entends parler de ce mot. C’est un mot nouveau, une nouvelle terminologie qui apparaît. Changer les mots, la traduction, je n’ai pourtant rien à y redire. Donc ce que disent à propos de la version du roi James, les réviseurs de la Version Standard Révisée --trente-deux savants parmi les plus éminents soutenus en cela par cinquante confessions-- c’est que la version du roi James a été qualifiée avec raison de monument le plus noble de la prose anglaise."}, {"t": "p", "x": "Ces réviseurs, en 1881, ont exprimé leur admiration pour sa simplicité, sa dignité, sa puissance, l’heureux choix de ses expressions, ses cadences musicales et la beauté de son rythme. Elle a contribué, plus qu’aucun autre ouvrage, à façonner le caractère individuel et les institutions publiques des peuples anglophones - je le dis, nous avons envers elle une dette incalculable - tels les Américains, les Canadiens, les Britanniques, et des gens comme moi qui ont adopté l’anglais comme langue maternell. Je parle l’anglais mieux que n importe quelle autre langue, quoique pas aussi bien que le Frère Swaggart."}, {"t": "p", "x": "Voilà donc pour les louanges. Si quelqu’un décernait de telles louanges au Coran, je ne pourrais pas imaginer qu’un savant musulman puisse en décerner de plus flatteuses. A présent, préparez-vous à recevoir un choc, comme je me prépare aussi à ce choc."}, {"t": "p", "x": "A partir de là, trente-deux savants parmi les plus éminents, soutenus en cela par cinquante confessions, disent pourtant que la Version du roi James a de graves défauts. Et ces défauts sont si nombreux et si graves - ce n’est pas moi qui emploie ces mots qu’ils appellent une révision de la traduction anglaise. Ils l’ont révisée, et dans cette révision, le roi a des évangélistes: le prêcheur, l’ardent orateur, l’actif prédicateur de la Bible (Chants, chapitre 3 verset 16). Aucun prédicateur chrétien ne peut l’égaler. Aucun ne soutient la comparaison avec Jean. Jean chapitre 3 verset 16 (Version Autorisée du roi James) dit: \"Car Dieu a tant aimé le monde qu’il a donné le seul fils qu’il ait engendré\"."}, {"t": "p", "x": "Frère Swaggart a changé le mot \"engendré\" en \"unique\". Ce n’est pas ce que dit la version du roi James. Elle dit \"engendré\". J’ai entendu le Frère Swaggart à la télévision ce matin. Il parlait à un groupe comme si c’était son propre groupe de fidèles. Vous savez, pendant un exposé sur Babylone, il a utilisé le mot \"engendré\" ce matin, et huit heures après, il utilisait à la place le mot \"unique\". Je vous le demande. Avez-vous honte du mot \"engendré, avez-vous honte du fait que Jésus est le seul fils engendré par Dieu ?"}, {"t": "p", "x": "Avant de venir, j’ai acheté les trente livres du Frère Swaggart, et j’ai parcouru chacun d’entre eux, il le fallait) je veux savoir ce dont mon frère parle, sans quoi il croit vraiment. Parce qu’en général lorsqu’on parle un chrétien, il se trouve que chaque chrétien est absolument unique. Dès que l’on met au pied du mur, il dit: \"Mais je ne crois pas en ça, et sur ce milliard de personnes, la moindre personne est unique, un tel appartient à l’église anglicane mais vous savez il ne croit pas en ce qu’enseigne l’Eglise anglicane, un tel appartient à l’Eglise catholique romaine, mais il ne croit pas vraiment en ce qu’enseigne l’Eglise catholique romaine."}, {"t": "p", "x": "Chacun est unique. Donc je me suis dit, voyons à présent ce que dit \"Black and White\", et j’ai vu qu’il cite ce passage de Jean chapitre 3 verset 16, et dans la citation de son livre il emploie le mot \"engendré\". Ce soir il dit \"unique\" et voyez-vous la raison est évidente. Les musulmans ne sont pas d’accord avec ce terme. Le Coran condamne cette idée que Dieu ait engendré un fils parce qu’ \"engendrer\" est un acte animal. Il appartient aux fonctions sexuelles animales les plus basses et nous n’allons pas attribuer une telle qualité à Dieu."}, {"t": "p", "x": "Les chrétiens, eux, disent dans leur catéchisme que Jésus est le seul fils engendré, non pas créé. Expliquez-moi, je vous prie, ce que vous essayez en fait de mettre en relief quand vous dites \"engendré, non pas créé, qu’est- ce que vous essayez en fait de me dire ? Et croyez-moi, en quarante ans, aucun Anglais digne de ce nom n’a su m expliquer ce mot. Il a fallu que je rencontre un Américain qui faisait un séjour à Durban (Il faisait une visite guidée à la Mosquée et il se trouvait que j’étais le guide) et avec lequel nous avons discuté le sujet."}, {"t": "p", "x": "J’ai dit \"Qu’est-ce que signifie \"engendré, non pas créé ? Cet Américain m’a dit: \"Ça signifie ’procréé’ par Dieu\". J’ai dit : \"Comment ?\" \"Non, non, ce n’est pas ce que je veux dire, mais c’est bien ça que ça veut dire : ’engendré, non pas crée’.\""}, {"t": "p", "x": "Donc, les musulmans sont fortement opposés à l’emploi d’une telle expression à propos de Dieu, que Dieu ait engendré un fils et cela d’après votre langage, à savoir le catéchisme de l’Eglise catholique, romaine, le catéchisme anglican, le catéchisme méthodiste, le catéchisme luthérien."}, {"t": "p", "x": "Vous acceptez cela. \"Engendré, non pas créé\", d’après lui, n’a pas le même sens que pour Adam. Adam a été créé par Dieu. Chaque chien, chaque cochon, chaque âne, a été créé par Dieu, et ainsi métaphoriquement parlant, il est le père de toutes choses. Mais il n’en est pas de même de Jésus. Il a été engendré, non pas créé. J’ai demandé : \"Pouvezvous m’expliquer ?\" Mais pas d’explication. C’était donc une chose à laquelle les musulmans étaient opposés. Et les trente-deux savants parmi les plus éminents soutenus en cela par cinquante confessions - ont supprimé ce mot."}, {"t": "p", "x": "Est-ce pour nous apaiser, est-ce que les musulmans vous ont fait des menaces ? Est-ce qu’ils ont dit: \"Voilà, si vous n’enlevez pas ce mot de la Bible, nous ne vous fournissons plus de pétrole. Pourquoi l’avez- vous enlevé ? Parce que c’était une interpolation, ce n’était pas la parole de Dieu."}, {"t": "p", "x": "La Bible que vous avez apportée contient une interpolation et vous avez dit ce matin (j’ai entendu la cassette) qu’il s’agissait d’un mot, rien que d’un mot. Même s’il n’est pas censé être là, il est là. Dans ce cas, le livre entier devrait être jeté. il ne s’agit pas que d’un mot, il s’agit d’un morceau entier selon vos réviseurs. Frère Swaggart me dit, dans un de ses livres, que si l’on veut prendre connaissance d’un fait, s’informer sur un sujet quelconque, on s’adresse aux spécialistes. Et il donne un exemple : Si on veut savoir quelque chose en géologie, on s’adresse à un géologue."}, {"t": "p", "x": "Si on veut savoir quelque chose sur la Bible, à qui s’adresse t-on, au coiffeur, au cordonnier? Non! On s’adresse aux spécialistes de la Bible, aux théologiens de la Bible, et ils vous diront que c’est une invention. Ainsi, la Trinité -- le Père, le Fils et le Saint-Esprit -- Frère Swaggart sait aussi textuellement la première épître de Jean chapitre 5 verset 7, où il est dit: \"Car il y en a trois qui rendent témoignage, l’esprit, l’eau et le sang et les trois sont d’accord\"."}, {"t": "p", "x": "S’il m’en donne le temps, et que vous me demandez dans quel livre il dit ça, je peux l’ouvrir et vous montrer textuellement cette citation. Mais regardez, elle n’est pas dans la Bible. N’est-ce pas la parole de Dieu ? Pourquoi ne se trouve-t-elle pas dans la Bible ? Parce que vos savants -- trente-deux savants parmi les plus éminents -- disent que c’est là une autre invention, une autre interpolation. Ils l’ont donc supprimé aussi, sans cérémonie. Une suppression de plus ! Et en ce qui concerne l’Ascension, Frère Swaggart cite dans son livre Marc chapitre 16, verset 16, un autre endroit de Marc, chapitre 16, verste 19, mais voilà ils ne se trouvent pas dans la Bible."}, {"t": "p", "x": "Ce n’est pas moi qui ai imprimé ce livre. Ce ne sont pas des juifs qui l’ont imprimé, ni des hindous, ce sont vous chrétiens qui avez produit ce livre et vous dites que c’est la Bible la plus à jour, qui remonte aux manuscrits les plus anciens."}, {"t": "p", "x": "Donc je cherche Marc, chapitre 16 et je vois qu’il se termine au verset 8. Les versets 9 à 20 manquent. Est-ce que c’est moi qui les ai enlevés Est-ce que ce sont des musulmans qui les ont enlevés. Non ! Ce sont trente-deux savants parmi les plus éminents qui ont estimé qu’il s’agissait d’une autre invention imposée au christianisme, et ils les ont supprimés. Ce n’est pas dans ma Bible, donc ce n’est pas la parole de Dieu. Si ceci est la parole de Dieu alors cela n’est pas la parole de Dieu."}, {"t": "p", "x": "Mais à présent, je prends une autre Bible. Regardez ces deux Bibles, elles sont identiques. Cependant, à l’intérieur de l’une d’elles, l’Ascension avait été supprimée. Il n’y a que deux endroits dans les Evangiles, dans celles de Matthieu, Marc, Luc et Jean, où l’Ascension est mentionnée : Marc chapitre 16, verset 19 et Luc chapitre 24 verset 51. L’Ascension! Supprimée de cette version, supprimée en tant qu’invention, et pourtant chacune de ces Bibles nous dit que Jésus entra dans Jérusalem monté sur un âne. Matthieu le dit, Marc et Luc également, ainsi que Jean."}, {"t": "p", "x": "Cet évènement-là n’est pas passé inaperçu aux yeux de Dieu tout- puissant, son fils entrant dans Jérusalem monté sur un âne, à une époque où n’importe qui entrait dans Jérusalem monté sur un âne. Ça il ne l’a pas oublié. Mais l’Ascension n’est pas mentionnée, pas une seule fois, et là où elle était mentionnée on l’a supprimée. J’ai acheté une autre Bible, une Bible identique, imprimée par les mêmes imprimeurs, et regardez C’est à nouveau dedans. Ce qui avait été supprimé a été remis. Comment çela se fait-il? Quel jeu êtes-vous en train de jouer? Ceci"}, {"t": "p", "x": "est la version de 1951, et c’est à nouveau dedans. Les gens ordinaires, les pauvres ne savent pas ce qui se passe, quel jeu on joue là. Qui le sait? Vous lisez la préface, l’homme instruit, le prédicateur lit la préface mais il ne dira pas à son assistant ce qu’il a lu. Dans la préface, nous apprenons que plusieurs personnes, leur faisant peur, les ont obligés à remettre ce passage, sinon ils allaient prêcher contre ce livre. Ne l’achetez pas! Achetez plutôt la Version du roi James, la Bible la plus à jour qui remonte aux manuscrits les plus anciens."}, {"t": "p", "x": "Non ! Ne touchez pas à l’autre livre. Celui-ci est plus sûr car il contient tout ce que vous voulez. Prêchez pour attraper le poisson et il est plus facile d’attraper le poisson avec ceci qu’avec cela, l’hameçon, vous savez. C’est comme ce que David nous dit dans son livre \"Comment se faire des ennemis, et influencer les gens ?\" Il dit \"J’aime les fraises à la crème comme, je pense, la plupart des Américains. il dit, par ailleurs \"Quand je vais à la pêche, je me sers d’un vers pour attraper le poisson. Ce n’est pas que j’aime les vers, mais c’est ce que le poisson aime."}, {"t": "p", "x": "Donc je me sers d’un vers. Donc, si vous voulez attraper des poissons, il vous faut utiliser le bon hameçon. L’Ascension a été rétablie dans le texte, dit la préface. Pourquoi? Ce n’est pas Dieu qui le leur a dit. Dieu ne parle pas librement à ses savants, pas aussi librement qu’il lui arrive de parler, comme mon Frère le prétend, avec lui."}, {"t": "p", "x": "Souvent, vous savez à maintes reprises, on lit que Dieu vient à lui, lui parle et lui dit: \"Mon fils, et à nouveau \"Mon fils, alors qu’il ne le disait pas à son propre fils, \"Jésus\". Il ne l’a jamais appelé \"Mon fils\". Il parle à la troisième personne. Il dit : \"Celui-ci est mon fils bien-aimé\". Mais à Frère Swaggart, il dit : \"Mon fils, Mon fils\". C’est pourquoi je dis : \"Ecoutez, ce n’est pas la parole de Dieu !\" Ils disent simplement que les groupes d’église, en attendant que ceci soit découvert, ont fait un bénéfice net de 15 millions de dollars sur cette version, avant de pouvoir la retirer."}, {"t": "p", "x": "Frère Swaggart a écrit quelques beaux livres: \"L’inceste\", \"La pornographie\", \"L’homosexualité\", \"L’alcool\", \"Sodome et Gomorrhe\". Je ne crois pas pouvoir faire mieux. -- L’inceste : c’est là la souillure de notre société, la société américaine. Elle a atteint des proportions épidémiques. Dans mon pays, en ce qui concerne les Blancs d’Afrique du Sud, d’après les statistiques, 8% de tous les Blancs commettent l’inceste, 1 sur 12 commet l’inceste. Je ne sais pas quel est le pourcentage ici, mais Frère Swaggart nous dit qu’il a atteint des proportions épidémiques dans votre puissant pays, l’Amérique, et il donne des exemples tirés de la Sainte Bible."}, {"t": "p", "x": "Il parait qu’il y a dix cas d’inceste dans la Sainte Bible. Je savais qu’il y en a quatre dans le premier livre de la Bible, la Genèse. Le livre de Frère Swaggart m éclaire sur le cinquième -- comme s’il s’agissait d’un manuel sur l’inceste -- pour m’apprendre quel type d’inceste on peut commettre. Dans un livre de Dieu, dix cas d’inceste et j’apprends quel type de nourriture vous mangez. Si vous mangez de la nourriture corrompue, vous devenez corrompu. Si vous lisez des livres corrompus, vous avez l’esprit corrompu. Est-ce que vous ne vous rendez pas compte que vous êtes programmé par tout ce que vous voyez, tout ce que vous lisez, que vous êtes programmé quand vous lisez sur l’inceste."}, {"t": "p", "x": "L’inceste ! Le père avec ses filles, le fils avec sa mère, le beau-père avec sa belle-fille, le frère avec sa soeur. Qu’est-ce que ça signifie ? Dix cas d’inceste. Vous lisez sur l’inceste ! C’est une petite merveille Vous dites qu’il a atteint des proportions épidémiques. Le docteur Vernon Jones, un psychologue américain très réputé, a réalisé des expériences sur un groupe d’écoliers auxquels il leur lisait certaines histoires et il a dit que ces histoires provoquaient des changements de caractère légers, mais durables même dans"}, {"t": "p", "x": "le cadre restreint d’une salle de classe. Le genre d’histoires que vous lisez, le genre d’histoire qu’ils lisent, les choses qu’ils voient. Tout cela détermine la mentalité qu’ils auront. Je dis donc que s’il s’agit du livre de Dieu, pourquoi Dieu tout-puissant s’égarerait-il dans son livre saint pour vous révéler dix cas d’accouplements incestueux. C’est pourquoi mes chers frères et soeurs, cela n’est pas la parole de Dieu. Les cinq premiers livres, supposés être les livres de Moïse -- la Genèse, l’Exode, le Lévitique, les Nombres, le Deutéronome -- ces réviseurs, docteurs parmi les plus éminents, nous disent aujourd’hui que Moïse ne les pas écrits.Il n’en est pas l’auteur. il n’est pas l’auteur de la Genèse, le \"premier livre de Moïse\", ni de l’Exode, le \"deuxième livre de Moïse\", ni du Lévitique, le \"troisième livre de Moïse\", ni des Nombres, le \"quatrième livre de Moïse\", ni du Deutéronome, le \"cinquième livre de Moïse\"."}, {"t": "p", "x": "Je pose la question Pourquoi les guillemets? Pour quelles raisons? Ces guillemets vous disent de façon psychologiquement très diplomatique que ce ne sont pas nos paroles à nous; que nous ne croyons pas. Mais l’homme de la rue, la dame de la bonne société, les prédicateurs, les fervents prêcheurs de la Bible, les ardents évangélistes, eux y croient, et ils croient que ce sont les livres de Moïse. Mais ce n’est pas Moïse qui les a écrits. Nous ne croyons pas que ce sont ses paroles, c’est pourquoi nous les avons mis entre guillemets."}, {"t": "p", "x": "Ce ne sont pas les livres de Moïse. On lit plus de sept cents fois dans ces cinq livres des expressions telles que \"Et le Seigneur dit à Moïse\", \"Et Moïse dit au Seigneur\", etc. Le Seigneur n’a pas dit cela, pas plus que Moïse ne l’a écrit. L’anglais est votre langue. Cela est écrit à la troisième personne. Pas par Dieu, ni par Moïse. Si c’était Moïse qui l’avait écrit, il aurait dit \"Le Seigneur me dit et je dis au Seigneur\"."}, {"t": "p", "x": "Ou si ça avait été le Seigneur, il aurait dit \"Je dis à Moïse et Moïse me dit\". Cela est écrit à la troisième personne. C’est donc quelqu’un d’autre qui a écrit sur ces choses. Ce n’est pas la parole de Dieu. Ce ne sont même pas les paroles de Moïse. En ce qui concerne la nécrologie, les savants juifs m’apprennent que les prophètes juifs n’écrivaient pas leur nécrologie avant de mourir. Sur les pierres tombales, vous savez, on met des épitaphes. Les juifs ne faisaient pas ça. Le Deutéronome dit : \"Mon frère admet que ce pourrait être les paroles de Josué\", mais ces livres sont supposés être ceux de Moïse."}, {"t": "p", "x": "Comment se fait- il qu’on y parle ainsi de Josué. Le Deutéronome dit: \"Moïse mourut là dans le pays de Mohab\". Personne n en connut son sépulcre jusqu’à ce jour. Moïse était âgé de 120 ans quand il mourut. Bien sûr, Dieu peut tout faire. Dieu peut tout faire. Dans une explication sur les contradictions de la Bible, dans le passage qui dit que Satan excita David ou que le Seigneur excita David, il a dit : \"Ecoutez, nous attribuons ceci à Dieu. Bien que le diable l’a fait, nous disons que c’est Dieu qui l’a fait. Sur cette base, serions-nous prêts à admettre que Dieu a fait incinérer six millions de juifs parce qu’Hitler l’a fait ?"}, {"t": "p", "x": "Diriez-vous que c’est parce que Dieu en avait l’intention ? D’après le principe que vous voulez poser là, Dieu serait don cresponsable du massacre d’incinération de six millions de juifs, même s’il ne s’agissait que de 600 000 ou même de 6 000, ce serait déjà assez dramatique."}, {"t": "p", "x": "Si Hitler l’a fait, pourriez-vous dire que Dieu l’a fait. Allez- vous blâmer Dieu pour cela? Vous allez disculper Hitler et le parti nazi en disant que c’est Dieu qui l’a fait. Non ! Cher Frère Swaggart, nous ne pensons pas comme ça. Si un criminel a commis tel ou tel crime, nous disons que c’est son action, qu’il en est responsable. Nous ne disons"}, {"t": "p", "x": "pas que c’est Dieu qui l’a fait, parce que ses origines du pouvoir découlent de Dieu. Dieu nous a donné la liberté de réfléchir et de distinguer le bien du mal. Donc quand on fait le mal, on est responsable, on ne peut pas tenir Dieu pour responsable. Donc, David a été provoqué, soit par Satan, soit par le Seigneur, et Satan et le Seigneur ne sont dans aucune religion des termes synonymes. Ce sont des antonymes. Satan et le ToutPuissant sont des antonymes. Concernant la pornographie, Frère Swaggart la condamne très fortement, et je l’approuve."}, {"t": "p", "x": "La pornographie, sous quelque forme que ce soit, par écrit, en images, ou dans les films, est une chose horrible. Dans son livre, Frère Swaggart donne les résultats de ses recherches, de son étude. En premier lieu il dit que, lorsqu on lit ou qu’on regarde ces choses, elles ont le même effet qu’une drogue comme la marijuana, l’opium, l’héroïne ou l’alcool. On regarde ces choses et elles produisent un effet chimique et je suis d’accord avec Frère Swaggart."}, {"t": "p", "x": "Elles produisent un effet chimique. Le saviez-vous ? Don, quand on lit sur la pornographie l’esprit s’habitue, et se produit une escalade, une désynthétisation. Ce sont ses propres termes. C’est la première fois que je lis ses termes. Et on doit alors jouer le rôle, se mettre dans la peau du rôle. Voilà comment cette maladie, ce mal accable l’homme. La condamnation de Frère Swaggart est sans appel. Elle se rapproche de la position de mon gouvernement en Afrique du Sud, parce que si je prends un seul des magazines que je peux acheter l’aéroport Kennedy ou n’importe où ailleurs, et que je l’apporte dans mon pays, je vais en prison pour deux ans."}, {"t": "p", "x": "Voilà ce qu’a de bien mon pays l’Afrique du Sud. Bien sûr, il y a, vous savez, l’envers du décor, mais en ce qui concerne la religion, la religiosité, ce sont des chrétiens à toute épreuve. Mais mon pays a interdit certains passages de la Bible. A un moment donné, il y avait un pamphlet qui circulait avec des extraits, neuf extraits de la Sainte Bible, et quelqu’un l’a envoyé à la Commission de censure en disant : \"Regardez-moi ça ! Une chose pareille! On a donc fait un décret pour interdire ce pamphlet sans savoir que ces mots étaient tirés de la Sainte Bible."}, {"t": "p", "x": "Ce sont des extraits de la Sainte Bible, tirés du livre d’Ezekiel, chapitre 23. Je défie tout prédicateur de le lire à son assistance. Je défie tout évangéliste de le lire à sa mère, à sa soeur, à sa fille, ou même à sa fiancée, si c’est une femme vertueuse (Ezekiel, chapitre 23, La débauche de deux soeurs, Ohola et Oholiba)."}, {"t": "p", "x": "Le langage, ce langage si luxurieux, mon gouvernement l’a interdit et il y avait deux ministres de l’Eglise dans la Commission de censure, mais ils ne savaient pas qu’ils interdisaient des extraits de la Sainte Bible. Mon gouvernement est si rigoureux qu’il a interdit \"L’amant de Lady Chaterley. C’est un roman qui contenait un mot inconvenant, un mot de quatre lettres, un seul mot et à cause de cela, il a été interdit pour vingt ans. Mais à présent, mon gouvernement est devenu grand et plus mûr et il l’a autorisé."}, {"t": "p", "x": "Il l’a décensuré, il a retiré ses décrets contre le livre, les neuf extraits de la Sainte Bible, ce que vous appelez le livre de Dieu, que vous avez honte de lire à votre audience. Je défie mon frère de lire ce pamphlet. Je l’ai ici à portée de la main. Il n’a même pas besoin d’ouvrir le livre. Ici, tous ces mots sont en rouge. Je lui dis \"Ecoutez, avec le langage charismatique qui vous est habituel, avec les actions qui vous sont habituelles, j’aimerais vraiment voir Frère Swaggart -- j’ai honte de le soudoyer-- lire ceci à votre auditoire, je vous donne 100 dollars\"."}, {"t": "p", "x": "Que sont 100 dollars pour Frère Swaggart ? Bon je lis dans ce livre sur l’Eglise catholique romaine qu’il a besoin de 291 000 dollars par jour pour rester à flot. J’ai fait le calcul, cela fait 106 millions par an, juste pour rester à flot, et dans l ’Evangelist, Décembre 1985, il aspire, et je lui souhaite bonne chance, à un million de dollars par jour. Il a besoin, dit-il, d’un million de dollars par jour."}, {"t": "p", "x": "Mais, à présent, si je lui disais \"Je vous donne un million Frère Swaggart\". Vous savez, je peux le tenter et je le sais, mais j’espère et je prie pour que, avec l’ardeur qui lui est coutumière, il ait le courage, le cran qu’aucun prêtre, d’après mon expérience, n’a eu de le lire à l’auditoire Ezekiel chapitre 23. Si vous ne le pouvez alors, je peux vous dire que la Bible n’est pas la parole de Dieu."}, {"t": "p", "x": "Et si une mention était faite, elle est tirée de mon livre \"La Bible, est-elle la parole de Dieu ?\". J’en ai fait envoyer environ dix mille à la ville, et je pense qu’ils sont disponibles. Je ne sais pas s’ils seront distribués ici, mais j’ai donné pour instruction de les donner à tout le monde, pour que chacun rentre chez soi, parcourt l’ouvrage, le lise pour luimême, et se forme sa propre opinion. Dans ce livre, en ce qui concerne les contradictions, le Coran nous dit \"Ne considère-t-il pas le Coran avec vénération ?\""}, {"t": "p", "x": "S’il provenait de quelqu’un d’autre que d’Allah, on lui trouverait beaucoup d’incohérences, beaucoup de contradictions. Le Coran n est pas notre propos ce soir. Mais c’est ce que dit le Coran. Si c’est vraiment la parole de Dieu, n’importe quel livre qui prétend être le livre de Dieu ne contiendra aucune contradiction."}, {"t": "p", "x": "Ainsi, à propos de l’exemple qu’a donné mon frère, je vais le répéter. Ecoutez dans un des livres il est écrit que Salomon avait 4 000 crèches pour les chevaux, dans un autre qu’il avait 40000 crèches pour les chevaux."}, {"t": "p", "x": "Entre 4 et 40 il n’y a que la différence d’un zéro. C’est que ce vous dites. Quant à moi, je dis, vous savez, mes cousins les juifs ne connaissaient pas le zéro quand ils écrivirent le livre. Ils ne le connaissaient pas. Ce sont mes frères arabes qui l’ont appris de mes pères en Inde et qui l’ont partagé avec le monde entier. Le zéro, les juifs ne le connaissaient pas. Ils l’ont écrit en mot: quatre: q-u-a-t-r-e en hébreu et quarante: q-u-a-r-a-n-t-e. Je dis en fait: Qui a fait la faute ? Dieu ou l’auteur ? On dit qu’il n’était pas à l’abri des fautes."}, {"t": "p", "x": "Madame Elen G. White, vous voyez, c’est une cultiste, la prophéteuse du mouvement adventiste du 7ème jour dit, dans son commentaire de la Bible, qu’elle n’a pas de raison de mentir. Elle croit que la Bible est la parole inspirée de Dieu. Et pourtant elle dit que \"La Bible que nous lisons aujourd’hui est le travail de nombreux copistes qui, dans la plupart des cas, ont accompli leur tâche avec une exactitude admirable. Mais les copistes n’ont pas été infaillibles, et Dieu très évidememment n’a pas jugé bon de les préserver totalement de l’erreur de transcription."}, {"t": "p", "x": "Autrement dit, ceci est l’affaire de Dieu. S’il le juge bon, s’il veut faire quelque chose, il le fait, s’il ne le veut pas, il dit : \"Allez au diable ! C’est votre affaire. Donc Dieu n’a pas jugé bon de les préserver des erreurs de transcription. Dans les pages suivantes de son commentaire, Mme White assure plus loin : \"Je vis que Dieu avait spécialement protégé la Bible."}, {"t": "p", "x": "Dieu avait spécialement gardé la Bible. Je me demande de quoi. Pourtant, à l’époque où il n’y avait que peu d’exemplaires de la Bible, des érudits avaient à plusieurs reprises changé les mots des manuscrits originaux. Ils avaient changé les mots, croyant simplifier, quant, en réalité, ils obscurcissaient ce qui était simple en l’orientant du côté de leur point de vue établi dicté par la tradition."}, {"t": "p", "x": "De même, les témoins de Jéhovah. Ils ont publié une nouvelle traduction appelée Nouvelle Traduction Mondiale. Vous autres, orthodoxes, vous n’acceptez pas ça. Pourquoi ne le faites-vous pas ? Parce qu’ils ont leur propre tendance en fonction de leurs propres idées. Ils changent les mots de la même façon que les protestants l’ont fait. Il y a eu des gens qui croyaient que Jésus était Dieu et ils ont, d~s lors, changé les mots, nous disant"}, {"t": "p", "x": "donc que c’est ce qu’il s’est passé depuis le tout début. En ce qui concerne les 24 000 manuscrits dont vous vous vantez Frère Swaggart, il n’y en a pas deux qui soient identiques. Vos savants l’affirment. Comment arrivez-vous donc à savoir que ceci est la parole de Dieu et que cela ne l’est pas? Au vu de cela, quand vous ouvrez le livre - l’Injîl et la Thorah - dont vous parlez, voici comment commencent Marc et Matthieu. Dans votre version, celle du roi James, il est question de l’Evangile selon Saint Matthieu, de l’Evangile selon Saint Marc, de l’Evangile selon Saint Luc, de l’Evangile selon Saint Jean."}, {"t": "p", "x": "Je demande pourquoi : à chaque fois selon ? Que veulent-ils dire ? J’ai ici le livre de Frère Swaggart intitulé \" L’homosexualité, ses causes et ses remèdes \" par Jimmy Swaggart ou simplement Jimmy Swaggart. Il ne dit pas \"selon Jimmy Swaggart\". Pourquoi, dans le livre de Dieu, trouve-ton tous ces \"selon\" ? Vous savez pourquoi ? Parce que Matthieu n’a pas signé de son nom. ainsi que Luc, Marc et Jean. Ces livres sont reconnus comme étant des livres anonymes attribués à Dieu.Quant à moi, je dis Ceci n’est pas l’Injîl."}, {"t": "p", "x": "Vous voyez, même dans vos traductions arabes de ces livres, on lit “ Injîl Matti ” signifiant l’Evangile de Matthieu. Le mot “ Injîl ” est utilisé “ Injîl ” “ Murqus ”, “ Injîl Lûqa ”, “ Injîl Yûhanna ”. Ce à quoi nous croyons est l’Evangile de Jésus, ce qu’il a prêché. Voilà ce en quoi nous croyons comme venant de Dieu. Quand vous regardez ces livres — Matthieu, Marc — ils représentent l’Injîl des évangiles de Matthieu, Marc. Mieux que les gens, nous croyons en l’Evangile de Jésus. C’est lui qui l’a prêchée. Et Matthieu dit qu’il se rendit dans tel endroit et qu’il prêcha l’évangile."}, {"t": "p", "x": "Marc, Luc et Jean firent de même. Quant à moi, je dis Jésus avait-il un livre sous le bras ? Avait-il un livre sous le bras. Non ! Tout ce qu’il a prêché venait de Dieu. Voilà ce en quoi nous croyons. Si vous pouvez produire un document appelé “l’Evangile de Jésus”, nous serions très heureux de le reconnaître comme tel, de chercher à vérifier s’il vient de Dieu, et de l’accepter en tant que tel. Mais ce que vous avez, Matthieu, Marc, Luc et Jean, et Jimmy Phillips, chanoine à la cathédrale de ichester, en Angleterre, dit dans la préface de son ouvrage “The anglican church” (L’église anglicane), à la page 7, à propos de Matthieu “ Une tradition ancienne a attribué cet évangile à l’apôtre Matthieu. (C’est ce que les gens disent)."}, {"t": "p", "x": "Mais les savants, aujourd’hui, rejettent presque tous ce point de vue”. Quels savants ? Les savants juifs, les savants hindous, les savant musulmans ? Pas du tout. Ce sont les savants chrétiens, parmi les plus éminents, soutenus en cela par cinquante confessions qui disent que ce n’est pas Matthieu qui a écrit l’Evangile de Matthieu. Ils disent que: “ L’auteur que nous pouvons encore, par commodité, appeler Matthieu ”. Pourquoi “ par commodité ” ? Parce qu’au lieu que ce soit moi qui vous le dise, référons-nous au premier livre du Nouveau Testament, chapitre 9, verset 9, le premier livre du Nouveau Testament, chapitre 5, verset 17."}, {"t": "p", "x": "Je vous fais perdre votre temps, et le mien aussi. Je dis donc : Matthieu chapitre 9 verset 9, Matthieu chapitre 5 verset 17 (par commodité, j’utilise le nom de Matthieu). Ils ont donc dit que l’auteur a simplement tracé à nouveau le mystérieux “ q ” entre guillemets, qui représente le mot allemand “ Quella ” qui veut dire “ source ”. Et ces sources auraient pu être un recueil de traditions orales. L’auteur aurait utilisé, en toute liberté, l’Evangile de Marc."}, {"t": "p", "x": "Pour parler comme un maître d’école, il aurait largement copié sur Marc. Matthieu, un témoin oculaire et auditif de ce qui s’est passé auprès de Jésus; un de ses disciples, de ses apôtres qui va copier un livre vieux de dix ans qui ne se trouvait pas là. A quoi cela rime-t-il ? Un homme avec un témoin oculaire et un témoin auditif? Un compagnon de Jésus ! Et vous dites que c’est la parole de Dieu!"}, {"t": "p", "x": "En ce qui concerne la généalogie, Matthieu et Luc attribuent à Jésus 66 pères et grandspères. A l’exception d’un nom, il n’y en a pas deux qui soient identiques. Sur ces listes séparées, chaque nom est un nom différent. Frère Swaggart dit “L’une est la généalogie de Marie, l’autre de Jésus”. Je dis : “Pourquoi de Marie? Est-ce que le livre dit cela ?“ Non ! Le livre dit: Ceci est la généalogie de Jésus-Christ. L’autre se termine avec Jésus-Christ. il n’y est pas question de Marie. Sur 66 noms, il n’y a pas deux qui soient les mêmes, àl’exception d’un seul, et le père présumé de Jésus-Christ, Dieu tout-puissant, ne s’y trouve pas."}, {"t": "p", "x": "Pouvez-vous imaginer Dieu tout-puissant dictant la généalogie de son “fils”, sans se mentionner lui-même. Il s’égare. Pour dicter ainsi deux généalogies avec 66 noms sans s’y mentionner lui-même, il ne s’y trouve pas. Je me demande ce qu’il peut bien essayer de vous dire, en ne faisant pas figurer son nom. Un homme qui n a aucune généalogie, on lui a miraculeusement, sans aucune intervention du sexe masculin, donné 66 pères et grandspères, et vous dites : c’est Dieu tout-puissant qui a dicté cela. Vous voyez Frère Swaggart, nous autres, musulmans, nous sommes fortement opposés à cette espèce de manipulation de ce puissant messager de Dieu."}, {"t": "p", "x": "Nous disons, c’était un puissant messager de Dieu. Sa naissance a été miraculeuse. Le Saint Coran en témoigne. il a fait, qu’aujourd’hui, un milliard de musulmans dans le monde, sans aucune espèce de preuve de la part des chrétiens, croit que Jésus-Christ est né miraculeusement et qu’il était le messie, qu’il était la parole que Dieu a accordée à Marie. Je traiterai ce sujet demain soir dans le titre “Mohammed, le successeur naturel du Christ” et je serai prêt à répondre à toutes les questions qui viendront s’ajouter à celles de ce soir."}, {"t": "p", "x": "Sur ces mots donc, Monsieur le Président, Mesdames et Messieurs, je suis infiniment reconnaissant à la communauté ici réunie de m’avoir fourni l’occasion d’occuper la tribune au côté du plus grand orateur charismatique, Frère Jimmy Swaggart. Je considère cela comme un privilège et un honneur. Je vous remercie."}]}, {"title": "Réplique de Jimmy Swaggart", "blocks": [{"t": "p", "x": "Je regarde les Bibles que tient Monsieur Deedat, et dans le Coran, une sourate, celle que nous appelons chapitre 62 verset 5 dit : “Il ressemble à l’âne qui porte des livres, de même que l’âne est inconscient de la valeur de la charge qu’il a sur son dos, de même certains hommes ignorent les trésors spirituels qu’ils ont entre les mains. Que produit la Bible ? Ce qu’elleproduit, ce sont des preuves indestructibles. J’étais en Afrique, il y a peu de temps, et je me suis trouvé avec un groupe de ministres. J’ai fait leur connaissance, parlé avec eux, et j’ai demandéà l’un deux ou plutôt on lui a demandé : “ Comment êtesvous devenu un ministre de l’Evangile de Jésus-Christ ? “ Vous voyez, Jésus ne peut pas être àla fois le messie, un grand prophète et un menteur."}, {"t": "p", "x": "Sois il est ce qu’il a dit qu’il était, soit il est un menteur. Or, il n’est pas un menteur. Il a dit : “Voici comment je suis devenu un ministre de l’Evangile. Il a dit : “ Un de mes plus proches amis était un chrétien. Nous avions sans arrêt des discussions sur l’islam, et sur le christianisme. Un jour, le jeune chrétien a dit: “Je connais un homme possédé par le démon”. Vous savez Saint Marc, chapitre 16 verset 17, dit : “En mon nom, ils chasseront les démons.” Ceci est un livre de pouvoirs. Des millions et des millions ont été guéris par le pouvoir de Dieu en invoquant le nom puissant de Jésus. Des millions ont été transformés instantanément, délivrés des pires chaînes que l’enfer ait jamais pu forgées ainsi qu’il l’a"}, {"t": "p", "x": "mentionné. Par la puissance de la parole de Dieu tout-puissant, je vous rappelle que n’importe quel livre mort ne pourrait produire ce genre de résultat. Allez à votre église, et vous verrez que plus de la moitié des gens qui s’y trouvent sont d’anciens alcooliques ou d’anciens drogués. Chaque chaîne que l’enfer peut forger — je sais que dans votre religion, l’islam, on croit à l’enfer — mais aujourd’hui ils sont libérés par le pouvoir du Dieu Tout-Puissant, délivrés au nom puissant du Seigneur Jésus-Christ. L’Evangile de Jésus-Christ produit des résultats, ils brisent les chaînes du péché, il remplit le vide des cœurs, l’ami a dit : “Allons-y et il l’a accompagné ”. il allait prier pour cet homme possédé par le démon, un fou furieux."}, {"t": "p", "x": "Il a dit: “Quand nous sommes arrivés, il avait l’écume aux lèvres”. Je n’ai jamais rien vu de pareil. Et il a dit: “Mon ami a prié pour lui sans résultat visible et il est parti chercher un autre ministre, et je suis resté seul avec ce fou furieux. Et il a dit : je pense que je vais, moi aussi, prier pour lui. Et il a dit qu’il a prié en disant, au nom de Mohammed [C’est un blasphème pour un musulman de prier au nom de Mohammed] : “Sors de lui !” Je lui ai demandé: “Que s’est-il passé ?” “Rien !” “ il a prié plusieurs fois au nom de Mohammed : “Sors de lui !” “Toujours rien !” Et je ne dis pas cela pour manquer de respect à Mohammed. il aurait pu invoquer le nom d’Abraham ou de Moïse, il n aurait rien obtenu de mieux."}, {"t": "p", "x": "Il aurait pu prier au nom de Paul ou de Pierre, il n’aurait rien obtenu de mieux. Alors, se trouvant là tout seul, il s’est dit: “Je pense que je vais essayer. Mon ami chrétien l’a dit: Je n’y crois pas, mais je vais essayer. il a étendu les mains sur lui et il a dit: “Au nom de Jésus-Christ sors de lui !” Alors, Frère Swaggart a-t-il dit, sous mes yeux, il a été délivré par le pouvoir du Dieu Tout-Puissant. Je sais que vous ne niez pas les miracles de Jésus, mais je vous rappelle avant de terminer, qu’un homme mort ne peut pas. produire de miracle."}, {"t": "p", "x": "Je tiens à le répéter. Un homme mort ne peut pas produire de miracle ! Jésus est vivant! [Nous rappelons au lecteur que le sujet du débat’ est : La Bible est-elle la parole de Dieu ?] J’ai encore deux minutes. il a dit : “Venez à moi vous tous qui êtes fatigués, chargés, et je vous donnerai du repos”. Prenez mon joug sur vous et recevez mes mstructions parce que je suis doux et humble de cœur, et vous trouverez du repos pour vos âmes. Un jour, très bientôt, vous voyez, il a promis de revenir, il revient parce qu’il a dit qu’il reviendrait."}, {"t": "p", "x": "La moindre prophétie de ce livre qui devait s’accomplir s’est accomplie. Les autres, celles qui ne se sont pas encore accomplies, s’accompliront. il y a dans le cœur de chaque homme la faim de Dieu. Seul Jésus-Christ peut apaiser cette faim, car Dieu est amour. il vous aime. Ce livre dit qu’il est amour et qu’il vous aime, en dépit du péché et de l’iniquité. il vous aime et veut devenir une réalité pour vous, il n’est pas lointain, distant, inapprochable. A travers Jésus-Christ, vous pouvez l’approcher, l’aimer, l’adorer et il vous aimera parce que c’est ce que dit son livre. Je vous remercie."}]}]}, {"n": 2, "title": "Questions du public", "sections": [{"title": "Ouverture des questions", "blocks": [{"t": "p", "x": "Applaudissons ces deux brillants orateurs, applaudissons-les tous les deux. Mesdames et Messieurs, vous avez maintenant la possibilité de poser des questions. Quel que soient vos questions, veuillez les adresser soit au Révérend Jimmy Swaggart soit à Frère Ahmed Deedat."}]}, {"title": "Q1. Le glorieux Coran existe-t-il, dans sa forme originale et pure. Les…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Le glorieux Coran existe-t-il, dans sa forme originale et pure. Les originaux n’ont-ils pas en fait été brûlés?"}, {"t": "p", "x": "A. Deedat: il y a un Coran d’Othmân. Vous savez que lorsqu’il était calife, le frère Swaggart a mentionné quelque chose au sujet de lectures différentes, disant que Othmân avait fait brûler ces variantes. Pour donner un exemple tiré de son propre exposé, de l’exposé du Frère Swaggart, imaginez que quelqu’un ait pris des notes en sténo, en mentionnant un certain nombre de noms, il en a mutilé certains, mais nous le lui pardonnons, parce quand il a dit: “Otmân, ou quelque chose d’approchant, alors que nous, nous disons Othmân, il a plutôt dit Omar, ce qui sonne des plus horribles."}, {"t": "p", "x": "Mais nous ne faisons pas exception pour cela, car vous n’avez pas l’habitude de nos noms, mais la personne qui noterait en sténo, si vous voulez le reproduire, vous ne pourrez jamais retrouver s’il s’agit de Othmân, le troisième calife de l’islam, ou de Omar le deuxième calife de l’islam. Hafsa, vous l’avez prononcé correctement, par contre. Dans ce cas, si je parcourais les notes en vue d’une publication du discours du Frère Swaggart, vous vous attendriez à ce que je le laisse tel quel. Vous savez donc ce qui va se passer en mutilant la façon dont Othmân s’épèle, ce n’est pas Otmân."}, {"t": "p", "x": "Je vous dis alors : Vous savez c’est Othmân. Et si je ne vois pas le faire, voici donc ce qui s’est passé. Les livres, que ce soit en écriture hébraïque ou en écriture arabe, furent écrits à l’origine sans les points diacritiques et les voyelles, l’hébreu, sans les voyelles, et l’arabe sans les voyelles. Pour celui, dont c’est la langue maternelle, c’était facile de comprendre ce qui était dit. Mais pour un étranger, sans les voyelles, on ne sait pas rendre la prononciation correcte. C’est comme l’anglais, si vous écrivez sans les voyelles, la phrase “l’homme dort sur le lit”, le mot “bed” (lit) s’écrirait bd, pas bid ou bed, bd est là pour “bed”."}, {"t": "p", "x": "Votre sens de langue vous fait substituer la voyelle dans votre esprit. Les Arabes connaissaient cela et les Juifs aussi, concernant leurs langues. Mais dès qu’on passe à une nation étrangère, la personne ne sait pas comment prononcer. C’est comme le mot “el hamdu lillahi rabbu alalamine”, qui signifie “la louange à Dieu, celui qui aime et celui qui dirige le monde”. Ecrit sans voyelles,,comment le prononcer: “ai hamdu” ou “il hamdu” ou encore “el hamdu”. C’est ainsi que les différentes nations, dès qu’elles acceptèrent l’islam, commencèrent à prononcer comme elles entendaient, à l’écrire, mais aussi à mutiler la langue."}, {"t": "p", "x": "Concernant la différence entre la prononciation anglaise et la prononciation américaine, vos façons d’épeler varient, mais heureusement le son, la prononciation ne varient pas. Mais si cela produit une différence de prononciation, vous dites non. Vous devez changer cela. il en est de même des lectures différentes de prononciations différentes. Vous dites: La révélation fut donnée dans le dialecte de Qoraish qui état la famille, la tribu de Mohammed. Mais cette prononciation doit être préservée. Dès lors, toute autre traduction avec d’autres voyelles doit être éliminée. C’est ce qu’a fait Othmân. L’exemplaire a été conservé au musée Topkapî à Istanbul (Turquie)."}]}, {"title": "Q2. Frère Swaggart, voulez-vous m’expliquer comment, d’après la Révélation, ceux…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Frère Swaggart, voulez-vous m’expliquer comment, d’après la Révélation, ceux qui entreront au paradis seront 144 000 et seront tous des juifs des douze tribus? Qu’adviendra-t-il de ceux qui, comme nous, ne Sont pas juifs?"}, {"t": "p", "x": "J. Swaggart : Est-ce cela votre question ? Les 144000 qui sont mentionnés dans le livre de la Révélation, comme l’a dit le frère, font partie du peuple juif, 12000 de chaque tribu, mais n’ont rien à voir avec les Gentils non juifs."}, {"t": "p", "x": "Et ces 12000 seront choisis dans chaque tribu au cours de la période de la grande tribulations parce qu’ils seront ceux qui auront accepté le Seigneur Jésus-Christ comme leur sauveur personnel. C’est ainsi qu’ils seront transportés d’extase d’être au paradis."}, {"t": "p", "x": "Cela n’a rien à voir avec la salvation des millions qui seront venus au Seigneur. Cela n’a rien à voir avec les Gentils. Cela ne parle que de ces 144000. Mais cela établit également que quiconque se revendique du nom Seigneur sera sauvé. Ainsi, n’importe quel Gentil qui en appellera au nom du Seigneur sera sauvé également. Je crois que cela répond à la question."}]}, {"title": "Q3. Frère A. Deedat, Jésus dit que le Seigneur notre Dieu est un Seigneur…", "blocks": [{"t": "h", "x": "Question du public"}, {"t": "p", "x": "Frère A. Deedat, Jésus dit que le Seigneur notre Dieu est un Seigneur unique. “Et vous aimerez le Seigneur votre Dieu de tout votre coeur”, dit Marc chapitre 12, versets 29-30. Les musulmans sont d’accord avec ‘les chrétiens sur le fait qu’il n’y a qu’un seul Dieu. Mais comment les musulmans aiment-ils Dieu sans que leur coeur en soit modifié?"}, {"t": "p", "x": "A. Deedat : Que leur coeur en soit modifié. Mais regardez les musulmans! Regardez-les donc ! C’est àleurs fruits que vous les reconnaîtrez. Cueille-t-on des figues sur des chardons, ou du raisin de la tombe? Chaque arbre sain donnera des fruits sains, et chaque arbre mauvais donnera de mauvais fruits. Le test, ce sont les fruits. L’islam a créé la plus grande société de tempérance: abstinence d’alcool du monde. Ils sont quelque 100 millions de musulmans dans le monde et tous les musulmans forment un tout. ils sont abstinents, ils ne boivent pas et n’achètent pas d’alcool."}, {"t": "p", "x": "Voilà les fruits. Prenons le cas de ma propre race, les gens les plus racistes qui soient au monde, la caste des Hindous, la caste des Brahmans, ma nation, et vous voyez cette même nation, ces gens les plus racistes au monde qui deviennent des gens qui acceptent les Blancs et les Noirs, les riches et les pauvres comme leurs frères. il y a eu un changement. Toutes ces revendications qui ont été faites pour la chrétienté disant que Jésus-Christ transforme la vie des gens, que le vieux vous sort de vous-même et qu’un nouveau vous y entre."}, {"t": "p", "x": "Laissez-moi vous dire, mes chers frères et sœurs:Regardez cette puissante nation d’Amérique. Selon le frère Swaggart, il y a Il millions de buveurs. C’est ce qu’il dit et 44 millions de drogués sévères, la voilà voire nation. Et le Frère Swaggart dit: “Je ne vois aucune différence entre eux”. C’est donc 55 millions de gens qu’ils considèrent comme des buveurs, mais il y a une différence. Il ne va pas assez loin. En islam nous disons même que vous êtes un buveur social. Le Saint Coran en parle, mais même avant, le prophète Mohammed avait dit: “Ce qui intoxique en grande quantité est interdit même en petite quantité”. Pas d’excuse pour un petit coup ou pour un pot pris hors de chez soi. Le Saint Coran dit :"}, {"t": "v", "x": ["“Ô vous qui avez la foi,", "le vin, le jeu, le fait", "de dire l’avenir et d’adorer des idoles", "sont vraiment une abomination,", "font partie des oeuvres de Satan.", "Tenez-vous en à l’écart. Ainsi, pourrezvous", "peut-être prospérer.”"]}, {"t": "p", "x": "(Saint Coran 5:90) Les bouteilles de vins furent alors déversées dans les rues de Médine pour ne plus être remplies. Ce sont les fruits de cet enseignement. Le Frère Swaggart dit, dans son livre sur le jeu, que “54 millions de dollars sont gaspillés au jeu”. Prenez le cas des miracles : le Christ a donné la vie, a guéri les malades. Mohammed n’a pas pu. Au nom de Mohammed, ils n’ont pas pu le faire, a dit Swaggart. Je vous dirais, mes frères et sœurs, que vous ne lisez pas dans les Ecritures. Jésus-Christ a dit:“Car il va arriver de nombreux faux christs et de nombreux faux prophètes qui vous montreront de grands signes et de grandes merveilles essayant de tromper les élus”."}, {"t": "p", "x": "Si de faux prophètes peuvent faire des miracles je vous demanderai si cela est un test pour votre foi. Non. Jésus-Christ dit que ceux qui feront de telles oeuvres miraculeuses, il vous le dit dans L’Evangile de Saint Matthieu, ce jour-là le dernier jour du jugement, il dira : “Beaucoup viendront vers moi ce jour-là, disant:Seigneur, Seigneur, n’avons-nous pas prophétisé en ton nom, n’avons-nous pas chassé les démons en ton nom, et n’avonsnous pas réalisé beaucoup de grandes choses en ton nom, au nom de Jésus, n’avonsnous pas fait toutes ces choses ?"}, {"t": "p", "x": "N’avons-nous pas fait tout cela”. Et il répondra: “Oui, mais je vous jure que je ne vous ai jamais connus. Eloignez-vous de moi, païens de l’iniquité, il ne s’agit pas de vous”. il ne dira pas aux juifs : “Eloignez-vous de mois, partez, je ne vous connais pas”. il ne le dira pas non plus aux Hindous, ni aux athées. C’est à vous qu’il le dira. Je voudrais savoir pourquoi il vous dira : “Je ne vous connais même pas, allez-vous en !“ C’est pourquoi j’ai dit que ces choses ne sont pas un test. Jean-Baptiste fut, selon Jésus, l’un des plus puissants messagers de Dieu."}, {"t": "p", "x": "Jésus a dit : “Parmi tous ces hommes et femmes, il n’y en pas eu un de plus grand que JeanBaptiste”. Et pourtant il n’a accompli aucun miracle. L’a-t-il fait ? Montrez-moi ce qu’il a fait. Quel miracle ? Les miracles ne sont pas un test. Mais le plus grand des miracles est que sans un miracle vous transformiez des nations. Des nations sont transformées, un milliard de gens qui n’achètent pas, qui ne boivent pas d’alcool à cause des préceptes de Mohammed."}, {"t": "p", "x": "Jimmy Swaggart : Qu’adviendra-t-il des musulmans qui croient en Jésus mais qui ne le considèreront pas comme un Seigneur, comme le fils de Dieu, quand ils mourront? Frère Swaggart : La Bible nous dit qu’il n’y a pas d’autre rédemption sous le ciel que par l’intermédiaire du Seigneur Jésus-Christ. Le fait de croire en Jésus, de croire qu’il a fait des miracles, qu’il a été un prophète, qu’il a été un grand enseignant, n’est pas assez. Vous devez accepter ce qu’il a fait au calvaire de la croix pour que votre âme soit sauvée."}, {"t": "p", "x": "L’homme peine sous un énorme fardeau de péchés comme résultat de la faute. Le péché n’est pas seulement un acte que vous commettez, ce n’est même pas une force, c’est une nature. Vous ne pouvez pas contrôler cette nature en coupant la main d’un homme. Vous devez atteindre son cœur. Si tous les musulmans du monde sont pénétrés et heureux de ce qu’ils ont, pourquoi des centaines de milliers d’entre eux regardent-ils mon émission de télévision [ils regardent également des émissions telles que “Dallas”, “Dynasty” etc...]."}, {"t": "p", "x": "Deuxièmement, les vrais chrétiens ne boivent pas non plus. Ce que peut et doit avoir un homme c’est un changement de son cœur. Vous ne pouvez rien de l’extérieur. Cela vient de l’intérieur. Seul Jésus-Christ peut faire cela. Ne pas boire d’alcool ne suffit pas. Ne pas jouer ne suffit pas. S’en tenir tout juste aux règles ne suffit pas. La chrétienté, en réalité, n’est pas une religion. Ce n’est pas une série de: “Fais et ne fais pas !“ Vous ne pouvez pas épargner pour votre salut. Jésus l’a payé sur la croix totalement et complètement, et nous l’acceptons."}, {"t": "p", "x": "Ainsi, la nature de péché est brisée. La personne ne boit pas parce qu’elle croit pas qu’on va lui couper la main, les doigts de pieds ou le nez ou n’importe quoi. Elle ne boit pas parce qu’elle n’en a plus le désir. Acceptez Jésus-Christ comme votre sauveur personnel, et L’Evangile
