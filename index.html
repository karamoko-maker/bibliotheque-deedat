st alors ce superman?"}]}, {"title": "Les innovations de Paul", "blocks": [{"t": "p", "x": "“Ce Melchisedek était roi de Salem, sacrificateur du Dieu très haut...” il est sans père, sans mère, sans généalogie il n’a ni commencement de jours, ni fin de vie...” Hébreux 7:1-3 Voilà un candidat à la divinisation, seul Dieu Tout Puissant possède ces qualités. Adam a été créé dans un jardin (1’eden). Jésus (P) a vu le jour dans une étable. Adam a eu une fin tout comme Jésus (P). comme le clament les chrétiens, “et a abandonné l’esprit”. Mais où est Melchisedek? il hiberne quelque part, peut-être comme Rip van Winkel (20). Et qui sont ces “hébreux” ? C’est le nom des volumes (20) Personnage de légende qui aurait dormi pendant plusieurs siècles."}, {"t": "p", "x": "de la Sainte Bible rédigée par le brave Saint Paul, l’un des trentes apôtres désignés du Christ. Jésus (P) avait douze compagnons, mais l’un d’eux (Judas) était habité par le diable. Le poste vacant devait être comblé car les douze trônes du paradis devaient être occupés par les disciples (de Jésus) pour juger les enfants d’Israël (Luc 22:30). Saül était un juif renégat et les chrétiens changèrent son nom en Paul, probablement à cause du fait que Saül avait une consonnance juive."}, {"t": "p", "x": "Ce (fameux*) Saint Paul fit un tel bruit autour des prêches de Jésus (P) qu’il réussit à lui faire attribuer la deuxième des positions les plus convoitées des “(Les) Hommes les plus influents de l’histoire” dans l’oeuvre monumentale de Michaël H. Hart : “Les 100” ou les “100 plus importants” ou encore “Les 100 plus grands (noms*) de l’histoire”. Paul dépassa Jésus, car selon Michael H. Hart, Paul serait le véritable fondateur du christianisme. L’honneur de la création de cette religion serait à partager entre Paul et Jésus (P), mais Paul aurait la prépondérance car il aurait écrit plus de recueils de la Bible que n’importe qui d’autre, alors que Jésus (P) n’en a pas écrit un seul mot."}, {"t": "p", "x": "Paul n’avait besoin d’aucune inspiration pour écrire ses hyperboles (21) ici et dans le reste de ses épîtres. N’était-ce pas Goebbels, le ministre de la propagande qui disait : “ Plus le mensonge est gros, plus il a de chance d’être cru réellement’. Le plus amusant dans cette exagération c’est qu’aucun chrétien ne semble l’avoir lue."}, {"t": "p", "x": "Toutes les personnes instruites en la matière à qui j’ai (21) Description ou état amplifié qui ne peut être pris dans son sens littéral."}, {"t": "p", "x": "montré ce verset semblaient le découvrir pour la première fois. ils paraissaient abasourdis tels que les décrivent, fort àpropos. les paroles de Jésus (P): “...Parce qu’en voyant ils ne voient pas, et qu’en entendant ils n’entendent ni ne comprennent.” Matthieu 13:13 Le Saint Coran contient aussi un verset qui décrit une maladie parfaitement entretenue: “Sourds, muets et aveugles, sans espoir de retour” Saint Coran 2:18"}]}, {"title": "Les fils de Dieu", "blocks": [{"t": "p", "x": "Le musulman fait de grandes réserves en ce qui concerne le dogme chrétien qui faisait que “Jésus (P) était le fils unique (de Dieu*) engendré mais non conçu (physiologiquement*). Cest ce que le chrétien est habitué à répéter depuis son enfance dans son catéchisme. J’ai demandé, à maintes et maintes reprises, à des chrétiens instruits, pourquoi ils exagéraient lorsqu’ils disaient: “Engendré mais non pas conçu”. ils savent que, selon leurs divines Ecritures, Dieu a une multitude d’enfants: “Adam, fils de dieu.”Luc 3:38 “Les fils de dieu virent que les filles des hommes étaient belles.” “...Après que les fils de dieu furent venus vers les filles et qu’elles leur eurent donné des enfants...” Genèse 6:2-4 “...Ainsi parle l’Eternel Israel est mon fils, mon premier-né”Exode 4:22 “Car je suis un PÈRE pour Israel est Iphraïm est mon premier né...”Jérémie 31:9 “...Il m’a dit tu es mon fils! “C’est Moi qui t’ai engendré aujourd’hui”.Psaumes 2:7 “Car tous ceux qui sont conduits par l’esprit de Dieu sont fils de Dieu.” Romains 8:14"}, {"t": "p", "x": "Pouvez-vous trouver cela dans la langue hébraïque, chaque personnage vertueux, que ce soit Tom, Dick ou Harry qui ont suivi la volonté et le projet de Dieu sont Fils de Dieu. C’est une métaphore communément utilisée par certains juifs. Les chrétiens acceptent ce raisonnement mais restent sur leur position “mais Jésus n’était pas ainsi”. Adam fut “fait” par Dieu, toute chose vivante est création de Dieu. ll est le Seigneur qui chérit et qui soutient. De façon métaphorique, Dieu est le père de tout, mais Jésus fut le fils “engendré” par Dieu et non un fils créé par Dieu?"}]}, {"title": "« Engendré » synonyme de « reproduit »", "blocks": [{"t": "p", "x": "Durant plus de quarante ans d’échanges avec les chrétiens éclairés, je n’en ai pas rencontré un seul qui ait osé se hasarder à expliquer la phrase “engendré et non créé”. Ce fut un Américain qui eut l’audace d’expliquer: “Cela veut dire qu’il a été conçu (physiologiquement, comme fruit d’un étalon*) par Dieu.” “ Comment ? Explosai-je. “Reproduit ou conçu par Dieu ?“. “Non, non” dit-il. “J’essayai simplement d’expliquer le sens de l’expression “Je ne pense pas du tout que Dieu ait pu concevoir un fils (physiologiquement)”."}, {"t": "p", "x": "Le chrétien sensible me fit remarquer que les mots n’expriment pas littéralement leur sens. Pourquoi les utilisez-vous alors ? Pourquoi créez-vous des conflits inutiles entre 1.200.000.000 chrétiens et plus d’un milliard de musulmans à travers le monde en développant des non-sens?"}]}, {"title": "La raison de l’objection", "blocks": [{"t": "p", "x": "Le musulman prend l’exception de la formule “engendré” car elle est du domaine de la reproduction animale, relevant des fonctions sexuelles animales les plus basses. Comment pouvons-nous attribuer des capacités (caractéristiques*) aussi viles à Dieu ? Sur le plan métaphorique, nous sommes tous enfants de Dieu — bons et mauvais — et Jésus (P) serait le seul parmi nous tous à être le seul proche de Dieu, a en être le seul fils, parce qu’il en aurait été le plus fidèle d’entre nous tous."}, {"t": "p", "x": "De ce point de vue, il est sans conteste le fils de Dieu. Bien que ce pernicieux mot “engendré” (22) soit maintenant supprimé sans scrupule des versions les plus précises de la Bible, la Version Standart Révisée (23), son ombre s’attarde encore dans la mémoire chrétienne, qu’elle fut blanche ou noire. (22) Bonnes nouvelles pour les musulmans. Consultez “La Bible est-elle la parole de Dieu?” page 15. Pour tous les détails relatifs à ce mot dégradant “engendré”. (23) Version Standard Révisée proclamée par le Church of England News paper comme étant “la plus précise ou la plus rigoureuse des versions réalisées au cours de ce siècle” qui en fait est une version des anciens manuscrits datant de deux ou trois siècles A.P. Jésus-Christ."}, {"t": "p", "x": "A cause d’un insidieux lavage de cerveau, l’homme blanc se sent supérieur à son frère noir (24) de confession chrétienne qui prie dans la même église. En retour, lhomme noir continue à donner l’image de son complexe d’infériorité à travers son dogme."}]}, {"title": "L’infériorité par le lavage de cerveau", "blocks": [{"t": "p", "x": "L’esprit humain ne peut raisonner autrement qu’en admettant le fait qu’un fils engendré par un Africain ne peut ressembler qu’à un Africain, qu’un Chinois à un Chinois et un Indien à un Indien. Ainsi, le fils engendré de Dieu ne peut ressembler à rien d’autre qu’à Dieu. Des milliards de portraits et de superbes images du “fils unique engendré” sont mises entre les mains des hommes. Il ressemble à un européen avec ses cheveux blonds, ses yeux bleus et des atours plaisants tout comme celui que je vis dans le “Roi des Rois” ou “Le jour de gloire” ou encore “Jésus de Nazareth”. Vous souvenez-vous de Jeffrey Hunter ? Le “sauveur” des chrétiens avait plus le type germain que juif avec son petit nez mignon. Ainsi naturellement si le fils est blanc, le père ne peut être que blanc (Dieu ?)."}, {"t": "p", "x": "Dès lors les hommes de race noire ressentent dans leur subconscient leur origine inférieure et au fond de leur âme, ils sont comme les enfants d’une lignée parallèle (beauxfrères, gendres, belle-filles ou brues). Aucune quantité de crème faciale, aucun éclaircissement de peau, aucun défisage de cheveux ne pourra effacer l’infériorité. (24)J’utilise ce terme dans son contexte d’Afrique du sud, où tout nom européen est décrété Noir, qu’il soit africain. métisse ou asiatique. Peu importe comment il peut ressembler à un Blanc."}]}, {"title": "Dieu est esprit", "blocks": [{"t": "p", "x": "Dieu n’est ni blanc, ni noir, il est état spirituel au-delà de l’imagination et de la dimension des hommes. Brisez les blocages mentaux d’un caucasien Dieu homme (blanc) et vous aurez brisé les chaînes de l’infériorité permanente; cependant les barrières intellectuelles sont très difficiles àabattre, l’esclave lui-même se bat pour les retenir."}]}]}, {"n": 6, "title": "Réponse au dilemme chrétien", "sections": [{"title": "Réponse au dilemme chrétien", "blocks": [{"t": "p", "x": "\"Le Christ dans l’islam\" est réellement le Christ dans le Coran qui a définitivement dénoncé les aberrations du christianisme.Le Coran absout Jésus (P) de toutes les fausses accusations dont ses ennemis, parmi ses infatueux disciples, l’avaient chargées.Ses ennemis l’auraient accusé de blasphème contre Dieu en se proclamant divin, mais ce n’était pas un blasphème puisqu’il était émanation de Dieu.Que dit le Coran ? Dieu (Allah) s’adressant aux juifs et aux chrétiens : \"Ô gens du livre ! Ne sortez pas de la juste mesure dans votre religion"}, {"t": "v", "x": ["et ne dites sur Dieu", "que la vérité : Le Messie", "Jésus Fils de Marie", "n’est que le messager de Dieu."]}, {"t": "v", "x": ["Son verbe", "qu’il a jeté à Marie", "et un esprit venant de lui", "croyez donc à Dieu", "et â ses messagers.", "Saint Coran 4:171"]}]}, {"title": "Jusqu’aux extrêmes", "blocks": [{"t": "p", "x": "\"Ô gens du livre\" est l’expression très respectueuse utilisée pour interpeler les juifs et les chrétiens dans le coran.En d’autres termes Allah dirait \"Ô peuple instruit ou lettré\" ou encore \"Ô peuple ayant des lettres ou des écritures\".Conformément à leur esprit vantard, les juifs et les chrétiens se sont fièrement décrétés supérieurs aux Arabes qui n’avaient pas de (Saintes) Écritures avant le Coran. Allah fit stopper les compétiteurs des deux religions pour les empêcher d’aller aux extrêmes au regard de la personnalité du Christ."}, {"t": "p", "x": "Les juifs avaient insinué certains doutes à propos de la légitimité de Jésus (P) et l’avaient qualifié de blasphémateur en déformant ses mots. Les chrétiens avaient donné d’autres sens a la lecture de ses mots complètement déformés hors de leur contexte et qui devaient en faire Dieu.Les chrétiens réformiste, les fervents évangélistes, les défenseurs de la Bible font usage de termes extrêmement sévères pour souligner, après les avoir manipulés, \"ses blasphèmes\". Ils disent : a) \" Ou bien Jésus (P) est Dieu ou un menteur.\" b) \""}, {"t": "p", "x": "Ou bien Jésus (P) est Dieu ou c’est un illuminé. \" c) \"ou bien Jésus (P) est Dieu ou c’est un imposteur.\" Ce sont leurs termes, cueillis de la littérature chrétienne. Alors qu’aucun homme charitable, musulman ou autre, ne peut condamner le Christ si durement comme semble le pousser à le faire le chrétien, il ne peut en fin de compte que se sentir non impliqué. Il pense qu’il n’a qu’un seul choix entre ces deux extrêmes stupides. Il ne peut voir aucune alternative à cette devinette chrétienne."}]}, {"title": "Une alternative sensible", "blocks": [{"t": "p", "x": "Jésus (P) ne serait-il pas simplement ce qu’il clame être, un prophète, comme beaucoup d’autres avant lui ? Et s’il. était l’un des plus grands parmi eux. Un puissant faiseur de miracles. Un grand prêcheur et un guide. Le Messie !"}, {"t": "p", "x": "Pourquoi Dieu ou illuminé ? L’illumination serait-elle le contraire de la divination dans le christianisme ? Quelle est l’antinomie de Dieu ? Est-ce qu’un chrétien éclairé peut répondre? Le Coran met à nu (révèle*) la véritable situation du Christ Il le fait en un verset: 1. C’était l’enfant d’une femme, Marie, et ainsi un homme. 2. Mais un apôtre, un homme avec une mission divine, et ainsi auréolé d’honneur."}, {"t": "p", "x": "3. Un message accordé à Marie par le fait qu’il a été volonté divine, \"sois\" et il fut (3:59). 4. Un esprit qui relève de Dieu : sa vie et sa mission furent bien plus réduites que celles d’autres apôtres. Nous lui devons le plus grand respect au titre d’homme de Dieu. La théorie de la Trinité, égalité avec Dieu et Son fils"}, {"t": "p", "x": "sont bannies au litre du blasphème (25)."}, {"t": "p", "x": "Dieu n’a aucun besoin,et ne peut avoir recours à Son fils pour \"gérer Ses affaires\" L’évangile de Jean (ou celui qui l’a écrit) a soulevé un grand Débat sur les convictions des Alexandriens et leur mysticisme à propos de la doctrine relative (au message) au mot (grec logos) simplement expliqué ici. D’ailleurs, nos soufis travaillent à son explication.\" Commentaire de A.Yusuf Ali. Verset 17"}]}, {"title": "Jésus interpellé", "blocks": [{"t": "p", "x": "les versets 119 à 121 du chapitre 5 de la sourate \" al -Maïda\" (le festin) sont reproduits cidessous. Ils décrivent la scène du jugement dernier, lorsque Allah questionnera Jésus (P) à propos des comportements de ses fidèles supposés quand au culte qu’ils devaient lui vouer ainsi qu’à sa mère et sa réponse : 119. \"et quand Dieu dit : \"O Jésus fils de Marie ! Est-ce toi qui as dit aux gens : \"prenez moi ainsi que ma mère comme divinité autres que Dieu ?\" Il dit: \"Gloire et pureté à toi !"}, {"t": "p", "x": "Il ne m’appartient pas de dire ce qui ne me revient pas de droit. si je l’ai dit tu le saurais déjas. tu sais ce qui est en moi-mème."}, {"t": "p", "x": "(25) Référez-vous au saint Coran et lisez le verset 141 du chapitre 4 avec tout son sens. et je ne saiS pas ce qui est en toi.C’est Toi le parfait savant des mondes inconnus. 120.\"je ne leur ai dit que ce que Tu m’as Ordonné,de dire à savoir : Adorez servilement Dieu. mon Seigneur et ce Vôtre ! je, fus témoin contre eux tant que je f us Parmi eux et, lorsque Tu as repris mon âme tu fus Leur observateur attentif et tu es de toutes chose témoin. 121.\"Si Tu les tortures, ce sont ’Tes esclaves et si tu les absous,"}, {"t": "p", "x": "C’est Toi certainement le Puissant et le sage.\""}]}, {"title": "Il proclame sa non-divinité", "blocks": [{"t": "p", "x": "\"Si ce qui précède est vérité, venant de celui qui a connaissance de, toute chose (Dieu*) le verset - Je ne leur ai dit que ce que Tu m’as ordonné de dire à savoir \"Adorez servilement Dieu mon Seigneur et le vôtre !... pose la question suivante : Comment les chrétiens justifientils leur vénération pour Jésus.(P)? Il y a plus d’une équivoque dans la Bible, dans les 66 volumes des versions protestantes ou dans les 73 autres des versions catholiques lorsque Jésus (P) proclame qu’il est Dieu ou encore lorsqu’il dit \"Vénérez-moi\", ou comme ici et maintenant, il dit que lui et Dieu Tout Puissant sont une et même personne."}, {"t": "p", "x": "Cette dernière phrase une et même personne a perturbé plus d’un fervent évangéliste et plus d’un défenseur de la Sainte Bible en tenant compte des docteurs ès divinités et des professeurs de théologie. Même si les nouveaux convertis au christianisme ont appris par cœur ces versets, ils sont programmés comme des zombies afin d’en raccourcir le sens et la portée en les plaçant hors de leur contexte et au fait desquels ils peuvent accrocher leur ferveur, pour mieux étaler leur foi. Les ’Mots \"sont un\" excitent l’esprit par l’association de souvenirs. \"Oui\" disent les partisans de la Trinité. Les vénérateurs des trois Dieux en un et de Dieu en trois autres \"Jésus aurait proclamé qu’il était Dieu ! \" Où ?"}]}, {"title": "Le révérend attablé", "blocks": [{"t": "p", "x": "J’avais invité le révérend Morris D.D. et son épouse à déjeuner. Une fois attablés et durant l’échange de nos connaissances mutuelles, l’occasion de demander enfin \"Où ?\"survint. Dans un murmure, il cita \"Moi et mon père sommes un\"qui impliquait que Dieu et Jésus {P) était une etmême personne, que Jésus ;(P), ici, proclamait qu’il était Dieu. Je connaissais du reste, le verset cité par, cœur, mais il fut cité hors de son contexte. Il n’avait pas le sens que le docteur pouvait imaginer, aussi je lui demandai \"Quel est le contexte ?\""}]}, {"title": "Choqué par le contexte", "blocks": [{"t": "p", "x": "Le révérend s’arrêta de manger et me dévisagea avec de grands yeux ronds. Je demandai : \"Pourquoi ignorez-vous le contexte ?\". \"Ce que vous venez de citer est le texte, ce que je veux savoir c’est son contexte, le texte qui précède et celui qui suit !\". C’est alors que je découvris le (Canadian) Britannique, de l’église presbytérienne où il était appointé, docteur ès divinités à qui, prétentieusement, j’aurais voulu enseigné l’anglais."}, {"t": "p", "x": "Bien sûr qu’il savait ce que le terme \"contexte\" signifiait, mais comme tous ses compatriotes, il n’avait guère étudié le sens avec lequel Jésus (P) avait prononcé ces mots. Pendant mes quartantes années d’expérience ce texte m’a été jeté à la face des centaines de fois, mais jamais un seul chrétien au fait de la question n’avait tenté la moindre interrogation quant au vrai sens de ces paroles, mais ils s’enflamment facilement dès qu’il est question de leurs Bibles. Le docteur n’en avait pas. Dès que je les sens partir je les arrête dans leur élan."}, {"t": "p", "x": "\"Je suis convaincu du fait que vous connaissez votre Bible\". Après avoir lu cela, j’espère que quelques chrétiens \"Revenants\" rectifieront cette déficience. Cependant, je doute que mes lecteurs musulmans puissent un jour, leur fournir le contexte (26)."}]}, {"title": "Quel est le contexte ?", "blocks": [{"t": "p", "x": "Ce fut navrant de la part du révérend d’avoir échoué. Il n’avait pu expliquer le contexte. Il me demanda alors : \"Connaissez-vous le contexte ?\" \"Bien sûr !\" répondis-je.\"Alors quel est-il ? me demanda mon frère instruit. Je lui dis : \"Ce que vous avez cité est le texte de Jean chapitre"}, {"t": "p", "x": "(26) Pourquoi ne pas apprendre les versets de Jean 10:23-36. Avec les versets recommandés page 14. Écrivez sur des bristols de poche et ne vous en séparez que lorsqu’elles seront dans votre cerveau. Sans ces outils, vous ne ferez jamais le travail. verset 30. Pour vous situer dans le contexte, vous,devez commencer au verset 23 qui cite: 23. \"Jésus se promenait dans le temple, sous le portique de Salomon..\" Jean ou quelque soit celui qui écrivit l’histoire ne nous donne pas les raisons pour lesquelles Jésus tentait le diable en marchant seul dans la tanière du lion."}, {"t": "p", "x": "Nous ne pouvons attendre des juifs qu’ils laissent passer une occasion en or de mettre Jésus à l’index. Peut être fut-il encouragé par la façon dont il chassa à coups de fouet les juifs du temple, qu’il en renversa les tables des changeurs de monnaie, au début de son ministère (Jean 2:15). 24.\"Les Juifs l’entourèrent et lui dirent : Jusqu’à quand tiendras-tu notre âme en suspens ? Si toi tu es le Christ, dis-le nous ouvertement.\""}, {"t": "p", "x": "Il l’encerclèrent, leurs doigts accusateurs pointés vers son visage, le provoquant et l’accusant de ne pas avoir fait sa demande à haute voix et ouvertement, cultivant ainsi l’ambiguïté. Ils commencèrent à s’exciter jusqu’à entrer en transes, de façon à pouvoir l’assaillir. En fait, leur principal grief était qu’ils n’aimaient pas sa façon de prêcher, à savoir: ses invectives, sa façon de condamner leur formalisme, leur cérémonial, leur respect à la lettre de la loi et leur oubli de l’esprit. Mais Jésus (P) ne pouvait supporter davantage leurs remises en cause."}, {"t": "p", "x": "Ils étaient trop excités pour une confrontation majeure. La retenue est la meilleure chose dans un esprit de conciliation qui prévaut en pareille circonstance. 25. \"Jésus leur répondit : Je vous l’ai dit et vous, ne croyez pas. Les œuvres que je fais au nom de mon père, rendent témoignage de moi :\""}, {"t": "p", "x": "26. \"Mais vous ne croyez pas, parce que vous n’êtes pas mes brebis.\" Jésus (P) réfutait toutes les accusations de ses ennemis qui faisaient de lui un personnage ambigü lorsqu’il annonçait qu’il était le Messie qu’ils attendaient. Il leur dit qu’ils les avaient clairement informés mais qu’aucun d’eux n’avait voulu l’entendre. 27.\" Mes brebis entendent ma voix, moi je les connais et elles nie suivent; 28. \"Je leur donne la vie éternelle, elles ne périront personne ne les arrachera de ma main. 29. \"Mon père qui nie les a données est plus grand que tous, et personne ne peut les arracher de la main du père. \""}, {"t": "p", "x": "Comment peut-on être aveugle pour ne pas voir l’inexactitude des terminaisons des deux derniers versets. Ce qui est sûr c’est que les aveugles spirituels sont beaucoup plus atteints par la cécité que les aveugles physiques. Il dit aux juifs et en fait présent à la postérité, la seule et véritable liaison dans l’unité entre Dieu et Son fils (est contenue dans ces deux versets). Le verset 30 est le plus crucial 30.\"Moi et le Père sommes un.\""}, {"t": "p", "x": "Un en quoi ? -Dans leur omniscience, dans leur nature, dans leur omnipotence ? Non ! Et pour l’exemple, lorsque le croyant a accepté la foi, le messager le voit revenir dans la foi, Dieu aussi le voit revenir ainsi. Ceci est le rôle du \"père et \"du fils\" et du \"Saint Esprit\" et, de tous les hommes et de toutes les femmes, de foi."}, {"t": "p", "x": "Laissons le même Jean nous expliquer, dans son verbiage mystique et croyant, la chose: \"...Afin que tous soient; comme Toi Père Tu es en moi, et moi en Toi, qu’eux aussi soient (un) en nous, afin que le monde croît, que Tu m’as envoyé. Moi en eux, et Toi en moi, afin qu’ils soient parfaitement un,...\" Jean 17:20-22 Si Jésus (P) est \"un\" avec. Dieu, et si cette \"unicité\" en fait Dieu, alors Judas le traitre, Thomas qui doutait et le Pierre (27), ainsi que les neuf autres qui ont fui (trahis) Jésus (P), étaient des Dieux, pour la simple raison que cette unicité avec Dieu qu’il proclamait dans l’Évangile de Jean (10:30), maintenant ils la demandait pour \"...Tous ceux qui l’abandonnèrent et prirent la fuite.\" (Marc 14:50)."}, {"t": "p", "x": "Il leur dit : \"Pourquoi avez-vous peur, gens de peu de foi ?... \"(Matthieu 8:26)\"..., Race incrédule, et perverse, jusqu’à quand serai-je avec vous ?\"(Luc 9:41 ). Quand cesseront enfin les blasphèmes des chrétiens?L’expression \"moi et mon père sommes un\" est innocentée, ne signifiant pas autre chose qu’avoir le même que Dieu, mais les juifs cherchaient à semer la discorde et aucune excuses ne les satisfaisait. 31. \"Les juifs ramassèrent de nouveau. les pierres pour le lapider.\""}, {"t": "p", "x": "32.\"Jésus reprit et leur dit : Je vous fais voir beaucoup d’œuvres bonnes venant du Père. Pour laquelle de ces oeuvres me lapidez-vous ?\" 33. \"les juifs lui répondirent : Ce n’est pas pour unebonne œuvre que nous te lapidons, mais pour un blasphème, et parce que toi qui es un homme, tu te fais Dieu.\""}, {"t": "n", "x": "(27) Mais Jésus (P) se retourna et dit à Pierre: \"Arrière satan! Tu es pour moi un scandale, car tes pensées ne sont pas celles de Dieu, mais celles des hommes.\""}, {"t": "p", "x": "Dans le verset 24 {Évangile de Jean, chapitre 10) les juifs ont faussement prétendu que Jésus (P) avait parlé de facon ambiguë. Lorsque cette allégation fut définitivement refutée, ils accusèrent alors le Christ de blasphème, qui équivaut à une haute trahison dans le domaine de la spitualité. Aussi ils eurent à dire que Jésus (P) proclamait qu’il était Dieu \"moi et mon père sommes un\". Les chrétiens furent de l’avis des juifs sur le fait que Jésus (P) n’aurait pas dû faire une telle proclamation, mais divergeaient dans le fait de ne pas, reconnaître le blasphème, car Jésus (P) était Dieu et avait donc le titre de divination.Les chrétiens et les juifs ont convenu du fait que ce point sombre était de taille."}, {"t": "p", "x": "Pour certains ce pouvait être une excuse pour une \"rédemption\", pour les autres une autre excuse pour mieux embrouiller les choses. Entre les deux, Jésus (P) est laissé à son sort, mais il refuse de participer à ce jeu malpropre. 34.\"Jésus leur répondit : N’est-il pas écrit dans votre loi: \"Tai dit : vous êtes des Dieux\".\" 35. \"Si elle a appelé Dieux ceux à qui la parole de Dieu a été adressée, et l’Écriture ne peut être abolie.\""}, {"t": "p", "x": "A celui que le père a sanctifié et envoyé dans le monde,"}, {"t": "p", "x": "(28) Observez le jeu subtil des enseignants du christianisme dam l’utilisation des lettres majuscules et minuscules pour écrire \"Dieu\". De même, dans les prononciations de Dieu et de Jésus. Pour Dieu ils utilisent un \"I\" majuscule à la Y personne du singulier (il), alors qu’ils écrivent le même pronom avec un \"I\" majuscule pour le il de la 3° personne pour Jésus. Il n’y a pas de telles nuances en hébreu ou en grec vous dites : tu blasphèmes ! Parce que j’ai dit : \"Je suis le fils de Dieu\".\" (28) Jean10: 34"}]}, {"title": "Pourquoi « votre loi » ?", "blocks": [{"t": "p", "x": "Il (Jésus*) est sarcastique dans ’le verset 34., mais quelque soit la situation, pourquoi dit-il, \" votre loi \" ? Ne serait ce pas sa loi à lui aussi ? N’avait-il, pas dit : \"Ne pensez pas que je sois venu abolir la loi ou les prophètes. Je suis venu non pour abolir mais pour accomplir.En"}, {"t": "p", "x": "vérité, jusqu’à ce que le ciel et la terre passent, pas un seul iota (29) pas un seul trait de lettre de la loi ne passera jusqu’a ce que tout soit arrivé.\""}, {"t": "p", "x": "Matthieu 5:17-18"}]}, {"title": "« Vous êtes des dieux »", "blocks": [{"t": "p", "x": "\"Vous êtes des Dieux\". Il cite délibérément le 82ème psaume, verset 6 : \"J’avais dît : Vous êtes des Dieux, vous êtes tous des fils du Dieu Très Haut.\"Jésus (P) continue : \"S’Il (Dieu Tout-Puissant) les a désignés Dieux, eux sur qui la parole de Dieu a été révélée (ce qui veut dire que les prophètes divins étaient désignés \" Dieux \") et que les Écritures ne pouvaient être brisées [(dénoncées*) autrement vous ne pouvez me contredire]. Jésus (P) connaissait ses Écritures, il parlait avec autorité et raisonnait avec ses ennemis qu’il consideraît comme des hommes bons, des saints, des messagers de Dieu et qui sont désignés comme"}, {"t": "p", "x": "(29) Plus petite lettre de l’alphabet hébreu. \"Iota\" signifie ici que pas la plus petite lettre de la loi ne pouvait être abrogée. \"Dieux \" dans nos écritures officielles et dans lesquelles vous ne trouverez pas d’erreur. Alors pourquoi faites-vous une exception pour moi, quand la seule demande que faite pour moi est largement modeste ? Dans notre langue un \"fils de Dieu\" par rapport aux autres désignés \" Dieu\" part Dieu lui-même, quand bien même les juifs m’aurait décrit \"’Dieu\" dans notre langue, conformément aux us et coutumes hébraïques vous ne commettrez aucune faute avec moi. lest la lecture simple du Nouveau Testament, je ne donne aucune interprétation personnelle ou quelque sens ésotérique aux mots !"}]}]}, {"n": 7, "title": "Au tout début", "sections": [{"title": "Au tout début", "blocks": [{"t": "p", "x": "Où Jésus (P) a-t-il dit: \"Je suis Dieu\" ou \"je suis l’égal de Dieu\" ou encore \"Vénérez-moi\" ? demandai-je au Canadien D.D. De nouveau, il me cita le plus galvaudé des versets du Nouveau Testament :\"Au commencement était la parole, et la parole était avec Dieu et la parole était Dieu.\" Jean 1:1(30) Veuillez noter que ce ne sont pas les termes de Jésus (P). Ils appartiennent à Jean (ou celui qui est sensé les avoir écrits). Reconnus par tous les érudits chrétiens étudiant la Bible, comme étant les mots d’un autre juif, Philo d’Alexandrie, qui les aurait écrits bien avant la naissance de Jean et de Jésus (P) et qui n’a jamais fait état de la moindre inspiration (divine) en ce qui les concerne. Quelque soit le sens que Philo a voulu propager autour de ces mots (que notre Jean a plagiés) (31) nous l’acceptons pour ce qu’il aura de pire."}, {"t": "n", "x": "(30) Étrangement, durant toute ma vie, je n’ai pas rencontré un seul chrétien capable de me citer le premier commandement pour tout prouver. (31) Plagier: s’accaparer les œuvres artistiques d’autrui (œuvres écrites...) et les faire passer"}, {"t": "p", "x": "pour siennes en les falsifiant, recopiant... Consultez l’ouvrage \"La Bible est-elle la parole de Dieu\", page 31, pour les plagiats importants et nombreux."}]}, {"title": "Grec et non pas hébreu", "blocks": [{"t": "p", "x": "Depuis la parution des vingt-sept volumes du Nouveau Testament en grec, une secte chrétienne a realisé sa propre version et en a même changé le nom pour l’appeler \"Les Ecritures gréco-chrétiennes\". Je demandai au révérend s’il connaissait la langue grecque ? \"Oui\" me répondit-il. Il l’avait étudié durant cinq années avant d’être diplômé. Je lui demandai quel était le mot grec pour désigner Dieu, la première fois où il fut mentionné dans une citation : \"Et le mot fut avec Dieu \"? Il ouvrit de grands yeux mais resta sans me répondre.\"Bon, répondis-je, le mot était Hotheos qui, littéralement, signifie \"le Dieu\"."}, {"t": "p", "x": "Depuis que les Européens [(Américains du Nord inclus), Occidentaux*]. ont développé l’usage des majuscules utilisées pour les noms propres et des minuscules utilisées pour les noms communs, il est admis que le mot Dieu s’écrira avec une majuscule. Bref, Hotheos est transformé en \"dieu\" qui lui-même devient alors \"Dieu\" \" Dites-moi maintenant quel est le mot grec pour dire Dieu dans la deuxième citation de votre référence \"Et la parole était Dieu \" ? Le révérend resta silencieux, non parce qu’il ne connaissait pas le grec ou parce qu’il avait menti."}, {"t": "p", "x": "Il en savait plus que cela mais les jeux étaient faits. je dis alors que le mot en fait était Tontheos qui signifie \"un dieu\". Par rapport à votre système de traduction vous avez écrit ce deuxième mot \"dieu\" avec une minuscule et non avec une majuscule. En d’autres termes, Tontheos devient \"divinité\". Les deux termes sont en fait exacts. j’enchainai pour le révérend : \"Mais, dans les Corinthiens 4:4, vous avez malhonnêtement changé vos systèmes de traduction en faisant usage de minuscule quand il s’agissait de Dieu et du diable, \"..."}, {"t": "p", "x": "Dieu de ce monde\".Le mot grec pour Dieu est Hotheos, le même que celui de Jean 1: 1. \"Pourquoi n’avez-vous pas été conséquents avec vos systèmes de traduction ?\" Si Paul fut inspiré pour écrire Hotheos le Dieu, pour le diable pourquoi l’a-t-il jalousé pour cette majuscule \"D\" Dans le vieux testament, le Seigneur dit à Moïse:\"... Vois, Je te fais Dieu pour le pharaon.\" Exode 7:1 Pourquoi écrivez-vous Dieu avec un \"d\" minuscule quand vous faites référence à Moise, comme vous le faites pour un mot important \" Parole \"."}, {"t": "p", "x": "\"Et la parole fut Dieu ?\" pour quoi faites-vous cela ? Pourquoi jonglez-vous avec la parole de Dieu ? demandai-je au révérend. Il me répondit : \"Je n’y suis pour rien !\". Je le savais et enchaînais : \"Je parle de ceux qui ont à coeur ’les intérêts du christianisme, ceux qui sont déterminés à défier le christ en faisant usage ici de majuscules et là de minuscules pour désarçonner les croyants dans leur foi, persuadés que chaque point, chaque virgule, les majuscules et les minuscules furent dictées par Dieu luimème."}]}]}, {"n": 8, "title": "L’omission", "sections": [{"title": "Trois titres", "blocks": [{"t": "p", "x": "Il est très difficile pour quelqu’un de pouvoir rencontrer, à travers une modeste publication comme celle-ci, toutes les références ayant trait à Jésus (P) et disséminées tout au long des quinze chapitres différents du Saint Coran. Nous pouvons donner un bref aperçu de l’index reproduit à partir du Saint Coran et figurant en page 12-13 de ce recueil. Nous pouvons y trouver trois titres significatifs que nous n’avons pas encore cotoyés dans nos échanges : 1 - Non crucifié : IV 157 2 - Message et miracles : V 113 - XIX 30-33 3 - Ahmed annoncé: LXI 6 En référence au premier titre \"Non crucifié\", j’ai rédigé un recueil sous le titre de \"Le Christ fut-il crucifié ?\" il y a quelque vingt années."}, {"t": "p", "x": "Le recueil n’est plus imprimé et nécessite une mise à jour, tant d’eau ayant coulé sous les ponts depuis qu’il a vu le jour.Quant au troisième titre cité plus haut, \"L’annonce de Ahmed\" (32) ou,\"Ahmed annoncé\", je me propose de"}, {"t": "n", "x": "(32) Ahmed est un autre nom de Mohammed (Ç) réaliser un ouvrage qui sera intitulé \"Mohammed (Ç), le successeur naturel de Jésus (P)\" et ce, lorsque j’aurai achevé \"Le Christ fut-il crucifié ?\". j’éspère terminer ces deux projets prochainement, si Dieu l’agrée. Priez pour moi."}]}, {"title": "La voie du salut", "blocks": [{"t": "p", "x": "Nous sommes maintenant en face de notre deuxième titre : \"Message et miracles\". Le message de Jésus (P) fut simple et direct comme le furent ceux de ses prédécesseur et comme le fut celui de son sucesseur Mohammed (Ç) nommément : \"Croyez en Dieu et exécutez ses commandements\". Pour Dieu, inspirateur de ses messagers, il est Dieu constant et consistant, il n’est pas \"auteur de confusion\" (Corinthiens 14:33). Une loi fut \"édictée\" par Jésus (P) à un juif qui cherchait la vie éternelle ou le salut. \"Alors un homme s’approcha et dit a Jésus :\""}, {"t": "p", "x": "Maitre, que dois-je faire de bon pour avoir la vie éternelle ?\"Il lui répondît : \"Pourquoi m’interroges-tu sur ce qui est bon. Si tu veux entrer dans la vie, observe les commandements\".\" Matthieu 19:16-17 Vous conviendrez que si l’un de nous avait été juif, nous aurions pu conclure à partir de ces versets que le salut pouvait étre garanti dès lors que les commandements étaient respectés, sans qu’une goutte de sang ne fut versée. Bien sùr Jésus (P) parlait par allusions, car il connaissait parfaitement le \"sacrifice de sa mission de rédemption\", son \"supplice pour les autres\" (?!) et pour toutes les fois ou les lois divines furent violées par les hommes, il savait que le terme était proche."}, {"t": "p", "x": "Pourquoi lui aurait-il offert une solution \" impossible\" qui respectait la loi (divine*) (ainsi que l’affirment les chrétiens) alors qu’il lui était possible’d’opter pour une solution moins contraignante ? Ne savait-il donc pas ce qui allait se produire, qu’il allait être crucifié ?"}, {"t": "p", "x": "N’y avait-il donc pas un accord entre Père et fils avant le commencement des mondes (matériel et audelà*). Fallait-il que son sang coule pour sa rédemption ? Avait-il perdu la mémoire (ou la raison *) ? Non ! En aucune façon, ce conte de fée n’a pu être. Il savait qu’il n’y aurait qu’une seule voie pour atteindre Dieu, le respect de la loi divine."}]}, {"title": "Les miracles que prouvent-ils ?", "blocks": [{"t": "p", "x": "en ce qui concerne ses (Jésus *) miracles, le Saint Coran ne s’intéresse pas aux détails concernant la cécité de Bartimée ou Lazare ou quelque autre miracle que ce soit, sauf lorsqu’il prit défense de sa mère alors qu’il n’était que petit enfant dans ses bras (voir page 24). Le musulman n’éprouve aucune hésitation à admettre les plus inexplicables de ses miracles, même ceux relatifs aux résurrections. Cela ne fait pas de Jésus {P) un \"Dieu\" ouun fils engendré par Dieu, comme cela est compris par les chretiens. Les miracles ne prouvent pas, même s’ils sont prophétiques, si un homme est sincère ou non."}, {"t": "p", "x": "Jésus (P) luimême aurait dit: \"Car il s’élèvera de faux, Christs et de faux prophètes, ils opéreront de grands signes, et des prodiges au point de séduire si possible même les élus\" Matthieu 24:24 Si de faux prophètes et de faux Christs peuvent accomplir des miracles, alors ces choses incroyables ou ces miracles ne prouvent en aucune façon origine ou quoique ce soit d’autre d’un prophète. Jean-le-Baptiste fut, d’après Jésus (P), le plus grand des prophètes israélites, plus grand que Moïse (P), David, Salomon, Isaïe et tous les autres, lui-mème étant inclus et ce d’après ses propres termes: \"En vérité, je, vous le dis parmi ceux qui sont nés d’une femme, il ne s’en est- pas levé de Jean-Baptiste...\""}, {"t": "p", "x": "Matthieu 11:11 (1)Ce qui n’exclut pas Jésus (P) car n’était-il pas né d’une femme, Marie. (2) Jean-Baptiste plus grand que tous alors qu’il navait pas réalisé un seul miracle ! Les miracles ne sont pas des références pour porter un jugement et apprécier le vrai et le faux. Mais dans son enfance, le chrétien apprend avec insistance que Jésus (P) est Dieu, du fait qu’il a res’sucité des morts. Le fait de ressuciter des morts donnerait-il aussi d’autres Dieux ? Ceci le rend perplexe car son esprit est obnubilé par le fait que d’autres ont éclipsé Jésus (P) dans sa propre Bible."}, {"t": "p", "x": "Par exemple, et conformément à ses faux standards : a - Moïse (P) est plus grand que Jésus ’(P} car il a donné la vie à un bâton mort et a transformé une plante en animal en en faisant un serpent. (Exodes 7:1 0). b - Eliezer est plus grand. que Jésus (P) car ses, vieux os, de par le simple contact avec un cadavre, lui ont rendu la vie. (2 Rois 13:21) Est-il besoin d’illustrer tous les miracles ou d’en faire un catalogue ? Mais la maladie est chronique \"Dieu réalisait ses miracles à travers ses prophètes, mais Jésus (P} réalisait ses miracles grâce à son seul pouvoir ?\" Demandez-le à Jésus (P) et il nous répondra :"}]}, {"title": "Le pouvoir n’était pas le sien", "blocks": [{"t": "p", "x": "\"Jésus s’approcha et leur parla ainsi : tout pouvoir été donné dans le ciel et sur la terre.\" Matthieu 28:18 \"Mais si c’est par l’esprit de Dieu que moi je chasse les démons, le royaume de Dieu est parvenu jusqu’a vous.\" Matthieu 12:28 \"Moi, je ne peux rien faire par moi-même...\" Jean 5:30 \"Mais si c’est par le doigt de Dieu que moi je chasse les démons...\" Luc 11:20"}]}, {"title": "Un pouvoir emprunté", "blocks": [{"t": "p", "x": "Comme il Jésus le disait le pouvoir n’était pas le sien: \"Il me fut donné\", mais donné par qui? par Dieu bien sûr ! Chaque action, chaque mot est de Qieu."}]}, {"title": "Lazare", "blocks": [{"t": "p", "x": "Mais devant l’ampleur de tout ce qui a été fait depuis le prodigieux miracle qui fit ressusciter Lazare, nous analyserons l’épisode tel qu’il nous est rapporté dans l’évangile de Jean. Ce qu’il y a d’étonnant c’est qu’aucun autre évangil fait état de Lazare dans aucun contexte. L’histoire fut que Lazare était très malade et que ses soeurs, Marie et Marthe, lancèrent des appels pressants à Jésus (P) pour qu’il vienne le guérir, mais il arriva trop tard, quatre jours après sa mort."}]}, {"title": "Il s’insurgeait", "blocks": [{"t": "p", "x": "Marie gronda Jésus (P) du fait de son retard sans lequel son frère ne serait pas mort. Voulant dire par la que s’il avait pu chasser la maladie chez d’autres hommes, il aurait pu guérir son frère, de surcroît l’un de ses meilleurs amis. Jésus (P) lui dit ceci : \"Si vous avez la foi jusqu’à maintenant, vous pourriez voir la puissance de Dieu.\" il fallait qu’ils aient tous la foi. N’avait-il pas dit que la foi pouvait déplacer des montagnes ?Il demanda alors a être conduit à la tombe.En chemin il se prit à se lamenter."}, {"t": "p", "x": "Il ne marmonnait pas, il mettait tout son coeur dans ses prières à Dieu. Il sanglotait amèrement et ses paroles étaient inaudibles de l’assistance qui pensait qu’il s’insurgeait. A l’approche de la tombe, Jésus (P) se remit à sangloter puis, repenti vers Dieu qui entendit sa prière, il reçut alors l’assurance de voir sa prière exaucée."}, {"t": "p", "x": "Jésus (P), rassuré, pouvait demander à ce que la pierre tombale fut déplacée afin de permettre à Lazare de ressusciter. Sans cette assurance divine Jésus (P) serait devenu fou."}]}, {"title": "Chasser tout malentendu", "blocks": [{"t": "p", "x": "Marie avait de sombres pensées car son frère était bel et bien mort depuis quatre jours, mais Jésus était un proche et la pierre tombale fut déplacée."}, {"t": "p", "x": "\"Il ôtèrent donc la pierre, Jésus leva les yeux en haut et dit : Père je Té rends grâce de ce que tu m’as exaucé.Pour moi je savais que tu m’exauces toujours, mais j’ai parlé à cause de la foule de ceux qui se tiennent ici afin qu’ils croient que c’est Toi qui m’as envoyé.\" Jean 11:41-42."}, {"t": "p", "x": "Qu’est-ce que tout cela ? Un jeu de rôles ? Pourquoi tout ce drame ? Parce qu’il savait que ce peuple crédule et superstitieux ne comprendrait pas l’origine du miracle. Il pourrait le prendre pour Dieu. Donner la vie (ressusciter*) à un mort est du seul pouvoir de Dieu. Pour être assuré doublement du fait que le peuple ne se, méprendrait pas, il se mit à parler fort et à \" marmonner \"alors qu’il implorait le secours de Dieu Tout Puissant. La prière fut incohérente, d’après ce que les participants avaient pu discerner, mais Dieu dans sa miséricorde avait accepté sa prière : \"Vous m’avez entendu\"."}, {"t": "p", "x": "En d’autres termes, il dit : \"Vous m’écoutez toujours\", voulant dire que tous les miracles qu’il avait réalisés étaient une réponse de Dieu à ses prières. Les juifs, à l’époque, comprirent pafaitement la situation et glorifièrent Dieu comme nous le dit Matthieu à une autre occasion lorsqu’ils glorifièrent qui à donné aux hommes un tel pouvoir. Matthieu 9:8 En fait Jésus (P) donna les raisons de ses éclats de voix car il dit : \"Ils auraient pu croire que vous m’aviez envoyé.\". D’abord, celui qui est envoyé est un messager et s’il est envoyé par Dieu est un messager de Dieu, Rassoul Allah."}, {"t": "p", "x": "Hélas, cette tentative de Jésus (P) pour prévenir tout malentendu à propos de Dieu qui avait permis à ces Miracles de se réaliser, quand lui Jésus (P) n’était que son messager, échoua. Les chrétiens ne purent accepter le désaveu ambigu de Jésus (P) pas plus que le serment de Pierre, le \"rocher\" sur lequel Jésus (P) était sensé bâtir son église Peter déclamait: \"israélites, écoutez ces paroles : Jésus de Nazareth, cet homme approuvé. de Dieu devant vous par les miracles, les prodiges et les signes que Dieu a fait par lui au milieu de vous, comme vous le savez vous-mêmes\". Actes 2:22"}]}, {"title": "Une situation néfaste", "blocks": [{"t": "p", "x": "Ce message est. répété très. souvent par Dieu tout-Puissant dans le Saint Coran en référence aux révélations. Dans le verset 49 du chapitre 3, Allah l’a clarifié. Aucun signe ou miracle ne fut accompli par Jésus (P) que lorsque Dieu l’a voulu. \""}]}, {"title": "Avec le consentement d’Allah", "blocks": [{"t": "p", "x": "Avec la permission divine, Jésus (P), Peter et Dieu le disaient, mais les férus de controverse restent sourds. Les injures, la superstition et les fausses croyances meurent difficilement."}, {"t": "p", "x": "Notre rôle est de délivrer le message, de façon puissante et claire. Nous laissons le reste à Dieu qui nous dit dans le Saint Coran alors que la situation n’est pas totalement favorable. \"c’eut été bien meilleur pour eux. Il en est qui ont cru, mai la plupart d’entre eux sont des dévergondés. Saint Coran 3:110 \"parmi eux\" signifie les juifs et les chrétiens. Ils sont constitués deux peuples : l’un est celui de la foi à qui le livre est destiné, l’autre composé de rebelles qui transgressent la loi divine. Nous devons trouver les voies et les moyens pour les atteindre.Notre littérature est destinée à alimenter tout le monde.Faites-la connaître à vos amis non musulmans."}, {"t": "p", "x": "Ouvrez le Saint Coran et donnez lecture à vos relations chrétiennes et à vos proches des versets abordés dans ce recueil. Nous pouvons maintenant conclure : \"Tel est Jésus fils de Marie, c’est le langage mème de la vérité qui fait l’objet de leur doute. Il ne convient nullement à Dieu de s’attribuer un enfant, gloire et pureté à lui ! quand il décide une chose. Il lui suffit de lui dire \"sois !\" et elle devient réelle. Dieu est mon seigneur et le vôtre, adorez-le humblement c’est la une voie rectiligne.\""}, {"t": "p", "x": "Saint Coran 19:34-36"}]}]}]}, {"id": "bible", "title": "La Bible est-elle la parole de Dieu ?", "sub": "Versions, auteurs et contradictions du texte biblique", "chapters": [{"n": 1, "title": "Ce qu’ils disent", "sections": [{"title": "La Bible", "blocks": [{"t": "p", "x": "est-elle la parole de DIEU ? Ce qu’ils disent."}]}, {"title": "Les chrétiens confessent", "blocks": [{"t": "p", "x": "Le Docteur W. Graham Scroggie du Moody Bible Institute (l’Institut Moody,Bible) de Chicago, l’une des missions évangéliques chrétiennes les plus prestigieuses du monde, répond à la question posée \"La Bible, est-elle la parole de Dieu ?\" par un livre intitulé : \"Elle est d’essence humaine et cependant divine\". A la page 17, il écrit : \"Oui, la Bible est d’essence humaine, bien que certains aient nié ce fait. Les livres de la Bible (l) n’ont fait que traverser l’esprit des hommes, car écrits dans un langage humain, par la main de l’homme et portant en eux toutes les caractéristiques humaines\"."}, {"t": "p", "x": "Un autre savant chrétien Kenneth Cragg, l’évêque anglican de Jérusalem, dit dans son livre: \"The Call of the Minaret\" (l’Appel du Minaret), page 277 \"Pas comme le nouveau Testament (2)... Il existe une condensation, une rédaction (3) et aussi un choix, des reprises de citations et des témoignages. Les Évangiles ont survécu à leurs auteurs et sont présents dans l’esprit de l’Église. Ils sont les représentants de 1 expérience et de l’histoire.\""}, {"t": "p", "x": "1. La Bible n’est pas un seul livre, c’est une sélection et une compilation de plusieurs livres. 2. Par opposition au Coran. 3. \"Rédaction\" - alternance aussi."}, {"t": "p", "x": "Devions-nous encore ajouter quelque chose ? Non, mais les propagandistes professionnels ont toujours l’aplomb de faire croire à leurs lecteurs qu’ils ont prouvé que la Bible est incontestablement la Parole de Dieu, dissipant ainsi toute ombre de doute. Leurs exercices sémantiques sont étonnants : tergiversations et jeux de mots ! Ces deux Docteurs en Religion nous font comprendre, très clairement, que la Bible est l’oeuvre de l’homme, tout en feignant de révéler le contraire. Un vieil Arabe dit à ce sujet: \"Si tels sont les prêtres, alors que Dieu bénisse la congrégation\"."}, {"t": "p", "x": "En conséquence, l’évangéliseur acharné et le défenseur de la Bible sont ainsi amenés à harceler les païens (i). Un visiteur assidu de la Mosquée de Johannesbourg voulut \"témoigner\" (2) auprès des membres de la congrégation. Lorsque je lui fus présenté (et connaissant ses desseins) je le conviai à déjeuner au domicile de mon frère - à proximité de la Mosquée. La discussion sur l’authenticité de la Bible s’était engagée et je devinai alors son dogmatisme obstiné. Je lui dis : \"Votre Professeur Geyser (Chef du Département de Théologie) ne croit pas que la Bible soit la Parole de Dieu\"."}, {"t": "p", "x": "Sans sourciller, il répondit : \"Je sais\". A ce moment-là, je n’avais aucune idée de l’opinion da Professeur quant à la Bible. Ce n’était là que pure hypothèse de ma part, suite à une polémique dans son entourage au sujet de la \"Divinité du Christ\" (s). Je poursuivis en disant : \"Votre conférencier ne croit pas que la Bible soit la Parole de Dieu\". Le jeune évangéliste répondit à nouveau \"Je sais\" et, cette fois-ci, ajouta : \"Mais je crois, moi, que c’est la Parole de Dieu !\" C’était sans espoir ! Même Jésus (P)* se lamentait :"}, {"t": "p", "x": "(·) Abréviation de la formule de révérence : \"Que la Pain soit sur lui\". 1. Voir \"How Lost are the Heathem ?\" par Dr Scroggie, Moody Press. 2. Lorsque tes chrétiens utilisent le mot \"témoigner\", il faut entendre là \"propager, convertir, faire adhérer\". 3. Ce sujet sera w de façon plus exhaustive, Insh Allah, dans mon prochain ouvrage \"Christ in Islam (Le Christ dans 7slam). ’,... parce qu’en voyant ils ne voient pas; et qu’en entendant ils n’entendent ni ne comprennent.\"(Matthieu 13:13) Le Coran, le Saint Livre de Dieu, condamne également cette mentalité obstinée"}, {"t": "v", "x": ["\"Sourds, muets, aveugles,", "ils ne reviendront jamais", "vers Dieu.\"", "(Saint Coran 2:18)"]}, {"t": "p", "x": "Ces pages sont dédiées aux \"âmes humbles, qui sont à la recherche de la Lumière de Dieu, et qui souhaitent être guidées pa elle. Quant aux âmes malades, les faits, tels que présentés ici, ne peuvent qu’accroît leurs malaises."}]}]}, {"n": 2, "title": "Le point de vue des musulmans", "sections": [{"title": "Les chrétiens présomptueux", "blocks": [{"t": "p", "x": "Qu’ils soient catholiques, protestants ou adeptes de l’une des mille et une sectes et confessions da christianisme, pas un seul missionnaire ne supposera qu’une conversion puisse le conduire à accepter sa Sainte Bible comme étant le livre de l’autorité définitive sur toute opinion religieuse ? la seule réponse que le futur \"convertisseur\" puisse faire est de citer les versets de la Bible, opposés à ceux du missionnaire ou de débattre de leurs interprétations."}]}, {"title": "Question tenace", "blocks": [{"t": "p", "x": "Lorsque le musulman prouve son point de vue à partir de la Sainte Écriture des chrétiens, et lorsque le prêtre, pasteur ou prêcheur, ne peut réfuter les arguments - alors il s’abrite derrière la question : \"Reconnaissez-vous la Parole de la Bible comme étant la Parole de Dieu ?\" Lorsqu’on y regarde bien, la question semble facile, mais il n’est pas si simple d’y répondre par \"oui\" ou \"non\". Il faut d’abord expliquer sa position. Mais le chrétien ne laisse à personne cette chance, s’impatiente : \"Réponds : Oui ou non !\" Les juifs avaient agi ainsi avec Jésus (P) il y a deux mille ans, sauf qu’il ne fut pas \"encamisolé\" comme on le fait de nos jours !"}, {"t": "p", "x": "Le lecteur acceptera volontiers que les choses ne soient pas toutes noires ou toutes blanches. Entre ces deux extrêmes, il existe une gamme de différents gris. Si vous répondez par \"oui\" à sa question, cela signifie que vous êtes prêt à tout avaler: l’hameçon, la ligne et le plomb, de la Genèse à la révélation de sa Bible. Si vous répondez par \"non\", alors il se démarque des faits énoncés et rallie l’avis de ses coreligionnaires et dit : \"Vous voyez, cet homme ne croit pas dans la Bible ?\" Grâce à cet échappatoire, il se trouve à nouveau à l’abri. Que doit faire le Muballigh ? Il doit expliquer sa position vis-à-vis de la Bible."}]}, {"title": "Trois degrés d’évidence", "blocks": [{"t": "p", "x": "Nous, musulmans, n’hésitons pas à reconnaître qu’il y a dans la Bible trois types de témoignages évidents : 1. La possibilité de reconnaître dans la Bible ce qui peut être décrit comme \"La Parole de Dieu\". 2. La possibilité aussi de distinguer ce qui peut être Décrit comme \"Les Paroles d’un Prophète de Dieu\". 3. Et le fait que la Bible en sa totalité n’est que la compilation de témoignages visuels ou auditifs, ou de oui-dire. Sous cet angle, ce sont les \"Paroles d’un historien\"."}, {"t": "p", "x": "Vous n’avez pas à chercher d’exemples de ces différents types d’évidences dans la Bible. Les citations ci-après suffisent"}, {"t": "p", "x": "Le PREMIER type a) \"[Je] leur susciterai du milieu de leurs frères un prophète... [je] mettrai mes paroles dans... et il dira tout ce que (je lui commanderai:\" (Deutéronome 18:18) b) \"C’est [moiJ, [moiJ qui suis l’Éternel, et hors de (moij il n’y a point de sauveur.\" (Esaïe 43:11) c) \"Tournez-vous vers [moi] et soyez sauvés, vers tous les confins de la terre ! Car [jeJ suis Dieu (P), et il n’y en a point d’autre.\" (Esaïe 45:22) Remarquez le pronom personnel à la première personne du singulier (entre crochets) dans les références ci-dessus. Sans difficulté, aucune alors; vous admettrez que ces affirmations semblent bien émaner de Dieu."}, {"t": "p", "x": "Le SECOND type a) \"Et... Jésus (P) cria d’une voit forte : \"Eli, Eli, la masabachtani ?\"...\" (Matthieu 27:46) b) \"Jésus (p) répondit : \"Voici le premier (de tous les commandements). Ecoute Israël, le Seigneur, notre Dieu, le Seigneur est un.\" (Marc 12:29) c) \"Jésus (P) lui dit: \"Pourquoi m’appelles-tu bon ? Personne n’est bon, si ce n’est Dieu seul ?\" (Marc 10:18) Même un enfant serait à même d’affirmer que, Jésus (P) \"cria\", Jésus (P) \"répondit\" et Jésus (P) \"dit\" sont des paroles attribuées à un autre : les Paroles d’un prophète de Dieu."}, {"t": "p", "x": "Le TROISIEME type \"Apercevant de loin un figuier qui avait des feuilles, [il] (i) alla voir s’[il] trouverait quelque chose, mais s’en étant approché; [il] n’y trouva que des feuilles...\" (Marc 11:13) L’ensemble de la Bible est un témoignage de ce troisième type d’exemples. Les paroles d’une troisième personne. Remarquez les pronoms entre crochets. Ce ne sont pas les Paroles de Dieu, ni celles de Son Prophète mais les paroles d’un historien. Pour le musulman, il est facile de distinguer ces différents types d’évidence car elles appartiennent à sa propre croyance et sont sanscrites dans différents livres, contrairement aux autres religions."}, {"t": "p", "x": "Un : le premier type -La Parole de Dieu - est transcrite dans un livre appelé Le Saint Coran."}, {"t": "p", "x": "1.[11] : Jésus."}, {"t": "p", "x": "Deux : Le deuxième type - Les Paroles du Prophète de Dieu - (Mohammed, que la paix et la bénédiction d’Allah soient avec lui) - sont transcrites dans les Livres de la Tradition : Les hadith(s)."}, {"t": "p", "x": "Trois : Les évidences du troisième type abondent dans différents livres de l’Histoire Islamique, certains étant rédigés par quelques personnalités intègres et cultivées et d’autres par des personnes de crédibilité plus douteuse."}, {"t": "p", "x": "Le musulman conserve jalousement séparés ces 3 types d’évidence, selon leur propre degré d’autorité, et ne leur accorde jamais la même attention; alors que la Bible regroupe, sous un seul titre, des styles littéraires différents qui forment un tout -parfois gênant, le sordide et l’obscène se mêlant sous le même couvert, contraignant le chrétien à donner à l’ensemble une signification et un ascendant spirituel égal. Ce qui est regrettable !"}]}]}, {"n": 3, "title": "Les multiples versions de la Bible", "sections": [{"title": "Les multiples versions de la Bible", "blocks": [{"t": "p", "x": "Voyons à présent l’analyse de la réaction d’un chrétien vis-àvis de son Livre Saint."}]}, {"title": "Séparer le grain de l’ivraie", "blocks": [{"t": "p", "x": "Avant d’observer les différentes versions, permettez-moi de vous donner notre propre idée des Livres de Dieu. Lorsque nous disons croire en la Tawrât, le Zabour, l’Injîl et le Coran, qu’est-ce que cela signifie réellement ? Nous savons déjà que le Saint Coran est la Parole de Dieu, transmise à notre Saint Prophète Mohammed Mustapha (Ç)*, par l’archange Gabriel. Parole parfaitement préservée et protégée contre toute altération humaine au cours des quatorze cent années passées (1). Même les critiques les plus virulentes de l’Islam ont confirmé, à contre-coeur, la pureté du Saint Coran : \"Dans le monde, il n’est probablement pas d’autre livre qui existât depuis douze siècles (quatorze d présent), avec un texte aussi pur.\" (Sir William Muir)."}, {"t": "p", "x": "La Tawrât, en laquelle nous, musulmans, croyons n’est pas la Torah des juifs et des chrétiens, bien que les paroles en arabe ou"}, {"t": "p", "x": "(*) Abréviation de la formule de révérence : \" que les prières (çalaâts) d’Allah soient sur Lui et ses Descendants\". 1. Que vous soyez ou non musulman, vous n’êtes s tenu d’accepter ceci les yeux fermés. Vous pouvez vérifier : le Coran a été protégé par un système mathématique divin ?r vous vez voir, sentir et toucher. Demandez un exemplaire du livre \" Le Coran - le Miracle ultime\". en hébreu soient identiques. Nous croyons que tout ce que le Saint Prophète Moïse (P) a prêché à son peuple était la révélation de Dieu Tout-Puissant."}, {"t": "p", "x": "Il n’était pas l’auteur de ces \"livres\" qui lui sont attribués par les juifs et les chrétiens. (1) Nous croyons aussi que le Zabour était la révélation de Dieu transmise à Hazrat Dawood (David) (p), mais que ces psaumes (2) qui lui sont attribuées, ne sont pas la révélation. Les chrétiens eux-mêmes en conviennent."}, {"t": "p", "x": "Que dire de l’Injîl ? Injeel signifie \"Evangile\" ou \"bonne nouvelle\" que Jésus-Christ prêcha durant son court ministère. Les auteurs de l’Évangile évoque souvent Jésus (P) allant sur les chem ins et prêchant lEvangile (Injîl). \"Jésus (P) parcourait toutes les villes et les villages,... prêchant l’Évangile... guérissant toute maladie et toute infirmi té.\" (Matthieu 9:35) \"... mais quiconque perdra sa vie d cause de moi et de l’Évangile la sauvera.\" (Marc 8:35) \"... il annonçait la banne nouvelle...\" (Luc 20:1) Le mot \"Évangile\" est fréquemment utilisé, mais quel est l’Évangile que Jésus (P) prêche ?"}, {"t": "p", "x": "Parmi les 27 Livres du Nouveau Testament, seulement une infime partie peut-être acceptée comme étant la Parole de Jésus (P). Les chrétiens se glorifient des Evangiles selon Saint Matthieu, selon Saint Marc, selon Saint Luc et selon Saint Jean, mais pas un seul évangile selon (Saint) Jésus (P), lui-même ! Nous croyons sincèrement que tout ce que le Christ (P) prêchait émanait de Dieu. Ce fut l’injîl, la bonne nouvelle et le chemin à"}, {"t": "p", "x": "suivre, que Dieu montrait aux enfants d’Israël. De son vivant, Jésus (P) n’écrivit pas, pas même un seul mot, et jamais il ne demanda à quiconque d’écrire Que se passe-t-il donc pour que l’on dise aujourd’hui que les Évangiles sont des oeuvres d’auteurs anonymes !"}, {"t": "p", "x": "1.Ceci est mis en évidence chapitre V. 2.Voir \"la confession du Brain Trust chrétien\" page 71."}, {"t": "p", "x": "Auteur : David, bien qu’il y en sit d’autres."}, {"t": "p", "x": "La question qui se pose à nous est : \"Acceptez-vous la Bible comme Parole de Dieu ?\" La question est vraiment une forme de défi ? L’interrogateur n’est pas simplement à la recherche d’un éclaircissement La question posée exige un débat Nous avons alors le droit de demander : \"Vous parlez de quelle Bible ?\" \"Pourquoi n’y a-t-il qu’une seule Bible ?\""}]}, {"title": "La Bible catholique", "blocks": [{"t": "p", "x": "Brandissant le \"Douais\", la Version Catholique de la Bible, je demandai : \"Acceptez-vous cette Bible comme étant la Parole de Dieu ?\" Pour des raisons seulement connues d’ellemême, la Catholic Truth Society (Société Catholique de la Vérité) a publié sa version propre de la Bible sous une forme brève et tronquée, une version plus que singulière comparée aux autres versions."}, {"t": "p", "x": "Le chrétien en est déconcerté : \"Quelle Bible est-ce ?\" \"Pourquoi je pensais qu’il n’y avait qu’une seule Bible, c’est ce que vous avez dit ?\" \"Oui\" : murmure-t-il. \"Mais quelle version est-ce ?\" \"Pourquoi cela ferait-il une différence ?\" Bien sûr, et le prêcheur en est conscient. S’il ne revendique qu’une seule Bible, c’est qu’il veut nous tromper ! La Bible Catholique fut publiée à Reims en 1582 à partir de la Vulgate Latine de Jérôme et fut reproduite à Douais en 1609. Ausi la RCV (Version Catholique) est la plus ancienne version que l’on puisse acheter aujourd’hui."}, {"t": "p", "x": "Malgré son ancienneté, les protestants y compris les \"cultes\" (1) condamnent la RCV car elle regroupe sept \"livres\" supplémentaires auxquels ils ne font référence que dédaigneusement sous le nom d’ \"Apocryphe\", comme dans l’Apocalypse, qui est le dernier livre de la RCV (appelé \"Révélation\" par les protestants) dit : \"Si quelqu’un y ajoute, Dieu ajoutera (à son sort)"}, {"t": "p", "x": "1. Ce titre peu flatteur est donné par les orthodoxes aux témoins de Jéhovah aux Seventh Da Adventists Adventistes du septième ’ et à un millier d’autres sectes et confessions ne partageant pas leurs vues. les plaies décrites dans ce livre:\" (Révélation 22:18) Mais qui se méfie ? Les protestants n’ont-ils pas rayé sept livres entiers de leur livre de Dieu, dont - Le Livre de Judith - Le Livre de Tobias"}, {"t": "p", "x": "- Le Livre de Baruch - Le Livre d’Esther, etc..."}]}, {"title": "La Bible protestante", "blocks": [{"t": "p", "x": "Sir Winston Churchill fait des remarques pertinentes au sujet de la Version Autorisée (AV), de la Bible protestante, aussi connue sous le nom de Version du Roi James (KJV : King James Version, en anglais). \"La version autorisée de la Bible fut publiée en 1611 selon la volonté et d la demande expresse de sa majesté le roi James 1er dont elle porte le nom aujourd’hui.\" Les Catholiques aussi aident et encouragent le \"crime\" protestant (Bible tronquée) en amenant les croyants à acheter la Version Autorisée (VA), la seule Bible disponible dans le pays en 1 500 langues et dialectes."}, {"t": "p", "x": "Les catholiques profitent en quelque sorte du travail des protestants ! La majorité des chrétiens - catholiques et protestants - utilise la Version Autorisée (AV) ou Version du Roi James (KJV) ainsi indépendamment nommée."}]}, {"title": "Hommages chaleureux", "blocks": [{"t": "p", "x": "La première à avoir été publiée, en 1611, ainsi que le dit Sir Winston, puis révisée en 1881 (RV), re-révisée et mise à jour sous le nom de Revised Standard Version (Version Standard Révisée (RSV) en 1952 et à nouveau re-révisée en 1971 (le nom est toujours abrégé sous la forme RSV). Voyons quelle est l’opinion de la chrétienté sur la RSV, la Bible la plus révisée. \"La plus fine version que ce siècle ait produit.\" (Journal de lEglise d’Angleterre) \"Une traduction tout à fait nouvelle par les plus éminents savants.\" (Supplément du Times, Littéiaire) \"Les particularités appréciées de la Version Autorisée alliées d une nouvelle fidélité dans la traduction.\" (Life and Work) \"La traduction la plus fidèle et la plus proche de l’original.\" (The Times) Les éditeurs (Collins) dans leurs notes sur la Bible, disent à la page 10 : \"Cette Bible (RSV) est l’oeuvre de trente-deux savants, assistés d’un comité consultatif représentant cinquante confessions participantes.\" Pourquoi cette publicité ? Afin de vendre mieux à un public pourtant facile, et le laisser croire qu’en achetant cette Bible il a fait une bonne affaire."}]}, {"title": "Le best-seller mondial", "blocks": [{"t": "p", "x": "Que dire de la Version Autorisée de 1a Bible (AV), le \"BestSeller mondial\" ? Ces \"Réviseurs\" tous bon vendeurs, ont ainsi beaucoup à dire à ce sujet. Ainsi, la page iii, paragraphe six de la Préface de la RSV (voir page suivante) dit (1) \"La Bible - version du roi James (aussi appelé AV) fut, fort à propos, aussi qualifiée de monument le plus noble de la prose anglaise. Ses réviseurs en 1881 exprimèrent leur admiration pour sa simplicité, sa dignité, sa puissance, ses tournures de style... la"}, {"t": "p", "x": "musicalité et la fidélité de son tempo. Aucun autre livre n’a réussi à rendre compte du caractère personnel et des institutions publiques de ces peuples anglophones. Nous lui sommes redevables de tant de choses.\" \"Pouvez-vous imaginer un hommage plus digne pour le \"Livre des Livres\" que celui qui précède ? Je ne le peux vraiment pas. Laissons le croyant chrétien faire face aux coups cruels donnés par ses propres Hommes de Religion, et dire : \"Toutefois la version du Roi James se caractérise par de sérieux défauts. Et ces défauts sont si nombreux et si importants qu’il faut une révision...\""}, {"t": "p", "x": "Ainsi s’expriment, entre autres, les savants chrétiens orthodoxes \" les plus éminents\". Une autre brillante assemblée de Docteurs en Divinitè doit prochainement rédiger une encyclopédie explicitant la cause de cesimperfections dans leur Saint Ecrit et les raisons qu’ils ont de vouloir les éliminer."}, {"t": "p", "x": "Ce qui suit est la reproduction photographique de la PREFACE de la version Standars Révisée (R.V.S.) de la Bible. rsIoVersion Standard RévI E d e la Version HE Revised Standard Version of the Bible is an authorized revision of the American Standard Version, published in 1901, which was a revision of the King James Version, published in 1611."}, {"t": "p", "x": "The first English version of the Scriptures made b direct translation from the original Hebrew and Greek, and the first to printed, was the work of William Tvndale. He met bitter opposition. He was accused of willfullY perverting the meaning of the Scriptures, and his New Testaments were ordered to be burned as \"untrue translations. He was finally betrayed into the hands of his enemies, and in October 1536, was publicly executed and burned at the stake. Yet Tyndale’s worx became the foundation of subsequent English versions, notablY those of Coverdale, 1?35’ Thomas Matthew (probably a pseudonym for John Ro ers), 153; the reat Bible, 1 39; the Geneva Bible, 1560, and the Bishops’ Bible, 15."}, {"t": "p", "x": "In 1582 a translation of the New Testament, made from the Latin Vulgate by Roman Catholic scholars, was published at Rheims. The translators who made the King James Version took into account ail of these preceding versions; and comparison shows that it owes something to each o them. It kept felicitous phrases and apt expressions, from whatever source, which had stood the test of public usage. t owed most, especially In the New Testament, to Tyndale. The Kin ames Version had to compete with the Geneva Bible in popular g use; but ln t 4e end it prevailed, and for more than two and a half centuries no other authorized translation of the Bible into English was made."}, {"t": "p", "x": "The Kin amer Version became the \"Authorized Version\" of the EnglishJ spea in peo les.The I~in ames Version has with good reason n r m \" t monum n o s rose. s rev sers in 18 1 x r~i s s c s s wer, its ha turns omus c o s cadences. an e e c es o s rhythm.\" It -ntered, as noer as n o e ma ng o e Pe rsona c aracter and the public o institutions of the English-speaking peoples. We owe to it an incalculables. By the middle of the vemen o ca s udies and the discovery of manY manuscri ts more anc eut than those upon which the King JamesPVersion was based, made it manifest ha h o man and soof the English translation."}, {"t": "p", "x": "The task was un2er-a en. Y authority o e Church of En gland, in 18 0. The English Revised Version of the Bible was ublished in 1 1-1885; an the American Standard Version its variant em ying the preferences of the American scholars associated in the work, was published in 1901."}, {"t": "p", "x": "Because of unhappy experience with unauthorized publications in the two decades between 1881 and 1901, which tampered with the text of the E lish Revised Version in the supposed interest of the American public, the American Standard Version was copyrighted, to protect the tex from unauihorized changes. In 1928 this copyright was acquired by the International Council of Reli ous Education. an thus passed into the ownership of the churches of the nited States and Canada which were associated in this Council through their boards of education and publication."}, {"t": "p", "x": "The Council appointed a committee of scholars to have charge of the text of the American Standard Version and to undertake inquiry as to whether Reproduction photographique tirée de la RSV, 1971."}]}]}, {"n": 4, "title": "Cinquante mille erreurs (?)", "sections": [{"title": "Cinquante mille erreurs (?)", "blocks": [{"t": "p", "x": "Les témoins de Jéhovah, dans leur magazine \"Awake !\" (Réveillez-vous !) du 8 septembre 1957, ont publié un titre effrayant: \"50.000 erreurs dans la Bible\" (voir la reproduction page suivante)."}, {"t": "p", "x": "Un dimanche matin, alors que je réfléchissais encore au thème de ce livre, on sonna à ma porte. J’ouvris. Un européen se tenait dehors, sourire aux lèvres. \"Bonjour !\" dit-il. \"Bonjour !\" répondis-je. Il me remit ses magazines \"Awake\" et \"Watchtower\". Un témoin de Jéhovah ! Reconnaissable entre tous : les personnes les plus arrogantes qui n’aient jamais frappé aux portes ! Je l’invitai à entrer. Dès qu’il fut assis, je lui soumis la reproduction intégrale de ce que vous voyez à la page suivante. Lui montrant le monogramme, en haut de la page, je demandai : \"Cela est"}, {"t": "p", "x": "publié par les témoins de Jéhovah ?\" Il s’empressa d’acquiescer. Je dis : \"Il parle de 50 000 erreurs dans la Bible, est-ce vrai ?\" \"Quoi!\" s’exclama-t-il. Je répétai : \"Je dis qu’il parle de 50 000 erreurs dans la Bible\". \"Où avez-vous trouvé cela ?\" demanda-t-il. (Ce texte avait été publié 23 ans auparavant, lorsqu’il n’était peut-être qu’un gamin). Je dis : \"Oublions cette discussion\". \"Cela estil publié par les témoins de Jéhovah ?\" montrant encore le mot \"Awake !\" Il dit cette fois-ci : \"Puis-je jeter un coup d’oeil ?\""}, {"t": "p", "x": "\"Bien sûr\", répondis-je. Je lui tendis la page. Il commença à lire avec attention. Ils (les témoins de Jéhovah) ont l’habitude, ils suivent des cours, cinq fois par semaine dans leur \"Kingdom Halls\" (Salles de la Royauté). Et naturellement, ce sont les missionnaires les plus doués parmi les mille et une sectes et dénominations du christianisme. On leur enseigne à ne se compromettre en aucune façon"}, {"t": "p", "x": "et à se taire lorsqu’ils se trouvent poussés dans leurs derniers retranchements : Attendez que le \"Saint Fantôme\" vous inspire ce qu’il y a lieu de dire. Je le regardai en silence, alors qu’il parcourait la page. Soudain, il releva la tête. Il avait trouvé : Le Saint Fantôme l’avait touché. Il commença : \"L’article dit que : la plupart des erreurs ont été éliminées\". Je demandai : \"Si la plupart sont éliminées, il en reste combien sur les 50 000 ? 5 000 ? 500 ? 50 ? Et s’il en reste encore 50, attribuez-vous ces erreurs à Dieu ?\""}, {"t": "p", "x": "II resta sans voix, s’excusa et proposa de revenir avec quelque autre personnalité de son Egiise. Quelle journée en perspective ! Si ce livre avait déjà été publié, je lui aurais offert en disant: \"Je voudrais vous faire plaisir, donnez-moi vos coordonnées. Je vous prête ce livre - \"La Bible est-elle la Parole de Dieu ?\" - pour 90 jours. Je veux une réponse écrite !\" Si vous faîtes ce que je demande, ainsi que quelques autres musulmans, eux, les autres missionnaires, ne remettront plus jamais les pieds chez vous. Je crois que ce livre est en fait le talisman le plus efficace à ce jour. Inch Allah !"}, {"t": "p", "x": "Ce \"culte\" des témoins de Jéhovah, qui condamne si fortement les orthodoxes trinitariens pour avoir jugé avec \"La Parole de Dieu\", se prête lui-même à cette manipulation sémantique. Dans"}, {"t": "p", "x": "Récemment un jeune homme achetait une Bible Version Roi lames, pensant qu’elle ne contenait aucune erreur."}, {"t": "p", "x": "Mais alors qu’il jetait un coup d’oeil à un ancien numéro du magasine \"Look\", il vit un article intitulé \"La Vérité sur la Bible\". Cet article indiquait que, \"déjà en 1720, une personnalité anglaise estimait qu’il Y avait au moins 20 000 erreurs dans les deux éditions du Nouveau Testament généralement lu par les protestants et les catholiques. Les étudiants contemporains disent qu’il y a probablement 50 000 erreurs\". Le jeune homme fut bouleversé : sa foi en l’authenticité de la Bible en fut ébranlée. \"Comment peut-on se fier à la Bible si elle contient des milliers de contradictions et d’inexactitudes. \" 8 Septembre 1957 AWAKE !"}, {"t": "p", "x": "Pour obtenir 1’article original complet écrire ou téléphoner à ISLAMIC PROPAGATION CENTRE 47/49 Madressa Arcade, Durban, Republic of South Afica - (Tés) 329518 l’article en question, \"50 000 erreurs dans la Bible ?\", il est dit: \"Il y a probablement 50 000 erreurs... des erreurs qui se sont glissées dans le texte de la Bible... 50 000 erreurs aussi graves (?)... la plupart de ces soi-disant erreurs... Dans l’ensemble, la Bible est fiable !\""}, {"t": "p", "x": "Nous n’avons ni le temps ni l’espace de voir les dizaines de milliers d’erreurs - sérieuses ou mineures - que les auteurs de la Version Standard Révisée (RSV) ont essayé de corriger. Nous abandonnons ce privilège aux savants chrétiens bibliophiles Mais j’aborderai quand même une douzaine environ de ces modifications \"mineures\". 1. C’est pourquoi le Seigneur lui-même nous donnera un signe. Voici que la Vierge est enceinte. Elle enfantera un fils et lui donnera le nom d’Emmanuel.\" (Esaïe 7:14) Le mot indispensable \"vierge\" dans le verset ci-dessus a été remplacé dans la RSV par les mots \"une jeune fille\" qui est, en fait, la traduction du mot hébreu \"Almah\"."}, {"t": "p", "x": "Almah, qui apparaît tout au long du texte hébreu, en lieu et place du mot \"bethulah\" qui signifie\"vierge\". Cette correction-là n’apparaît que dans la traduction anglaise, car la RSV n’est publiée que dans cette langue. Chrétiens, Africains et Afrikaners, Arabes et Zoulous, et ceux des 1 500 autres langues dans le monde, vous lisez la fausse traduction !"}]}, {"title": "Engendré et non créé", "blocks": [{"t": "p", "x": "\"Jésus (P) est le fils unique engendré par Dieu. Engendré et non \"créé\", dit le catéchisme orthodoxe s’appuyant sur le texte suivant: 2. \"Car Dieu a tant aimé le monde qu’il a donné son Fils unique afin que quiconque croit en lui, ne périsse pas, mais qu’il ait la vie éternelle.\" (Jean 3:16) Aucun prêtre, digne de ce nom, ne manque de citer \"le fils unique engendré par (Dieu) le Père\" dans ses prêches, à l’attention des futurs convertis. Mais cette \"invention\" -\"engendré\" - à présent, a été supprimée sans cérémonie, aucune, par les \"Réviseurs\" de la Bible, et sans explication..."}, {"t": "p", "x": "Ils savent si bien se montrer discrets à cet égard que le lecteur n’a pas encore perçu cette suppression. Ce mot blasphématoire (sacrilège) \"engendré\" n’était qu’une des nombreuses autres interpolations de la \"Sainte Bible\". Dieu Tout-Puissant condamna ce blasphème, aussitôt qu’il fut prononcé et en des termes les plus violents."}, {"t": "p", "x": "Il n’attendit pas 2 000 ans pour que les savants de la Bible révèlent l’imposture."}, {"t": "v", "x": ["\"Ils ont dit \"le Miséricordieux s’est", "donné un fils\" !", "Vous avancez là une chose", "abominable !", "Peu s’en faut que les cieux ne se", "fendent à cause de cette parole;", "Que la terre ne s’entrouve", "et que les montagnes ne s’écroulent !", "Ils ont attribué un fils au", "Miséricordieux !", "Il ne convient pas au Miséricordieux", "de se donner un fils\".\""]}, {"t": "p", "x": "(Saint Coran 19:88-92) Le monde musulman devrait féliciter les \"cinquante confessions participantes de la chrétienté, ainsi que le brain-trust constitué de \"trente-deux savants des plus hautes sphères\" pour avoir rapprocher la Sainte Bible de la vérité coranique."}, {"t": "v", "x": ["\"ll (Dieu Tout-Puissant)", "n’engendre pas;", "11 n’est pas engendré\""]}, {"t": "p", "x": "(Saint Coran 112:3)"}]}, {"title": "« Mathématiques chrétiennes »", "blocks": [{"t": "p", "x": "3. \"Car il y en a trois qui rendent témoignage [dansle ciel : le Père, la Parole et l’Esprit Saint. Et ces trois sont uns. (1 Epiae Jean 5:7) C’est le verset le plus proche de ce que les chrétiens appellent leur Sainte Trinité dans cette encyclopédie appelée la Bible. Cette clé de voûte de la foi chrétienne a également été rayée dans la RSV et toujours sans la moindre explication. Depuis le commencement, et à juste titre, ce fut ce que l’on appelle un pieux mensonge. Il a cependant été effacé de la RSV à l’attention des peuples anglophones, mais pour les 1499 autres groupes linguistiques du monde, qui lisent ces \"compositions\" dans leurs langues maternelles, l’imposture existe toujours. Ces peuples n’auront accès à la vérité que le Jour du Grand Jugement. Nous, musulmans, tenons à féliciter la brillante élite de Docteurs en Divinité"}, {"t": "p", "x": "qui fut assez honnête pour essayer d’effacer un autre mensonge de la Bible anglaise (RSV), rapprochant ainsi encore leur Saint Livre des enseignements de l’Islam. Le Saint Coran dit"}, {"t": "v", "x": ["\"... Ne dites pas : \"Trois\";", "Cessez de le faire;", "Ce sera mieux pour vous.", "Dieu est unique !... \"*"]}, {"t": "p", "x": "(Saint Coran 4:171)"}, {"t": "n", "x": "(*) Pas en une trinité."}]}, {"title": "L’ascension", "blocks": [{"t": "p", "x": "L’un des \"principaux manquements\" que l’auteur de la RSV a tenté de corriger porte sur l’ascension du Christ. Sur le plus prodigieux événement du christianisme - Jésus (P) enlevé au ciel - il n’existe, que deux citations dans les Evangiles de Matthieu, Marc, Luc et Jean. Ces deux citations apparaissent dans chaque Bible publiée en diverses langues, avant 1952, date de la première parution de la RSV : 4.a. \"Le Seigneur, après leur avoir parlé, fut enlevé au ciel et il s’assit à la droite de Dieu:\"(Marc 16:19) 4.b. \"Pendant qu’il les bénissait, il se sépara d’eux et fut enlevé au ciel:’ (Luc 24:51) A présent, s’il vous plaît, regardez la page suivante, il s’agit d’une photocopie où la citation \"4.â\" devrait apparaître."}, {"t": "p", "x": "Vous serez surpris de voir que Marc 16 se termine au verset 8 et qu’après un espace déconcertant les versets manquants apparaissent en \"petits caractères\" à la place des notes de bas de page. Si vous pouvez disposer dune Bible RSV datant de 1952, vous verrez alors qu’aux cinq derniers mots de \"4.b:’ (cidessus), c’est-à-dire \"et fut enlevé au ciel\" se substitue un petit \"a\" qui vous demande de vous reporter à la note de bas de page, où vous trouverez les mots manquants. Chaque chrétien admettra aisément que les notes reléguées en bas de page ne peuvent être considérées comme Parole de Dieu."}, {"t": "p", "x": "Pourquoi les serviteurs appointés du christianisme relèguent-ils le récit du plus grand miracle de leur religion dans une simple note située en bas de page D’après le tableau \"Origine et croissance de la Bible anglaise\" (page suivante) vous remarquerez que les \"versions\" bibliques antérieures à la Version Révisée de 1881, dépendaient toutes des anciennes transcriptions - datant seulement de cinq on six cent ans après jésus (P) - Les Réviseurs de 1a RSV de 1952 furent les premiers érudits en matière de Bible à pouvoir percer \"les plus anpages 24"}, {"t": "p", "x": "MARK 16"}, {"t": "p", "x": "« He has risen"}, {"t": "p", "x": "MARK 16 « He has risen saw a young man sitting on the right side, ples and Peter that he is going before you to dressed in a white robe; and they were Galilee; there you will see him, as he told amazed. 6And he said to thcm, you.\" gAnd they went out and fled from the \"Do not be amazed; you seek Jesus of tomb; for trembling and astonishment had Nazareth, who was crucified. He has risen, he come upon them; and they said nothing to any is not here; see the place where they laid him. one, for they were afraid.k 7 But go, tell his disciimg bintôt inch Allah"}, {"t": "p", "x": "Notez bien l’espace important entre le texte et la note de bas de page ’Other texts and versions ahtl as A9 - 16.9-20 the tbllow ng pass e4 N ut.’ u~lnrr lt rs’ i r ’ o f r e ’ ·r c ~ t l ’c · ri p · J Jir t n r ’1 rv ~ a i a, front tnlront hc had. J, casI llllt St\"i’ill Jirlr ~, 1 ’ f’.I r t (oh (, i t ! v t I In, rhi 7 : ipt. tt Ôtrt i’:hi71 tht’y hiarJ rhal he »a. U~’,, aIIJ la iirt aiiif l’ 7i r, hi ’ :;’Wr 1JU1 i riT’c’ tl.12 Apir this lre appiariJ in urrurhir Jvrrrr tu t:vu pJ t hinl, as t hiy.tvirc tvalkirrg into t/u country. 1jAnd they tuent bock anJ tvlJ tlrc reU, hrrt rhi v JiJ trot htiü.’elhinl. 14 AJriru’aal he ap ~t~efa y ljr~elf,H$t,~(~,j,· ~~ r ~’Jed thent for their urrbilitf and harJr-s (y- heurt, hii,rt~w t tey hcrJ rtta hilrct’cd rhuli,vlrv saru htnr aJrer he raJ rlscn. t~.4r1J he ’aid to thinr,\"(iv irrtv al! thc.,vrlJ t rnJ priaclr (!ri gospil (v the
